<!--
  NAVIRE, embed hero de la page d'accueil (section sur fond sombre)
  ================================================================
  Fond transparent : la couleur sombre de la section est posée dans Framer.
  La hauteur suit le contenu.

  Pastille   → GET /landing/hero : photos des 4 premiers du classement
               général, texte du bloc CONFIG (COMMUNITY_TEXT).
  Titre      → TITLE_BEFORE + TITLE_HIGHLIGHT (dégradé) + TITLE_AFTER.
  Pastilles  → trois atouts avec les icônes servies par /assets.
  Boutons    → « Se connecter » (LOGIN_URL) et « Commencer » (REGISTER_URL) ;
               déjà connecté (navire_token) : un seul bouton « Accéder à mon
               espace » (APP_URL).

  Réglages : bloc CONFIG du script.
-->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
#nv-hero {
  --text: #fff;
  --text-2: rgba(255,255,255,0.72);
  --text-3: rgba(255,255,255,0.5);
  --line: rgba(255,255,255,0.09);
  --line-2: rgba(255,255,255,0.16);
  --panel: rgba(255,255,255,0.04);
  --blue: #7AA7FF;
  --blue-hi: #B5CDFF;
  --blue-deep: #4F7DFF;
  --ease: cubic-bezier(.2,.8,.2,1);

  position: relative;
  width: 100%;
  padding: 72px 16px 64px;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  font-family: 'Inter', system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  color: var(--text);
  background: transparent;
  box-sizing: border-box;
}
#nv-hero *, #nv-hero *::before, #nv-hero *::after { box-sizing: border-box; }
#nv-hero ::selection { background: rgba(122,167,255,0.3); }

/* Apparition en cascade */
#nv-hero .nh-in { opacity: 0; transform: translateY(14px); animation: nh-up .8s var(--ease) forwards; }
#nv-hero .nh-d1 { animation-delay: .05s; }
#nv-hero .nh-d2 { animation-delay: .15s; }
#nv-hero .nh-d3 { animation-delay: .28s; }
#nv-hero .nh-d4 { animation-delay: .4s; }
@keyframes nh-up { to { opacity: 1; transform: none; } }

/* ── Pastille communauté ── */
#nv-hero .nh-community {
  display: inline-flex; align-items: center; gap: 10px;
  padding: 5px 14px 5px 6px;
  border-radius: 99px;
  border: 1px solid var(--line-2);
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  font-size: 13px; font-weight: 500; color: var(--text);
  white-space: nowrap;
}
#nv-hero .nh-avatars { display: flex; align-items: center; }
#nv-hero .nh-avatars:empty { display: none; }
#nv-hero .nh-av {
  width: 24px; height: 24px; border-radius: 50%;
  border: 2px solid #0b0e16;
  background: #1a2133 center / cover no-repeat;
  display: grid; place-items: center;
  font-size: 10px; font-weight: 700; color: var(--blue-hi);
  margin-left: -8px;
  overflow: hidden;
}
#nv-hero .nh-av:first-child { margin-left: 0; }
#nv-hero .nh-community.no-av { padding-left: 14px; }

/* ── Titre ── */
#nv-hero .nh-title {
  margin: 26px auto 0;
  max-width: 900px;
  font-size: clamp(34px, 6.4vw, 72px);
  line-height: 1.04;
  font-weight: 800;
  letter-spacing: -0.045em;
  text-wrap: balance;
}
#nv-hero .nh-hl {
  background: linear-gradient(92deg, var(--blue-hi) 0%, var(--blue) 45%, var(--blue-deep) 100%);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent; color: transparent;
}
#nv-hero .nh-sub {
  margin: 20px auto 0;
  max-width: 560px;
  font-size: 16px; line-height: 1.5;
  color: var(--text-2);
}
#nv-hero .nh-sub:empty { display: none; }

/* ── Pastilles atouts ── */
#nv-hero .nh-feats {
  margin-top: 34px;
  display: flex; flex-wrap: wrap; justify-content: center; gap: 10px;
}
#nv-hero .nh-feat {
  display: inline-flex; align-items: center; gap: 9px;
  padding: 8px 16px 8px 9px;
  border-radius: 99px;
  border: 1px solid var(--line);
  background: var(--panel);
  font-size: 13.5px; font-weight: 600; color: var(--text);
  white-space: nowrap;
}
#nv-hero .nh-feat img { width: 22px; height: 22px; object-fit: contain; display: block; }

/* ── Boutons ── */
#nv-hero .nh-actions {
  margin-top: 44px;
  display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 12px;
}
#nv-hero .nh-login {
  display: inline-flex; align-items: center;
  height: 52px; padding: 0 24px;
  border-radius: 99px;
  border: 1px solid var(--line-2);
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  color: var(--text);
  font-size: 15.5px; font-weight: 600; letter-spacing: -0.01em;
  text-decoration: none;
  transition: background .2s, border-color .2s, transform .25s var(--ease);
}
#nv-hero .nh-login:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.28); transform: translateY(-1px); }
#nv-hero .nh-login:focus-visible { outline: 2px solid var(--blue); outline-offset: 4px; }
#nv-hero .nh-login[hidden] { display: none; }
#nv-hero .nh-cta {
  display: inline-flex; align-items: center; gap: 14px;
  height: 52px;
  padding: 0 7px 0 24px;
  border-radius: 99px;
  border: 1px solid #fff;
  background: #fff;
  color: #0a0a12;
  font-family: inherit;
  font-size: 15.5px; font-weight: 700; letter-spacing: -0.01em;
  text-decoration: none;
  cursor: pointer;
  box-shadow: 0 0 0 6px rgba(255,255,255,0.06), 0 10px 40px rgba(122,167,255,0.28);
  transition: transform .25s var(--ease), box-shadow .25s var(--ease), background .2s;
}
#nv-hero .nh-cta:hover {
  transform: translateY(-1px);
  background: #eef2ff;
  box-shadow: 0 0 0 7px rgba(255,255,255,0.08), 0 14px 48px rgba(122,167,255,0.4);
}
#nv-hero .nh-cta:active { transform: translateY(0) scale(.98); }
#nv-hero .nh-cta:focus-visible { outline: 2px solid var(--blue); outline-offset: 4px; }
#nv-hero .nh-cta-arrow {
  width: 38px; height: 38px; border-radius: 50%;
  display: grid; place-items: center;
  background: #0a0a12; color: #fff;
  transition: transform .25s var(--ease);
}
#nv-hero .nh-cta:hover .nh-cta-arrow { transform: translateX(2px); }

@media (max-width: 640px) {
  #nv-hero { padding: 48px 16px 44px; }
  #nv-hero .nh-community { font-size: 12px; }
  #nv-hero .nh-title { margin-top: 22px; letter-spacing: -0.04em; }
  #nv-hero .nh-sub { font-size: 15px; }
  /* Téléphone : les trois atouts restent sur une ligne, icône au-dessus du texte. */
  #nv-hero .nh-feats {
    margin-top: 26px; gap: 8px;
    display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
    width: 100%; max-width: 420px;
  }
  #nv-hero .nh-feat {
    flex-direction: column; justify-content: flex-start; gap: 7px;
    padding: 12px 6px 11px;
    border-radius: 16px;
    font-size: 11.5px; line-height: 1.25;
    white-space: normal; text-align: center;
  }
  #nv-hero .nh-feat img { width: 26px; height: 26px; }
  #nv-hero .nh-actions { margin-top: 32px; gap: 10px; }
  #nv-hero .nh-cta, #nv-hero .nh-login { height: 50px; font-size: 15px; }
  #nv-hero .nh-login { padding: 0 20px; }
  #nv-hero .nh-cta { padding-left: 20px; gap: 12px; }
}
@media (prefers-reduced-motion: reduce) {
  #nv-hero .nh-in { animation: none; opacity: 1; transform: none; }
  #nv-hero .nh-cta, #nv-hero .nh-cta-arrow, #nv-hero .nh-login { transition: none; }
}
</style>

<section id="nv-hero" aria-label="NAVIRE">
  <div class="nh-community nh-in nh-d1" id="nh-community">
    <span class="nh-avatars" id="nh-avatars"></span>
    <span id="nh-community-text"></span>
  </div>

  <h1 class="nh-title nh-in nh-d2" id="nh-title"></h1>
  <p class="nh-sub nh-in nh-d2" id="nh-sub"></p>

  <div class="nh-feats nh-in nh-d3" id="nh-feats"></div>

  <div class="nh-actions nh-in nh-d4">
  <a class="nh-login" id="nh-login" target="_top"></a>
  <a class="nh-cta" id="nh-cta" target="_top">
    <span id="nh-cta-text"></span>
    <span class="nh-cta-arrow" aria-hidden="true">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>
    </span>
  </a>
  </div>
</section>

<script>
(function () {
  /* ═══ CONFIG ═══════════════════════════════════════════════ */
  var CONFIG = {
    API: "https://navire-app-api.onrender.com",
    TOKEN_KEY: "navire_token",                       // jeton partagé avec les autres embeds
    COMMUNITY_TEXT: "Une communauté de + 250 membres",
    TITLE_BEFORE: "Réussis ton année avec les cours particuliers de nos ",
    TITLE_HIGHLIGHT: "chargés de TD et juristes",
    TITLE_AFTER: ".",
    SUBTITLE: "",                                    // vide : pas de sous-titre
    FEATURES: [
      { icon: "/assets/NAVIRE_Articles_icon.png", label: "Articles de doctorants" },
      { icon: "/assets/home-cours.png",           label: "Librairie complète de cours" },
      { icon: "/assets/home-fichiers.png",        label: "IA liée à tes fichiers" }
    ],
    LOGIN_TEXT: "Se connecter",
    CTA_TEXT: "Commencer",
    CTA_TEXT_CONNECTED: "Accéder à mon espace",
    LOGIN_URL: "https://navire-ai.com/login",
    REGISTER_URL: "https://navire-ai.com/register",
    APP_URL: "https://navire-ai.com/home"            // déjà connecté
  };
  /* ══════════════════════════════════════════════════════════ */

  var root = document.getElementById("nv-hero");
  if (!root || root.getAttribute("data-ready")) return;
  root.setAttribute("data-ready", "1");

  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function token() { try { return localStorage.getItem(CONFIG.TOKEN_KEY); } catch (e) { return null; } }
  function asset(p) { return /^https?:/.test(p) ? p : CONFIG.API + p; }

  // Textes
  $("nh-community-text").textContent = CONFIG.COMMUNITY_TEXT;
  $("nh-title").innerHTML = esc(CONFIG.TITLE_BEFORE)
    + '<span class="nh-hl">' + esc(CONFIG.TITLE_HIGHLIGHT) + "</span>"
    + esc(CONFIG.TITLE_AFTER);
  $("nh-sub").textContent = CONFIG.SUBTITLE || "";

  $("nh-feats").innerHTML = CONFIG.FEATURES.map(function (f) {
    return '<span class="nh-feat"><img src="' + esc(asset(f.icon)) + '" alt="" loading="lazy">'
      + esc(f.label) + "</span>";
  }).join("");

  // Boutons : connecté, seulement « Accéder à mon espace »
  var connected = !!token();
  var login = $("nh-login");
  login.textContent = CONFIG.LOGIN_TEXT;
  login.href = CONFIG.LOGIN_URL;
  login.hidden = connected;
  $("nh-cta").href = connected ? CONFIG.APP_URL : CONFIG.REGISTER_URL;
  $("nh-cta-text").textContent = connected ? CONFIG.CTA_TEXT_CONNECTED : CONFIG.CTA_TEXT;

  // Photos des 4 premiers du classement
  var box = $("nh-avatars");
  function avatars(list) {
    box.innerHTML = list.slice(0, 4).map(function (u) {
      var name = u.username || "";
      if (u.avatar_url) {
        return '<span class="nh-av" title="' + esc(name) + '" style="background-image:url(\'' + esc(u.avatar_url).replace(/'/g, "%27") + '\')"></span>';
      }
      return '<span class="nh-av" title="' + esc(name) + '">' + esc(name.charAt(0).toUpperCase()) + "</span>";
    }).join("");
    $("nh-community").classList.toggle("no-av", !list.length);
  }
  $("nh-community").classList.add("no-av");
  fetch(CONFIG.API + "/landing/hero")
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (d) { if (d && d.top) avatars(d.top); })
    .catch(function () {});
})();
</script>
