<!--
  NAVIRE, embed « Nos professeurs »
  ==================================
  Cartes en verre, qui flottent doucement, sur le fond BLANC de la page
  (l'embed est transparent). Un halo discret derrière rend le verre visible.

  Ajouter un professeur : une entrée de plus dans PROFS (en bas du fichier).
  Si la photo ne charge pas, le logo NAVIRE prend sa place.
-->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
#nv-team {
  position: relative;
  box-sizing: border-box;
  width: 100%;
  padding: 48px 16px 64px;
  font-family: 'Inter', system-ui, sans-serif;
  color: #0a0a12;
  background: transparent;
  overflow: hidden;
  isolation: isolate;
}
#nv-team *, #nv-team *::before, #nv-team *::after { box-sizing: border-box; }

#nv-team::before {
  content: ""; position: absolute; z-index: -1; left: 50%; top: 50%;
  width: 520px; height: 360px; translate: -50% -50%;
  background: radial-gradient(closest-side, rgba(122,167,255,.28), transparent);
  filter: blur(40px); pointer-events: none;
}

#nv-team h2 {
  margin: 0 0 36px; text-align: center;
  font-size: clamp(26px, 4vw, 34px); font-weight: 700; letter-spacing: -.03em;
}

#nv-team .grid {
  display: grid; gap: 24px; justify-content: center;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 420px));
}

#nv-team .float { animation: nvFloat 7s ease-in-out infinite; }
@keyframes nvFloat { 50% { transform: translateY(-10px); } }

#nv-team .card {
  height: 100%; padding: 28px; border-radius: 24px;
  background: rgba(255,255,255,.55);
  border: 1px solid rgba(255,255,255,.9);
  box-shadow: 0 24px 48px -24px rgba(30,40,100,.22), inset 0 1px 0 #fff;
  backdrop-filter: blur(20px) saturate(150%); -webkit-backdrop-filter: blur(20px) saturate(150%);
}

#nv-team .top { display: flex; align-items: center; gap: 16px; margin-bottom: 18px; }
#nv-team .avatar {
  flex: none; width: 64px; height: 64px; border-radius: 50%; overflow: hidden;
  background: #0a0a12; display: grid; place-items: center;
}
#nv-team .avatar img { width: 100%; height: 100%; object-fit: cover; }
#nv-team .avatar img.logo { width: 58%; height: 58%; object-fit: contain; }
#nv-team .name { margin: 0; font-size: 19px; font-weight: 700; letter-spacing: -.02em; }
#nv-team .role { margin: 3px 0 0; font-size: 13px; color: rgba(10,10,18,.5); }
#nv-team .bio { margin: 0; font-size: 14.5px; line-height: 1.7; color: rgba(10,10,18,.72); }

@media (prefers-reduced-motion: reduce) { #nv-team .float { animation: none; } }
</style>

<section id="nv-team" aria-label="Nos professeurs">
  <h2>Nos professeurs</h2>
  <div class="grid"></div>
</section>

<script>
(function () {
  var LOGO = "https://navire-app-api.onrender.com/assets/logo-navire.png";

  var PROFS = [
    {
      nom: "Julien Paradis",
      role: "Fondateur de NAVIRE",
      photo: "https://www.google.com/s2/photos/profile/112242460335378339266?sz=256",
      bio: "Champion de France de débat et d'éloquence et titulaire d'un Master 2 en droit des contrats d’affaires (Université d’Évry Paris-Saclay), j'ai exercé chez BMW Group France en droit automobile avant de rejoindre le cabinet français de référence en droit économique. Passionné par la transmission, j'ai accompagné de nombreux étudiants en droit et animé des formations à la prise de parole en public, avant de fonder NAVIRE, une plateforme de cours en ligne et de révisions dédiée aux futurs juristes."
    }
  ];

  var grid = document.querySelector("#nv-team .grid");
  var esc = function (s) { var d = document.createElement("div"); d.textContent = s || ""; return d.innerHTML; };

  PROFS.forEach(function (p, i) {
    var wrap = document.createElement("div");
    wrap.className = "float";
    wrap.style.animationDelay = (-i * 2) + "s";
    wrap.innerHTML =
      '<article class="card">' +
        '<div class="top"><div class="avatar"><img alt="' + esc(p.nom) + '"></div>' +
        '<div><h3 class="name">' + esc(p.nom) + '</h3><p class="role">' + esc(p.role) + '</p></div></div>' +
        '<p class="bio">' + esc(p.bio) + '</p>' +
      '</article>';
    var img = wrap.querySelector("img");
    var useLogo = function () { img.onerror = null; img.className = "logo"; img.src = LOGO; };
    img.onerror = useLogo;
    if (p.photo) img.src = p.photo; else useLogo();
    grid.appendChild(wrap);
  });
})();
</script>
