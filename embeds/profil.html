<!--
  NAVIRE, page profil (composant embarqué), façon X / Twitter
  =========================================================================
  De haut en bas :
    - la bannière, puis la photo de profil qui la chevauche ;
    - à droite, pour l'élève sur son propre profil seulement : « Lier
      Discord » (ou « Discord lié »), « Lier LinkedIn » tant qu'il n'est pas
      renseigné, et « Éditer le profil » ;
    - le nom, la pastille du plan, la bio, l'université, le lien LinkedIn et
      la date d'arrivée sur NAVIRE ;
    - l'Elo et le rang, à la place des abonnés ;
    - les stats (rang, réussite QCM, documents, deep work Discord), masquées
      aux autres quand le profil est en privé ;
    - les posts de veille de l'élève, avec « Voir plus ».

  « Éditer le profil » ouvre un panneau à quatre onglets :
    - Profil : bannière, photo, nom, bio, lien LinkedIn, profil privé ;
    - Abonnement : chaque abonnement (NAVIRE AI, Prép'AdJuris), sa carte, son
      prochain prélèvement, résilier / réactiver / changer de carte ou de
      formule (GET /subscriptions/billing, lu à l'ouverture seulement) ;
    - Factures : les dernières factures, PDF et lien de règlement ;
    - Sécurité : adresse, méthode de connexion, mot de passe.

  Voir le profil d'un autre élève : ajoute ?u=<id> à l'adresse de la page.
  Sans paramètre (ou avec son propre id), c'est son profil à soi.
  En haut de la page, « Rechercher un élève » (GET /users/search) : un clic
  ouvre son profil sur place (l'adresse passe à ?u=<id>, le bouton retour du
  navigateur fonctionne) ; « Mon profil » ramène au sien. Les profils
  s'ouvrent aussi depuis le classement (fiche joueur) et la veille (auteur).

  Même DA que le Home : bleu et blanc, aucun trait, des fonds légers, aucun
  fond de page (le fond sombre est posé par le site). --ring, plus bas, est la
  couleur du liseré autour de la photo : mets-y la couleur de ton fond.

  Routes : /users/me/profile-summary?ranking=false, /users/{id}/profile,
           /users/{id}/posts, PATCH /users/me, /users/me/avatar,
           /users/me/banner, /users/me/discord-code, /users/me/discord-unlink,
           /users/me/password, /subscriptions/billing, /subscriptions/*
-->
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
#nv-profil {
  --ring: #0b0b12;              /* liseré de la photo : la couleur du fond du site */
  --panel: rgba(255,255,255,0.035);
  --panel-2: rgba(255,255,255,0.06);
  --panel-3: rgba(255,255,255,0.1);
  --text: #fff;
  --text-2: rgba(255,255,255,0.72);
  --text-3: rgba(255,255,255,0.45);
  --text-4: rgba(255,255,255,0.28);
  --blue: #7AA7FF;
  --blue-hi: #B5CDFF;
  --blue-deep: #4F7DFF;
  --blue-soft: rgba(122,167,255,0.1);
  --blue-line: rgba(122,167,255,0.35);
  --discord: #5865F2;
  --danger: #FF6B6B;
  --mono: 'IBM Plex Mono', monospace;
  --ease: cubic-bezier(.2,.8,.2,1);

  position: relative;
  width: 100%;
  max-width: 760px;
  margin: 0 auto;
  font-family: 'Inter', sans-serif;
  -webkit-font-smoothing: antialiased;
  font-size: 14px;
  color: var(--text);
  background: transparent;
  box-sizing: border-box;
  padding: 12px 16px 32px;
}
#nv-profil *, #nv-profil *::before, #nv-profil *::after { box-sizing: border-box; }
#nv-profil button { font-family: inherit; color: inherit; }
#nv-profil ::selection { background: rgba(122,167,255,0.3); }
#nv-profil svg { flex-shrink: 0; }
#nv-profil .is-hidden { display: none !important; }
@keyframes pf-rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes pf-fade { from { opacity: 0; } to { opacity: 1; } }

/* ================= ÉTAT DE CHARGEMENT ================= */
#nv-profil .pf-state { padding: 80px 0; text-align: center; font-size: 12px; color: var(--text-3); letter-spacing: .4px; }

/* ================= BANNIÈRE ================= */
#nv-profil .pf-banner {
  position: relative;
  aspect-ratio: 3 / 1;
  max-height: 230px;
  width: 100%;
  border-radius: 18px;
  overflow: hidden;
  background:
    radial-gradient(120% 140% at 85% 0%, rgba(122,167,255,0.32), transparent 55%),
    radial-gradient(90% 120% at 10% 100%, rgba(79,125,255,0.22), transparent 60%),
    var(--panel);
  background-size: cover;
  background-position: center;
}
#nv-profil .pf-banner.has-img { background-color: var(--panel); }

/* ================= EN-TÊTE ================= */
#nv-profil .pf-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding: 0 4px; margin-top: -56px; position: relative; }
#nv-profil .pf-avatar {
  width: 124px; height: 124px;
  border-radius: 50%;
  background: var(--panel-3) center/cover no-repeat;
  box-shadow: 0 0 0 4px var(--ring);
  display: flex; align-items: center; justify-content: center;
  font-size: 40px; font-weight: 700;
  flex-shrink: 0;
}
#nv-profil .pf-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; padding-bottom: 6px; }
#nv-profil .pf-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  height: 36px; padding: 0 16px;
  border-radius: 99px; border: none;
  background: var(--panel-2);
  font-size: 13px; font-weight: 600; color: var(--text);
  cursor: pointer; white-space: nowrap; text-decoration: none;
  transition: background .15s, transform .15s var(--ease);
  position: relative;
}
#nv-profil .pf-btn:hover { background: var(--panel-3); }
#nv-profil .pf-btn:active { transform: scale(.97); }
#nv-profil .pf-btn:disabled { opacity: .5; cursor: not-allowed; }
#nv-profil .pf-btn svg { width: 15px; height: 15px; }
#nv-profil .pf-btn.is-primary { background: #fff; color: #0b0b12; }
#nv-profil .pf-btn.is-primary:hover { background: rgba(255,255,255,0.86); }
#nv-profil .pf-btn.is-blue { background: var(--blue-deep); color: #fff; }
#nv-profil .pf-btn.is-blue:hover { background: #6690ff; }
#nv-profil .pf-btn.is-discord { background: var(--discord); color: #fff; }
#nv-profil .pf-btn.is-discord:hover { background: #4a57e0; }
#nv-profil .pf-btn.is-linked svg { color: var(--blue); }
#nv-profil .pf-btn.is-icon { width: 36px; padding: 0; }
#nv-profil .pf-btn .pf-dot { position: absolute; top: 1px; right: 1px; width: 9px; height: 9px; border-radius: 50%; background: var(--danger); box-shadow: 0 0 0 2px var(--ring); }

#nv-profil .pf-identity { padding: 12px 4px 0; }
#nv-profil .pf-name-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
#nv-profil .pf-name { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -.6px; line-height: 1.2; overflow-wrap: anywhere; }
#nv-profil .pf-tag {
  display: inline-flex; align-items: center; gap: 5px;
  font-family: var(--mono); font-size: 10px; font-weight: 600;
  padding: 2px 8px; border-radius: 99px; white-space: nowrap;
  background: var(--panel-2); color: var(--text-2);
}
#nv-profil .pf-tag svg { width: 11px; height: 11px; }
#nv-profil .pf-tag.blue { color: var(--blue); background: var(--blue-soft); }
#nv-profil .pf-tag.bad { color: var(--danger); background: rgba(255,107,107,0.1); }
#nv-profil .pf-bio { margin: 10px 0 0; font-size: 14px; line-height: 1.55; color: var(--text-2); white-space: pre-wrap; overflow-wrap: anywhere; }
#nv-profil .pf-meta { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 10px; font-size: 13px; color: var(--text-3); }
#nv-profil .pf-meta span, #nv-profil .pf-meta a { display: inline-flex; align-items: center; gap: 6px; min-width: 0; }
#nv-profil .pf-meta svg { width: 15px; height: 15px; opacity: .8; }
#nv-profil .pf-meta a { color: var(--blue); text-decoration: none; }
#nv-profil .pf-meta a:hover { text-decoration: underline; }
#nv-profil .pf-counts { display: flex; flex-wrap: wrap; gap: 4px 18px; margin-top: 12px; font-size: 13.5px; color: var(--text-3); }
#nv-profil .pf-counts b { color: var(--text); font-weight: 700; margin-right: 4px; font-variant-numeric: tabular-nums; }

/* ================= ALERTE D'IMPAYÉ ================= */
#nv-profil .pf-alert { display: flex; align-items: center; gap: 12px; margin-top: 16px; padding: 10px 10px 10px 14px; border-radius: 14px; background: rgba(255,107,107,0.08); animation: pf-rise .35s var(--ease) both; }
#nv-profil .pf-alert-text { flex: 1; min-width: 0; font-size: 12.5px; line-height: 1.45; color: var(--text-2); }
#nv-profil .pf-alert-text b { color: #fff; }
#nv-profil .pf-alert .pf-btn { height: 32px; font-size: 12px; }

/* ================= PANNEAU DISCORD (code ou gestion) ================= */
#nv-profil .pf-discord { position: relative; overflow: hidden; margin-top: 16px; padding: 14px 16px; border-radius: 16px; background: var(--panel); animation: pf-rise .35s var(--ease) both; }
#nv-profil .pf-discord::after { content: ''; position: absolute; left: -30px; top: -50px; width: 160px; height: 160px; border-radius: 50%; background: radial-gradient(circle, rgba(88,101,242,0.22), transparent 70%); pointer-events: none; }
#nv-profil .pf-discord > * { position: relative; z-index: 1; }
#nv-profil .pf-dc-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
#nv-profil .pf-label { font-size: 10px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: var(--text-4); }
#nv-profil .pf-dc-timer { font-family: var(--mono); font-size: 11px; color: var(--text-3); font-variant-numeric: tabular-nums; }
#nv-profil .pf-dc-timer.is-urgent { color: var(--blue-hi); }
#nv-profil .pf-dc-row { display: flex; align-items: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
#nv-profil .pf-dc-code { flex: 1; min-width: 150px; font-family: var(--mono); font-size: 24px; font-weight: 600; letter-spacing: 4px; }
#nv-profil .pf-dc-row .pf-btn { height: 32px; font-size: 12px; }
#nv-profil .pf-dc-hint { margin-top: 10px; font-size: 12px; line-height: 1.5; color: var(--text-3); }
#nv-profil .pf-dc-hint b { color: var(--text-2); }
#nv-profil .pf-dc-text { margin-top: 6px; font-size: 13px; line-height: 1.5; color: var(--text-2); }
#nv-profil .pf-dc-msg { margin-top: 8px; font-size: 12px; color: var(--danger); }
#nv-profil .pf-close { width: 30px; height: 30px; border-radius: 9px; border: none; background: transparent; color: var(--text-3); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; padding: 0; }
#nv-profil .pf-close:hover { background: var(--panel-2); color: #fff; }
#nv-profil .pf-close svg { width: 15px; height: 15px; }

/* ================= STATS ================= */
#nv-profil .pf-section { margin-top: 22px; }
#nv-profil .pf-section-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 0 4px 10px; }
#nv-profil .pf-section-head h2 { margin: 0; font-size: 15px; font-weight: 700; letter-spacing: -.2px; display: flex; align-items: center; gap: 8px; }
#nv-profil .pf-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
#nv-profil .pf-stat { position: relative; overflow: hidden; min-width: 0; padding: 14px 14px 13px; border-radius: 16px; background: var(--panel); animation: pf-rise .4s var(--ease) both; }
#nv-profil .pf-stat::after { content: ''; position: absolute; right: -36px; top: -36px; width: 100px; height: 100px; border-radius: 50%; background: radial-gradient(circle, rgba(122,167,255,0.14), transparent 70%); pointer-events: none; }
#nv-profil .pf-stat:nth-child(2) { animation-delay: .04s; }
#nv-profil .pf-stat:nth-child(3) { animation-delay: .08s; }
#nv-profil .pf-stat:nth-child(4) { animation-delay: .12s; }
#nv-profil .pf-stat-ico { width: 28px; height: 28px; border-radius: 9px; display: flex; align-items: center; justify-content: center; background: var(--blue-soft); color: var(--blue); margin-bottom: 12px; }
#nv-profil .pf-stat-ico svg { width: 15px; height: 15px; }
#nv-profil .pf-stat-value { font-size: 22px; font-weight: 700; letter-spacing: -.7px; line-height: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
#nv-profil .pf-stat-label { margin-top: 5px; font-size: 12px; line-height: 1.4; color: var(--text-3); overflow-wrap: anywhere; }
#nv-profil .pf-bar { height: 4px; border-radius: 9px; background: var(--panel-2); margin-top: 9px; overflow: hidden; }
#nv-profil .pf-bar i { display: block; height: 100%; border-radius: 9px; background: linear-gradient(90deg, var(--blue-deep), var(--blue-hi)); transition: width .5s var(--ease); }
#nv-profil .pf-stats-foot { margin: 10px 4px 0; font-size: 12px; color: var(--text-3); line-height: 1.5; }
#nv-profil .pf-stats-foot b { color: var(--text-2); font-weight: 600; }
#nv-profil .pf-locked { display: flex; align-items: center; gap: 14px; padding: 18px; border-radius: 16px; background: var(--panel); }
#nv-profil .pf-locked-ico { width: 40px; height: 40px; border-radius: 12px; background: var(--panel-2); display: flex; align-items: center; justify-content: center; color: var(--text-3); }
#nv-profil .pf-locked-ico svg { width: 18px; height: 18px; }
#nv-profil .pf-locked b { display: block; font-size: 14px; }
#nv-profil .pf-locked span { font-size: 12.5px; color: var(--text-3); }

/* ================= POSTS DE VEILLE ================= */
#nv-profil .pf-tabs-bar { display: flex; gap: 4px; margin-top: 26px; padding: 0 4px; }
#nv-profil .pf-tab-static { position: relative; padding: 10px 2px 12px; font-size: 14px; font-weight: 700; }
#nv-profil .pf-tab-static::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 3px; border-radius: 3px; background: var(--blue); }
#nv-profil .pf-tab-static small { font-family: var(--mono); font-size: 11px; font-weight: 600; color: var(--text-4); margin-left: 6px; }
#nv-profil .pf-posts { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
#nv-profil .pf-post { padding: 14px 16px; border-radius: 16px; background: var(--panel); display: flex; gap: 12px; transition: background .15s; animation: pf-rise .35s var(--ease) both; }
#nv-profil .pf-post:hover { background: var(--panel-2); }
#nv-profil .pf-post-av { width: 38px; height: 38px; border-radius: 50%; background: var(--panel-3) center/cover no-repeat; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; }
#nv-profil .pf-post-main { flex: 1; min-width: 0; }
#nv-profil .pf-post-top { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 13px; color: var(--text-3); }
#nv-profil .pf-post-top b { color: var(--text); font-weight: 700; }
#nv-profil .pf-post-title { margin: 6px 0 0; font-size: 15px; font-weight: 600; line-height: 1.4; letter-spacing: -.1px; }
#nv-profil .pf-post-title a { color: inherit; text-decoration: none; }
#nv-profil .pf-post-title a:hover { text-decoration: underline; text-decoration-color: var(--blue-line); }
#nv-profil .pf-post-text { margin: 6px 0 0; font-size: 13.5px; line-height: 1.58; color: var(--text-2); }
#nv-profil .pf-post-impact { margin: 10px 0 0; padding: 10px 12px; border-radius: 12px; background: var(--blue-soft); font-size: 13px; line-height: 1.55; color: var(--text-2); }
#nv-profil .pf-post-impact b { color: var(--blue-hi); font-weight: 600; }
#nv-profil .pf-post-foot { display: flex; align-items: center; gap: 6px 14px; flex-wrap: wrap; margin-top: 10px; font-size: 12px; color: var(--text-3); }
#nv-profil .pf-post-foot a { color: var(--text-3); text-decoration: none; display: inline-flex; align-items: center; gap: 5px; }
#nv-profil .pf-post-foot a:hover { color: var(--blue); }
#nv-profil .pf-post-foot svg { width: 13px; height: 13px; }
#nv-profil .pf-empty { padding: 34px 20px; border-radius: 16px; background: var(--panel); text-align: center; color: var(--text-3); font-size: 13px; line-height: 1.55; }
#nv-profil .pf-empty b { display: block; color: var(--text); font-size: 15px; margin-bottom: 4px; }
#nv-profil .pf-more { display: flex; justify-content: center; margin-top: 14px; }

/* ================= PANNEAU « ÉDITER LE PROFIL » ================= */
/* Verre dépoli : le profil reste visible, flouté, derrière le panneau. Le
   panneau prend au plus la hauteur de l'écran ; l'onglet Profil est composé
   pour y tenir sans défiler (le corps défile seulement sur très petit écran). */
#nv-profil .pf-overlay { position: fixed; inset: 0; z-index: 1000; display: none; background: rgba(4,4,12,0.6); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); animation: pf-fade .2s ease both; }
#nv-profil .pf-overlay.is-open { display: block; }
/* Zone de l'écran réellement visible (calculée en JS) : dans une iframe plus
   haute que l'écran, c'est elle qui centre le panneau, pas l'iframe entière. */
#nv-profil .pf-stage { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; padding: 16px; }
#nv-profil .pf-panel {
  width: 100%; max-width: 620px;
  max-height: 100%;
  display: flex; flex-direction: column;
  border-radius: 22px;
  background:
    linear-gradient(160deg, rgba(255,255,255,0.07), rgba(255,255,255,0.015) 45%, rgba(122,167,255,0.05)),
    rgba(16,16,28,0.86);
  -webkit-backdrop-filter: blur(30px) saturate(150%); backdrop-filter: blur(30px) saturate(150%);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.14), inset 0 0 0 1px rgba(255,255,255,0.06), 0 30px 90px rgba(0,0,0,0.45);
  overflow: hidden;
  animation: pf-rise .3s var(--ease) both;
}
/* Navigateur sans flou : un fond plus opaque pour rester lisible */
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  #nv-profil .pf-panel { background: rgba(16,16,28,0.97); }
}
#nv-profil .pf-panel-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px 4px; flex-shrink: 0; }
#nv-profil .pf-panel-title { flex: 1; font-size: 16px; font-weight: 700; letter-spacing: -.3px; }
#nv-profil .pf-panel-head .pf-btn { height: 32px; }
#nv-profil .pf-tabs { display: flex; gap: 2px; padding: 2px 12px 0; overflow-x: auto; scrollbar-width: none; flex-shrink: 0; }
#nv-profil .pf-tabs::-webkit-scrollbar { display: none; }
#nv-profil .pf-tab { position: relative; flex-shrink: 0; padding: 9px 12px 11px; border: none; background: none; font-size: 13px; font-weight: 600; color: var(--text-3); cursor: pointer; border-radius: 10px 10px 0 0; transition: color .15s; }
#nv-profil .pf-tab:hover { color: var(--text); }
#nv-profil .pf-tab.is-active { color: #fff; }
#nv-profil .pf-tab.is-active::after { content: ''; position: absolute; left: 12px; right: 12px; bottom: 0; height: 3px; border-radius: 3px; background: var(--blue); }
#nv-profil .pf-tab .pf-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--danger); margin-left: 6px; vertical-align: 1px; }
#nv-profil .pf-panel-body { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 12px 16px 16px; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.1) transparent; }
#nv-profil .pf-loading { padding: 34px 0; text-align: center; font-size: 12px; color: var(--text-3); }

/* Onglet Profil */
#nv-profil .pf-edit-banner { position: relative; aspect-ratio: 3 / 1; max-height: 130px; width: 100%; border-radius: 14px; overflow: hidden; background:
    radial-gradient(120% 140% at 85% 0%, rgba(122,167,255,0.32), transparent 55%),
    radial-gradient(90% 120% at 10% 100%, rgba(79,125,255,0.22), transparent 60%),
    var(--panel); background-size: cover; background-position: center; }
#nv-profil .pf-edit-banner-acts { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 10px; background: rgba(0,0,0,0.28); }
#nv-profil .pf-round { width: 40px; height: 40px; border-radius: 50%; border: none; background: rgba(10,10,18,0.72); color: #fff; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; transition: background .15s, transform .15s var(--ease); }
#nv-profil .pf-round:hover { background: rgba(10,10,18,0.92); transform: scale(1.05); }
#nv-profil .pf-round svg { width: 17px; height: 17px; }
#nv-profil .pf-edit-av-row { display: flex; align-items: flex-end; gap: 12px; margin: -34px 0 0 14px; position: relative; }
#nv-profil .pf-edit-av-wrap { position: relative; width: 76px; height: 76px; flex-shrink: 0; }
#nv-profil .pf-edit-av { width: 76px; height: 76px; border-radius: 50%; background: rgba(40,44,70,0.9) center/cover no-repeat; box-shadow: 0 0 0 3px rgba(255,255,255,0.14), 0 8px 24px rgba(0,0,0,0.35); display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 700; }
#nv-profil .pf-edit-av-wrap .pf-round { width: 34px; height: 34px; }
#nv-profil .pf-edit-av-wrap .pf-round { position: absolute; inset: 0; margin: auto; }
#nv-profil .pf-file-hint { margin: 0 0 4px; font-size: 12px; color: var(--text-3); min-width: 0; }
#nv-profil .pf-file-hint.is-error { color: var(--danger); }

  function $(name) { return root.querySelector('[data-el="' + name + '"]'); }

  var token = '';
  try { token = localStorage.getItem('navire_token') || ''; } catch (e) {}

  // ================= OUTILS =================
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  // Seuls les liens http(s) finissent dans un href
  function safeUrl(u) { return /^https?:\/\//i.test(u || '') ? esc(u) : '#'; }
  function initial(n) { return ((n || '?').trim().charAt(0) || '?').toUpperCase(); }
  function setAvatar(node, url, name) {
    if (url) { node.style.backgroundImage = 'url("' + String(url).replace(/"/g, '%22') + '")'; node.textContent = ''; }
    else { node.style.backgroundImage = ''; node.textContent = initial(name); }
  }
  function setBg(node, url) {
    node.style.backgroundImage = url ? 'url("' + String(url).replace(/"/g, '%22') + '")' : '';
    node.classList.toggle('has-img', !!url);
  }
  function show(node, on) { node.classList.toggle('is-hidden', !on); }
  function fmtInt(n) { return Number(n || 0).toLocaleString('fr-FR'); }
  function dateFr(iso, style) {
    if (!iso) return '';
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    var o = style === 'month' ? { month: 'long', year: 'numeric' }
      : style === 'short' ? { day: 'numeric', month: 'short', year: 'numeric' }
      : { day: 'numeric', month: 'long', year: 'numeric' };
    return d.toLocaleDateString('fr-FR', o);
  }
  function relDate(iso) {
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    var s = (Date.now() - d.getTime()) / 1000;
    if (s < 3600) return Math.max(1, Math.round(s / 60)) + ' min';
    if (s < 86400) return Math.round(s / 3600) + ' h';
    if (s < 7 * 86400) return Math.round(s / 86400) + ' j';
    return d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short', year: d.getFullYear() === new Date().getFullYear() ? undefined : 'numeric' });
  }
  function detailMessage(d, status) {
    if (!d) return 'Une erreur est survenue (HTTP ' + status + ').';
    if (typeof d === 'string') return d;
    if (d.message) return d.message;
    if (Array.isArray(d)) return d.map(function (x) { return x.msg; }).join(' · ');
    return 'Une erreur est survenue (HTTP ' + status + ').';
  }
  function headers(json) {
    var h = {};
    if (token) h.Authorization = 'Bearer ' + token;
    if (json) h['Content-Type'] = 'application/json';
    return h;
  }
  // Appel JSON : rejette avec le message de l'API. body FormData = envoi multipart.
  function api(method, path, body) {
    var isForm = typeof FormData !== 'undefined' && body instanceof FormData;
    return fetch(API + path, {
      method: method,
      headers: headers(body && !isForm),
      body: body ? (isForm ? body : JSON.stringify(body)) : undefined
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) {
        if (r.status === 401) throw new Error('Session expirée, reconnecte-toi.');
        // « Not Found » brut de FastAPI = la route n'existe pas sur l'API en
        // ligne (version pas encore déployée), pas une ressource absente.
        if (r.status === 404 && j.detail === 'Not Found') throw new Error('Cette fonction n\'est pas encore disponible : l\'API en ligne doit être mise à jour.');
        if (r.status === 429) { var e = new Error('RATE'); e.rate = true; throw e; }
        if (!r.ok) throw new Error(detailMessage(j.detail, r.status));
        return j;
      });
    });
  }
  function go(url) { try { window.top.location.href = url; } catch (e) { window.open(url, '_blank'); } }
  function pageUrl() {
    try { if (window.top.location.href) return window.top.location.href; } catch (e) {}
    try { if (document.referrer) return document.referrer; } catch (e) {}
    return null;
  }
  function pageParam(name) {
    var srcs = [];
    try { srcs.push(window.location.search); } catch (e) {}
    try { srcs.push(window.top.location.search); } catch (e) {}
    try { if (document.referrer) srcs.push(new URL(document.referrer).search); } catch (e) {}
    for (var i = 0; i < srcs.length; i++) {
      try { var v = new URLSearchParams(srcs[i] || '').get(name); if (v) return v; } catch (e) {}
    }
    return null;
  }

  // Mise en page téléphone : selon la largeur du composant, pas de l'écran
  function syncWidth() { root.classList.toggle('is-narrow', root.clientWidth < NARROW); }
  if (window.ResizeObserver) new ResizeObserver(syncWidth).observe(root);
  else window.addEventListener('resize', syncWidth);
  syncWidth();

  var ICON = {
    edit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>',
    discord: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.32 4.37a19.8 19.8 0 0 0-4.89-1.52.07.07 0 0 0-.08.04c-.21.38-.44.86-.61 1.25a18.3 18.3 0 0 0-5.49 0 12.6 12.6 0 0 0-.62-1.25.08.08 0 0 0-.08-.04 19.7 19.7 0 0 0-4.88 1.52.07.07 0 0 0-.03.03C.53 9.05-.32 13.58.1 18.06a.08.08 0 0 0 .03.05 19.9 19.9 0 0 0 5.99 3.03.08.08 0 0 0 .08-.03c.46-.63.87-1.3 1.23-1.99a.08.08 0 0 0-.04-.1 13.1 13.1 0 0 1-1.87-.9.08.08 0 0 1-.01-.12l.37-.29a.07.07 0 0 1 .08-.01c3.93 1.79 8.18 1.79 12.06 0a.07.07 0 0 1 .08 0l.37.3a.08.08 0 0 1 0 .12 12.3 12.3 0 0 1-1.88.89.08.08 0 0 0-.04.11c.36.7.77 1.36 1.23 1.99a.08.08 0 0 0 .08.03 19.8 19.8 0 0 0 6-3.03.08.08 0 0 0 .03-.05c.5-5.18-.84-9.67-3.55-13.66a.06.06 0 0 0-.03-.03ZM8.02 15.33c-1.18 0-2.16-1.08-2.16-2.42 0-1.33.96-2.42 2.16-2.42 1.21 0 2.18 1.1 2.16 2.42 0 1.34-.96 2.42-2.16 2.42Zm7.97 0c-1.18 0-2.15-1.08-2.15-2.42 0-1.33.95-2.42 2.15-2.42 1.21 0 2.18 1.1 2.16 2.42 0 1.34-.95 2.42-2.16 2.42Z"/></svg>',
    linkedin: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.45 20.45h-3.56v-5.57c0-1.33-.02-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.34V9h3.42v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28ZM5.34 7.43a2.06 2.06 0 1 1 0-4.13 2.06 2.06 0 0 1 0 4.13ZM7.12 20.45H3.56V9h3.56v11.45ZM22.22 0H1.77C.79 0 0 .77 0 1.73v20.54C0 23.23.79 24 1.77 24h20.45c.98 0 1.78-.77 1.78-1.73V1.73C24 .77 23.2 0 22.22 0Z"/></svg>',
    check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',

    lock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>',
    trophy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6M18 9h1.5a2.5 2.5 0 0 0 0-5H18M4 22h16M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>',
    target: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>',
    doc: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><path d="M14 2v6h6"/></svg>',
    wave: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6c.6.5 1.2 1 2.5 1C7 7 7 5 9.5 5c2.6 0 2.4 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1M2 12c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 2.6 0 2.4 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1M2 18c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 2.6 0 2.4 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/></svg>',

    read: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>',

  // ================= ÉTAT =================
  var S = {
    mine: false,      // profil de l'élève connecté
    data: null,       // payload /profile-summary (soi) ou /users/{id}/profile (autre)
    user: {},
    stats: null,      // null = masquées (profil privé vu par un autre)
    posts: [], postsTotal: 0, postsHasMore: false, loadingMore: false,
    shown: 0,         // posts affichés : POSTS_FIRST au départ, + POSTS_STEP par « Voir plus »
    dc: { mode: null, code: '', ticker: null, tick: null }
  };

  // ================= CHARGEMENT =================
  function load() {
    var wanted = S.voir != null ? S.voir : pageParam('u');
    var p;
    if (wanted && /^\d+$/.test(wanted)) {
      p = api('GET', '/users/' + wanted + '/profile').then(function (d) {
        // Son propre id : on bascule sur la version complète (abonnement, Discord…)
        if (d.is_me && token) return loadMine();
        S.mine = false;
        S.data = d;
        S.user = d.user || {};
        S.stats = d.stats;
        setPosts(d.posts);
        render();
      });
    } else if (token) {
      p = loadMine();
    } else {
      $('state').textContent = 'Connecte-toi pour voir ton profil.';
      return Promise.resolve();
    }
    return p.catch(function (err) {
      $('state').textContent = /introuvable/i.test(err.message) ? 'Ce profil n\'existe pas.' : 'Impossible de charger le profil. Réessaie dans un instant.';
      show($('state'), true);
      show($('page'), false);
      console.error('[profil]', err);
    });
  }

  function loadMine() {
    return api('GET', '/users/me/profile-summary?ranking=false').then(function (d) {
      S.mine = true;
      S.data = d;
      S.user = d.user || {};
      S.stats = {
        rank: d.elo && d.elo.rank,
        total_ranked_users: d.elo && d.elo.total_ranked_users,
        qcm_stats: d.qcm_stats || {},
        files: d.files || {},
        deepwork: d.deepwork
      };
      setPosts(d.posts);
      render();
      // Un code Discord encore valable reprend son décompte
      if (d.discord_link_code && !S.dc.ticker) dcShowCode(d.discord_link_code);
    });
  }

  function setPosts(p) {
    p = p || {};
    S.posts = p.items || [];
    S.postsTotal = p.total || 0;
    S.postsHasMore = !!p.has_more;
    S.shown = Math.min(POSTS_FIRST, S.posts.length);
  }

  // ================= RENDU =================
  function render() {
    var u = S.user;
    show($('state'), false);
    show($('page'), true);
    show($('find'), !!token);
    show($('back'), !!token && !S.mine);

    setBg($('banner'), u.banner_url);
    setAvatar($('avatar'), u.avatar_url, u.username);
    $('name').textContent = u.username || '…';
    renderTags();

    var bio = (u.bio || '').trim();
    $('bio').textContent = bio;
    show($('bio'), !!bio);

    var meta = '';
    if (u.university) meta += '<span>' + ICON.uni + esc(u.university) + '</span>';
    if (u.linkedin_url) meta += '<a href="' + safeUrl(u.linkedin_url) + '" target="_blank" rel="noopener">' + ICON.linkedin + 'LinkedIn</a>';
    if (u.created_at) meta += '<span>' + ICON.cal + 'A rejoint NAVIRE en ' + esc(dateFr(u.created_at, 'month')) + '</span>';
    $('meta').innerHTML = meta;
    show($('meta'), !!meta);

    var elo = S.data.elo || {};
    var counts = '<span><b>' + fmtInt(elo.value) + '</b>Elo</span>';
    if (S.stats && S.stats.rank) counts += '<span><b>#' + fmtInt(S.stats.rank) + '</b>au classement</span>';
    $('counts').innerHTML = counts;

    renderActions();
    renderAlert();
    renderStats();
    renderPosts();
  }

  function planLabel() {
    if (S.mine) {
      var s = S.data.subscription;
      if (s && s.plan && s.plan !== 'free') return s.plan_label || CONFIG.PLANS[s.plan] || s.plan;
      if (!s && S.user.plan && S.user.plan !== 'free') return CONFIG.PLANS[S.user.plan] || S.user.plan;
      return '';
    }
    var p = S.user.plan;
    return p && p !== 'free' ? (CONFIG.PLANS[p] || p) : '';
  }

  function renderTags() {
    var h = '';
    var plan = planLabel();
    if (plan) h += '<span class="pf-tag blue">' + esc(plan) + '</span> ';
    if (S.user.stats_public === false) h += '<span class="pf-tag">' + ICON.lock + 'privé</span>';
    $('name-tags').innerHTML = h;
  }

  function renderActions() {
    var box = $('actions');
    if (!S.mine) {
      box.innerHTML = '';
      return;
    }
    var u = S.user;
    var h = '';
    h += u.discord_linked
      ? '<button class="pf-btn is-linked pf-hide-narrow-label" data-act="discord" title="Compte Discord lié">' + ICON.discord + '<span>Discord lié</span></button>'
      : '<button class="pf-btn is-discord pf-hide-narrow-label" data-act="discord" title="Lier mon compte Discord">' + ICON.discord + '<span>Lier Discord</span></button>';
    if (!u.linkedin_url) {
      h += '<button class="pf-btn pf-hide-narrow-label" data-act="linkedin" title="Lier mon LinkedIn">' + ICON.linkedin + '<span>Lier LinkedIn</span></button>';
    }
    var issue = !!(S.data.subscription && S.data.subscription.payment_issue);
    h += '<button class="pf-btn is-primary" data-act="edit">Éditer le profil' + (issue ? '<span class="pf-dot"></span>' : '') + '</button>';
    box.innerHTML = h;
  }

  function renderAlert() {
    var s = S.mine && S.data.subscription;
    var on = !!(s && s.payment_issue);
    show($('alert'), on);
    if (!on) return;
    var suspendu = (s.adjuris || []).some(function (a) { return a.status === 'suspendu'; });
    $('alert-text').innerHTML = suspendu
      ? '<b>Accès suspendu.</b> Un paiement est en attente : mets ta carte à jour.'
      : '<b>Paiement refusé.</b> Mets ta carte à jour pour garder ton accès.';
  }

  function renderStats() {
    var box = $('stats');
    var tag = $('stats-tag');
    tag.innerHTML = S.mine && S.user.stats_public === false
      ? '<span class="pf-tag">' + ICON.lock + 'visibles par toi seul</span>' : '';

    if (!S.stats) {
      box.innerHTML = '<div class="pf-locked"><div class="pf-locked-ico">' + ICON.lock + '</div>' +
        '<div><b>Profil privé</b><span>' + esc(S.user.username || 'Cet élève') + ' garde ses statistiques pour lui.</span></div></div>';
      return;
    }
    var st = S.stats;
    var qcm = st.qcm_stats || {};
    var files = st.files || {};
    var dw = st.deepwork || {};
    var rate = qcm.success_rate != null ? qcm.success_rate : 0;

    var docsLimit = S.mine ? files.limit : null;
    var docsVal = fmtInt(files.count) + (docsLimit != null ? '<small style="font-size:13px;color:var(--text-3);font-weight:600"> / ' + fmtInt(docsLimit) + '</small>' : '');
    var docsPct = docsLimit ? Math.min(100, Math.round((files.count || 0) / docsLimit * 100)) : null;

    var sessions = dw.total_sessions || 0;
    box.innerHTML =
      '<div class="pf-stats">' +
        tile(ICON.trophy, st.rank ? '#' + fmtInt(st.rank) : '…', st.total_ranked_users ? 'rang sur ' + fmtInt(st.total_ranked_users) : 'rang') +
        tile(ICON.target, String(rate).replace('.', ',') + ' %', 'réussite QCM · ' + fmtInt(qcm.total_sessions) + ' session' + ((qcm.total_sessions || 0) > 1 ? 's' : ''), Math.round(rate)) +
        tile(ICON.doc, docsVal, 'documents', docsPct, true) +
        tile(ICON.wave, sessions ? esc(dw.total_label || '0 min') : '0 min', 'deep work · ' + fmtInt(sessions) + ' session' + (sessions > 1 ? 's' : '') + ' Discord') +
      '</div>' + deepworkFoot(dw);
  }

  function tile(icon, value, label, pct, rawValue) {
    return '<div class="pf-stat"><div class="pf-stat-ico">' + icon + '</div>' +
      '<div class="pf-stat-value">' + (rawValue ? value : esc(value)) + '</div>' +
      '<div class="pf-stat-label">' + esc(label) + '</div>' +
      (pct != null ? '<div class="pf-bar"><i style="width:' + pct + '%"></i></div>' : '') +
      '</div>';
  }

  function deepworkFoot(dw) {
    if (!dw || !dw.total_sessions) {
      return S.mine
        ? '<div class="pf-stats-foot">Rejoins le salon vocal <b>deep work</b> sur Discord : ton temps de travail, tes objectifs et ta série s\'afficheront ici.</div>'
        : '';
    }
    var parts = [];
    var streak = dw.current_streak || 0;
    if (streak > 0) parts.push('🔥 <b>' + streak + ' jour' + (streak > 1 ? 's' : '') + '</b> d\'affilée');
    if (dw.goals_set) parts.push('<b>' + dw.goals_reached + '/' + dw.goals_set + '</b> objectifs tenus');
    if (dw.week_label) parts.push('<b>' + esc(dw.week_label) + '</b> ces 7 derniers jours');
    return parts.length ? '<div class="pf-stats-foot">' + parts.join(' · ') + '</div>' : '';
  }

  // ================= POSTS DE VEILLE =================
  function actuUrl(id) { return CONFIG.ACTUS_URL + (CONFIG.ACTUS_URL.indexOf('?') < 0 ? '?' : '&') + 'actu=' + encodeURIComponent(id); }

  function postHtml(it, i) {
    var a = it.author || { name: S.user.username, avatar_url: S.user.avatar_url };
    var av = a.avatar_url
      ? '<div class="pf-post-av" style="background-image:url(&quot;' + esc(a.avatar_url) + '&quot;)"></div>'
      : '<div class="pf-post-av">' + esc(initial(a.name)) + '</div>';
    return '<article class="pf-post" style="animation-delay:' + Math.min(i || 0, 8) * 0.03 + 's">' + av +
      '<div class="pf-post-main">' +
        '<div class="pf-post-top"><b>' + esc(a.name || '') + '</b>' +
          (a.role ? '<span class="pf-tag">' + esc(a.role) + '</span>' : '') +
          '<span>· ' + esc(relDate(it.published_at)) + '</span>' +
          (it.category_label ? '<span class="pf-tag blue" style="margin-left:auto">' + esc(it.category_label) + '</span>' : '') +
        '</div>' +
        '<h3 class="pf-post-title"><a href="' + esc(actuUrl(it.id)) + '" target="_top">' + esc(it.title) + '</a></h3>' +
        (it.essentiel ? '<p class="pf-post-text">' + esc(it.essentiel) + '</p>' : '') +
        (it.impact ? '<p class="pf-post-impact"><b>Pourquoi c\'est important · </b>' + esc(it.impact) + '</p>' : '') +
        '<div class="pf-post-foot">' +
          '<a href="' + esc(actuUrl(it.id)) + '" target="_top">' + ICON.read + 'Lire · ' + (it.reading_minutes || 1) + ' min</a>' +
          (it.source_url ? '<a href="' + safeUrl(it.source_url) + '" target="_blank" rel="noopener">' + ICON.out + esc(it.source_name || 'Source') + '</a>' : '') +
        '</div>' +
      '</div></article>';
  }

  function renderPosts() {
    $('posts-count').textContent = S.postsTotal ? fmtInt(S.postsTotal) : '';
    if (!S.posts.length) {
      $('posts').innerHTML = S.mine
        ? '<div class="pf-empty"><b>Aucun post pour l\'instant</b>Les actus de veille que tu publies apparaîtront ici.</div>'
        : '<div class="pf-empty"><b>Aucun post pour l\'instant</b>' + esc(S.user.username || 'Cet élève') + ' n\'a pas encore publié de veille.</div>';
    } else {
      $('posts').innerHTML = S.posts.slice(0, S.shown).map(postHtml).join('');
    }
    syncMore();
  }

  function syncMore() { show($('more'), S.shown < S.posts.length || S.postsHasMore); }

  // Ajoute à la liste les posts déjà chargés jusqu'à `upto`
  function revealPosts(upto) {
    var from = S.shown;
    S.shown = Math.min(upto, S.posts.length);
    $('posts').insertAdjacentHTML('beforeend', S.posts.slice(from, S.shown).map(function (it, i) { return postHtml(it, i); }).join(''));
    syncMore();
  }

    show(box, true);

    var echeance = Date.now() + Math.max(0, d.expires_in != null ? d.expires_in : 300) * 1000;
    S.dc.tick = function () {

      '<div class="pf-dc-row"><button class="pf-btn" data-act="dc-new">Relier un autre compte</button>' +
      '<button class="pf-btn is-ghost" data-act="dc-unlink" style="color:var(--danger)">Délier</button></div>' +

  function dcError(msg) {
    var box = $('discord');

  function dcRequestCode(btn) {

  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(text);
    return new Promise(function (resolve, reject) {
      try {
        var ta = document.createElement('textarea');
        ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select(); document.execCommand('copy');
        document.body.removeChild(ta); resolve();
      } catch (e) { reject(e); }
    });
  }

  // ================= PANNEAU « ÉDITER LE PROFIL » =================
  var overlay = $('overlay');
  var activeTab = 'profil';
  var draft = { banner: null, avatar: null, dropBanner: false };   // fichiers choisis, pas encore envoyés

  // Partie de l'écran où l'embed est réellement visible, en coordonnées de
  // l'iframe. Dans une iframe aussi haute que son contenu, position: fixed se
  // cale sur l'iframe entière (souvent plusieurs écrans de haut) : le panneau
  // s'ouvrait alors au milieu de l'embed, hors de vue. IntersectionObserver
  // donne, même depuis une iframe d'un autre domaine, le morceau de l'iframe
  // qui se trouve dans la fenêtre du navigateur.
  var framed = false;
  try { framed = window.self !== window.top; } catch (e) { framed = true; }

  function fullView() { return { top: 0, left: 0, width: window.innerWidth, height: window.innerHeight }; }

  function visibleArea(cb) {
    if (!framed || !window.IntersectionObserver) { cb(fullView()); return; }
    var done = false;
    var io = new IntersectionObserver(function (entries) {
      if (done) return;
      done = true;
      io.disconnect();
      var r = entries[0] && entries[0].intersectionRect;
      cb(r && r.height >= 160 ? { top: r.top, left: r.left, width: r.width, height: r.height } : fullView());
    });
    io.observe(document.documentElement);
    setTimeout(function () { if (!done) { done = true; io.disconnect(); cb(fullView()); } }, 300);
  }

  function placeStage() {
    visibleArea(function (v) {
      var st = $('stage');
      st.style.top = v.top + 'px';
      st.style.left = v.left + 'px';
      st.style.width = v.width + 'px';
      st.style.height = v.height + 'px';
    });
  }
  window.addEventListener('resize', function () { if (overlay.classList.contains('is-open')) placeStage(); });

  function openEdit(tab) {
    if (!S.mine) return;
    var u = S.user;
    draft = { banner: null, avatar: null, dropBanner: false };
    $('in-name').value = u.username || '';
    $('in-bio').value = u.bio || '';
    $('in-linkedin').value = u.linkedin_url || '';
    $('in-private').setAttribute('aria-checked', u.stats_public === false ? 'true' : 'false');
    setBg($('edit-banner'), u.banner_url);
    show($('drop-banner'), !!u.banner_url);
    setAvatar($('edit-avatar'), u.avatar_url, u.username);
    fileHint('');
    show($('edit-error'), false);
    syncCounts();
    resetPwd();
    showNotice(null);
    syncTabDots();
    placeStage();
    overlay.classList.add('is-open');
    try { document.documentElement.style.overflow = 'hidden'; } catch (e) {}
    setTab(tab || 'profil');
  }

  function closeEdit() {
    overlay.classList.remove('is-open');
    try { document.documentElement.style.overflow = ''; } catch (e) {}
  }

  function setTab(name) {
    activeTab = name;
    [].forEach.call(root.querySelectorAll('.pf-tab'), function (t) {
      var on = t.getAttribute('data-tab') === name;
      t.classList.toggle('is-active', on);
      t.setAttribute('aria-selected', on ? 'true' : 'false');
    });
    [].forEach.call(root.querySelectorAll('[data-pane]'), function (p) { show(p, p.getAttribute('data-pane') === name); });
    show($('save'), name === 'profil');
    $('body').scrollTop = 0;
    if (name === 'securite') secRender();
    if ((name === 'abonnement' || name === 'factures') && !billingPromise) loadBilling();
  }

  function syncTabDots() {
    var t = root.querySelector('.pf-tab[data-tab="abonnement"]');
    var issue = !!(S.data && S.data.subscription && S.data.subscription.payment_issue);
    t.innerHTML = 'Abonnement' + (issue ? '<span class="pf-dot"></span>' : '');
  }

  function showNotice(text, kind) {
    var n = $('notice');
    n.className = 'pf-notice' + (kind ? ' is-' + kind : '') + (text ? '' : ' is-hidden');
    n.textContent = text || '';
  }

  function syncCounts() {
    $('count-name').textContent = $('in-name').value.length + ' / 64';
    $('count-bio').textContent = $('in-bio').value.length + ' / 160';
  }

  function fileHint(msg, isError) {
    var h = $('file-hint');
    h.textContent = msg || '';
    h.classList.toggle('is-error', !!isError);
  }

  function pickFile(input, kind) {
    var file = input.files && input.files[0];
    input.value = '';
    if (!file) return;
    if (['image/jpeg', 'image/jpg', 'image/png', 'image/webp'].indexOf(file.type) < 0) { fileHint('Format non supporté : JPG, PNG ou WEBP.', true); return; }
    if (file.size > 8 * 1024 * 1024) { fileHint('Image trop lourde (8 Mo maximum).', true); return; }
    var reader = new FileReader();
    reader.onload = function (e) {
      if (kind === 'banner') {
        draft.banner = file; draft.dropBanner = false;
        setBg($('edit-banner'), e.target.result);
        show($('drop-banner'), true);
      } else {
        draft.avatar = file;
        setAvatar($('edit-avatar'), e.target.result, '');
      }
      fileHint((kind === 'banner' ? 'Nouvelle bannière' : 'Nouvelle photo') + ' prête : clique sur Enregistrer.');
    };
    reader.readAsDataURL(file);
  }

  function upload(path, file) {
    var fd = new FormData();
    fd.append('file', file);
    return api('POST', path, fd);
  }

  function saveProfile(btn) {
    var u = S.user;
    var name = $('in-name').value.trim();
    var err = $('edit-error');
    show(err, false);
    if (!name) { err.textContent = 'Le nom ne peut pas être vide.'; show(err, true); return; }

    var patch = {};
    if (name !== (u.username || '')) patch.username = name;
    var bio = $('in-bio').value.trim();
    if (bio !== (u.bio || '')) patch.bio = bio;
    var li = $('in-linkedin').value.trim();
    if (li !== (u.linkedin_url || '')) patch.linkedin_url = li;
    var isPublic = $('in-private').getAttribute('aria-checked') !== 'true';
    if (isPublic !== (u.stats_public !== false)) patch.stats_public = isPublic;

    btn.disabled = true;
    btn.textContent = 'Enregistrement…';

    // Les envois d'images d'abord, puis le texte : une erreur de format sur
    // le lien LinkedIn ne doit pas faire perdre une photo déjà envoyée.
    var chain = Promise.resolve();
    if (draft.avatar) chain = chain.then(function () { return upload('/users/me/avatar', draft.avatar); }).then(function () { draft.avatar = null; });
    if (draft.banner) chain = chain.then(function () { return upload('/users/me/banner', draft.banner); }).then(function () { draft.banner = null; });
    else if (draft.dropBanner) chain = chain.then(function () { return api('DELETE', '/users/me/banner'); }).then(function () { draft.dropBanner = false; });
    if (Object.keys(patch).length) chain = chain.then(function () { return api('PATCH', '/users/me', patch); });

    chain
      .then(function () { closeEdit(); return loadMine(); })
      .catch(function (e) { err.textContent = e.message || 'Échec de l\'enregistrement. Réessaie.'; show(err, true); })
      .then(function () { btn.disabled = false; btn.textContent = 'Enregistrer'; });
  }

  // ================= ABONNEMENT & FACTURES =================
  var billing = null, billingPromise = null, billingError = null;
  var paneAbo = root.querySelector('[data-pane="abonnement"]');
  var paneFact = root.querySelector('[data-pane="factures"]');

  function loadBilling() {
    if (!billing) {
      paneAbo.innerHTML = '<div class="pf-loading">Chargement de ton abonnement…</div>';
      paneFact.innerHTML = '<div class="pf-loading">Chargement des factures…</div>';
    }
    billingError = null;
    var p = api('GET', '/subscriptions/billing')
      .then(function (d) { billing = d; })
      .catch(function (e) { billingError = e; console.error('[billing]', e); })
      .then(function () {
        if (billingPromise === p) billingPromise = null;
        renderAbonnement();
        renderFactures();
      });
    billingPromise = p;
    return p;
  }

  function euros(cents, cur) {
    if (cents == null) return null;
    try { return new Intl.NumberFormat('fr-FR', { style: 'currency', currency: (cur || 'eur').toUpperCase() }).format(cents / 100); }
    catch (e) { return (cents / 100).toFixed(2).replace('.', ',') + ' €'; }
  }
  var MARQUES = { visa: 'Visa', mastercard: 'Mastercard', amex: 'American Express', cartes_bancaires: 'CB', cb: 'CB', discover: 'Discover', jcb: 'JCB', unionpay: 'UnionPay', diners: 'Diners', sepa: 'Prélèvement SEPA', sepa_debit: 'Prélèvement SEPA', link: 'Link', paypal: 'PayPal' };
  function carteTexte(c) {
    var t = (MARQUES[c.brand] || (c.brand ? c.brand.charAt(0).toUpperCase() + c.brand.slice(1) : 'Moyen de paiement')) + (c.last4 ? ' •••• ' + c.last4 : '');
    if (c.exp_month && c.exp_year) t += ' · ' + (c.exp_month < 10 ? '0' : '') + c.exp_month + '/' + String(c.exp_year).slice(-2);
    return t;
  }
  function row(k, v, kind) { return '<div class="pf-row"><span class="pf-row-k">' + esc(k) + '</span><span class="pf-row-v' + (kind ? ' is-' + kind : '') + '">' + v + '</span></div>'; }
  function rowCarte(c) {
    if (!c) return row('Carte', 'aucune enregistrée', 'muted');
    var t = esc(carteTexte(c));
    if (c.expired) return row('Carte', t + ' · expirée', 'error');
    if (c.expires_soon) return row('Carte', t + ' · expire bientôt', 'warn');
    return row('Carte', t);
  }
  function rowProchain(n) {
    if (!n) return '';
    var m = euros(n.amount_cents, n.currency);
    var v = m ? esc(m) + ' le ' + esc(dateFr(n.date)) : esc(dateFr(n.date));
    if (n.sessions) v += ' <small>(' + n.sessions + ' séance' + (n.sessions > 1 ? 's' : '') + ')</small>';
    return row('Prochain prélèvement', v);
  }
  function cycle(c) { return c === 'annual' ? 'annuel' : (c === 'monthly' ? 'mensuel' : ''); }
  function pill(text, kind) { return '<span class="pf-tag' + (kind ? ' ' + kind : '') + '">' + esc(text) + '</span>'; }

  function renderAbonnement() {
    if (!billing) {
      paneAbo.innerHTML = '<div class="pf-notice is-error">' + esc(billingError ? billingError.message : 'Abonnement indisponible.') + '</div>' +
        '<button class="pf-btn" data-act="retry">Réessayer</button>';
      return;
    }
    var h = '';
    if (billing.stripe_ok === false) h += '<div class="pf-notice">Stripe ne répond pas pour le moment : la carte, les montants ou les factures peuvent manquer. Réessaie dans quelques minutes.</div>';
    h += carteNavire(billing.navire || {});
    (billing.adjuris || []).forEach(function (a) { h += carteAdjuris(a); });
    h += '<div class="pf-foot">Les paiements sont gérés par Stripe : NAVIRE ne voit jamais ton numéro de carte complet.</div>';
    paneAbo.innerHTML = h;

    // L'alerte et la pastille de la page suivent l'état le plus récent
    if (S.data) {
      var s = S.data.subscription || {};
      s.payment_issue = !!billing.payment_issue;
      s.plan = billing.plan;
      s.plan_label = billing.plan_label;
      s.adjuris = billing.adjuris;
      S.data.subscription = s;
      renderAlert(); renderTags(); renderActions(); syncTabDots();
    }
  }

  function carteNavire(n) {
    var nom = 'NAVIRE AI';
    if (!n.managed_by) {
      return '<div class="pf-card"><div class="pf-card-head"><div><div class="pf-card-name">' + nom + '</div><div class="pf-card-meta">Offre gratuite</div></div>' + pill('Gratuit') + '</div>' +
        '<p class="pf-sec-sub">Passe à Membre ou Membre+ pour plus de QCM, de flashcards et de documents.</p>' +
        '<div class="pf-card-acts"><button class="pf-btn is-blue" data-act="offres">Voir les offres</button></div></div>';
    }
    var formule = esc(n.plan_label || n.plan) + (cycle(n.billing_cycle) ? ' · ' + cycle(n.billing_cycle) : '');
    if (n.managed_by === 'manual') {
      return '<div class="pf-card"><div class="pf-card-head"><div class="pf-card-name">' + nom + '</div>' + pill('Actif', 'blue') + '</div>' +
        '<div class="pf-rows">' + row('Formule', formule) + (n.access_until ? row('Accès jusqu\'au', esc(dateFr(n.access_until))) : '') + '</div>' +
        '<div class="pf-notice">Accès accordé par l\'équipe NAVIRE : aucun prélèvement.</div></div>';
    }
    var tag, notice = '';
    if (n.status === 'past_due') {
      tag = pill('Paiement refusé', 'bad');
      notice = '<div class="pf-notice is-error">Le dernier prélèvement a échoué. Change de carte : la facture en attente sera représentée aussitôt.' +
        (n.unpaid_invoice_url ? ' Tu peux aussi <a href="' + safeUrl(n.unpaid_invoice_url) + '" target="_blank" rel="noopener">la régler en ligne</a>.' : '') + '</div>';
    } else if (n.status === 'cancelled') {
      tag = pill('Résilié');
      notice = '<div class="pf-notice">Ton abonnement ne sera pas renouvelé' + (n.access_until ? ' : tu gardes ton accès jusqu\'au <b>' + esc(dateFr(n.access_until)) + '</b>.' : '.') + '</div>';
    } else {
      tag = pill('Actif', 'blue');
    }
    var rows = row('Formule', formule) + rowProchain(n.next_payment);
    if (n.status === 'active' && !n.next_payment && n.current_period_end) rows += row('Renouvellement', esc(dateFr(n.current_period_end)));
    rows += rowCarte(n.card);

    var a = n.actions || {}, acts = '';
    var urgent = n.status === 'past_due' || (n.card && n.card.expired);
    if (a.reactivate) acts += '<button class="pf-btn is-blue" data-act="reactivate">Réactiver</button>';
    if (a.update_card) acts += '<button class="pf-btn' + (urgent ? ' is-blue' : '') + '" data-act="card" data-target="navire">Changer de carte</button>';
    if (a.portal) acts += '<button class="pf-btn" data-act="portal">Changer de formule</button>';
    if (a.cancel) acts += '<button class="pf-btn is-ghost" data-act="cancel">Résilier</button>';

    return '<div class="pf-card"><div class="pf-card-head"><div class="pf-card-name">' + nom + '</div>' + tag + '</div>' +
      '<div class="pf-rows">' + rows + '</div>' + notice + (acts ? '<div class="pf-card-acts">' + acts + '</div>' : '') + '</div>';
  }

  function carteAdjuris(a) {
    var tag, notice = '';
    var regler = a.unpaid_invoice_url ? ' Ou <a href="' + safeUrl(a.unpaid_invoice_url) + '" target="_blank" rel="noopener">règle-la en ligne</a>.' : '';
    if (a.status === 'suspendu') {
      tag = pill('Accès suspendu', 'bad');
      notice = '<div class="pf-notice is-error">Un prélèvement est resté impayé : ton accès aux matières est suspendu. Change de carte, la facture sera représentée aussitôt et ton accès rendu.' + regler + '</div>';
    } else if (a.status === 'payment_failed') {
      tag = pill('Paiement refusé', 'bad');
      notice = '<div class="pf-notice is-error">Le dernier prélèvement a échoué. Ton accès est conservé 7 jours : change de carte pour régler la facture.' + regler + '</div>';
    } else {
      tag = pill('Actif', 'blue');
    }
    var matieres = (a.matieres || []).map(function (m) { return esc(m.label || m.key); }).join(', ');
    var rows = (rowProchain(a.next_payment) || row('Prochain prélèvement', 'aucun à venir', 'muted')) + rowCarte(a.card);
    var acts = (a.actions || {}).update_card
      ? '<div class="pf-card-acts"><button class="pf-btn' + (a.status !== 'active' || (a.card && a.card.expired) ? ' is-blue' : '') + '" data-act="card" data-target="' + esc(a.subscription_id) + '">Changer de carte</button></div>' : '';
    return '<div class="pf-card"><div class="pf-card-head"><div><div class="pf-card-name">' + esc(a.label || 'Prép\'AdJuris') + '</div>' +
      (matieres ? '<div class="pf-card-meta">' + matieres + '</div>' : '') + '</div>' + tag + '</div>' +
      '<div class="pf-rows">' + rows + '</div>' + notice + acts + '</div>';
  }

  var STATUTS = { paid: ['Payée', 'blue'], open: ['À régler', 'bad'], void: ['Annulée', ''], uncollectible: ['Impayée', 'bad'] };
  function renderFactures() {
    if (!billing) {
      paneFact.innerHTML = '<div class="pf-notice is-error">' + esc(billingError ? billingError.message : 'Factures indisponibles.') + '</div>';
      return;
    }
    var list = billing.invoices || [];
    if (!list.length) {
      paneFact.innerHTML = '<div class="pf-loading">' + (billing.stripe_ok === false ? 'Stripe ne répond pas, réessaie dans quelques minutes.' : 'Aucune facture pour l\'instant.') + '</div>';
      return;
    }
    paneFact.innerHTML = list.map(function (f) {
      var st = STATUTS[f.status] || [f.status || '', ''];
      var liens = '';
      if (f.url) liens += '<a href="' + safeUrl(f.url) + '" target="_blank" rel="noopener">' + (f.status === 'open' ? 'Régler' : 'Voir') + '</a>';
      if (f.pdf_url) liens += '<a href="' + safeUrl(f.pdf_url) + '" target="_blank" rel="noopener">PDF</a>';
      return '<div class="pf-inv"><div class="pf-inv-main">' +
        '<div class="pf-inv-title">' + esc(f.label) + (f.number ? ' · ' + esc(f.number) : '') + '</div>' +
        '<div class="pf-inv-sub">' + esc(dateFr(f.date, 'short')) + '</div></div>' + pill(st[0], st[1]) +
        '<div class="pf-inv-side"><div class="pf-inv-amount">' + esc(euros(f.amount_cents, f.currency) || '') + '</div>' +
        (liens ? '<div class="pf-inv-links">' + liens + '</div>' : '') + '</div></div>';
    }).join('');
  }

  function busy(btn, text) {
    var before = btn.innerHTML;
    btn.disabled = true;
    btn.textContent = text;
    return function () { btn.disabled = false; btn.innerHTML = before; };
  }

  function changerCarte(btn, target) {
    var done = busy(btn, 'Ouverture de Stripe…');
    showNotice(null);
    api('POST', '/subscriptions/payment-method', { target: target || 'navire', return_url: pageUrl() })
      .then(function (d) { go(d.checkout_url); })
      .catch(function (e) { done(); showNotice(e.message, 'error'); });
  }
  function resilier(btn) {
    var n = (billing && billing.navire) || {};
    var jusqua = n.next_payment && n.next_payment.date ? n.next_payment.date : n.current_period_end;
    if (!confirm('Résilier ton abonnement ' + (n.plan_label || '') + ' ?\n\n' +
      (jusqua ? 'Tu gardes ton accès jusqu\'au ' + dateFr(jusqua) + ', ' : 'Tu gardes ton accès jusqu\'à la fin de la période payée, ') +
      'puis tu repasses sur l\'offre gratuite. Tu pourras le réactiver d\'ici là.')) return;
    var done = busy(btn, 'Résiliation…');
    api('POST', '/subscriptions/cancel')
      .then(function (d) { showNotice(d.message || 'Résiliation programmée.', 'ok'); return Promise.all([loadBilling(), loadMine()]); })
      .catch(function (e) { done(); showNotice(e.message, 'error'); });
  }
  function reactiver(btn) {
    var done = busy(btn, 'Réactivation…');
    api('POST', '/subscriptions/reactivate')
      .then(function (d) { showNotice(d.message || 'Abonnement réactivé.', 'ok'); return Promise.all([loadBilling(), loadMine()]); })
      .catch(function (e) { done(); showNotice(e.message, 'error'); });
  }
  function portail(btn) {
    var done = busy(btn, 'Ouverture de Stripe…');
    api('POST', '/subscriptions/portal', { return_url: pageUrl() })
      .then(function (d) { go(d.portal_url); })
      .catch(function (e) { done(); showNotice(e.message, 'error'); });
  }

  // Retour de Stripe : ?billing=card_updated | card_cancelled | portal
  function retourStripe() {
    // Lien direct vers un onglet des paramètres : ?onglet=abonnement|factures
    // (ex. depuis l'onglet Prépa, rubrique Facturation).
    var o = pageParam('onglet');
    if (/^(abonnement|factures)$/.test(o || '') && S.mine && !pageParam('billing')) { openEdit(o); return; }
    var r = pageParam('billing');
    if (!/^(card_updated|card_cancelled|portal)$/.test(r || '') || !S.mine) return;
    var cle = 'pf_billing_retour', emp = r + '|' + (pageUrl() || ''), deja = null;
    try { deja = sessionStorage.getItem(cle); } catch (e) {}
    if (deja === emp) return;
    try { sessionStorage.setItem(cle, emp); } catch (e) {}
    [window, window.parent, window.top].forEach(function (w) {
      try {
        var u = new URL(w.location.href);
        if (!u.searchParams.has('billing')) return;
        u.searchParams.delete('billing');
        w.history.replaceState(w.history.state, '', u.pathname + u.search + u.hash);
      } catch (e) {}
    });
    openEdit('abonnement');
    if (r === 'card_updated') {
      showNotice('Carte enregistrée. Elle servira aux prochains prélèvements, et une facture en attente est représentée dessus.', 'ok');
      // Stripe prévient l'API quelques secondes après le retour
      setTimeout(function () { if (overlay.classList.contains('is-open')) { loadBilling(); loadMine(); } }, 4000);
    } else if (r === 'card_cancelled') {
      showNotice('Changement de carte annulé : rien n\'a été modifié.');
    }
  }

  // ================= SÉCURITÉ =================
  function hasPassword() { return S.user.has_password !== false; }

  function secRender() {
    var u = S.user;
    $('sec-email').textContent = u.email || '…';
    var f = u.oauth_provider ? u.oauth_provider.charAt(0).toUpperCase() + u.oauth_provider.slice(1) : null;
    $('sec-login').textContent = f ? (hasPassword() ? f + ' et mot de passe' : f) : 'Email et mot de passe';
    var setting = !hasPassword();
    $('pwd-title').textContent = setting ? 'Définir un mot de passe' : 'Modifier mon mot de passe';
    $('pwd-sub').innerHTML = setting
      ? (f ? 'Ton compte se connecte avec <b>' + esc(f) + '</b>. Définis un mot de passe pour pouvoir aussi te connecter avec ton adresse email.' : 'Définis un mot de passe pour pouvoir te connecter avec ton adresse email.')
      : 'Tu resteras connecté sur cet appareil après le changement.';
    show($('pwd-current-field'), !setting);
  }

  function pwdRules(pw) {
    return { len: pw.length >= 8 && pw.length <= 72, upper: /[A-Z]/.test(pw), num: /\d/.test(pw) || /[^\w\s]/.test(pw) };
  }
  function syncRules() {
    var r = pwdRules($('pwd-new').value || '');
    [].forEach.call(root.querySelectorAll('[data-rule]'), function (li) { li.classList.toggle('is-ok', !!r[li.getAttribute('data-rule')]); });
  }
  function resetPwd() {
    $('pwd-current').value = ''; $('pwd-new').value = ''; $('pwd-confirm').value = '';
    syncRules();
    show($('pwd-error'), false);
    show($('pwd-success'), false);
  }
  function pwdError(msg, focus) {
    show($('pwd-success'), false);
    $('pwd-error').textContent = msg;
    show($('pwd-error'), true);
    if (focus) $(focus).focus();
  }

  function submitPassword() {
    var need = hasPassword();
    var cur = $('pwd-current').value, next = $('pwd-new').value, conf = $('pwd-confirm').value;
    if (need && !cur) return pwdError('Renseigne ton mot de passe actuel.', 'pwd-current');
    var r = pwdRules(next);
    if (!r.len || !r.upper || !r.num) return pwdError('Mot de passe invalide : 8 à 72 caractères, au moins 1 majuscule, et au moins 1 chiffre ou 1 symbole.', 'pwd-new');
    if (next !== conf) return pwdError('Les deux mots de passe ne correspondent pas.', 'pwd-confirm');
    if (need && next === cur) return pwdError('Le nouveau mot de passe doit être différent de l\'actuel.', 'pwd-new');

    show($('pwd-error'), false);
    var btn = $('pwd-save');
    var done = busy(btn, 'Enregistrement…');
    var body = { new_password: next };
    if (need) body.current_password = cur;
    api('POST', '/users/me/password', body)
      .then(function (d) {
        // Jeton frais : la session continue sans reconnexion
        if (d && d.access_token) { token = d.access_token; try { localStorage.setItem('navire_token', token); } catch (e) {} }
        S.user.has_password = true;
        resetPwd();
        secRender();
        $('pwd-success').textContent = 'Mot de passe mis à jour. Un email de confirmation t\'a été envoyé.';
        show($('pwd-success'), true);
      })
      .catch(function (e) { pwdError(e.message || 'Échec de la mise à jour. Réessaie.'); })
      .then(done);
  }

  // ================= ÉVÉNEMENTS =================
  root.addEventListener('click', function (e) {
    var t = e.target;
    if (t === overlay || t === $('stage')) { closeEdit(); return; }
    var tab = t.closest ? t.closest('.pf-tab') : null;
    if (tab) { showNotice(null); setTab(tab.getAttribute('data-tab')); return; }
    var eye = t.closest ? t.closest('[data-eye]') : null;
    if (eye) { var inp = $(eye.getAttribute('data-eye')); inp.type = inp.type === 'password' ? 'text' : 'password'; inp.focus(); return; }
    if (t.closest && t.closest('[data-el="in-private"]')) {
      var sw = $('in-private');
      sw.setAttribute('aria-checked', sw.getAttribute('aria-checked') === 'true' ? 'false' : 'true');
      return;
    }
    var btn = t.closest ? t.closest('[data-act]') : null;
    if (!btn || btn.disabled) return;
    switch (btn.getAttribute('data-act')) {
      case 'edit': openEdit('profil'); break;
      case 'linkedin': openEdit('profil'); setTimeout(function () { $('in-linkedin').focus(); }, 60); break;
      case 'alert': openEdit('abonnement'); break;
      case 'close': closeEdit(); break;
      case 'save': saveProfile(btn); break;
      case 'more': loadMorePosts(btn); break;
      case 'pick-banner': $('file-banner').click(); break;
      case 'pick-avatar': $('file-avatar').click(); break;
      case 'drop-banner':
        draft.banner = null; draft.dropBanner = !!S.user.banner_url;
        setBg($('edit-banner'), null); show($('drop-banner'), false);
        fileHint(draft.dropBanner ? 'Bannière retirée : clique sur Enregistrer.' : '');
        break;
      case 'discord': dcToggle(); break;
      case 'dc-close': dcClose(); break;
      case 'dc-new': S.dc.mode = S.dc.mode || 'pending'; dcRequestCode(btn); break;
      case 'dc-unlink': dcUnlink(btn); break;
      case 'dc-copy':
        copyText(S.dc.code).then(function () { btn.textContent = 'Copié'; }, function () { btn.textContent = 'Échec'; })
          .then(function () { setTimeout(function () { btn.textContent = 'Copier'; }, 1800); });
        break;
      case 'retry': loadBilling(); break;
      case 'offres': go(CONFIG.OFFRES_URL); break;
      case 'card': changerCarte(btn, btn.getAttribute('data-target')); break;
      case 'cancel': resilier(btn); break;
      case 'reactivate': reactiver(btn); break;
      case 'portal': portail(btn); break;
      case 'pwd-save': submitPassword(); break;
    }
  });

  $('file-banner').addEventListener('change', function () { pickFile(this, 'banner'); });
  $('file-avatar').addEventListener('change', function () { pickFile(this, 'avatar'); });
  $('in-name').addEventListener('input', syncCounts);
  $('in-bio').addEventListener('input', syncCounts);
  $('pwd-new').addEventListener('input', syncRules);
  ['pwd-current', 'pwd-new', 'pwd-confirm'].forEach(function (k) {
    $(k).addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); submitPassword(); } });
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && overlay.classList.contains('is-open')) closeEdit();
  });

  // ================= INIT =================

  // ================= AUTRES PROFILS : recherche, ouverture sur place =================
  S.voir = null;   // id ouvert sur place ('' = mon profil), sinon ?u= de l'adresse
  function setUrlU(id, push) {
    try {
      var w = window.top, u = new URL(w.location.href);
      if (id) u.searchParams.set('u', id); else u.searchParams.delete('u');
      w.history[push ? 'pushState' : 'replaceState']({ navireProfil: id || '' }, '', u.toString());
    } catch (e) {}
  }
  function openUser(id, push) {
    closeFind();
    $('find-q').value = '';
    S.voir = id ? String(id) : '';
    setUrlU(S.voir, push !== false);
    dcStop && dcStop();
    $('state').textContent = 'Chargement…';
    show($('state'), true); show($('page'), false);
    try { root.scrollIntoView({ block: 'start', behavior: 'smooth' }); } catch (e) {}
    return load();
  }
  try {
    window.top.addEventListener('popstate', function () {
      var id = null; try { id = new URL(window.top.location.href).searchParams.get('u'); } catch (e) {}
      S.voir = id || ''; load();
    });
  } catch (e) {}

  var findTimer = null, findSeq = 0, findItems = [], findSel = -1;
  function closeFind() { $('find-res').classList.remove('is-on'); findSel = -1; }
  function renderFind(items, q) {
    findItems = items; findSel = items.length ? 0 : -1;
    var box = $('find-res');
    box.innerHTML = items.length ? items.map(function (u, i) {
      var av = u.avatar_url ? '<span class="pf-res-av" style="background-image:url(&quot;' + esc(u.avatar_url) + '&quot;)"></span>'
                            : '<span class="pf-res-av">' + esc(initial(u.username)) + '</span>';
      return '<button class="pf-res' + (i === 0 ? ' is-sel' : '') + '" data-user="' + u.id + '" role="option">' + av +
        '<span class="pf-res-txt"><b>' + esc(u.username) + (u.is_me ? ' · toi' : '') + '</b><span>' + esc(u.university || 'Étudiant NAVIRE') + '</span></span>' +
        '<span class="pf-res-elo">' + fmtInt(u.elo) + ' elo</span></button>';
    }).join('') : '<div class="pf-res-empty">Aucun élève pour « ' + esc(q) + ' ».</div>';
    box.classList.add('is-on');
  }
  function searchUsers() {
    var q = $('find-q').value.trim(), seq = ++findSeq;
    if (q.length < 2) { closeFind(); return; }
    api('GET', '/users/search?q=' + encodeURIComponent(q)).then(function (d) {
      if (seq === findSeq) renderFind((d && d.items) || [], q);
    }).catch(function () { if (seq === findSeq) closeFind(); });
  }
  $('find-q').addEventListener('input', function () { clearTimeout(findTimer); findTimer = setTimeout(searchUsers, 220); });
  $('find-q').addEventListener('focus', function () { if (findItems.length && $('find-q').value.trim().length >= 2) $('find-res').classList.add('is-on'); });
  $('find-q').addEventListener('keydown', function (e) {
    var rows = $('find-res').querySelectorAll('.pf-res');
    if (e.key === 'Escape') { closeFind(); return; }
    if ((e.key === 'ArrowDown' || e.key === 'ArrowUp') && rows.length) {
      e.preventDefault();
      findSel = (findSel + (e.key === 'ArrowDown' ? 1 : -1) + rows.length) % rows.length;
      rows.forEach(function (r, i) { r.classList.toggle('is-sel', i === findSel); });
    }
    if (e.key === 'Enter' && findSel >= 0 && findItems[findSel]) { e.preventDefault(); var u = findItems[findSel]; openUser(u.is_me ? '' : u.id); }
  });
  $('find').addEventListener('click', function (e) {
    var r = e.target.closest('[data-user]');
    if (r) { var u = findItems.filter(function (x) { return String(x.id) === r.getAttribute('data-user'); })[0]; openUser(u && u.is_me ? '' : r.getAttribute('data-user')); return; }
    if (e.target.closest('[data-act="mon-profil"]')) openUser('');
  });
  document.addEventListener('click', function (e) { if (!e.target.closest || !e.target.closest('[data-el="find"]')) closeFind(); });

  load().then(retourStripe);
})();
</script>
