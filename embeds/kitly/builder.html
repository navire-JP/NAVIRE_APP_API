<!--
  KITLY : builder de vitrine (tableau de bord « Ma vitrine »)
  ==========================================================
  À coller dans un composant « Embed » (HTML) du site Framer Kitly, page
  /dashboard. Hauteur conseillée : 100vh (ou « Fill » dans une section pleine
  hauteur) — l'embed gère lui-même ses deux zones de défilement (formulaire à
  gauche, aperçu téléphone à droite ; onglets Modifier / Aperçu sur mobile).

  Parcours en 4 étapes, sauvegarde automatique (PATCH /kitly/me/profile) :
    1. Identité   nom, adresse kitly.fr/…, métier, catégorie, lieu, accroche,
                  présentation, photo, bannière, email de contact
    2. Liens      réseaux sociaux, chiffres clés, blocs (liens, vidéos, textes)
    3. Boutique   offres : produit physique, numérique, prestation, rendez-vous
    4. Style      template, couleurs, typo, forme des boutons, sections
  Barre du bas : lien de la vitrine, aperçu public, publier / dépublier
  (confirmation de l'email proposée sur place si nécessaire).

  Les limites de formule viennent de l'API (GET /kitly/auth/me) : une option
  verrouillée renvoie vers la page Tarifs. Jeton : « kitly_token ».
  Réglages : bloc CONFIG du script.
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">

<style>
  html, body { margin: 0; padding: 0; height: 100%; background: transparent !important; overflow: hidden; }
  *, *::before, *::after { box-sizing: border-box; }

  #kb {
    --ink: #0a0a0a; --paper: #ffffff; --grey: #f5f5f4; --line: #e4e4e2; --mut: #6f6f6c; --bad: #c2410c; --good: #15803d;
    --serif: 'Instrument Serif', Georgia, serif;
    --sans: 'Inter', -apple-system, 'Segoe UI', Arial, sans-serif;
    font-family: var(--sans); color: var(--ink); -webkit-font-smoothing: antialiased;
    height: 100%; display: flex; flex-direction: column; background: var(--paper);
  }
  #kb button { font-family: inherit; }
  #kb .hidden { display: none !important; }

  /* ── barre du haut ── */
  #kb .top { border-bottom: 1px solid var(--line); padding: 12px 20px 0; flex-shrink: 0; }
  #kb .top-in { display: flex; align-items: center; gap: 14px; justify-content: space-between; flex-wrap: wrap; }
  #kb .title { font-size: 20px; font-weight: 900; letter-spacing: -.03em; margin: 0; }
  #kb .title em { font-family: var(--serif); font-style: italic; font-weight: 400; letter-spacing: 0; }
  #kb .meta { display: flex; align-items: center; gap: 10px; font-size: 12.5px; color: var(--mut); font-weight: 600; }
  #kb .save { display: inline-flex; align-items: center; gap: 6px; }
  #kb .save i { width: 7px; height: 7px; border-radius: 50%; background: var(--good); }
  #kb .save.saving i { background: #d4d4d1; animation: kb-pulse 1s infinite; }
  #kb .save.error i { background: var(--bad); }
  @keyframes kb-pulse { 50% { opacity: .3; } }
  #kb .plan { font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; border: 1px solid var(--ink); padding: 4px 11px; border-radius: 99px; color: var(--ink); text-decoration: none; cursor: pointer; background: none; }
  #kb .steps { display: flex; gap: 4px; margin-top: 12px; overflow-x: auto; scrollbar-width: none; }
  #kb .step { border: 0; background: none; padding: 10px 12px 12px; font-size: 13.5px; font-weight: 700; color: var(--mut); cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; }
  #kb .step b { font-family: var(--serif); font-style: italic; font-weight: 400; margin-right: 4px; }
  #kb .step.on { color: var(--ink); border-bottom-color: var(--ink); }
  #kb .step.extra { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; }
  #kb .step .short { display: none; }
  #kb .step .cnt { font-size: 10.5px; font-weight: 800; background: var(--bad); color: #fff; border-radius: 99px; padding: 1px 7px; }
  #kb .main.wide-mode { grid-template-columns: minmax(0, 1fr); }
  #kb .main.wide-mode .prev { display: none !important; }
  #kb .main.wide-mode .edit { display: block !important; }
  #kb .main.wide-mode .edit-in { max-width: 860px; }
  #kb.wide-mode .mtabs { display: none !important; }
  #kb .kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-bottom: 22px; }
  #kb .kpi { border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
  #kb .kpi b { display: block; font-size: 22px; font-weight: 900; letter-spacing: -.03em; }
  #kb .kpi small { font-size: 11px; color: var(--mut); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
  #kb .kpi.hot { border-color: var(--ink); }
  #kb .order { border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; margin-bottom: 10px; }
  #kb .order.todo { border-color: var(--ink); }
  #kb .order-h { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; flex-wrap: wrap; }
  #kb .order-h .t { font-weight: 800; font-size: 14.5px; }
  #kb .order-h .m { font-size: 12px; color: var(--mut); margin-top: 2px; }
  #kb .order-h .amt { text-align: right; font-weight: 900; font-size: 16px; white-space: nowrap; }
  #kb .order-h .amt small { display: block; font-weight: 600; font-size: 11.5px; color: var(--mut); }
  #kb .order-b { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 16px; font-size: 13px; margin-top: 10px; line-height: 1.45; }
  #kb .order-b .lb { margin: 0 0 2px; }
  #kb .order-b a { color: var(--ink); }
  #kb .order-a { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; align-items: center; }
  #kb .st { display: inline-block; font-size: 10px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; padding: 3px 8px; border-radius: 99px; background: var(--grey); color: var(--mut); vertical-align: 2px; margin-left: 6px; }
  #kb .st.todo { background: var(--ink); color: var(--paper); }
  #kb .st.done { background: #e7f5ec; color: var(--good); }
  #kb .st.bad { background: #fdece4; color: var(--bad); }
  @media (max-width: 560px) {
    #kb .kpis { gap: 6px; }
    #kb .kpi { padding: 10px; }
    #kb .kpi b { font-size: 16px; }
    #kb .kpi small { font-size: 9.5px; }
    #kb .order-b { grid-template-columns: 1fr; }
    #kb .step.extra { margin-left: 0; }
  }

  /* ── zone principale ── */
  #kb .main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 440px; }
  #kb .edit { overflow-y: auto; padding: 24px 28px 40px; }
  #kb .prev { overflow-y: auto; background: var(--grey); border-left: 1px solid var(--line); padding: 22px 20px 40px; }
  #kb .edit-in { max-width: 620px; margin: 0 auto; }
  #kb .pv-label { font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--mut); text-align: center; margin-bottom: 12px; }
  #kb .phone { width: 100%; max-width: 380px; margin: 0 auto; border-radius: 30px; overflow: hidden; box-shadow: 0 0 0 1px var(--line), 0 20px 50px -24px rgba(0,0,0,.25); }
  #kb .mtabs { display: none; }

  /* ── formulaires ── */
  #kb .sec { margin-bottom: 30px; }
  #kb .sec h3 { font-size: 12px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--mut); margin: 0 0 14px; }
  #kb .sec .lead { font-size: 13.5px; color: var(--mut); margin: -6px 0 14px; line-height: 1.5; }
  #kb .field { margin-bottom: 14px; }
  #kb .field > label, #kb .lb { display: block; font-size: 12px; font-weight: 700; color: var(--mut); margin-bottom: 5px; }
  #kb .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  #kb input[type=text], #kb input[type=email], #kb input[type=url], #kb input[type=number], #kb textarea, #kb select {
    width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 11px 13px; font: 14.5px var(--sans);
    color: var(--ink); background: var(--paper); outline: none; transition: border-color .15s;
  }
  #kb textarea { resize: vertical; line-height: 1.5; }
  #kb input:focus, #kb textarea:focus, #kb select:focus { border-color: var(--ink); }
  #kb .err-field { border-color: var(--bad) !important; }
  #kb .count { float: right; font-weight: 600; color: #a3a3a0; }
  #kb .slug { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  #kb .slug span { padding: 0 2px 0 13px; color: var(--mut); font-size: 14.5px; white-space: nowrap; }
  #kb .slug input { border: 0 !important; padding-left: 2px; }
  #kb .slug:focus-within { border-color: var(--ink); }
  #kb .note { font-size: 12px; margin-top: 5px; color: var(--mut); }
  #kb .note.bad { color: var(--bad); } #kb .note.good { color: var(--good); }

  #kb .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; font-weight: 700; font-size: 13.5px; padding: 10px 18px; border-radius: 999px; border: 1px solid var(--ink); background: var(--paper); color: var(--ink); cursor: pointer; transition: .15s; text-decoration: none; white-space: nowrap; }
  #kb .btn:hover { background: var(--grey); }
  #kb .btn.dark { background: var(--ink); color: var(--paper); }
  #kb .btn.dark:hover { background: #2a2a2a; }
  #kb .btn.sm { padding: 7px 13px; font-size: 12.5px; }
  #kb .btn:disabled { opacity: .5; cursor: default; }
  #kb .add { width: 100%; background: none; border: 1px dashed #cfcfcc; border-radius: 11px; padding: 11px; font-size: 13px; font-weight: 700; color: var(--mut); cursor: pointer; transition: .15s; }
  #kb .add:hover { border-color: var(--ink); color: var(--ink); }
  #kb .icon-btn { width: 34px; height: 34px; flex-shrink: 0; border: 1px solid var(--line); border-radius: 9px; background: var(--paper); color: var(--mut); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; font-size: 13px; padding: 0; }
  #kb .icon-btn:hover { border-color: var(--ink); color: var(--ink); }
  #kb .icon-btn svg { width: 15px; height: 15px; }

  #kb .up { display: flex; gap: 12px; align-items: center; }
  #kb .up-av { width: 56px; height: 56px; border-radius: 50%; background: var(--ink) center/cover; color: var(--paper); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 20px; flex-shrink: 0; }
  #kb .up-ban { width: 130px; height: 44px; border-radius: 9px; background: var(--grey) center/cover; color: var(--mut); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; flex-shrink: 0; border: 1px solid var(--line); }

  #kb .item { border: 1px solid var(--line); border-radius: 12px; padding: 10px; margin-bottom: 8px; background: var(--paper); }
  #kb .item-l { display: flex; gap: 8px; align-items: center; }
  #kb .item-l > input, #kb .item-l > select { flex: 1; min-width: 0; }
  #kb .item .grow { flex: 1; min-width: 0; }
  #kb .item + .item { margin-top: 0; }
  #kb .item .sub { display: flex; gap: 8px; margin-top: 8px; }
  #kb .item .sub > * { flex: 1; min-width: 0; }
  #kb .type-tag { font-size: 10px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; background: var(--grey); padding: 4px 8px; border-radius: 99px; color: var(--mut); flex-shrink: 0; }
  #kb .item.off { opacity: .55; }
  #kb .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  #kb .chip { border: 1px solid var(--line); background: var(--paper); border-radius: 99px; padding: 7px 13px; font-size: 12.5px; font-weight: 700; cursor: pointer; color: var(--ink); }
  #kb .chip:hover { border-color: var(--ink); }

  /* offres */
  #kb .offer { display: flex; gap: 12px; align-items: center; border: 1px solid var(--line); border-radius: 13px; padding: 10px; margin-bottom: 8px; }
  #kb .offer-img { width: 52px; height: 52px; border-radius: 10px; background: var(--grey) center/cover; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: #b5b5b2; }
  #kb .offer-img svg { width: 20px; height: 20px; }
  #kb .offer-t { font-weight: 700; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #kb .offer-m { font-size: 12px; color: var(--mut); margin-top: 2px; }
  #kb .pill { display: inline-block; font-size: 10px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; padding: 3px 8px; border-radius: 99px; margin-left: 6px; vertical-align: 1px; }
  #kb .pill.live { background: var(--ink); color: var(--paper); } #kb .pill.draft { background: var(--grey); color: var(--mut); }
  #kb .banner { border: 1px solid var(--ink); border-radius: 13px; padding: 13px 15px; display: flex; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 22px; font-size: 13.5px; line-height: 1.45; }
  #kb .banner.soft { border-color: var(--line); background: var(--grey); }
  #kb .sell { border: 1px solid var(--line); border-radius: 16px; padding: 16px 16px 12px; margin-bottom: 26px; }
  #kb .sell h3 { font-size: 12px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--mut); margin: 0 0 8px; }
  #kb .sell-row { display: flex; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); font-size: 13.5px; }
  #kb .sell-row:first-of-type { border-top: 0; }
  #kb .sell-row .ic { width: 24px; height: 24px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 900; border: 1.5px solid var(--line); color: var(--mut); }
  #kb .sell-row .ic.ok { background: var(--ink); border-color: var(--ink); color: var(--paper); }
  #kb .sell-row .tx { flex: 1; min-width: 0; line-height: 1.4; }
  #kb .sell-row .tx small { display: block; color: var(--mut); font-size: 12px; }
  #kb .sell-foot { font-size: 12.5px; color: var(--mut); margin: 6px 0 0; line-height: 1.5; }
  #kb .sell-foot.ok { color: var(--good); font-weight: 600; }
  #kb .blk-img { display: flex; gap: 10px; align-items: center; margin-top: 8px; }
  #kb .blk-img .thumb { width: 64px; height: 48px; border-radius: 8px; background: var(--grey) center/cover; border: 1px solid var(--line); flex-shrink: 0; }
  #kb .gal-ed { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  #kb .gal-ed .g { position: relative; width: 72px; height: 72px; border-radius: 10px; background: var(--grey) center/cover; border: 1px solid var(--line); }
  #kb .gal-ed .g button { position: absolute; top: -6px; right: -6px; width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--line); background: var(--paper); cursor: pointer; font-size: 11px; line-height: 1; }
  #kb .gal-ed .add-g { width: 72px; height: 72px; border-radius: 10px; border: 1px dashed var(--line); background: none; cursor: pointer; font-size: 22px; color: var(--mut); }
  #kb .side-seg { display: inline-flex; gap: 4px; margin-left: auto; }
  #kb .offer-pay { font-size: 11.5px; margin-top: 3px; color: var(--mut); }
  #kb .offer-pay.ok { color: var(--good); font-weight: 600; }
  #kb .tm-art { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 10px; }
  #kb .tm-art b { display: block; font-size: 13px; margin-bottom: 6px; }
  #kb .tm-art textarea { width: 100%; min-height: 110px; font-size: 13px; line-height: 1.5; }
  #kb .tm-todo { border-color: #f0c9b6; background: #fdf6f1; }
  #kb .kinds { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  #kb .kind { border: 1px solid var(--line); border-radius: 14px; padding: 16px; text-align: left; background: var(--paper); cursor: pointer; transition: .15s; }
  #kb .kind:hover { border-color: var(--ink); transform: translateY(-2px); }
  #kb .kind svg { width: 22px; height: 22px; margin-bottom: 10px; }
  #kb .kind b { display: block; font-size: 14px; } #kb .kind span { display: block; font-size: 12px; color: var(--mut); margin-top: 3px; line-height: 1.4; }
  #kb .imgs { display: flex; gap: 8px; flex-wrap: wrap; }
  #kb .img-th { width: 64px; height: 64px; border-radius: 10px; background: var(--grey) center/cover; position: relative; border: 1px solid var(--line); }
  #kb .img-th button { position: absolute; top: -7px; right: -7px; width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--line); background: var(--paper); cursor: pointer; font-size: 11px; padding: 0; }
  #kb .img-add { width: 64px; height: 64px; border-radius: 10px; border: 1px dashed #cfcfcc; display: flex; align-items: center; justify-content: center; color: var(--mut); cursor: pointer; font-size: 22px; background: none; }
  #kb .check { display: flex; gap: 10px; align-items: center; font-size: 13.5px; font-weight: 600; cursor: pointer; margin: 6px 0; }
  #kb .check input { width: 17px; height: 17px; accent-color: var(--ink); margin: 0; }

  /* style */
  #kb .tpls { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  #kb .tpl { border: 2px solid var(--line); border-radius: 14px; padding: 0; overflow: hidden; cursor: pointer; background: var(--paper); text-align: left; position: relative; transition: .15s; }
  #kb .tpl:hover { transform: translateY(-2px); }
  #kb .tpl.on { border-color: var(--ink); }
  #kb .tpl .sw { height: 70px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; }
  #kb .tpl .sw i { display: block; width: 60%; height: 9px; border-radius: 99px; }
  #kb .tpl .nm { font-size: 12px; font-weight: 700; padding: 8px 10px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
  #kb .lock { font-size: 9.5px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--mut); }
  #kb .colors { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  #kb .color { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; font-size: 13px; font-weight: 600; }
  #kb .color input[type=color] { width: 30px; height: 30px; border: 0; padding: 0; background: none; cursor: pointer; border-radius: 8px; }
  #kb .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 99px; padding: 3px; }
  #kb .seg button { border: 0; background: none; padding: 7px 14px; border-radius: 99px; font-size: 12.5px; font-weight: 700; color: var(--mut); cursor: pointer; }
  #kb .seg button.on { background: var(--ink); color: var(--paper); }

  /* barre de publication */
  #kb .pub { flex-shrink: 0; border-top: 1px solid var(--line); padding: 12px 20px; display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; background: var(--paper); }
  #kb .pub-url { display: flex; align-items: center; gap: 10px; min-width: 0; }
  #kb .dot { width: 8px; height: 8px; border-radius: 50%; background: #d4d4d1; flex-shrink: 0; }
  #kb .dot.on { background: var(--good); }
  #kb .pub-url b { font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #kb .pub-url small { display: block; font-size: 11.5px; color: var(--mut); font-weight: 600; }
  #kb .pub-act { display: flex; gap: 8px; }

  /* modale */
  #kb .modal-bg { position: fixed; inset: 0; background: rgba(10,10,10,.5); z-index: 50; display: flex; align-items: center; justify-content: center; padding: 16px; }
  #kb .modal { background: var(--paper); border-radius: 20px; width: 100%; max-width: 560px; max-height: 100%; overflow-y: auto; padding: 26px; position: relative; animation: kb-pop .18s ease; }
  @keyframes kb-pop { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }
  #kb .modal h4 { font-size: 21px; font-weight: 900; letter-spacing: -.02em; margin: 0 0 6px; }
  #kb .modal h4 em { font-family: var(--serif); font-style: italic; font-weight: 400; }
  #kb .modal .x { position: absolute; top: 14px; right: 14px; }
  #kb .modal-foot { display: flex; justify-content: space-between; gap: 10px; margin-top: 20px; }
  #kb .code { display: flex; gap: 8px; justify-content: center; margin: 16px 0; }
  #kb .code input { width: 46px; height: 54px; text-align: center; font: 800 22px var(--sans); padding: 0; }

  #kb .toast { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%) translateY(20px); opacity: 0; pointer-events: none; background: var(--ink); color: var(--paper); padding: 11px 20px; border-radius: 99px; font-size: 13px; font-weight: 600; transition: .25s; z-index: 60; max-width: calc(100% - 32px); text-align: center; }
  #kb .toast.show { opacity: 1; transform: translateX(-50%); pointer-events: auto; }
  #kb .toast a { color: var(--paper); font-weight: 800; }
  #kb .center { flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px; text-align: center; }
  #kb .center h2 { font-size: 24px; font-weight: 900; letter-spacing: -.03em; margin: 0 0 8px; }
  #kb .center p { color: var(--mut); font-size: 14px; margin: 0 0 18px; }

  @media (max-width: 960px) {
    #kb .main { grid-template-columns: 1fr; }
    #kb .prev { border-left: 0; }
    #kb .main[data-pane=edit] .prev, #kb .main[data-pane=prev] .edit { display: none; }
    #kb .mtabs { display: flex; gap: 6px; padding: 10px 16px 0; }
    #kb .mtabs button { flex: 1; border: 1px solid var(--line); background: var(--paper); border-radius: 99px; padding: 8px; font-weight: 700; font-size: 13px; color: var(--mut); cursor: pointer; }
    #kb .mtabs button.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
    #kb .edit { padding: 18px 16px 32px; }
    #kb .top { padding: 10px 16px 0; }
    #kb .pub { padding: 10px 16px; }
  }

      api("GET", "/slugs/check?slug=" + encodeURIComponent(v)).then(function (r) {
        if (input.value !== v) return;
        if (r.available) {
          note.className = "note good"; note.textContent = "✓ Disponible — enregistrée.";
          queue({ slug: v }, true);
        } else {
          note.className = "note bad";
          note.innerHTML = esc(r.reason || "Indisponible.") + (r.suggestion ? ' Suggestion : <button type="button" class="chip" id="kb-sugg">' + esc(r.suggestion) + '</button>' : "");
          var s = $("#kb-sugg");
          if (s) s.onclick = function () { input.value = r.suggestion; checkSlug(input); };
        }
      }).catch(function () { note.className = "note bad"; note.textContent = "Vérification impossible."; });
    }, 450);
  }

  function chooseTemplate(key) {
    var meta = ((S.catalog && S.catalog.templates) || []).filter(function (t) { return t.key === key; })[0];
    if (meta && meta.advanced && !limits().advanced_theme) return upsell("Le template " + meta.label + " est inclus à partir de la formule Custom.");
    var th = S.profile.theme;
    var patch = { template: key };
    th.template = key;
    if (CUSTOMIZABLE[key]) {
      var pr = TEMPLATE_PRESET[key];
      th.colors = Object.assign({}, pr.colors); th.font_heading = pr.fh; th.background = { type: pr.bg, image_url: "" };
      patch.colors = th.colors; patch.font_heading = pr.fh; patch.background = th.background;
    }
    queue({ theme: patch }, true);
    renderStep(); renderPreview();
  }

  // ── Offres ────────────────────────────────────────────────
  function refreshOffers() {
    return api("GET", "/me/offers").then(function (r) { S.offers = r.items; if (S.step === 3) renderStep(); renderPreview(); });
  }
  function deleteOffer(id) {
    var o = S.offers.filter(function (x) { return x.id === id; })[0];
    if (!o || !window.confirm("Supprimer « " + o.title + " » ?")) return;
    api("DELETE", "/me/offers/" + id).then(function () { toast("Offre supprimée."); refreshOffers(); }).catch(handleError);
  }
  function moveOffer(i, dir) {
    var ids = S.offers.map(function (o) { return o.id; }), j = i + dir;
    if (j < 0 || j >= ids.length) return;
    var t = ids[i]; ids[i] = ids[j]; ids[j] = t;
    api("POST", "/me/offers/reorder", { ids: ids }).then(function (r) { S.offers = r.items; renderStep(); renderPreview(); }).catch(handleError);
  }

  function euros(cents) { return cents == null ? "" : (cents / 100).toFixed(2).replace(".", ",").replace(",00", ""); }
  function cents(v) {
    v = String(v || "").replace(/\s/g, "").replace(",", ".");
    if (v === "") return null;
    var n = Math.round(parseFloat(v) * 100);
    return isNaN(n) || n < 0 ? NaN : n;
  }

    var bg = document.createElement("div");

        }).join("") + '</select></div>';

        '<label class="check"><input type="checkbox" data-d="pickup_available"' + (d.pickup_available ? " checked" : "") + '>Retrait sur place possible</label>';
      if (draft.kind === "digital") return '<div class="row">' + t("file_format", "Format", "PDF, Notion, Figma…") +
        sel("delivery_mode", "Livraison", { download: "Téléchargement", email_link: "Lien par email", account_access: "Accès en ligne" }) + '</div>' +
        t("delivery_url", "Lien de livraison (envoyé automatiquement à l'acheteur après paiement, jamais affiché)", "https://drive.google.com/…");

        sel("location_mode", "Réalisation", { remote: "À distance", onsite: "En présentiel", both: "Les deux" }) + '</div>' +
        t("revisions_included", "Modifications incluses", "2", "number");

    function form() {

      bg.innerHTML = '<div class="modal"><button type="button" class="icon-btn x" data-close>✕</button>' +

          return '<option value="' + m[0] + '"' + (draft.price_mode === m[0] ? " selected" : "") + '>' + m[1] + '</option>';
        }).join("") + '</select></div>' +
        '<div class="field" id="kb-price"><label>Montant TTC (€)</label><div class="item-l" style="gap:6px"><input type="text" inputmode="decimal" data-o="price" value="' + esc(euros(draft.price_cents)) + '" placeholder="150">' +

        '<div class="field"><label>Bouton client</label><select data-o="cta">' + ctas.map(function (c) {
          return '<option value="' + c + '"' + (draft.cta === c ? " selected" : "") + '>' + CTA_LABEL[c] + (c === "book" && !limits().appointments ? " (Custom)" : "") + '</option>';
        }).join("") + '</select></div></div>' +
        detailFields() +
        '<div class="field"><label class="lb">Images (' + draft.images.length + '/' + maxImg + ')</label><div class="imgs">' +
        draft.images.map(function (u, i) { return '<div class="img-th" style="background-image:' + cssUrl(u) + '"><button type="button" data-rm-img="' + i + '">✕</button></div>'; }).join("") +
        (draft.images.length < maxImg ? '<button type="button" class="img-add" data-add-img>+</button>' : '') + '</div></div>' +
        '<label class="check"><input type="checkbox" data-o="published"' + (draft.status === "published" ? " checked" : "") + '>Afficher sur ma vitrine</label>' +
        '<p class="note" id="kb-offer-err" style="color:var(--bad)"></p>' +
        '<div class="modal-foot">' + (offer ? '<span></span>' : '<button type="button" class="btn" data-back>← Changer de type</button>') +
        '<button type="button" class="btn dark" data-save>' + (offer ? "Enregistrer" : "Ajouter l'offre") + '</button></div></div>';
      var priceBox = bg.querySelector("#kb-price"), maxBox = bg.querySelector("#kb-price-max");
      function syncPrice() {
        var m = bg.querySelector('[data-o="price_mode"]').value;
        priceBox.style.visibility = m === "quote" || m === "free" ? "hidden" : "visible";
        maxBox.style.display = m === "range" ? "" : "none";
      }
      syncPrice();
      bg.querySelector('[data-o="price_mode"]').onchange = syncPrice;
      bg.querySelector("[data-close]").onclick = function () { bg.remove(); };
      var back = bg.querySelector("[data-back]"); if (back) back.onclick = chooseKind;
      var addImg = bg.querySelector("[data-add-img]");
      if (addImg) addImg.onclick = function () { readForm(); pickFile("offer", function (url) { draft.images.push(url); form(); }); };
      bg.querySelectorAll("[data-rm-img]").forEach(function (b) { b.onclick = function () { readForm(); draft.images.splice(+b.dataset.rmImg, 1); form(); }; });
      bg.querySelector("[data-save]").onclick = save;
    }

    function readForm() {
      var g = function (k) { var el = bg.querySelector('[data-o="' + k + '"]'); return el ? el.value : ""; };
      draft.title = g("title").trim(); draft.description = g("description").trim(); draft.price_mode = g("price_mode");
      draft.badge = g("badge").trim(); draft.cta = g("cta");
      draft._price = g("price"); draft._price_max = g("price_max");
      draft.status = bg.querySelector('[data-o="published"]').checked ? "published" : "draft";
      var d = Object.assign({}, draft.details || {});
      bg.querySelectorAll("[data-d]").forEach(function (el) {
        var k = el.dataset.d;
        if (el.type === "checkbox") d[k] = el.checked;
        else if (el.type === "number") { if (el.value === "") delete d[k]; else d[k] = parseInt(el.value, 10); }
        else d[k] = el.value;
      });
      draft.details = d;
    }

    function save() {
      readForm();
      var err = bg.querySelector("#kb-offer-err");
      if (!draft.title) { err.textContent = "Donne un titre à ton offre."; return; }
      var body = { kind: draft.kind, title: draft.title, description: draft.description, price_mode: draft.price_mode,
                   badge: draft.badge, cta: draft.cta, images: draft.images, details: draft.details, status: draft.status };
      if (draft.price_mode === "fixed" || draft.price_mode === "range") {
        var p = cents(draft._price), pm = cents(draft._price_max);
        if (p === null || isNaN(p)) { err.textContent = "Indique un prix valide."; return; }
        if (isNaN(pm)) { err.textContent = "Prix maximum invalide."; return; }
        body.price_cents = p; body.price_max_cents = draft.price_mode === "range" ? pm : null;
      }
      var btn = bg.querySelector("[data-save]"); btn.disabled = true;
      var req = offer ? api("PATCH", "/me/offers/" + offer.id, body) : api("POST", "/me/offers", body);
      req.then(function (r) {
        bg.remove();
        toast(offer ? "Offre enregistrée ✓" : "Offre ajoutée ✓");
        refreshOffers();
        if (!offer && r.suggest_terms_questionnaire && body.cta === "order") {
          setTimeout(function () { toast("Pour encaisser cette vente en ligne : active les paiements et publie tes CGV (bloc « Vente en ligne » ci-dessus).", 7000); }, 2000);
        }
      }).catch(function (e) {
        btn.disabled = false;
        var d = e.data && e.data.detail;
        if (e.status === 403 && d && d.code === "plan_required") { err.innerHTML = esc(d.message) + ' <a href="' + esc(CONFIG.PRICING_URL) + '" target="_top">Voir les formules</a>'; return; }
        err.textContent = e.message;
      });
    }

    if (offer) form(); else chooseKind();
  }

  // ── Publication ──────────────────────────────────────────
  function togglePublish() {
    flush().then(function () {
      if (S.profile.is_published) {
        if (!window.confirm("Dépublier ta vitrine ? Elle ne sera plus visible jusqu'à la prochaine publication.")) return;
        return api("POST", "/me/profile/unpublish").then(function (r) { S.profile.is_published = false; renderPub(); renderStep(); toast("Vitrine dépubliée."); });
      }
      return api("POST", "/me/profile/publish").then(function (r) {
        S.profile.is_published = true; renderPub(); renderStep();
        toast("🎉 Ta vitrine est en ligne !", 5000);
      }).catch(function (e) {
        var d = e.data && e.data.detail;
        if (d && d.missing) {
          var keys = d.missing.map(function (m) { return m.key; });
          if (keys.indexOf("verify_email") >= 0) return openVerify(true);
          goStep(1);
          keys.forEach(function (k) { var f = $('[data-f="' + k + '"]'); if (f) f.classList.add("err-field"); });
          return toast(esc(d.missing.map(function (m) { return m.message; }).join(" ")));
        }
        handleError(e);
      });
    });
  }

  function openVerify(thenPublish) {
    var bg = document.createElement("div");
    bg.className = "modal-bg";
    bg.innerHTML = '<div class="modal" style="max-width:420px;text-align:center"><button type="button" class="icon-btn x" data-close>✕</button>' +
      '<h4>Confirme ton <em>email</em></h4><p class="note">Nous envoyons un code à 6 chiffres à <b>' + esc(S.me.user.email) + '</b>.</p>' +
      '<div class="code">' + [0, 1, 2, 3, 4, 5].map(function (i) { return '<input type="text" inputmode="numeric" data-c="' + i + '">'; }).join("") + '</div>' +
      '<p class="note" id="kb-v-err" style="color:var(--bad)"></p>' +
      '<button type="button" class="btn dark" data-ok style="width:100%">Valider</button>' +
      '<p class="note" style="margin-top:12px"><button type="button" class="chip" data-resend>Renvoyer le code</button></p></div>';
    root.appendChild(bg);
    var inputs = bg.querySelectorAll("[data-c]");
    var err = bg.querySelector("#kb-v-err");
    api("POST", "/auth/resend-code").then(function (r) { if (r && r.sent === false) err.textContent = "L'email n'a pas pu partir pour le moment. Réessaie dans quelques minutes."; })
      .catch(function (e) { if (e.status !== 429) err.textContent = e.message; });
    inputs.forEach(function (inp, i) {
      inp.oninput = function () {
        var v = inp.value.replace(/\D/g, "");
        if (v.length > 1) { v.split("").slice(0, 6 - i).forEach(function (c, k) { inputs[i + k].value = c; }); }
        else { inp.value = v; if (v && inputs[i + 1]) inputs[i + 1].focus(); }
      };
      inp.onkeydown = function (e) { if (e.key === "Backspace" && !inp.value && inputs[i - 1]) inputs[i - 1].focus(); };
      inp.onpaste = function (e) {
        var text = ((e.clipboardData || window.clipboardData).getData("text") || "").replace(/\D/g, "");
        if (!text) return;
        e.preventDefault(); inp.value = text; inp.oninput();
      };
    });
    inputs[0].focus();
    bg.querySelector("[data-close]").onclick = function () { bg.remove(); };
    bg.querySelector("[data-resend]").onclick = function () {
      api("POST", "/auth/resend-code").then(function (r) {
        if (r && r.sent === false) { err.style.color = "var(--bad)"; err.textContent = "L'email n'a pas pu partir pour le moment. Réessaie dans quelques minutes."; return; }
        err.style.color = "var(--good)"; err.textContent = "Code renvoyé.";
      })
        .catch(function (e) { err.style.color = "var(--bad)"; err.textContent = e.message; });
    };
    bg.querySelector("[data-ok]").onclick = function () {
      var code = Array.prototype.map.call(inputs, function (i) { return i.value; }).join("");
      if (!/^\d{6}$/.test(code)) { err.textContent = "Saisis les 6 chiffres."; return; }
      api("POST", "/auth/verify-email", { code: code }).then(function (r) {
        S.me.user = r.user; store(CONFIG.USER_KEY, JSON.stringify(r.user));
        bg.remove(); renderStep(); toast("Adresse confirmée ✓");
        if (thenPublish) togglePublish();
      }).catch(function (e) { err.style.color = "var(--bad)"; err.textContent = e.message; });
    };
  }

  // ============================================================
  // Démarrage
  // ============================================================
  function loadEngine() {
    if (window.KitlyVitrine) return Promise.resolve();
    return new Promise(function (resolve) {
      var sc = document.createElement("script");
      sc.src = CONFIG.API_BASE + "/kitly/static/vitrine.js";
      sc.onload = resolve;
      sc.onerror = function () { toast("Aperçu indisponible pour le moment."); resolve(); };
      document.head.appendChild(sc);
    });
  }
  function boot() {
    if (!load(CONFIG.TOKEN_KEY)) return showLogin();
    Promise.all([api("GET", "/auth/me"), api("GET", "/catalog"), loadEngine()]).then(function (res) {
      S.me = res[0]; S.catalog = res[1];
      // Pas encore de vitrine : création immédiate (adresse proposée à partir du nom).
      var ensure = S.me.profile ? Promise.resolve({ profile: S.me.profile }) : api("POST", "/me/profile", {});
      return ensure.then(function (r) {
        S.profile = r.profile;
        if (!S.profile.theme) S.profile.theme = {};
        return api("GET", "/me/offers");
      }).then(function (r) {
        S.offers = r.items;
        renderApp();
        loadSales();   // compteur « à traiter » sur l'onglet Mes ventes
        if (!S.me.profile) toast("Ta vitrine est créée : complète-la, tout est enregistré automatiquement.", 5000);
      });
    }).catch(function (e) { if (e.status !== 401) showError(e.message); });
  }
  boot();
})();
</script>
