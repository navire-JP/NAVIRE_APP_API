<!--
  KITLY : accueil (/home)
  =======================
  Page d'accueil simple, en deux temps :
    1. « Crée ta vitrine » — s'adapte à la personne :
         - visiteur              → grand hero photo pleine largeur (image servie par l'API :
                                   /kitly/static/hero-home.webp), plateforme française pour les
                                   indépendants et petits commerces, « Pourquoi Kitly », les 3 étapes ;
         - connecté, en cours    → sa progression et « Continuer ma vitrine » ;
         - vitrine en ligne      → son lien, ses visites et demandes, Gérer / Voir / Copier ;
    2. la marketplace complète en dessous (recherche, nouveaux, populaires,
       catégories), chargée depuis l'API (GET /kitly/static/marketplace.js, le
       même code que l'embed marketplace).

  Jeton : « kitly_token » (posé par l'embed connexion).
  Composant Framer : Embed HTML, largeur Fill, hauteur auto. Réglages : bloc CONFIG.
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">

<style>
  html, body { margin: 0; padding: 0; background: transparent !important; }
  *, *::before, *::after { box-sizing: border-box; }

  #kh {
    --ink: #0a0a0a; --paper: #ffffff; --grey: #f5f5f4; --line: #e4e4e2; --mut: #6f6f6c; --good: #15803d;
    --serif: 'Instrument Serif', Georgia, serif;
    --sans: 'Inter', -apple-system, 'Segoe UI', Arial, sans-serif;
    font-family: var(--sans); color: var(--ink); -webkit-font-smoothing: antialiased;
  }
  #kh .top { max-width: 1160px; margin: 0 auto; padding: 8px 20px 0; }
  /* Le header du site se superpose au haut de la page (au hero pour les visiteurs) :
     sans hero (connecté), on lui laisse la place. */
  #kh.no-hero .top { padding-top: calc(var(--kh-head, 70px) + 16px); }
  #kh button { font-family: inherit; }
  #kh .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-weight: 700; font-size: 15px; padding: 14px 26px; border-radius: 999px; border: 1px solid var(--ink); background: var(--ink); color: var(--paper); cursor: pointer; text-decoration: none; white-space: nowrap; transition: .15s; }
  #kh .btn:hover { background: #2a2a2a; }
  #kh .btn.ghost { background: var(--paper); color: var(--ink); }
  #kh .btn.ghost:hover { background: var(--grey); }
  #kh .btn.sm { padding: 10px 18px; font-size: 13.5px; }
  #kh em { font-family: var(--serif); font-style: italic; font-weight: 400; letter-spacing: -.01em; }

  /* visiteur */
  #kh .hero { text-align: center; padding: 56px 0 18px; }
  #kh .kicker { font-size: 12px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--mut); margin: 0 0 18px; }
  #kh h1 { font-size: clamp(36px, 6.4vw, 72px); font-weight: 900; letter-spacing: -.045em; line-height: 1.03; margin: 0 auto; max-width: 900px; }
  #kh .hero p.lead { color: var(--mut); font-size: 17px; line-height: 1.5; max-width: 560px; margin: 20px auto 30px; }
  #kh .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  #kh .fine { font-size: 12.5px; color: var(--mut); margin-top: 14px; }
  #kh .fine a, #kh .fine button { color: var(--ink); font-weight: 700; background: none; border: 0; padding: 0; cursor: pointer; font-size: inherit; text-decoration: none; border-bottom: 1px solid var(--ink); }
  #kh .steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin: 44px 0 0; }
  #kh .step { border: 1px solid var(--line); border-radius: 18px; padding: 22px; background: var(--paper); }
  #kh .step .n { font-family: var(--serif); font-style: italic; color: var(--mut); font-size: 15px; }
  #kh .step b { display: block; font-size: 16px; margin-top: 8px; letter-spacing: -.01em; }
  #kh .step p { color: var(--mut); font-size: 13.5px; line-height: 1.5; margin: 6px 0 0; }

  /* connecté */
  #kh .me { margin-top: 28px; border: 1px solid var(--line); border-radius: 24px; padding: 28px; display: grid; grid-template-columns: 1fr auto; gap: 24px; align-items: center; background: var(--paper); }
  #kh .me h2 { font-size: clamp(26px, 3.6vw, 36px); font-weight: 900; letter-spacing: -.035em; margin: 0; line-height: 1.1; }
  #kh .me .sub { color: var(--mut); font-size: 14.5px; margin: 8px 0 0; line-height: 1.5; }
  #kh .bar { height: 6px; background: var(--grey); border-radius: 99px; overflow: hidden; margin: 18px 0 8px; max-width: 420px; }
  #kh .bar i { display: block; height: 100%; background: var(--ink); border-radius: 99px; transition: width .4s; }
  #kh .next { font-size: 13px; color: var(--mut); }
  #kh .next b { color: var(--ink); }
  #kh .me-act { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  #kh .url { display: inline-flex; align-items: center; gap: 8px; margin-top: 14px; font-size: 14px; font-weight: 800; border: 1px solid var(--line); border-radius: 99px; padding: 8px 14px; max-width: 100%; }
  #kh .url span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #kh .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--good); flex-shrink: 0; }
  #kh .kpis { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
  #kh .kpi { border: 1px solid var(--line); border-radius: 14px; padding: 10px 16px; min-width: 120px; }
  #kh .kpi b { display: block; font-size: 22px; font-weight: 900; letter-spacing: -.02em; }
  #kh .kpi small { font-size: 11px; color: var(--mut); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
  #kh .upsell { margin-top: 14px; font-size: 13px; color: var(--mut); }
  #kh .upsell a { color: var(--ink); font-weight: 700; }

  #kh .divider { max-width: 1160px; margin: 56px auto 0; padding: 0 20px; }
  #kh .divider hr { border: 0; border-top: 1px solid var(--line); margin: 0; }
  #kh .market { padding-top: 40px; }
  #kh .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); opacity: 0; background: var(--ink); color: var(--paper); padding: 11px 20px; border-radius: 99px; font-size: 13px; font-weight: 600; transition: .25s; pointer-events: none; z-index: 50; }
  #kh .toast.show { opacity: 1; transform: translateX(-50%); }


  /* ── visiteur : grand hero photo pleine largeur ── */
  /* hauteur : tout l'écran visible sous le header du site (calculée par le script, voir fitHero) */
  #kh .sh { position: relative; width: 100%; min-height: var(--sh-h, 680px); display: flex; align-items: center; overflow: hidden; color: #fff; background: #1a1714; isolation: isolate; }
  #kh .sh-img { position: absolute; inset: 0; background: center 30% / cover no-repeat; z-index: -2; transform: scale(1.06); animation: kh-zoom 14s ease-out forwards; }
  @keyframes kh-zoom { to { transform: scale(1); } }
  #kh .sh::before { content: ""; position: absolute; inset: 0; z-index: -1;
    background: linear-gradient(90deg, rgba(14,11,9,.86) 0%, rgba(14,11,9,.66) 34%, rgba(14,11,9,.18) 62%, rgba(14,11,9,0) 80%),
                linear-gradient(0deg, rgba(14,11,9,.55) 0%, rgba(14,11,9,0) 30%); }
  #kh .sh-in { width: 100%; max-width: 1240px; margin: 0 auto; padding: 104px 40px 128px; }
  #kh .sh-txt { max-width: 620px; }
  #kh .fr { display: inline-flex; align-items: center; gap: 10px; padding: 7px 14px 7px 8px; border-radius: 99px; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.22); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); font-size: 13px; font-weight: 700; letter-spacing: .01em; }
  #kh .flag { width: 24px; height: 16px; border-radius: 3px; overflow: hidden; display: flex; flex-shrink: 0; box-shadow: 0 0 0 1px rgba(255,255,255,.35); }
  #kh .flag i { flex: 1; display: block; } #kh .flag i:nth-child(1) { background: #1f3f9a; } #kh .flag i:nth-child(2) { background: #fff; } #kh .flag i:nth-child(3) { background: #e1262d; }
  #kh .sh h1 { color: #fff; text-align: left; margin: 22px 0 0; max-width: none; font-size: clamp(40px, min(6.2vw, calc(var(--sh-h, 680px) * .085)), 84px); line-height: .98; letter-spacing: -.05em; text-shadow: 0 2px 30px rgba(0,0,0,.25); }
  #kh .sh h1 em { color: #fff; }
  #kh .sh .lead { color: rgba(255,255,255,.86); font-size: 18.5px; line-height: 1.55; margin: 22px 0 30px; max-width: 540px; }
  #kh .sh .actions { justify-content: flex-start; }
  #kh .sh .btn { background: #fff; color: #0a0a0a; border-color: #fff; padding: 16px 28px; font-size: 15.5px; }
  #kh .sh .btn:hover { background: #f1efe9; }
  #kh .sh .btn.ghost { background: rgba(255,255,255,.1); color: #fff; border-color: rgba(255,255,255,.55); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
  #kh .sh .btn.ghost:hover { background: rgba(255,255,255,.2); }
  #kh .sh .fine { color: rgba(255,255,255,.72); }
  #kh .sh .fine a { color: #fff; border-color: rgba(255,255,255,.7); }
  #kh .sh-trust { position: absolute; left: 0; right: 0; bottom: 0; border-top: 1px solid rgba(255,255,255,.16); background: rgba(14,11,9,.32); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
  #kh .sh-trust > div { max-width: 1240px; margin: 0 auto; padding: 18px 40px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; }
  #kh .sh-trust > div > span { display: flex; align-items: center; gap: 12px; font-size: 14px; font-weight: 600; color: rgba(255,255,255,.92); line-height: 1.35; }
  #kh .sh-trust svg { width: 22px; height: 22px; flex-shrink: 0; opacity: .95; }
  #kh .sh-in > * { opacity: 0; transform: translateY(16px); animation: kh-up .9s cubic-bezier(.2,.8,.2,1) forwards; }
  #kh .sh-txt > * { opacity: 0; transform: translateY(16px); animation: kh-up .9s cubic-bezier(.2,.8,.2,1) forwards; }
  #kh .sh-txt > *:nth-child(1) { animation-delay: .05s; } #kh .sh-txt > *:nth-child(2) { animation-delay: .15s; }
  #kh .sh-txt > *:nth-child(3) { animation-delay: .27s; } #kh .sh-txt > *:nth-child(4) { animation-delay: .38s; } #kh .sh-txt > *:nth-child(5) { animation-delay: .48s; }
  #kh .sh-in > .sh-txt { opacity: 1; transform: none; animation: none; }
  @keyframes kh-up { to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { #kh .sh-img, #kh .sh-txt > * { animation: none; opacity: 1; transform: none; } }

  /* pourquoi Kitly */
  #kh .why { max-width: 1160px; margin: 0 auto; padding: 88px 20px 0; }
  #kh .why-h { text-align: center; max-width: 720px; margin: 0 auto 40px; }
  #kh .why-h h2 { font-size: clamp(32px, 4.4vw, 52px); font-weight: 900; letter-spacing: -.045em; line-height: 1.04; margin: 0; }
  #kh .why-h p { color: var(--mut); font-size: 17px; line-height: 1.55; margin: 16px auto 0; max-width: 580px; }
  #kh .why-g { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
  #kh .why-c { border: 1px solid var(--line); border-radius: 22px; padding: 28px; background: var(--paper); }
  #kh .why-c > i { width: 46px; height: 46px; border-radius: 14px; background: var(--grey); display: flex; align-items: center; justify-content: center; }
  #kh .why-c > i svg { width: 22px; height: 22px; }
  #kh .why-c > i.flagbox { background: none; }
  #kh .why-c > i.flagbox .flag { width: 40px; height: 27px; border-radius: 6px; box-shadow: 0 0 0 1px var(--line); }
  #kh .why-c > b { display: block; font-size: 18px; letter-spacing: -.02em; margin-top: 18px; }
  #kh .why-c > p { color: var(--mut); font-size: 14.5px; line-height: 1.6; margin: 8px 0 0; }
  #kh .steps-h { text-align: center; font-size: clamp(26px, 3.2vw, 36px); font-weight: 900; letter-spacing: -.035em; margin: 72px 0 0; }
  #kh .guest .steps { margin-top: 28px; }
  @media (max-width: 760px) {
    #kh .sh { flex-direction: column; align-items: stretch; min-height: 0; }
    #kh .sh-in { min-height: var(--sh-h, 640px); display: flex; flex-direction: column; justify-content: flex-end; }
    #kh .sh h1 { font-size: clamp(36px, min(11vw, calc(var(--sh-h, 640px) * .065)), 52px); margin-top: 18px; }
    #kh .sh-img { background-position: 72% 30%; }
    #kh .sh::before { background: linear-gradient(0deg, rgba(14,11,9,.94) 0%, rgba(14,11,9,.78) 44%, rgba(14,11,9,.2) 72%, rgba(14,11,9,.05) 100%); }
    #kh .sh-in { padding: 96px 20px 24px; }
    #kh .sh .lead { font-size: 16px; margin: 16px 0 24px; }
    #kh .sh-trust { position: static; background: rgba(14,11,9,.94); -webkit-backdrop-filter: none; backdrop-filter: none; }
    #kh .sh-trust > div { grid-template-columns: 1fr; gap: 12px; padding: 18px 20px 22px; }
    #kh .why { padding-top: 56px; }
    #kh .why-g { grid-template-columns: 1fr; gap: 10px; }
    #kh .why-c { padding: 20px; }
    #kh .steps-h { margin-top: 48px; }
  }

  @media (max-width: 760px) {
    #kh .top { padding: 4px 16px 0; }
    #kh.no-hero .top { padding-top: calc(var(--kh-head, 70px) + 12px); }
    #kh .hero { padding: 32px 0 8px; }
    #kh .steps { grid-template-columns: 1fr; gap: 10px; margin-top: 30px; }
    #kh .step { padding: 16px 18px; }
    #kh .me { grid-template-columns: 1fr; padding: 22px; }
    #kh .me-act { justify-content: flex-start; }
    #kh .actions .btn { width: 100%; }
    #kh .divider { margin-top: 40px; padding: 0 16px; }
  }
</style>

<div id="kh">
  <div id="kh-hero"></div>
  <div class="top" id="kh-top"></div>
  <div class="divider"><hr></div>
  <div class="market" id="kh-market"></div>
  <div class="toast" id="kh-toast"></div>
</div>

<script>
(function () {
  "use strict";

  // ============================================================
  // CONFIG
  // ============================================================
  var CONFIG = {
    API_BASE: "https://navire-app-api.onrender.com",
    REGISTER_URL: "/connexion?mode=inscription",
    LOGIN_URL: "/connexion",
    BUILDER_URL: "/builder",
    PRICING_URL: "/subscribe",
    PUBLIC_BASE: "/profile#",       // vitrine = PUBLIC_BASE + slug
    PROFILE_URL: "/profile#{slug}",  // liens des cartes marketplace
    TOKEN_KEY: "kitly_token",
    HERO_IMAGE: ""                   // vide : image du hero servie par l'API (/kitly/static/hero-home.webp)
  };
  // Liens relatifs (« /builder ») complétés avec l'adresse du site qui affiche
  // l'embed : fonctionne tel quel sur kitly.framer.website comme sur kitly.fr.
  (function () {
    var origin = "";
    try { origin = window.top.location.origin; } catch (e) { try { origin = window.location.origin; } catch (e2) {} }
    if (!origin || origin === "null") origin = "https://kitly.framer.website";
    Object.keys(CONFIG).forEach(function (k) {
      var v = CONFIG[k];
      if (typeof v === "string" && v.charAt(0) === "/") CONFIG[k] = origin + v;
    });
  })();


  var root = document.getElementById("kh");
  var top = document.getElementById("kh-top");
  var heroEl = document.getElementById("kh-hero");
  var HERO_IMG = CONFIG.HERO_IMAGE || CONFIG.API_BASE + "/kitly/static/hero-home.webp";
  try { var pl = document.createElement("link"); pl.rel = "preload"; pl.as = "image"; pl.href = HERO_IMG; document.head.appendChild(pl); } catch (e) {}
  var HOST = window, frameEl = null;
  try { if (window.frameElement && window.parent.document) { HOST = window.parent; frameEl = window.frameElement; } } catch (e) {}

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function token() { try { return localStorage.getItem(CONFIG.TOKEN_KEY); } catch (e) { return null; } }
  function api(path) {
    return fetch(CONFIG.API_BASE + "/kitly" + path, { headers: { Authorization: "Bearer " + token() } }).then(function (r) {
      if (!r.ok) { var e = new Error("HTTP " + r.status); e.status = r.status; throw e; }
      return r.json();
    });
  }
  var toastTimer;
  function toast(msg) {
    var t = document.getElementById("kh-toast");
    t.textContent = msg; t.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove("show"); }, 2600);
  }
  function scrollToMarket() {
    var el = document.getElementById("kh-market");
    try {
      if (frameEl) {
        var y = frameEl.getBoundingClientRect().top + HOST.scrollY + el.offsetTop - 70;
        HOST.scrollTo({ top: y, behavior: "smooth" });
        return;
      }
    } catch (e) {}
    el.scrollIntoView({ behavior: "smooth" });
  }

  // ============================================================
  // 1. Crée ta vitrine
  // ============================================================
  var ICO = {
    shop: '<path d="M3 9.5 5 4h14l2 5.5"/><path d="M4 9.5V20h16V9.5"/><path d="M3 9.5a3 3 0 0 0 6 0 3 3 0 0 0 6 0 3 3 0 0 0 6 0"/><path d="M10 20v-5h4v5"/>',
    lock: '<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
    hand: '<path d="M7 11.5V6.5a1.5 1.5 0 0 1 3 0V11"/><path d="M10 10V4.5a1.5 1.5 0 0 1 3 0V10"/><path d="M13 10V5.5a1.5 1.5 0 0 1 3 0V12"/><path d="M16 9.5a1.5 1.5 0 0 1 3 0V14a7 7 0 0 1-7 7h-1a6 6 0 0 1-5-2.7L3.5 15a1.5 1.5 0 0 1 2.4-1.8L7 14.5"/>'
  };
  function ico(path) { return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + path + '</svg>'; }
  var FLAG = '<span class="flag" aria-hidden="true"><i></i><i></i><i></i></span>';

  function renderGuest() {
    heroEl.innerHTML =
      '<section class="sh" aria-label="Kitly" data-framer-name="Hero [sombre]"><div class="sh-img" data-framer-name="Photo [sombre]" style="background-image:url(\'' + esc(HERO_IMG) + '\')" role="img" aria-label="Deux clients descendent un escalator, sacs Kitly à la main"></div>' +
      '<div class="sh-in"><div class="sh-txt">' +
        '<span class="fr">' + FLAG + 'Une plateforme française</span>' +
        '<h1>Les petits commerces méritent une <em>grande vitrine.</em></h1>' +
        '<p class="lead">Artisans, créateurs, commerçants de quartier, freelances : Kitly te donne un vrai site pour présenter et vendre ce que tu fais, sans agence ni compétences techniques.</p>' +
        '<div class="actions"><a class="btn" href="' + esc(CONFIG.REGISTER_URL) + '" target="_top">Créer ma vitrine gratuitement</a>' +
        '<button type="button" class="btn ghost" data-market>Découvrir les commerçants ↓</button></div>' +
        '<p class="fine">Gratuit · Sans carte bancaire · 3 minutes — Déjà un compte ? <a href="' + esc(CONFIG.LOGIN_URL) + '" target="_top">Se connecter</a></p>' +
      '</div></div>' +
      '<div class="sh-trust"><div>' +
        '<span>' + FLAG + 'Conçu en France, pour les indépendants français</span>' +
        '<span>' + ico(ICO.shop) + 'Pensé pour les petits commerces et les artisans</span>' +
        '<span>' + ico(ICO.lock) + 'Paiements sécurisés par Stripe, versés au commerçant</span>' +
      '</div></div></section>';
    root.classList.remove("no-hero");
    fitHero(true);
    setTimeout(function () { fitHero(true); }, 400);   // position définitive de l'embed dans la page
    top.innerHTML =
      '<div class="guest"><section class="why"><div class="why-h">' +
        '<h2>Le commerce indépendant, <em>made in France.</em></h2>' +
        '<p>Face aux géants du e-commerce, les indépendants ont besoin d\'outils simples, pensés pour eux. C\'est pour ça qu\'on a créé Kitly.</p></div>' +
        '<div class="why-g">' +
          '<div class="why-c"><i class="flagbox">' + FLAG + '</i><b>Français, de A à Z</b><p>Une équipe en France, un support en français et une vitrine prête pour le droit français : CGV, mentions légales, données personnelles.</p></div>' +
          '<div class="why-c"><i>' + ico(ICO.shop) + '</i><b>Pour les petits commerçants</b><p>Boutique, prestations, rendez-vous, réalisations : tout ce qu\'il faut pour vendre, sans abonnement à une agence ni ligne de code.</p></div>' +
          '<div class="why-c"><i>' + ico(ICO.hand) + '</i><b>Tes clients restent les tiens</b><p>Ils te contactent directement et paient en ligne en toute sécurité. Ton nom, ta marque, ta relation client.</p></div>' +
        '</div>' +
        '<h2 class="steps-h">Ta vitrine en <em>3 étapes</em></h2>' +
        '<div class="steps">' +
          '<div class="step"><span class="n">01</span><b>Crée ton site</b><p>Ton nom, ton métier, ta photo : ta vitrine est prête en quelques minutes.</p></div>' +
          '<div class="step"><span class="n">02</span><b>Ajoute tes offres</b><p>Prestations, produits physiques ou numériques, rendez-vous.</p></div>' +
          '<div class="step"><span class="n">03</span><b>Partage ton lien</b><p>Sur Instagram, LinkedIn, WhatsApp… et reçois des demandes et des commandes.</p></div>' +
        '</div></section></div>';
  }

  // Le hero prend tout l'écran visible (fenêtre du site moins ce qui est au-dessus de l'embed,
  // le header) et suit les redimensionnements. Sur téléphone, la barre d'adresse qui se replie
  // ne fait pas sauter la page : on ne recalcule que si la largeur change.
  try {
    var hd = HOST.document.querySelector(".khd");
    // embed tout en haut de la page : le header passe par-dessus (sa hauteur, 70 px par défaut)
    if (frameEl && frameEl.getBoundingClientRect().top + HOST.scrollY < 20) root.style.setProperty("--kh-head", Math.round((hd && hd.getBoundingClientRect().height) || 70) + "px");
    else if (frameEl) root.style.setProperty("--kh-head", "0px");
  } catch (e) {}
  var heroW = 0;
  function fitHero(force) {
    var sh = heroEl.querySelector(".sh");
    if (!sh) return;
    var vw, vh, above = 0;
    try {
      vw = HOST.innerWidth; vh = HOST.innerHeight;
      if (frameEl) above = Math.max(0, Math.min(frameEl.getBoundingClientRect().top + HOST.scrollY, 160));
    } catch (e) { return; }
    if (!vh || (!force && vw === heroW)) return;
    heroW = vw;
    var minH = vw <= 760 ? 560 : 600;
    sh.style.setProperty("--sh-h", Math.max(minH, Math.round(vh - above)) + "px");
  }
  try { HOST.addEventListener("resize", function () { fitHero(false); }); } catch (e) {}
  try { HOST.addEventListener("orientationchange", function () { setTimeout(function () { fitHero(true); }, 300); }); } catch (e) {}

  function renderMember(me, stats, leads) {
    heroEl.innerHTML = "";
    root.classList.add("no-hero");
    var u = me.user, p = me.profile;
    var isPremium = me.plan && me.plan.limits && me.plan.limits.marketplace;
    if (p && p.is_published) {
      var url = CONFIG.PUBLIC_BASE + p.slug;
      top.innerHTML = '<div class="me"><div>' +
        '<h2>Ta vitrine est <em>en ligne</em>, ' + esc(u.first_name) + '</h2>' +
        '<div class="url"><span class="dot"></span><span>' + esc(url.replace(/^https?:\/\//, "")) + '</span></div>' +
        '<div class="kpis"><div class="kpi"><b>' + (stats ? stats.visits : "—") + '</b><small>Visites · 30 j</small></div>' +
        '<div class="kpi"><b>' + (leads ? leads.unread : "—") + '</b><small>Demandes à lire</small></div></div>' +
        (isPremium ? '' : '<p class="upsell">Ta vitrine n\'apparaît pas encore dans la marketplace ci-dessous. <a href="' + esc(CONFIG.PRICING_URL) + '" target="_top">Passer à Premium+ →</a></p>') +
        '</div><div class="me-act">' +
        '<a class="btn sm" href="' + esc(CONFIG.BUILDER_URL) + '" target="_top">Gérer ma vitrine</a>' +
        '<a class="btn sm ghost" href="' + esc(url) + '" target="_blank" rel="noopener">Voir</a>' +
        '<button type="button" class="btn sm ghost" data-copy="' + esc(url) + '">Copier le lien</button></div></div>';
      return;
    }
    var steps = me.onboarding || [];
    var next = steps.filter(function (s) { return !s.done; })[0];
    top.innerHTML = '<div class="me"><div>' +
      '<h2>Bonjour <em>' + esc(u.first_name) + '</em>, on termine ta vitrine ?</h2>' +
      '<p class="sub">Tout est enregistré automatiquement : reprends là où tu t\'es arrêté(e).</p>' +
      '<div class="bar"><i style="width:' + (me.onboarding_progress || 0) + '%"></i></div>' +
      '<div class="next">' + (me.onboarding_progress || 0) + ' % — ' + (next ? 'Prochaine étape : <b>' + esc(next.label) + '</b>' : 'Prête à publier') + '</div>' +
      '</div><div class="me-act"><a class="btn" href="' + esc(CONFIG.BUILDER_URL) + '" target="_top">' + (p ? "Continuer ma vitrine" : "Créer ma vitrine") + ' →</a></div></div>';
  }

  root.addEventListener("click", function (e) {
    var t = e.target.closest("[data-market],[data-copy]");
    if (!t) return;
    if (t.hasAttribute("data-market")) return scrollToMarket();
    var url = t.getAttribute("data-copy");
    var done = function () { toast("Lien copié ✓"); };
    if (navigator.clipboard) navigator.clipboard.writeText(url).then(done, function () { window.prompt("Ton lien :", url); });
    else window.prompt("Ton lien :", url);
  });

  // ============================================================
  // 2. Marketplace
  // ============================================================
  function loadMarket() {
    var el = document.getElementById("kh-market");
    var s = document.createElement("script");
    s.src = CONFIG.API_BASE + "/kitly/static/marketplace.js";
    s.onload = function () {
      window.KitlyMarket.mount(el, {
        apiBase: CONFIG.API_BASE, mode: "full", hero: false, ctaBand: false,
        title: "Découvrir les <em>freelances</em>",
        subtitle: "Graphistes, développeurs, photographes, coachs… Compare leurs offres et contacte-les directement.",
        profileUrl: CONFIG.PROFILE_URL, registerUrl: CONFIG.REGISTER_URL
      });
    };
    s.onerror = function () { el.innerHTML = '<p style="text-align:center;color:#6f6f6c">La marketplace n\'a pas pu être chargée.</p>'; };
    document.head.appendChild(s);
  }

  // ============================================================
  // Hauteur de l'iframe = hauteur du contenu
  // ============================================================
  (function () {
    if (!frameEl) {
      if (window.parent !== window) {
        try { new ResizeObserver(function () { window.parent.postMessage({ type: "KITLY_EMBED_HEIGHT", height: Math.ceil(root.getBoundingClientRect().height) }, "*"); }).observe(root); } catch (e) {}
      }
      return;
    }
    var wrappers = [];
    try {
      for (var n = frameEl.parentElement, i = 0; n && i < 4 && n !== HOST.document.body; i++, n = n.parentElement) wrappers.push(n);
      var st = document.createElement("style"); st.textContent = "html,body{overflow:hidden}"; document.head.appendChild(st);
    } catch (e) {}
    var last = 0;
    function report() {
      var h = Math.ceil(root.getBoundingClientRect().height);
      if (!h || h === last) return;
      last = h;
      frameEl.style.height = h + "px"; frameEl.style.minHeight = h + "px";
      wrappers.forEach(function (w) { if (w.childElementCount === 1) { w.style.height = "auto"; w.style.minHeight = h + "px"; } });
    }
    try { new ResizeObserver(report).observe(root); } catch (e) { setInterval(report, 500); }
    window.addEventListener("load", report);
  })();

  // ============================================================
  // Démarrage
  // ============================================================
  if (token()) {
    api("/auth/me").then(function (me) {
      if (me.profile && me.profile.is_published) {
        return Promise.all([api("/me/stats?days=30").catch(function () { return null; }), api("/me/leads?page_size=1").catch(function () { return null; })])
          .then(function (r) { renderMember(me, r[0], r[1]); });
      }
      renderMember(me, null, null);
    }).catch(function (e) {
      if (e.status === 401) { try { localStorage.removeItem(CONFIG.TOKEN_KEY); } catch (x) {} }
      renderGuest();
    });
  } else {
    renderGuest();
  }
  loadMarket();
})();
</script>
