<!--
  NAVIRE · Onglet Fichiers (embed HTML unique)

  Deux vues, bascule en haut à droite :
    - Lecture  : arborescence à gauche (rabattable), lecteur à droite avec onglets
    - Classeur : dossiers et fichiers en grille, fil d'Ariane, aperçu en surimpression

  Ne montre que ce que l'utilisateur a le droit de lire (GET /files/explorer) :
  ses PDF, les documents Prép'AdJuris de ses matières, ses copies et corrigés,
  la veille, le catalogue NAVIRE Lib. Chaque PDF est relu par une route qui
  revérifie l'accès côté serveur.

  Chaque section a son visuel (cartes du Classeur, titres, panneau rabattable) :
  Mes PDF → assets/home-fichiers.png, Mes copies → files-copies.png,
  Enregistrés → files-enregistres.png, servis par GET /assets/{nom}.

  Seule action d'écriture : ajouter ou supprimer un PDF de « Mes fichiers ».
-->
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<style>
  #nv-files, #nv-files *, #nv-files *::before, #nv-files *::after { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; }
  #nv-files {
    --bg: #0d0f17;
    --panel: rgba(255,255,255,0.03);
    --panel-2: rgba(255,255,255,0.05);
    --line: rgba(255,255,255,0.08);
    --line-2: rgba(255,255,255,0.14);
    --text: rgba(255,255,255,0.92);
    --muted: rgba(255,255,255,0.48);
    --faint: rgba(255,255,255,0.28);
    --accent: #5B6FFF;
    --accent-soft: rgba(91,111,255,0.12);
    --ok: #4ade80; --warn: #FFD166; --err: #f87171;
    position: relative;
    width: 100%; height: 640px;   /* remplacé par la hauteur de l'écran au chargement */
    min-height: 460px;
    display: flex; flex-direction: column;
    font-family: 'DM Sans', system-ui, sans-serif; font-size: 13px;
    color: var(--text);
    border: 1px solid var(--line); border-radius: 16px;
    background: var(--panel);
    overflow: hidden;
  }
  :where(#nv-files) button { font-family: inherit; color: inherit; }
  :where(#nv-files) a { color: inherit; text-decoration: none; }
  #nv-files svg { flex-shrink: 0; }

  /* ---------- barre du haut ---------- */
  .fx-top {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px; border-bottom: 1px solid var(--line); flex-shrink: 0;
  }
  .fx-ibtn {
    width: 30px; height: 30px; border-radius: 8px; border: 1px solid transparent;
    background: transparent; cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
    color: var(--muted); transition: background .15s, color .15s, border-color .15s;
  }
  .fx-ibtn:hover { background: var(--panel-2); color: var(--text); }
  .fx-ibtn.is-on { color: var(--text); background: var(--panel-2); border-color: var(--line); }
  .fx-title { font-weight: 600; letter-spacing: -0.01em; font-size: 14px; white-space: nowrap; }
  .fx-search {
    flex: 1; min-width: 0; max-width: 360px; margin-left: auto;
    display: flex; align-items: center; gap: 7px; height: 30px; padding: 0 10px;
    border: 1px solid var(--line); border-radius: 8px; background: rgba(255,255,255,0.02); color: var(--muted);
  }
  .fx-search:focus-within { border-color: var(--line-2); }
  .fx-search input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; color: var(--text); font: inherit; }
  .fx-search input::placeholder { color: var(--faint); }
  .fx-seg { display: inline-flex; padding: 2px; border: 1px solid var(--line); border-radius: 9px; background: rgba(255,255,255,0.02); }
  .fx-seg button {
    display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px;
    border: 0; border-radius: 7px; background: transparent; cursor: pointer; color: var(--muted); font-size: 12px; font-weight: 500;
  }
  .fx-seg button.is-on { background: rgba(255,255,255,0.09); color: var(--text); }
  .fx-btn {
    display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px;
    border-radius: 8px; border: 1px solid var(--line-2); background: transparent; cursor: pointer;
    font-size: 12px; font-weight: 500; white-space: nowrap; transition: background .15s, border-color .15s;
  }
  .fx-btn:hover { background: rgba(255,255,255,0.07); border-color: rgba(255,255,255,0.26); }
  .fx-btn.is-primary { background: #fff; color: #0d0f17; border-color: #fff; }
  .fx-btn.is-primary:hover { background: rgba(255,255,255,0.88); }
  .fx-btn.is-danger:hover { background: rgba(239,68,68,0.15); border-color: rgba(239,68,68,0.4); color: #fca5a5; }
  .fx-btn[disabled] { opacity: .5; pointer-events: none; }

  /* ---------- corps ---------- */
  .fx-body { flex: 1; min-height: 0; display: flex; position: relative; }

  .fx-side {
    width: 264px; flex-shrink: 0; display: flex; flex-direction: column;
    border-right: 1px solid var(--line); background: rgba(0,0,0,0.12);
    transition: margin-left .22s ease;
  }
  #nv-files.side-off .fx-side { margin-left: -264px; }
  .fx-tree { flex: 1; min-height: 0; overflow: auto; padding: 8px 6px 12px; }
  .fx-tree::-webkit-scrollbar, .fx-scroll::-webkit-scrollbar { width: 8px; height: 8px; }
  .fx-tree::-webkit-scrollbar-thumb, .fx-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 8px; }

  .fx-sec { margin-bottom: 6px; }
  .fx-row {
    position: relative; display: flex; align-items: center; gap: 6px; width: 100%;
    min-height: 28px; padding: 4px 8px; border: 0; border-radius: 7px; background: transparent;
    cursor: pointer; text-align: left; font-size: 12.5px; color: rgba(255,255,255,0.78);
  }
  .fx-row:hover { background: rgba(255,255,255,0.045); color: var(--text); }
  .fx-row.is-sel { background: var(--accent-soft); color: var(--text); }
  .fx-row.is-sec { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
  .fx-row .fx-lbl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fx-row .fx-cnt { font-size: 10.5px; color: var(--faint); font-variant-numeric: tabular-nums; }
  .fx-chev { transition: transform .15s; color: var(--faint); }
  .is-open > .fx-row .fx-chev { transform: rotate(90deg); }
  .fx-kids { display: none; padding-left: 12px; margin-left: 9px; border-left: 1px solid rgba(255,255,255,0.05); }
  .is-open > .fx-kids { display: block; }
  .fx-row .fx-del {
    opacity: 0; width: 20px; height: 20px; border: 0; border-radius: 5px; background: transparent; cursor: pointer;
    color: var(--faint); display: inline-flex; align-items: center; justify-content: center;
  }
  .fx-row:hover .fx-del { opacity: 1; }
  .fx-row .fx-del:hover { background: rgba(239,68,68,0.2); color: var(--err); }
  .fx-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }

  .fx-quota { padding: 10px 14px 12px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; }
  .fx-quota-l { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }
  .fx-track { height: 3px; border-radius: 99px; background: rgba(255,255,255,0.07); overflow: hidden; }
  .fx-fill { height: 100%; background: var(--accent); border-radius: 99px; transition: width .4s ease; }

  .fx-main { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; }

  /* ---------- vue Lecture ---------- */
  .fx-tabs { display: flex; gap: 2px; padding: 6px 8px 0; border-bottom: 1px solid var(--line); overflow-x: auto; flex-shrink: 0; }
  .fx-tabs:empty { display: none; }
  .fx-tab {
    display: inline-flex; align-items: center; gap: 6px; max-width: 220px; height: 30px; padding: 0 6px 0 10px;
    border: 1px solid transparent; border-bottom: 0; border-radius: 8px 8px 0 0; background: transparent;
    cursor: pointer; color: var(--muted); font-size: 12px; flex-shrink: 0;
  }
  .fx-tab:hover { color: var(--text); background: rgba(255,255,255,0.03); }
  .fx-tab.is-on { color: var(--text); background: rgba(255,255,255,0.05); border-color: var(--line); }
  .fx-tab span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fx-tab .fx-x { width: 18px; height: 18px; border-radius: 4px; display: inline-flex; align-items: center; justify-content: center; color: var(--faint); }
  .fx-tab .fx-x:hover { background: rgba(255,255,255,0.08); color: var(--text); }

  .fx-view { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .fx-vhead { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); flex-shrink: 0; }
  .fx-vhead h2 { margin: 0; font-size: 13.5px; font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fx-crumb { font-size: 11.5px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 40%; }
  .fx-frame { flex: 1; min-height: 0; border: 0; width: 100%; background: #1a1c25; }
  .fx-scroll { flex: 1; min-height: 0; overflow: auto; }
  .fx-center { flex: 1; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 10px; color: var(--muted); padding: 24px; text-align: center; }

  .fx-article { max-width: 680px; margin: 0 auto; padding: 28px 24px 40px; line-height: 1.6; }
  .fx-article .fx-kick { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--accent); font-weight: 600; }
  .fx-article h1 { font-size: 21px; line-height: 1.3; letter-spacing: -0.015em; margin: 8px 0 6px; font-weight: 600; }
  .fx-article .fx-sub { color: var(--muted); font-size: 12px; margin-bottom: 22px; }
  .fx-article h3 { font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 22px 0 6px; font-weight: 600; }
  .fx-article p { margin: 0; font-size: 14px; color: rgba(255,255,255,0.85); white-space: pre-line; }
  .fx-note { margin-top: 18px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: rgba(255,255,255,0.02); }
  .fx-note b { font-weight: 600; }
  .fx-pill { display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 8px; border-radius: 99px; font-size: 11px; border: 1px solid var(--line); color: var(--muted); }
  .fx-pill.is-ok { color: var(--ok); border-color: rgba(74,222,128,0.3); }
  .fx-pill.is-warn { color: var(--warn); border-color: rgba(255,209,102,0.3); }
  .fx-pill.is-acc { color: #aab4ff; border-color: rgba(91,111,255,0.35); }

  /* accueil (aucun onglet ouvert) */
  .fx-home { max-width: 760px; margin: 0 auto; padding: 26px 22px 36px; display: flex; flex-direction: column; gap: 22px; }
  .fx-drop {
    border: 1px dashed rgba(255,255,255,0.12); border-radius: 14px; padding: 26px 18px;
    display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; cursor: pointer;
    transition: border-color .2s, background .2s;
  }
  .fx-drop:hover { border-color: rgba(255,255,255,0.22); background: rgba(255,255,255,0.02); }
  .fx-drop-ic { width: 42px; height: 42px; border-radius: 12px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.09); display: flex; align-items: center; justify-content: center; }
  .fx-drop b { font-weight: 500; font-size: 14px; }
  .fx-drop small { color: var(--muted); font-size: 12px; }
  .fx-h { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; margin: 0 0 8px; }
  .fx-list { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .fx-li { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border: 0; border-bottom: 1px solid var(--line); background: transparent; cursor: pointer; text-align: left; font-size: 12.5px; }
  .fx-li:last-child { border-bottom: 0; }
  .fx-li:hover { background: rgba(255,255,255,0.03); }
  .fx-li .fx-lbl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fx-li .fx-m { color: var(--faint); font-size: 11px; white-space: nowrap; }

  /* ---------- vue Classeur ---------- */
  .fx-bc { display: flex; align-items: center; gap: 4px; padding: 10px 14px; border-bottom: 1px solid var(--line); flex-shrink: 0; overflow-x: auto; white-space: nowrap; }
  .fx-bc button { border: 0; background: transparent; cursor: pointer; padding: 3px 6px; border-radius: 6px; color: var(--muted); font-size: 12.5px; }
  .fx-bc button:hover { background: rgba(255,255,255,0.05); color: var(--text); }
  .fx-bc button:last-child { color: var(--text); font-weight: 500; }
  .fx-bc i { color: var(--faint); font-style: normal; }
  .fx-gsec:hover { color: var(--text); }
  .fx-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; padding: 14px; }
  .fx-card {
    position: relative; display: flex; flex-direction: column; gap: 10px; min-height: 112px; padding: 12px;
    border: 1px solid var(--line); border-radius: 12px; background: rgba(255,255,255,0.02); cursor: pointer; text-align: left;
    transition: border-color .15s, background .15s, transform .15s;
  }
  .fx-card:hover { border-color: var(--line-2); background: rgba(255,255,255,0.04); }
  .fx-card.is-folder { min-height: 0; flex-direction: row; align-items: center; }
  .fx-card .fx-ic { width: 34px; height: 34px; border-radius: 9px; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.05); }
  .fx-card .fx-ic.is-pdf { background: var(--accent-soft); }
  .fx-card .fx-nm { font-size: 12.5px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; }
  .fx-card.is-folder .fx-nm { display: block; flex: 1; min-width: 0; white-space: nowrap; text-overflow: ellipsis; }
  .fx-card .fx-m { margin-top: auto; font-size: 10.5px; color: var(--faint); }
  .fx-card .fx-del {
    position: absolute; top: 6px; right: 6px; width: 24px; height: 24px; border: 0; border-radius: 6px; background: transparent;
    color: var(--faint); cursor: pointer; display: flex; align-items: center; justify-content: center; opacity: 0;
  }
  .fx-card:hover .fx-del { opacity: 1; }
  .fx-card .fx-del:hover { background: rgba(239,68,68,0.2); color: var(--err); }
  .fx-gsec { display: block; border: 0; background: none; cursor: pointer; text-align: left; padding: 14px 14px 0; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }

  .fx-overlay { position: absolute; inset: 0; z-index: 20; background: rgba(8,9,14,0.72); backdrop-filter: blur(4px); display: flex; padding: 18px; }
  .fx-sheet { flex: 1; display: flex; flex-direction: column; min-width: 0; border: 1px solid var(--line-2); border-radius: 14px; background: #12141d; overflow: hidden; }

  /* ---------- divers ---------- */
  .fx-dropmask {
    position: absolute; inset: 0; z-index: 30; display: none; align-items: center; justify-content: center;
    background: rgba(91,111,255,0.08); border: 2px solid var(--accent); border-radius: 16px; pointer-events: none;
    font-weight: 500; font-size: 14px;
  }
  #nv-files.is-drag .fx-dropmask { display: flex; }
  .fx-spin { width: 16px; height: 16px; border: 1.5px solid rgba(255,255,255,0.1); border-top-color: rgba(255,255,255,0.6); border-radius: 50%; animation: fx-spin .7s linear infinite; }
  @keyframes fx-spin { to { transform: rotate(360deg); } }
  .fx-toasts { position: absolute; right: 14px; bottom: 14px; z-index: 40; display: flex; flex-direction: column; gap: 6px; }
  .fx-toast { display: flex; align-items: center; gap: 7px; padding: 8px 12px; border-radius: 9px; background: #1b1e2a; border: 1px solid var(--line-2); font-size: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.35); }
  .fx-toast.is-ok { color: var(--ok); }
  .fx-toast.is-err { color: var(--err); }
  .fx-empty { color: var(--faint); font-size: 12px; padding: 4px 10px 6px 30px; }
  .fx-hide-sm { }

  /* ---------- confirmation (verre) ---------- */
  .fx-ask { position: absolute; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; padding: 16px;
    background: rgba(6,7,12,0.5); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); animation: fx-fade .15s ease both; }
  .fx-ask-card {
    width: 100%; max-width: 330px; padding: 18px 18px 14px; border-radius: 16px;
    background: rgba(30,33,46,0.62); border: 1px solid rgba(255,255,255,0.14);
    -webkit-backdrop-filter: blur(22px) saturate(140%); backdrop-filter: blur(22px) saturate(140%);
    box-shadow: 0 20px 50px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.08);
    animation: fx-pop .18s cubic-bezier(.2,.8,.2,1) both;
  }
  .fx-ask-ic { width: 34px; height: 34px; border-radius: 10px; display: flex; align-items: center; justify-content: center;
    background: rgba(239,68,68,0.14); border: 1px solid rgba(239,68,68,0.25); color: var(--err); margin-bottom: 12px; }
  .fx-ask-card b { display: block; font-size: 14px; font-weight: 600; margin-bottom: 4px; word-break: break-word; }
  .fx-ask-card p { margin: 0 0 16px; font-size: 12.5px; color: var(--muted); line-height: 1.45; }
  .fx-ask-row { display: flex; gap: 8px; justify-content: flex-end; }
  .fx-btn.is-red { background: rgba(239,68,68,0.9); border-color: transparent; color: #fff; }
  .fx-btn.is-red:hover { background: #ef4444; }
  @keyframes fx-fade { from { opacity: 0; } }
  @keyframes fx-pop { from { opacity: 0; transform: translateY(6px) scale(.97); } }

  .fx-tab.is-pin { padding-right: 10px; }

  #nv-files .fx-go { color: var(--muted); font-size: 12px; }
  #nv-files .fx-go:hover { color: var(--text); }
  .fx-banner { margin: 10px 14px 0; padding: 8px 12px; border-radius: 9px; font-size: 12px; color: var(--warn);
    border: 1px solid rgba(255,209,102,0.25); background: rgba(255,209,102,0.06); flex-shrink: 0; }

  /* ================= VERRE ÉPURÉ : pas de bordures, des panneaux translucides ================= */
  /* Sans fond, comme NAVIRE Lib : la page du site se voit derrière. */
  #nv-files { border: 0; border-radius: 0; background: transparent; box-shadow: none; }
  #nv-files .fx-top { border-bottom: 0; padding: 12px 14px; }
  #nv-files .fx-side { border-right: 0; background: transparent; margin: 0; }
  #nv-files.side-off .fx-side { margin-left: -264px; visibility: hidden; transition: margin-left .22s ease, visibility 0s .22s; }
  #nv-files .fx-quota { border-top: 0; }
  #nv-files .fx-kids { border-left: 0; margin-left: 6px; }
  #nv-files .fx-row { border-radius: 9px; }
  #nv-files .fx-row.is-sel { background: rgba(91,111,255,0.14); }
  #nv-files .fx-ibtn, #nv-files .fx-ibtn.is-on { border: 0; }
  #nv-files .fx-ibtn.is-on { background: rgba(255,255,255,0.07); }
  #nv-files .fx-search { border: 0; background: rgba(255,255,255,0.05); border-radius: 10px; height: 32px; }
  #nv-files .fx-search:focus-within { background: rgba(255,255,255,0.08); }
  #nv-files .fx-seg { border: 0; background: rgba(255,255,255,0.05); border-radius: 10px; }
  #nv-files .fx-seg button.is-on { background: rgba(255,255,255,0.1); box-shadow: 0 1px 8px rgba(0,0,0,0.2); }
  #nv-files .fx-btn { border: 0; background: rgba(255,255,255,0.07); border-radius: 10px; }
  #nv-files .fx-btn:hover { background: rgba(255,255,255,0.12); }
  #nv-files .fx-btn.is-primary { background: #fff; color: #0d0f17; }
  #nv-files .fx-btn.is-primary:hover { background: rgba(255,255,255,0.88); }
  #nv-files .fx-btn.is-danger:hover { background: rgba(239,68,68,0.18); color: #fca5a5; }
  #nv-files .fx-btn.is-red { background: rgba(239,68,68,0.9); color: #fff; }
  #nv-files .fx-main { margin: 0; background: transparent; overflow: hidden; }
  #nv-files .fx-tabs { border-bottom: 0; padding: 8px 8px 0; gap: 4px; }
  #nv-files .fx-tab { border: 0; border-radius: 9px; height: 30px; }
  #nv-files .fx-tab.is-on { background: rgba(255,255,255,0.07); }
  #nv-files .fx-vhead, #nv-files .fx-bc { border-bottom: 0; }
  #nv-files .fx-frame { background: transparent; border-radius: 12px; margin: 0 10px 10px; width: calc(100% - 20px); }
  #nv-files .fx-note { border: 0; background: rgba(255,255,255,0.04); border-radius: 12px; }
  #nv-files .fx-pill { border: 0; background: rgba(255,255,255,0.06); }
  #nv-files .fx-pill.is-ok { background: rgba(74,222,128,0.1); }
  #nv-files .fx-pill.is-warn { background: rgba(255,209,102,0.1); }
  #nv-files .fx-pill.is-acc { background: rgba(91,111,255,0.14); }
  #nv-files .fx-banner { border: 0; }
  #nv-files .fx-list { border: 0; gap: 2px; }
  #nv-files .fx-li { border-bottom: 0; border-radius: 10px; }
  #nv-files .fx-overlay { background: rgba(6,7,12,0.45); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
  #nv-files .fx-sheet { border: 0; background: rgba(22,24,34,0.72); -webkit-backdrop-filter: blur(24px); backdrop-filter: blur(24px); border-radius: 18px; box-shadow: 0 30px 80px rgba(0,0,0,0.5); }

<script>
(function () {
  // ================= CONFIG =================
  var CONFIG = {
    API: "https://navire-app-api.onrender.com",
    TOKEN_KEY: "navire_token",
    LOGIN_URL: "https://navire-ai.com/login",
    SITE: "https://navire-ai.com",         // préfixe des liens NAVIRE Lib (/lib?doc=…, /lib?prepa=devoirs)
    ACTUS_URL: "https://navire-ai.com/actus"  // page Actus (une actu enregistrée s'y ouvre : ?actu=ID)
  };
  // Visuel de chaque section (servi par GET /assets/{nom}, app/routers/assets.py)
  var ART = { "mes-pdf": "files-pdf.png", copies: "files-copies.png", enregistres: "files-enregistres.png" };

  var root = document.getElementById("nv-files");
  var S = {
    data: null, loading: true, error: null,
    view: "lecture",        // lecture | classeur
    side: true,
    open: {},               // dossiers dépliés (arborescence)
    tabs: [], active: null, // vue lecture : onglets ouverts
    path: [],               // vue classeur : ids des dossiers parcourus
    peek: null,             // vue classeur : fichier en aperçu
    q: "",
    uploading: 0
  };
  var IDX = {};             // id → { node, trail: [nœuds parents], sec }
  var BLOBS = {};

  // ================= OUTILS =================
  function el(n) { return root.querySelector('[data-el="' + n + '"]'); }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function store(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function token() { return load(CONFIG.TOKEN_KEY) || ""; }
  function fmtSize(b) { if (b == null) return ""; if (b < 1024) return b + " o"; if (b < 1048576) return Math.round(b / 1024) + " Ko"; return (b / 1048576).toFixed(1).replace(".", ",") + " Mo"; }
  function fmtDate(iso) {
    if (!iso) return "";
    var d = new Date(iso); if (isNaN(d)) return "";
    return d.toLocaleDateString("fr-FR", { day: "numeric", month: "short", year: d.getFullYear() === new Date().getFullYear() ? undefined : "numeric" });
  }
  function norm(s) { return String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, ""); }
  function detail(j, status) {
    var d = j && j.detail;
    if (typeof d === "string") return d;
    if (Array.isArray(d)) return d.map(function (x) { return x.msg; }).join(" · ");
    return "Erreur " + status;
  }
  function api(method, path, body) {
    return fetch(CONFIG.API + path, { method: method, headers: { Authorization: "Bearer " + token() }, body: body })
      .then(function (r) {
        return r.json().catch(function () { return {}; }).then(function (j) {
          if (!r.ok) { var e = new Error(detail(j, r.status)); e.status = r.status; throw e; }
          return j;
        });
      });
  }
  function toast(msg, type) {
    var t = document.createElement("div");
    t.className = "fx-toast" + (type ? " is-" + type : "");
    t.innerHTML = (type === "ok" ? ic("check", 13) : type === "err" ? ic("alert", 13) : '<div class="fx-spin" style="width:12px;height:12px"></div>') + "<span>" + esc(msg) + "</span>";
    el("toasts").appendChild(t);
    if (type) setTimeout(function () { t.remove(); }, 2800);
    return t;
  }
  function go(url) { try { window.top.location.href = url; } catch (e) { window.open(url, "_blank"); } }

  // ================= ICÔNES =================
  var P = {
    side: '<rect x="2.5" y="3" width="15" height="14" rx="2.5"/><path d="M7.5 3v14"/>',
    search: '<circle cx="9" cy="9" r="5.5"/><path d="M13 13l4 4"/>',
    reader: '<rect x="2.5" y="3.5" width="15" height="13" rx="2"/><path d="M8 3.5v13M10.5 7.5h4.5M10.5 10.5h4.5M10.5 13.5h3"/>',
    grid: '<rect x="3" y="3" width="5.5" height="5.5" rx="1.3"/><rect x="11.5" y="3" width="5.5" height="5.5" rx="1.3"/><rect x="3" y="11.5" width="5.5" height="5.5" rx="1.3"/><rect x="11.5" y="11.5" width="5.5" height="5.5" rx="1.3"/>',
    upload: '<path d="M10 13V4M6.5 7.5L10 4l3.5 3.5M4 13.5v1.5a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2v-1.5"/>',
    cloud: '<path d="M10 13V7M10 7L7.5 9.5M10 7l2.5 2.5"/><path d="M5 15a3.5 3.5 0 0 1-.7-6.93A5 5 0 0 1 15 8a3.5 3.5 0 0 1-.3 6.93"/>',
    chev: '<path d="M7.5 5l5 5-5 5"/>',
    folder: '<path d="M2.5 6a2 2 0 0 1 2-2h3l2 2h6a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2h-11a2 2 0 0 1-2-2z"/>',
    pdf: '<path d="M11.5 2.5H6a1.5 1.5 0 0 0-1.5 1.5v12A1.5 1.5 0 0 0 6 17.5h8a1.5 1.5 0 0 0 1.5-1.5V6.5z"/><path d="M11.5 2.5v4h4"/>',
    news: '<rect x="3" y="4" width="14" height="12" rx="2"/><path d="M6 8h8M6 11h8M6 14h5"/>',
    book: '<path d="M4 4.5A1.5 1.5 0 0 1 5.5 3H16v12H5.5A1.5 1.5 0 0 0 4 16.5zM4 16.5A1.5 1.5 0 0 0 5.5 18H16"/>',
    user: '<circle cx="10" cy="7" r="3.2"/><path d="M4 17c.8-3 3.2-4.5 6-4.5s5.2 1.5 6 4.5"/>',
    school: '<path d="M2.5 8L10 4.5 17.5 8 10 11.5z"/><path d="M5.5 9.5v3.5c1.2 1.3 2.8 2 4.5 2s3.3-.7 4.5-2V9.5"/>',
    check: '<path d="M4 10.5l3.5 3.5L16 5.5"/>',
    alert: '<circle cx="10" cy="10" r="7"/><path d="M10 6.5v4.5M10 13.5v.1"/>',
    trash: '<path d="M4 6h12M8 6V4.5h4V6M6 6l.7 10a1.5 1.5 0 0 0 1.5 1.4h3.6a1.5 1.5 0 0 0 1.5-1.4L14 6"/>',
    x: '<path d="M5.5 5.5l9 9M14.5 5.5l-9 9"/>',
    ext: '<path d="M11 3.5h5.5V9M16.5 3.5L9 11M14 12v3a1.5 1.5 0 0 1-1.5 1.5h-7A1.5 1.5 0 0 1 4 15V7.5A1.5 1.5 0 0 1 5.5 6h3"/>',
    down: '<path d="M10 3.5v9M6.5 9L10 12.5 13.5 9M4 16h12"/>',
    bookmark: '<path d="M6 3.5h8a1 1 0 0 1 1 1v12l-5-3.2L5 16.5v-12a1 1 0 0 1 1-1z"/>',
    study: '<path d="M10 5.5C8.5 4.3 6.3 4 3.5 4v11c2.8 0 5 .3 6.5 1.5 1.5-1.2 3.7-1.5 6.5-1.5V4c-2.8 0-5 .3-6.5 1.5zM10 5.5v11"/>',
    home: '<path d="M3.5 9L10 3.5 16.5 9v7a1 1 0 0 1-1 1h-3.5v-5h-4v5H4.5a1 1 0 0 1-1-1z"/>'
  };
  function ic(name, size, color) {
    size = size || 15;
    return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 20 20" fill="none" stroke="' + (color || "currentColor") + '" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">' + (P[name] || "") + "</svg>";
  }
  // Visuel d'une section (vide si la section n'en a pas : on garde alors l'icône)
  function art(sec) {
    var f = sec && ART[sec.id];
    return f ? '<span class="fx-art" aria-hidden="true" style="background-image:url(&quot;' + CONFIG.API + '/assets/' + f + '&quot;)"></span>' : "";
  }
  function nodeIcon(n, size) {
    if (n.type === "folder") return ic("folder", size, "rgba(255,255,255,0.5)");
    if (n.type === "actu") return ic("news", size, "#FFD166");
    if (n.type === "lib") return ic("book", size, "#5BE3A3");
    return ic("pdf", size, "#8b98ff");
  }
  function hydrateIcons(scope) {
    (scope || root).querySelectorAll("[data-ic]").forEach(function (n) { n.innerHTML = ic(n.getAttribute("data-ic"), 15); n.removeAttribute("data-ic"); });
  }

  // ================= DONNÉES =================
  function index() {
    IDX = {};
    function walk(nodes, trail, sec) {
      (nodes || []).forEach(function (n) {
        IDX[n.id] = { node: n, trail: trail, sec: sec };
        if (n.type === "folder") walk(n.children, trail.concat([n]), sec);
      });
    }
    (S.data ? S.data.sections : []).forEach(function (s) {
      var node = { id: "s:" + s.id, type: "folder", label: s.label, children: s.items, section: s };
      IDX[node.id] = { node: node, trail: [], sec: s };
      walk(s.items, [node], s);
    });
  }
  function files(nodes, out) {
    out = out || [];
    (nodes || []).forEach(function (n) { if (n.type === "folder") files(n.children, out); else out.push(n); });
    return out;
  }
  function allFiles() {
    var out = [];
    (S.data ? S.data.sections : []).forEach(function (s) { files(s.items, out); });
    return out;
  }
  function matches(n) {
    if (!S.q) return true;
    var m = n.meta || {};
    var hay = norm([n.label, m.matiere, m.rubrique, m.description, m.source_name].join(" "));
    return norm(S.q).split(/\s+/).every(function (w) { return hay.indexOf(w) !== -1; });
  }
  function canDelete(n) { return !!(n && n.delete); }
  function sectionOf(id) { var x = IDX[id]; return x ? x.sec : null; }

  // Fichiers = mon espace. Le contenu NAVIRE (cours Lib, documents Prépa, fil
  // d'actus) a sa maison ailleurs : on ne le montre jamais ici, même si une
  // API plus ancienne le renvoie encore.
  var ESPACE = { "mes-pdf": "mes-pdf", "mes-fichiers": "mes-pdf", copies: "copies", devoirs: "copies", enregistres: "enregistres" };
  var NOMS = { "mes-pdf": ["Mes PDF", "user"], copies: ["Mes copies", "check"], enregistres: ["Enregistrés", "bookmark"] };
  function espace(sections) {
    var out = {};
    (sections || []).forEach(function (s) {
      var id = ESPACE[s.id]; if (!id || out[id]) return;
      out[id] = Object.assign({}, s, { id: id, label: NOMS[id][0], icon: NOMS[id][1] });
    });
    // API ancienne : les actus enregistrées étaient dans « Veille juridique »
    (sections || []).forEach(function (s) {
      if (s.id !== "veille" || out.enregistres) return;
      var saved = (s.items || []).filter(function (f) { return f.id === "veille-saved"; })[0];
      out.enregistres = { id: "enregistres", label: "Enregistrés", icon: "bookmark", items: saved ? saved.children : [] };
    });
    function propre(items) {
      return (items || []).filter(function (n) { return n.type !== "lib"; })
        .map(function (n) { return n.type === "folder" ? Object.assign({}, n, { children: propre(n.children) }) : n; });
    }
    if (out.copies && !out.copies.action) out.copies.action = { label: "Déposer une copie", link: "/lib?prepa=devoirs" };
    return ["mes-pdf", "copies", "enregistres"].filter(function (k) { return out[k]; })
      .map(function (k) { out[k].items = propre(out[k].items); return out[k]; });
  }
  function fetchAll(silent) {
    if (!token()) { S.loading = false; S.data = null; S.error = "auth"; render(); return Promise.resolve(); }
    if (!silent) { S.loading = true; render(); }
    return api("GET", "/files/explorer").catch(function (e) {
      // API pas encore à jour (405/404) : au moins « Mes fichiers », via l'ancienne route GET /files.
      if (e.status !== 405 && e.status !== 404) throw e;
      return api("GET", "/files").then(function (j) {
        return { fallback: true, sections: [{
          id: "mes-pdf", label: "Mes PDF", icon: "user", upload: true, quota: j.quota,
          items: (j.items || []).map(function (f) {
            return { id: "f-" + f.id, type: "pdf", label: f.filename_original, size_bytes: f.size_bytes, date: f.created_at,
                     src: "/files/" + f.id + "/download?inline=1", "delete": "/files/" + f.id };
          })
        }] };
      });
    }).then(function (j) {
      j.sections = espace(j.sections);
      S.data = j; S.error = null; S.loading = false;
      index();
      // Ferme ce qui n'existe plus (fichier supprimé ailleurs)
      S.tabs = S.tabs.filter(function (id) { return IDX[id]; });
      if (S.active && !IDX[S.active]) S.active = S.tabs[S.tabs.length - 1] || null;
      S.path = S.path.filter(function (id) { return IDX[id]; });
      if (S.peek && !IDX[S.peek]) S.peek = null;
      render();
    }).catch(function (e) {
      S.loading = false;
      S.error = e.status === 401 ? "auth" : (e.message || "Erreur réseau.");
      render();
    });
  }

  function blobFor(src) {
    var c = BLOBS[src];
    if (c && c.url) return Promise.resolve(c.url);
    if (c && c.promise) return c.promise;
    var p = fetch(CONFIG.API + src, { headers: { Authorization: "Bearer " + token() } }).then(function (r) {
      if (!r.ok) return r.json().catch(function () { return {}; }).then(function (j) { throw new Error(detail(j, r.status)); });
      return r.blob();
    }).then(function (b) {
      var url = URL.createObjectURL(new Blob([b], { type: "application/pdf" }));
      BLOBS[src] = { url: url };
      return url;
    }).catch(function (e) { delete BLOBS[src]; throw e; });
    BLOBS[src] = { promise: p };
    return p;
  }
  function dropBlob(src) { var c = BLOBS[src]; if (c && c.url) URL.revokeObjectURL(c.url); delete BLOBS[src]; }

  // ================= ÉCRITURE : ajout / suppression =================
  function notify() {
    try { store("navire_files_refresh", String(Date.now())); } catch (e) {}
    try { window.parent.postMessage({ type: "navire-files-updated" }, "*"); } catch (e) {}
  }
  function isPdf(f) { return f && (f.type === "application/pdf" || /\.pdf$/i.test(f.name || "")); }
  function upload(list) {
    if (!token()) { toast("Connecte-toi d'abord.", "err"); return; }
    var arr = Array.prototype.slice.call(list || []);
    var max = S.data && S.data.max_upload_bytes;
    arr.forEach(function (f) {
      if (!isPdf(f)) { toast(f.name + " : PDF uniquement.", "err"); return; }
      if (max && f.size > max) { toast(f.name + " : fichier trop volumineux.", "err"); return; }
      var t = toast("Envoi de " + f.name + "…");
      var fd = new FormData(); fd.append("file", f);
      S.uploading++;
      api("POST", "/files/upload", fd).then(function (j) {
        t.remove(); toast("Ajouté à Mes fichiers.", "ok");
        S.open["s:mes-pdf"] = true;
        notify();
        return fetchAll(true).then(function () { if (j && j.id && S.view === "lecture") openTab("f-" + j.id); });
      }).catch(function (e) {
        t.remove(); toast(e.message || "Erreur réseau.", "err");
      }).then(function () { S.uploading--; });
    });
  }
  function ask(title, text, okLabel) {
    return new Promise(function (resolve) {
      var box = document.createElement("div");
      box.className = "fx-ask";
      box.innerHTML = '<div class="fx-ask-card" role="dialog" aria-modal="true"><div class="fx-ask-ic">' + ic("trash", 16) + '</div>'
        + '<b>' + esc(title) + '</b><p>' + esc(text) + '</p>'
        + '<div class="fx-ask-row"><button class="fx-btn" data-a="no">Annuler</button><button class="fx-btn is-red" data-a="ok">' + esc(okLabel) + '</button></div></div>';
      function done(v) { document.removeEventListener("keydown", key, true); box.remove(); resolve(v); }
      function key(e) { if (e.key === "Escape") { e.stopPropagation(); done(false); } if (e.key === "Enter") { e.preventDefault(); done(true); } }
      box.addEventListener("click", function (e) {
        var b = e.target.closest("[data-a]");
        if (b) done(b.getAttribute("data-a") === "ok"); else if (e.target === box) done(false);
      });
      document.addEventListener("keydown", key, true);
      root.appendChild(box);
      box.querySelector('[data-a="ok"]').focus();
    });
  }
  function remove(id) {
    var x = IDX[id]; if (!x || !canDelete(x.node)) return;
    ask("Supprimer « " + x.node.label + " » ?", "Le fichier sera retiré de Mes fichiers et de NAVIRE AI. Cette action est définitive.", "Supprimer").then(function (ok) {
      if (ok) doRemove(id, x);
    });
  }
  function doRemove(id, x) {
    api("DELETE", x.node.delete).then(function () {
      if (x.node.src) dropBlob(x.node.src);
      closeTab(id, true);
      if (S.peek === id) S.peek = null;
      toast("Fichier supprimé.", "ok");
      notify();
      fetchAll(true);
    }).catch(function (e) { toast(e.message || "Suppression impossible.", "err"); });
  }

  // ================= NAVIGATION =================
  function openTab(id) {
    if (!IDX[id]) return;
    if (S.tabs.indexOf(id) === -1) S.tabs.push(id);
    S.active = id;
    IDX[id].trail.forEach(function (n) { S.open[n.id] = true; });
    render();
  }
  function closeTab(id, silent) {
    var i = S.tabs.indexOf(id); if (i === -1) return;
    S.tabs.splice(i, 1);
    if (S.active === id) S.active = S.tabs[Math.min(i, S.tabs.length - 1)] || null;
    if (!silent) render();
  }
  function openFile(id) {
    var n = IDX[id] && IDX[id].node; if (!n) return;
    if (S.view === "classeur") { S.peek = id; render(); }
    else openTab(id);
  }
  function setSide(on) { S.side = on; store("navire_files_side", on ? "1" : "0"); root.classList.toggle("side-off", !on); paintTop(); }
  function setView(v) { S.view = v; S.peek = null; store("navire_files_view", v); render(); }

  // ================= RENDU : barre latérale =================
  function treeRow(n, depth) {
    var sel = n.id === (S.view === "lecture" ? S.active : S.peek);
    if (n.type === "folder") {
      var kids = (n.children || []).map(function (c) { return treeRow(c, depth + 1); }).join("");
      if (S.q && !kids) return "";
      var open = S.q ? true : !!S.open[n.id];
      return '<div class="fx-fold' + (open ? " is-open" : "") + '">'
        + '<button class="fx-row" data-act="fold" data-id="' + esc(n.id) + '">' + ic("chev", 12) + nodeIcon(n, 14)
        + '<span class="fx-lbl">' + esc(n.label) + '</span><span class="fx-cnt">' + files(n.children).length + '</span></button>'
        + '<div class="fx-kids">' + (kids || '<div class="fx-empty">Vide</div>') + '</div></div>';
    }
    if (!matches(n)) return "";
    var unread = n.type === "actu" && n.meta && n.meta.lu === false;
    return '<div class="fx-row' + (sel ? " is-sel" : "") + '" role="button" tabindex="0" data-act="file" data-id="' + esc(n.id) + '" title="' + esc(n.label) + '">'
      + '<span style="width:12px"></span>' + nodeIcon(n, 14) + '<span class="fx-lbl">' + esc(n.label) + '</span>'
      + (unread ? '<span class="fx-dot" title="Non lue"></span>' : "")
      + (canDelete(n) ? '<button class="fx-del" data-act="del" data-id="' + esc(n.id) + '" title="Supprimer">' + ic("trash", 13) + '</button>' : "")
      + '</div>';
  }
  function emptyText(s) {
    return s.id === "copies" ? "Aucune copie pour l'instant"
      : s.id === "enregistres" ? "Enregistre une actu dans Actus pour la retrouver ici"
      : s.upload ? "Aucun PDF pour l'instant" : "Vide";
  }
  function actionCard(s) {
    return s.action ? '<button class="fx-card is-dashed" data-act="go" data-link="' + esc(s.action.link) + '" style="align-items:center;justify-content:center;color:var(--muted)">'
      + ic("ext", 18) + '<span style="font-size:12px">' + esc(s.action.label) + '</span></button>' : "";
  }
  function renderTree() {
    var t = el("tree");
    if (!S.data) { t.innerHTML = ""; el("quota").innerHTML = ""; return; }
    t.innerHTML = S.data.sections.map(function (s) {
      var id = "s:" + s.id;
      var kids = (s.items || []).map(function (c) { return treeRow(c, 1); }).join("");
      if (S.q && !kids) return "";
      var open = S.q ? true : S.open[id] !== false;
      return '<div class="fx-sec' + (open ? " is-open" : "") + '">'
        + '<button class="fx-row is-sec" data-act="fold" data-id="' + esc(id) + '" data-sec="1">' + ic("chev", 11) + (art(s) || ic(s.icon || "folder", 13))
        + '<span class="fx-lbl">' + esc(s.label) + '</span></button>'
        + '<div class="fx-kids" style="border-left:0;margin-left:0;padding-left:4px">'
        + (kids || '<div class="fx-empty">' + esc(emptyText(s)) + '</div>')
        + (s.action && !S.q ? '<button class="fx-row fx-go" data-act="go" data-link="' + esc(s.action.link) + '"><span style="width:12px"></span>' + ic("ext", 13) + '<span class="fx-lbl">' + esc(s.action.label) + '</span></button>' : "")
        + '</div></div>';
    }).join("") || '<div class="fx-empty" style="padding:10px">Aucun résultat</div>';
    var mine = S.data.sections[0], q = mine && mine.quota;
    if (q) {
      var lim = q.limit === -1 || q.limit == null ? "∞" : q.limit;
      var pct = q.limit > 0 ? Math.min(100, Math.round(q.used / q.limit * 100)) : 0;
      el("quota").innerHTML = '<div class="fx-quota-l"><span>Mes PDF</span><span>' + q.used + " / " + lim + '</span></div>'
        + '<div class="fx-track"><div class="fx-fill" style="width:' + pct + '%"></div></div>';
    }
  }

  // ================= RENDU : contenu d'un fichier =================
  function crumbOf(id) { var x = IDX[id]; return x ? x.trail.map(function (n) { return n.label; }).join(" / ") : ""; }
  function headActions(n) {
    var h = "";
    if (n.study) h += '<button class="fx-btn is-primary" data-act="study" data-id="' + esc(n.id) + '" title="Lire avec le plan, les questions et NAVIRE AI">' + ic("study", 13) + '<span>Étudier dans la Lib</span></button>';
    if (n.type === "pdf") h += '<button class="fx-btn" data-act="dl" data-id="' + esc(n.id) + '">' + ic("down", 13) + '<span class="fx-hide-sm">Télécharger</span></button>';
    if (n.type === "actu") h += '<button class="fx-btn is-primary" data-act="actus" data-id="' + esc(n.id) + '">' + ic("ext", 13) + '<span>Ouvrir dans Actus</span></button>';
    if (n.type === "actu" && n.meta && n.meta.source_url) h += '<a class="fx-btn" href="' + esc(n.meta.source_url) + '" target="_blank" rel="noopener" style="text-decoration:none">' + ic("ext", 13) + '<span class="fx-hide-sm">Source</span></a>';
    if (canDelete(n)) h += '<button class="fx-btn is-danger" data-act="del" data-id="' + esc(n.id) + '" title="Supprimer">' + ic("trash", 13) + '</button>';
    return h;
  }
  function fileView(id, closable) {
    var n = IDX[id].node, m = n.meta || {};
    var head = '<div class="fx-vhead">' + nodeIcon(n, 16) + '<h2 title="' + esc(n.label) + '">' + esc(n.label) + '</h2>'
      + '<span class="fx-crumb fx-hide-sm">' + esc(crumbOf(id)) + '</span>' + headActions(n)
      + (closable ? '<button class="fx-ibtn" data-act="peek-close" title="Fermer">' + ic("x", 15) + '</button>' : "") + '</div>';
    var notes = "";
    if (m.statut) {
      notes = '<div class="fx-note" style="margin:10px 14px 0;display:flex;flex-wrap:wrap;gap:8px;align-items:center">'
        + '<span class="fx-pill ' + (m.statut === "Corrigé" ? "is-ok" : "is-warn") + '">' + esc(m.statut) + '</span>'
        + (m.note ? '<span class="fx-pill is-acc">Note : ' + esc(m.note) + '</span>' : "")
        + (m.corrige_par ? '<span style="color:var(--muted);font-size:12px">par ' + esc(m.corrige_par) + '</span>' : "")
        + (m.commentaire ? '<div style="flex-basis:100%;font-size:12.5px;color:rgba(255,255,255,0.8);white-space:pre-line">' + esc(m.commentaire) + '</div>' : "")
        + '</div>';
    }
    if (n.type === "pdf") {
      var c = BLOBS[n.src];
      var body = c && c.url
        ? '<iframe class="fx-frame" src="' + esc(c.url) + '#view=FitH" title="' + esc(n.label) + '"></iframe>'
        : '<div class="fx-center" data-pdf="' + esc(n.src) + '"><div class="fx-spin"></div><span>Ouverture du PDF…</span></div>';
      if (!(c && c.url)) setTimeout(function () {
        blobFor(n.src).then(render).catch(function (e) {
          var box = root.querySelector('[data-pdf="' + CSS.escape(n.src) + '"]');
          if (box) box.innerHTML = ic("alert", 22, "#f87171") + "<span>" + esc(e.message || "Impossible d'ouvrir ce PDF.") + "</span>";
        });
      }, 0);
      return head + notes + body;
    }
    if (n.type === "actu") {
      return head + '<div class="fx-scroll"><article class="fx-article">'
        + '<div class="fx-kick">' + esc(m.rubrique || "Veille") + ' · ↗ Actus</div><h1>' + esc(n.label) + '</h1>'
        + '<div class="fx-sub">' + esc([m.source_name, fmtDate(n.date), m.minutes ? m.minutes + " min de lecture" : ""].filter(Boolean).join(" · ")) + '</div>'
        + '<h3>L\'essentiel</h3><p>' + esc(m.essentiel) + '</p>'
        + (m.impact ? '<h3>Pourquoi c\'est important</h3><p>' + esc(m.impact) + '</p>' : "")
        + '</article></div>';
    }
    return head;
  }

  // ================= RENDU : vue Lecture =================
  function renderLecture() {
    var pin = '<div class="fx-tab is-pin' + (!S.active ? " is-on" : "") + '" role="button" tabindex="0" data-act="tab" data-id="" title="Accueil">'
      + ic("home", 13) + '<span>Accueil</span></div>';
    var tabs = pin + S.tabs.map(function (id) {
      var n = IDX[id].node;
      return '<div class="fx-tab' + (id === S.active ? " is-on" : "") + '" role="button" tabindex="0" data-act="tab" data-id="' + esc(id) + '" title="' + esc(n.label) + '">'
        + nodeIcon(n, 13) + '<span>' + esc(n.label) + '</span><span class="fx-x" data-act="tab-close" data-id="' + esc(id) + '">' + ic("x", 12) + '</span></div>';
    }).join("");
    var body = S.active ? '<div class="fx-view">' + fileView(S.active) + '</div>' : '<div class="fx-scroll">' + home() + '</div>';
    return '<div class="fx-tabs">' + tabs + '</div>' + body;
  }
  function home() {
    var all = allFiles();
    function li(n) {
      return '<button class="fx-li" data-act="file" data-id="' + esc(n.id) + '">' + nodeIcon(n, 15) + '<span class="fx-lbl">' + esc(n.label) + '</span>'
        + '<span class="fx-m fx-hide-sm">' + esc(crumbOf(n.id)) + '</span><span class="fx-m">' + esc(fmtDate(n.date)) + '</span></button>';
    }
    function bloc(titre, items, vide) {
      return '<div><div class="fx-h">' + esc(titre) + '</div>' + (items.length ? '<div class="fx-list">' + items.map(li).join("") + '</div>'
        : '<div class="fx-m" style="padding:4px 2px">' + esc(vide) + '</div>') + '</div>';
    }
    var recents = all.filter(function (n) { return n.type === "pdf" && n.date; })
      .sort(function (a, b) { return new Date(b.date) - new Date(a.date); }).slice(0, 6);
    var notes = all.filter(function (n) { return n.meta && n.meta.statut === "Corrigé" && /\(copie\)$/.test(n.label); }).slice(0, 4);
    var actus = all.filter(function (n) { return n.type === "actu"; }).slice(0, 4);
    return '<div class="fx-home">'
      + '<div class="fx-drop" data-act="pick"><div class="fx-drop-ic">' + ic("cloud", 20, "rgba(255,255,255,0.65)") + '</div>'
      + '<b>Déposer un PDF</b><small>Glisse-le ici ou clique pour parcourir. Il rejoint Mes PDF, visible par toi seul, et s\'étudie dans la Lib.</small></div>'
      + bloc("Récents", recents, "Aucun PDF pour l'instant.")
      + (notes.length ? bloc("Copies corrigées", notes, "") : "")
      + bloc("Enregistrés", actus, "Enregistre une actu dans Actus pour la retrouver ici.")
      + '</div>';
  }

  // ================= RENDU : vue Classeur =================
  // Halo des cartes, couleur de la section (comme les cartes NAVIRE Lib)
  var GLOW = { "mes-pdf": "rgba(139,152,255,0.22)", copies: "rgba(74,222,128,0.16)", enregistres: "rgba(255,209,102,0.18)" };
  function glowOf(sec) { return (sec && GLOW[sec.id]) || "rgba(122,167,255,0.16)"; }
  function card(n) {
    if (n.type === "folder") {
      var nb = files(n.children).length, sec = n.section || sectionOf(n.id);
      return '<button class="fx-card is-folder" style="--glow:' + glowOf(sec) + '" data-act="cd" data-id="' + esc(n.id) + '">'
        + (art(sec) || '<div class="fx-ic">' + ic(n.section ? (n.section.icon || "folder") : "folder", 17) + '</div>')
        + '<div class="fx-nm">' + esc(n.label) + '</div><div class="fx-m">' + nb + (nb > 1 ? " documents" : " document") + '</div></button>';
    }
    var m = [fmtDate(n.date), n.size_bytes ? fmtSize(n.size_bytes) : ""].filter(Boolean).join(" · ");
    return '<div class="fx-card" style="--glow:' + glowOf(sectionOf(n.id)).replace(/0\.\d+\)$/, "0.1)") + '" role="button" tabindex="0" data-act="file" data-id="' + esc(n.id) + '" title="' + esc(n.label) + '">'
      + '<div class="fx-ic' + (n.type === "pdf" ? " is-pdf" : "") + '">' + nodeIcon(n, 17) + '</div>'
      + '<div class="fx-nm">' + esc(n.label) + '</div><div class="fx-m">' + esc(m) + '</div>'
      + (canDelete(n) ? '<button class="fx-del" data-act="del" data-id="' + esc(n.id) + '" title="Supprimer">' + ic("trash", 13) + '</button>' : "")
      + '</div>';
  }
  function renderClasseur() {
    var cur = S.path.length ? IDX[S.path[S.path.length - 1]].node : null;
    var bc = '<button data-act="cd" data-id="">' + ic("home", 13) + '</button>'
      + S.path.map(function (id) { return '<i>/</i><button data-act="cd" data-id="' + esc(id) + '">' + esc(IDX[id].node.label) + '</button>'; }).join("");
    var body;
    if (S.q) {
      var hits = (cur ? files(cur.children) : allFiles()).filter(matches);
      body = hits.length ? '<div class="fx-grid">' + hits.map(card).join("") + '</div>' : '<div class="fx-center">Aucun fichier ne correspond.</div>';
    } else if (!cur) {
      body = S.data.sections.map(function (s) {
        var node = IDX["s:" + s.id].node;
        var kids = s.items || [];
        var head = '<button class="fx-gsec" data-act="cd" data-id="' + esc(node.id) + '">' + art(s) + esc(s.label) + '</button>';
        if (!kids.length) {
          return head + '<div class="fx-grid">' + (s.upload ? '<div class="fx-card is-dashed" data-act="pick" style="align-items:center;justify-content:center;color:var(--muted)">' + ic("upload", 18) + '<span style="font-size:12px">Ajouter un PDF</span></div>'
            : actionCard(s) || '<div class="fx-card is-dashed" style="align-items:center;justify-content:center;color:var(--faint);cursor:default;font-size:12px;text-align:center">' + esc(emptyText(s)) + '</div>') + '</div>';
        }
        var show = kids.slice(0, 7).map(card).join("");
        var more = kids.length > 7 ? '<button class="fx-card is-folder" style="--glow:' + glowOf(s) + '" data-act="cd" data-id="' + esc(node.id) + '">' + (art(s) || '<div class="fx-ic">' + ic("folder", 17) + '</div>') + '<div class="fx-nm">Tout voir</div><div class="fx-m">' + kids.length + ' éléments</div></button>' : "";
        return head + '<div class="fx-grid">' + show + more + actionCard(s) + '</div>';
      }).join("");
    } else {
      var kids = cur.children || [];
      var folders = kids.filter(function (n) { return n.type === "folder"; });
      var leafs = kids.filter(function (n) { return n.type !== "folder"; });
      body = (folders.length ? '<div class="fx-grid">' + folders.map(card).join("") + '</div>' : "")
        + (leafs.length ? '<div class="fx-grid"' + (folders.length ? ' style="padding-top:0"' : "") + '>' + leafs.map(card).join("") + '</div>' : "")
        + (!kids.length ? '<div class="fx-center">Ce dossier est vide.' + (sectionOf(cur.id) && sectionOf(cur.id).upload ? ' <button class="fx-btn" data-act="pick">' + ic("upload", 13) + 'Ajouter un PDF</button>' : "") + '</div>' : "");
    }
    var peek = S.peek ? '<div class="fx-overlay" data-act="peek-bg"><div class="fx-sheet">' + fileView(S.peek, true) + '</div></div>' : "";
    return '<div class="fx-bc">' + bc + '</div><div class="fx-scroll">' + body + '</div>' + peek;
  }

  // ================= RENDU GLOBAL =================
  function paintTop() {
    var sideBtn = root.querySelector('[data-act="side"]');
    sideBtn.innerHTML = ic("side", 16);
    sideBtn.classList.toggle("is-on", S.side);
    root.querySelectorAll('[data-act="view"]').forEach(function (b) { b.classList.toggle("is-on", b.getAttribute("data-v") === S.view); });
  }
  function render() {
    paintTop();
    var main = el("main");
    if (S.loading && !S.data) { main.innerHTML = '<div class="fx-center"><div class="fx-spin"></div><span>Chargement de tes fichiers…</span></div>'; renderTree(); return; }
    if (S.error === "auth") {
      main.innerHTML = '<div class="fx-center">' + ic("user", 26, "rgba(255,255,255,0.5)") + '<b style="color:var(--text);font-weight:500">Connecte-toi pour voir tes fichiers</b>'
        + '<span>Tes PDF, tes devoirs et la veille t\'attendent ici.</span><button class="fx-btn is-primary" data-act="login">Se connecter</button></div>';
      renderTree(); return;
    }
    if (S.error && !S.data) {
      main.innerHTML = '<div class="fx-center">' + ic("alert", 24, "#f87171") + '<span>' + esc(S.error) + '</span><button class="fx-btn" data-act="retry">Réessayer</button></div>';
      renderTree(); return;
    }
    renderTree();
    var scroll = main.querySelector(".fx-scroll"), top = scroll ? scroll.scrollTop : 0;
    var prevFrame = main.querySelector("iframe.fx-frame");
    var html = S.view === "lecture" ? renderLecture() : renderClasseur();
    // Ne recharge pas le PDF affiché si rien n'a changé pour lui
    if (prevFrame && html.indexOf(prevFrame.getAttribute("src")) !== -1 && main.getAttribute("data-key") === S.view + (S.view === "lecture" ? S.active : S.peek)) {
      var tabs = main.querySelector(".fx-tabs");
      if (tabs && S.view === "lecture") { var tmp = document.createElement("div"); tmp.innerHTML = html; tabs.innerHTML = tmp.querySelector(".fx-tabs").innerHTML; }
      return;
    }
    if (S.data && S.data.fallback) html = '<div class="fx-banner">Seuls tes PDF s\'affichent pour l\'instant : l\'API NAVIRE doit être mise à jour pour voir tes copies et tes enregistrés.</div>' + html;
    main.innerHTML = html;
    main.setAttribute("data-key", S.view + (S.view === "lecture" ? S.active : S.peek));
    var ns = main.querySelector(".fx-scroll"); if (ns && !S.peek) ns.scrollTop = top;
  }

  // ================= ÉVÉNEMENTS =================
  root.addEventListener("click", function (e) {
    var t = e.target.closest("[data-act]"); if (!t || !root.contains(t)) return;
    var act = t.getAttribute("data-act"), id = t.getAttribute("data-id");
    switch (act) {
      case "side": setSide(!S.side); break;
      case "view": setView(t.getAttribute("data-v")); break;
      case "pick": el("file").click(); break;
      case "fold":
        var sec = t.hasAttribute("data-sec");
        S.open[id] = sec ? S.open[id] === false : !S.open[id];
        renderTree(); break;
      case "file": e.stopPropagation(); openFile(id); break;
      case "del": e.stopPropagation(); remove(id); break;
      case "tab": S.active = id || null; render(); break;
      case "tab-close": e.stopPropagation(); closeTab(id); break;
      case "cd": S.path = id ? IDX[id].trail.map(function (n) { return n.id; }).concat([id]) : []; render(); break;
      case "peek-close": S.peek = null; render(); break;
      case "peek-bg": if (e.target === t) { S.peek = null; render(); } break;
      case "dl":
        var n = IDX[id].node;
        blobFor(n.src).then(function (url) {
          var a = document.createElement("a"); a.href = url;
          a.download = /\.pdf$/i.test(n.label) ? n.label : n.label + ".pdf";
          document.body.appendChild(a); a.click(); a.remove();
        }).catch(function (er) { toast(er.message, "err"); });
        break;
      case "study": go(CONFIG.SITE + IDX[id].node.study); break;
      case "actus": var an = IDX[id].node, num = String(an.link || an.id).match(/(\d+)$/); go(CONFIG.ACTUS_URL + (num ? "?actu=" + num[1] : "")); break;
      case "go": go(CONFIG.SITE + t.getAttribute("data-link")); break;
      case "login": go(CONFIG.LOGIN_URL); break;
      case "retry": fetchAll(); break;
    }
  });
  root.addEventListener("keydown", function (e) {
    if ((e.key === "Enter" || e.key === " ") && e.target.matches('[role="button"][data-act]')) { e.preventDefault(); e.target.click(); }
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && S.peek) { S.peek = null; render(); }
  });
  el("q").addEventListener("input", function (e) { S.q = e.target.value.trim(); render(); });
  el("file").addEventListener("change", function (e) { upload(e.target.files); e.target.value = ""; });

  var dragDepth = 0;
  root.addEventListener("dragenter", function (e) { if (e.dataTransfer && Array.prototype.indexOf.call(e.dataTransfer.types || [], "Files") !== -1) { dragDepth++; root.classList.add("is-drag"); } });
  root.addEventListener("dragover", function (e) { e.preventDefault(); });
  root.addEventListener("dragleave", function () { dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) root.classList.remove("is-drag"); });
  root.addEventListener("drop", function (e) { e.preventDefault(); dragDepth = 0; root.classList.remove("is-drag"); if (e.dataTransfer) upload(e.dataTransfer.files); });

  // Synchro avec les autres embeds (NAVIRE AI, Lib…) qui ajoutent ou retirent des PDF
  window.addEventListener("message", function (e) { if (e.data && e.data.type === "navire-files-updated") fetchAll(true); });
  window.addEventListener("storage", function (e) { if (e.key === "navire_files_refresh") fetchAll(true); });
  window.addEventListener("storage", function (e) { if (e.key === CONFIG.TOKEN_KEY) fetchAll(); });

  // ================= HAUTEUR (comme NAVIRE Lib) =================
  // Dans Framer, l'embed agrandit lui-même son cadre à la hauteur de l'écran.
  var FRAMED = window.self !== window.top;
  var HOST = null, frameEl = null, wrappers = [];
  if (FRAMED) {
    var hideBar = document.createElement("style");
    hideBar.textContent = "html,body{margin:0;scrollbar-width:none}html::-webkit-scrollbar,body::-webkit-scrollbar{display:none;width:0;height:0}";
    document.head.appendChild(hideBar);
    try { if (window.frameElement && window.parent.document) { HOST = window.parent; frameEl = window.frameElement; } } catch (e) {}
    if (frameEl) for (var n = frameEl.parentElement, i = 0; n && i < 4 && n !== HOST.document.body; i++, n = n.parentElement) wrappers.push(n);
  }
  function sizeApp() {
    var win = HOST || window, h;
    if (HOST || !FRAMED) {
      var anchor = frameEl || root;
      var top = anchor.getBoundingClientRect().top + (win.scrollY || win.pageYOffset || 0);
      h = Math.max(520, Math.round(win.innerHeight - top - 12));
    } else {
      h = Math.max(520, Math.round((window.screen && window.screen.availHeight || 900) - 180));
    }
    root.style.height = h + "px";
    if (frameEl) {
      frameEl.style.height = h + "px"; frameEl.style.minHeight = h + "px";
      wrappers.forEach(function (w) { if (w.childElementCount === 1) w.style.minHeight = h + "px"; });
    } else if (FRAMED) {
      try { window.parent.postMessage({ type: "NAVIRE_EMBED_HEIGHT", height: h }, "*"); } catch (e) {}
    }
  }
  sizeApp();
  (HOST || window).addEventListener("resize", sizeApp);
  window.addEventListener("load", sizeApp);
  setTimeout(sizeApp, 600);

  // Téléphone (cadre étroit) : vue Classeur en liste, sans panneau ni bascule.
  S.compact = null;
  function updateCompact() {
    // Téléphone = écran étroit (pas le cadre) : sur PC la vue complète reste toujours là.
    var vw = HOST ? HOST.innerWidth : (!FRAMED ? window.innerWidth : (window.screen && window.screen.width) || root.clientWidth);
    var c = vw < 760 || root.clientWidth < 520;
    if (c === S.compact) return;
    S.compact = c;
    root.classList.toggle("is-compact", c);
    if (c) { S.view = "classeur"; }
    else { var pv = load("navire_files_view"); S.view = pv === "classeur" ? "classeur" : "lecture"; }
    S.peek = null;
    render();
  }

  // ================= DÉMARRAGE =================
  hydrateIcons();
  var sd = load("navire_files_side");
  setSide(sd !== "0");
  updateCompact();
  if (window.ResizeObserver) new ResizeObserver(updateCompact).observe(root);
  (HOST || window).addEventListener("resize", updateCompact);
  fetchAll();
})();
</script>
