<!--
  NAVIRE, embed fonctionnalités de la page d'accueil (section sur fond clair)
  =========================================================================
  Fond transparent : la couleur claire de la section est posée dans Framer.

  Sélecteur en gemmes : une gemme au premier plan, les autres en arrière-plan
  sur un anneau. Choisir une gemme (clic, flèches, glisser, points) fait
  tourner l'anneau jusqu'à elle, et la capture de la fonctionnalité glisse
  dans le sens de la rotation. Rotation automatique tant que personne n'a
  touché au sélecteur.

  Réglages : bloc CONFIG du script. Pour chaque fonctionnalité : gemme
  (icône /assets), nom, texte, points, lien, et `screens` : une ou plusieurs
  captures qui défilent dans l'ordre avant de passer à la gemme suivante.
  Les captures sont servies par /assets/screen-*.png (app/routers/assets.py) ;
  un fichier absent est remplacé par un visuel provisoire.
-->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
#nv-feat {
  --ink: #0A0E1F;
  --ink-2: rgba(10,14,31,0.64);
  --ink-3: rgba(10,14,31,0.42);
  --line: rgba(10,14,31,0.1);
  --accent: #5B6FFF;
  --ease: cubic-bezier(.2,.8,.2,1);

  position: relative;
  width: 100%;
  padding: 72px 24px 80px;
  font-family: 'Inter', system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  color: var(--ink);
  background: transparent;
  box-sizing: border-box;
  overflow: hidden;
}
#nv-feat *, #nv-feat *::before, #nv-feat *::after { box-sizing: border-box; }
#nv-feat ::selection { background: rgba(91,111,255,0.2); }

#nv-feat .nf-head { text-align: center; max-width: 720px; margin: 0 auto; }
#nv-feat .nf-eyebrow {
  display: inline-flex; align-items: center; gap: 8px;
  font-size: 11px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: var(--ink-3);
}
#nv-feat .nf-eyebrow i { width: 5px; height: 5px; border-radius: 99px; background: var(--accent); }
#nv-feat .nf-title {
  margin: 14px 0 0;
  font-size: clamp(30px, 4.6vw, 52px); line-height: 1.06; font-weight: 800; letter-spacing: -0.04em;
  text-wrap: balance;
}

/* ── Anneau de gemmes ── */
#nv-feat .nf-ring {
  position: relative;
  height: 290px;
  max-width: 820px;
  margin: 30px auto 0;
  touch-action: pan-y;
  outline: none;
  user-select: none;
}
#nv-feat .nf-ring:focus-visible { outline: 2px solid var(--accent); outline-offset: 6px; border-radius: 24px; }
#nv-feat .nf-gem {
  position: absolute;
  left: 50%; top: 50%;
  width: 150px; height: 150px;
  margin: -75px 0 0 -75px;
  border: 0; padding: 0; background: none;
  cursor: pointer;
  will-change: transform, opacity, filter;
  -webkit-tap-highlight-color: transparent;
}
#nv-feat .nf-gem img {
  width: 100%; height: 100%; object-fit: contain; display: block;
  pointer-events: none;
  animation: nf-float 5s ease-in-out infinite;
}
#nv-feat .nf-gem.is-front img { filter: drop-shadow(0 22px 28px rgba(40,60,160,0.28)); }
#nv-feat .nf-gem:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 50%; }
@keyframes nf-float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
/* Halo sous la gemme du premier plan */
#nv-feat .nf-halo {
  position: absolute; left: 50%; bottom: 6px;
  width: 220px; height: 34px; margin-left: -110px;
  border-radius: 50%;
  background: radial-gradient(closest-side, rgba(91,111,255,0.28), transparent);
  pointer-events: none;
}

#nv-feat .nf-dots { display: flex; justify-content: center; gap: 7px; margin-top: 6px; }
#nv-feat .nf-dot {
  width: 7px; height: 7px; border-radius: 99px; border: 0; padding: 0;
  background: rgba(10,14,31,0.16); cursor: pointer;
  transition: width .35s var(--ease), background .35s var(--ease);
}
#nv-feat .nf-dot.on { width: 22px; background: var(--ink); }

/* ── Fonctionnalité choisie ── */
#nv-feat .nf-body {
  max-width: 1120px; margin: 40px auto 0;
  display: grid; grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.2fr); gap: 56px; align-items: center;
}
#nv-feat .nf-text { min-height: 250px; }
#nv-feat .nf-text > * { transition: opacity .35s var(--ease), transform .35s var(--ease); }
#nv-feat .nf-text.is-out > * { opacity: 0; transform: translateY(8px); }
#nv-feat .nf-kicker { font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 0.2px; }
#nv-feat .nf-name { margin: 8px 0 0; font-size: 30px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.15; }
#nv-feat .nf-desc { margin: 12px 0 0; font-size: 16px; line-height: 1.55; color: var(--ink-2); }
#nv-feat .nf-points { list-style: none; margin: 20px 0 0; padding: 0; display: grid; gap: 10px; }
#nv-feat .nf-points li { display: flex; gap: 10px; align-items: flex-start; font-size: 14.5px; line-height: 1.45; color: var(--ink); }
#nv-feat .nf-points svg { flex-shrink: 0; margin-top: 2px; color: var(--accent); }
#nv-feat .nf-link {
  display: inline-flex; align-items: center; gap: 8px; margin-top: 24px;
  font-size: 14.5px; font-weight: 700; color: var(--ink); text-decoration: none;
  border-bottom: 1.5px solid var(--ink); padding-bottom: 2px;
}
#nv-feat .nf-link:hover { color: var(--accent); border-color: var(--accent); }
#nv-feat .nf-link[hidden] { display: none; }

/* Capture : les écrans glissent dans le sens de la rotation */
#nv-feat .nf-screen {
  position: relative;
  aspect-ratio: 19 / 10;
  border-radius: 20px;
  overflow: hidden;
  background: #0b0e16;
  border: 1px solid var(--line);
  box-shadow: 0 30px 70px rgba(10,14,31,0.12), 0 4px 14px rgba(10,14,31,0.05);
  touch-action: pan-y;
}
#nv-feat .nf-slide {
  position: absolute; inset: 0;
  transition: transform .7s var(--ease), opacity .7s var(--ease);
}
#nv-feat .nf-slide > img { width: 100%; height: 100%; object-fit: cover; object-position: top center; display: block; }
#nv-feat .nf-sub {
  position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); z-index: 5;
  display: flex; gap: 6px; padding: 6px 9px; border-radius: 99px;
  background: rgba(10,14,31,0.45); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
}
#nv-feat .nf-sub:empty { display: none; }
#nv-feat .nf-sub button {
  width: 6px; height: 6px; border-radius: 99px; border: 0; padding: 0; cursor: pointer;
  background: rgba(255,255,255,0.4); transition: width .3s var(--ease), background .3s var(--ease);
}
#nv-feat .nf-sub button.on { width: 18px; background: #fff; }
/* Visuel provisoire tant qu'aucune capture n'est fournie */
#nv-feat .nf-ph {
  width: 100%; height: 100%;
  display: grid; place-items: center; align-content: center; gap: 14px;
  background:
    radial-gradient(60% 70% at 50% 40%, rgba(91,111,255,0.14), transparent 70%),
    linear-gradient(180deg, #f8f9ff, #eef1fb);
  text-align: center;
}
#nv-feat .nf-ph img { width: 110px; height: 110px; object-fit: contain; }
#nv-feat .nf-ph b { font-size: 18px; font-weight: 800; letter-spacing: -0.02em; color: var(--ink); }
#nv-feat .nf-ph span { font-size: 12px; color: var(--ink-3); }

@media (max-width: 860px) {
  #nv-feat { padding: 52px 16px 56px; }
  #nv-feat .nf-ring { height: 230px; margin-top: 16px; }
  #nv-feat .nf-gem { width: 120px; height: 120px; margin: -60px 0 0 -60px; }
  #nv-feat .nf-body { grid-template-columns: 1fr; gap: 24px; margin-top: 26px; }
  #nv-feat .nf-text { min-height: 0; text-align: center; }
  #nv-feat .nf-name { font-size: 25px; }
  #nv-feat .nf-desc { font-size: 15px; }
  #nv-feat .nf-points { width: fit-content; max-width: 100%; margin-left: auto; margin-right: auto; }
  #nv-feat .nf-points li { text-align: left; }
  #nv-feat .nf-screen { border-radius: 14px; }
}
@media (prefers-reduced-motion: reduce) {
  #nv-feat .nf-gem img { animation: none; }
  #nv-feat .nf-slide, #nv-feat .nf-text > * { transition: none; }
}
</style>

<section id="nv-feat" aria-label="Fonctionnalités NAVIRE">
  <div class="nf-head">
    <div class="nf-eyebrow"><i></i><span id="nf-eyebrow"></span></div>
    <h2 class="nf-title" id="nf-title"></h2>
  </div>

  <div class="nf-ring" id="nf-ring" tabindex="0" role="tablist" aria-label="Choisir une fonctionnalité">
    <div class="nf-halo" aria-hidden="true"></div>
  </div>
  <div class="nf-dots" id="nf-dots"></div>

  <div class="nf-body">
    <div class="nf-text" id="nf-text" role="tabpanel" aria-live="polite">
      <div class="nf-kicker" id="nf-kicker"></div>
      <h3 class="nf-name" id="nf-name"></h3>
      <p class="nf-desc" id="nf-desc"></p>
      <ul class="nf-points" id="nf-points"></ul>
      <a class="nf-link" id="nf-link" target="_top"></a>
    </div>
    <div class="nf-screen" id="nf-screen"><div class="nf-sub" id="nf-sub"></div></div>
  </div>
</section>

<script>
(function () {
  /* ═══ CONFIG ═══════════════════════════════════════════════ */
  var CONFIG = {
    API: "https://navire-app-api.onrender.com",
    EYEBROW: "Fonctionnalités",
    TITLE: "Tout ce qu'il faut pour réussir ton année, au même endroit",
    AUTOPLAY_MS: 6000,          // rotation tant que personne n'a touché (0 : jamais)
    FEATURES: [
      {
        gem: "/assets/home-cours.png",
        kicker: "NAVIRE Lib",
        name: "Une librairie complète de cours",
        desc: "Tous tes cours rédigés et structurés, avec plan cliquable et points de passage pour vérifier que tu as compris.",
        points: ["Cours par matière, de la L1 au M1", "Plan détaillé et lecture suivie", "Lib+ : une question à NAVIRE AI à chaque étape"],
        link: { label: "Ouvrir la Lib", url: "https://navire-ai.com/lib" },
        screens: ["/assets/screen-lib.png", "/assets/screen-lib-lecture.png"]
      },
      {
        gem: "/assets/home-fichiers.png",
        kicker: "NAVIRE AI",
        name: "Une IA liée à tes fichiers",
        desc: "Dépose tes PDF de cours et de TD : NAVIRE AI répond à partir de tes documents, des cours de la Lib et de l'actualité.",
        points: ["Réponses sourcées, références cliquables", "Tes PDF, copies et actus enregistrées au même endroit", "Plusieurs modèles selon la difficulté"],
        link: { label: "Essayer NAVIRE AI", url: "https://navire-ai.com/home" },
        screens: ["/assets/screen-fichiers.png"]
      },
      {
        gem: "/assets/home-veilles.png",
        kicker: "Veille juridique",
        name: "L'actualité du droit, chaque jour",
        desc: "Les décisions et réformes qui comptent, résumées et classées par rubrique, avec les sources officielles.",
        points: ["À la une et par rubrique", "Sources officielles en un clic", "« Réviser dans la Lib » depuis une actu"],
        link: { label: "Voir les actus", url: "https://navire-ai.com/actus" },
        screens: ["/assets/screen-actus.png"]
      },
      {
        gem: "/assets/NAVIRE_Articles_icon.png",
        kicker: "Articles",
        name: "Des articles écrits par des doctorants",
        desc: "Analyses, méthodologie et points de cours publiés par des doctorants vérifiés et l'équipe NAVIRE.",
        points: ["Auteurs vérifiés (badge Doctorant)", "Méthode du commentaire, du cas pratique, de la dissert'", "Liés aux cours de la Lib"],
        link: { label: "Lire les articles", url: "https://navire-ai.com/actus" },
        screens: ["/assets/screen-articles.png"]
      },
      {
        gem: "/assets/files-cristal.png",
        kicker: "Prép'AdJuris",
        name: "Des copies corrigées par tes chargés de TD",
        desc: "Un cours par semaine en petit groupe, des épreuves chronométrées, et tes copies rédigées dans NAVIRE puis annotées par ton correcteur.",
        points: ["Calendrier des séances et épreuves", "Un écran blanc pour écrire ta copie, chronomètre compris", "Corrections annotées dans la marge"],
        link: { label: "Découvrir la Prépa", url: "https://navire-ai.com/subscribe" },
        screens: ["/assets/screen-prepa.png", "/assets/screen-copie.png"]
      },
      {
        gem: "/assets/files-diamant.png",
        kicker: "QCM et classement",
        name: "Progresse et grimpe au classement",
        desc: "Entraîne-toi en QCM, gagne de l'Elo et compare-toi aux étudiants de ta fac et de toute la France.",
        points: ["QCM générés depuis tes cours", "Elo, séries et paliers", "Classement général, 30 jours, 7 jours et par fac"],
        link: { label: "Voir le classement", url: "https://navire-ai.com/classement" },
        screens: ["/assets/screen-classement.png"]
      }
    ]
  };
  /* ══════════════════════════════════════════════════════════ */

  var root = document.getElementById("nv-feat");
  if (!root || root.getAttribute("data-ready")) return;
  root.setAttribute("data-ready", "1");

  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function asset(p) { return !p ? "" : /^https?:|^data:/.test(p) ? p : CONFIG.API + p; }
  var reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  var F = CONFIG.FEATURES, N = F.length;
  var ring = $("nf-ring"), dots = $("nf-dots"), screen = $("nf-screen"), text = $("nf-text");
  var current = 0;          // fonctionnalité choisie
  var sub = 0;              // capture affichée parmi celles de la fonctionnalité
  var subBox = $("nf-sub");
  var rot = 0, target = 0;  // rotation de l'anneau, en « nombre de gemmes » (continu)
  var raf = null, timer = null, touched = false;

  $("nf-eyebrow").textContent = CONFIG.EYEBROW;
  $("nf-title").textContent = CONFIG.TITLE;

  // Gemmes
  var gems = F.map(function (f, i) {
    var b = document.createElement("button");
    b.type = "button";
    b.className = "nf-gem";
    b.setAttribute("role", "tab");
    b.setAttribute("aria-label", f.kicker);
    b.style.animationDelay = (-i * 0.8) + "s";
    b.innerHTML = '<img src="' + esc(asset(f.gem)) + '" alt="" draggable="false" style="animation-delay:' + (-i * 0.8) + 's">';
    b.addEventListener("click", function () { touch(); select(i); });
    ring.appendChild(b);
    return b;
  });
  dots.innerHTML = F.map(function (f, i) {
    return '<button class="nf-dot" type="button" aria-label="' + esc(f.kicker) + '" data-i="' + i + '"></button>';
  }).join("");

  // Place les gemmes sur un anneau vu légèrement de dessus.
  function place() {
    var w = ring.clientWidth, phone = w < 600;
    var R = Math.min(w * (phone ? 0.4 : 0.36), 300);
    // Anneau incliné : les gemmes de derrière remontent et restent visibles
    // au-dessus de celle du premier plan ; le tout est recentré verticalement.
    var lift = phone ? 70 : 96;
    for (var i = 0; i < N; i++) {
      var a = (i - rot) / N * Math.PI * 2;      // 0 = devant
      var x = Math.sin(a) * R;
      var z = Math.cos(a);                      // 1 devant, -1 derrière
      var depth = (z + 1) / 2;                  // 0..1
      var s = 0.42 + 0.58 * Math.pow(depth, 1.4);
      var y = lift * 0.38 - (1 - depth) * lift;
      var g = gems[i];
      g.style.transform = "translate3d(" + x.toFixed(1) + "px," + y.toFixed(1) + "px,0) scale(" + s.toFixed(3) + ")";
      g.style.zIndex = String(Math.round(depth * 100));
      g.style.opacity = (0.5 + 0.5 * depth).toFixed(3);
      g.style.filter = depth > 0.97 ? "none" : "blur(" + ((1 - depth) * 2.2).toFixed(2) + "px) saturate(" + (0.7 + 0.3 * depth).toFixed(2) + ")";
      var front = i === current;
      g.classList.toggle("is-front", front);
      g.setAttribute("aria-selected", front ? "true" : "false");
      g.tabIndex = front ? 0 : -1;
    }
  }

  function animate() {
    var d = target - rot;
    if (Math.abs(d) < 0.001 || reduced) { rot = target; place(); raf = null; return; }
    rot += d * 0.09;
    place();
    raf = requestAnimationFrame(animate);
  }

  // Écran et texte
  function shots(i) { return (F[i].screens || []).filter(Boolean); }
  function placeholder(f) {
    return '<div class="nf-ph"><img src="' + esc(asset(f.gem)) + '" alt=""><b>' + esc(f.kicker) + "</b><span>Capture à venir</span></div>";
  }
  function slide(i, dir) {
    var f = F[i], list = shots(i), src = list[sub];
    var el = document.createElement("div");
    el.className = "nf-slide";
    if (src) {
      var img = new Image();
      img.alt = "Aperçu : " + f.name;
      img.draggable = false;
      img.onerror = function () { el.innerHTML = placeholder(f); };   // capture pas encore en ligne
      img.src = asset(src);
      el.appendChild(img);
    } else {
      el.innerHTML = placeholder(f);
    }
    subBox.innerHTML = list.length > 1 ? list.map(function (_, k) {
      return '<button type="button" aria-label="Capture ' + (k + 1) + '" data-k="' + k + '"' + (k === sub ? ' class="on"' : "") + "></button>";
    }).join("") : "";
    var old = screen.querySelectorAll(".nf-slide");
    if (!old.length || !dir || reduced) {
      Array.prototype.forEach.call(old, function (o) { o.remove(); });
      screen.insertBefore(el, subBox);
      return;
    }
    el.style.transform = "translateX(" + (dir * 100) + "%)";
    screen.insertBefore(el, subBox);
    el.getBoundingClientRect();
    el.style.transform = "translateX(0)";
    Array.prototype.forEach.call(old, function (o) {
      o.style.transform = "translateX(" + (-dir * 100) + "%)";
      o.style.opacity = "0.4";
      setTimeout(function () { o.remove(); }, 750);
    });
  }

  function fillText(i) {
    var f = F[i];
    $("nf-kicker").textContent = f.kicker;
    $("nf-name").textContent = f.name;
    $("nf-desc").textContent = f.desc;
    var check = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
    $("nf-points").innerHTML = (f.points || []).map(function (p) { return "<li>" + check + "<span>" + esc(p) + "</span></li>"; }).join("");
    var l = $("nf-link");
    l.hidden = !(f.link && f.link.url);
    if (f.link) { l.href = f.link.url; l.innerHTML = esc(f.link.label) + ' <span aria-hidden="true">→</span>'; }
  }

  function select(i, atEnd) {
    i = ((i % N) + N) % N;
    sub = atEnd ? Math.max(0, shots(i).length - 1) : 0;
    if (i === current && target === Math.round(target) && ((target % N) + N) % N === i) return;
    // Chemin le plus court sur l'anneau ; le sens de rotation donne le sens du glissement.
    var base = ((target % N) + N) % N;
    var step = i - base;
    if (step > N / 2) step -= N;
    if (step < -N / 2) step += N;
    var dir = step >= 0 ? 1 : -1;
    target += step;
    current = i;
    if (!raf) raf = requestAnimationFrame(animate);

    text.classList.add("is-out");
    setTimeout(function () { fillText(i); text.classList.remove("is-out"); }, reduced ? 0 : 180);
    slide(i, dir);
    Array.prototype.forEach.call(dots.children, function (d, k) { d.classList.toggle("on", k === i); });
    place();
  }

  // Suivante / précédente : d'abord les captures de la fonctionnalité, puis la gemme voisine.
  function next() {
    if (sub < shots(current).length - 1) { sub++; slide(current, 1); }
    else select(current + 1);
  }
  function prev() {
    if (sub > 0) { sub--; slide(current, -1); }
    else select(current - 1, true);
  }
  subBox.addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (!b) return;
    var k = +b.getAttribute("data-k");
    if (k === sub) return;
    touch();
    var dir = k > sub ? 1 : -1;
    sub = k;
    slide(current, dir);
  });

  function touch() { touched = true; clearInterval(timer); }

  dots.addEventListener("click", function (e) {
    var b = e.target.closest(".nf-dot");
    if (b) { touch(); select(+b.getAttribute("data-i")); }
  });
  ring.addEventListener("keydown", function (e) {
    if (e.key === "ArrowLeft") { e.preventDefault(); touch(); select(current - 1); gems[current].focus(); }
    if (e.key === "ArrowRight") { e.preventDefault(); touch(); select(current + 1); gems[current].focus(); }
  });

  // Glisser du doigt, sur l'anneau ou sur la capture
  function swipe(el, onLeft, onRight) {
    var x0 = null;
    el.addEventListener("touchstart", function (e) { x0 = e.touches[0].clientX; }, { passive: true });
    el.addEventListener("touchend", function (e) {
      if (x0 == null) return;
      var dx = e.changedTouches[0].clientX - x0; x0 = null;
      if (Math.abs(dx) > 40) { touch(); (dx < 0 ? onLeft : onRight)(); }
    });
  }
  swipe(ring, function () { select(current + 1); }, function () { select(current - 1); });
  swipe(screen, next, prev);

  // Rotation automatique, seulement quand la section est visible
  var visible = true;
  if ("IntersectionObserver" in window) {
    new IntersectionObserver(function (es) { visible = es[0].isIntersecting; }, { threshold: 0.25 }).observe(root);
  }
  if (CONFIG.AUTOPLAY_MS > 0 && !reduced) {
    timer = setInterval(function () {
      if (!touched && visible && !document.hidden) next();
    }, CONFIG.AUTOPLAY_MS);
  }
  root.addEventListener("mouseenter", function () { if (!touched) clearInterval(timer); });

  var rz;
  window.addEventListener("resize", function () { clearTimeout(rz); rz = setTimeout(place, 100); });

  fillText(0);
  slide(0, 0);
  Array.prototype.forEach.call(dots.children, function (d, k) { d.classList.toggle("on", k === 0); });
  place();
})();
</script>
