<!--
  NAVIRE — Panneau d'avis des pages connexion / inscription
  ==========================================================
  Colonne de droite de l'écran de connexion : un titre, une ligne de
  confiance, puis des avis qui défilent verticalement en boucle (pause au
  survol), estompés en haut et en bas.

  Framer : une Stack horizontale avec, à gauche, l'embed de connexion et, à
  droite, un Embed HTML contenant ce fichier (hauteur fixe ou "Fill"). Le
  panneau remplit tout son cadre. Le masquer sur la variante téléphone.

  ⚠ AVIS FACTICES (et chiffre de la ligne de confiance) à remplacer par de
  vrais témoignages avant la mise en ligne : bloc CONFIG du script.
-->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; }

  #nv-panel {
    --grad: linear-gradient(100deg, #4C93FF 0%, #A8CCFF 45%, #FFFFFF 100%);
    --dot: rgba(76,147,255,0.55);
    --card: rgba(255,255,255,0.035);
    --line: rgba(255,255,255,0.08);
    --text: #fff;
    --text-2: rgba(255,255,255,0.88);
    --text-3: rgba(255,255,255,0.5);
    --speed: 60s;                     /* durée d'un tour complet du défilement */

    position: relative;
    box-sizing: border-box;
    width: 100%;
    height: 100%;
    min-height: 420px;
    display: flex;
    flex-direction: column;
    padding: 44px 32px 0;
    border-radius: 24px;
    overflow: hidden;
    isolation: isolate;
    background: #0d1014;
    font-family: 'Inter', Arial, Helvetica, sans-serif;
    -webkit-font-smoothing: antialiased;
    color: var(--text);
  }
  #nv-panel *, #nv-panel *::before, #nv-panel *::after { box-sizing: border-box; }

  /* Trame de points bleus, plus dense sur les bords qu'au centre */
  #nv-panel::before {
    content: "";
    position: absolute; inset: 0; z-index: -1;
    background-image: radial-gradient(circle, var(--dot) 0.9px, transparent 1.3px);
    background-size: 5px 5px;
    -webkit-mask-image: radial-gradient(ellipse 75% 65% at 50% 45%, transparent 25%, #000 100%);
            mask-image: radial-gradient(ellipse 75% 65% at 50% 45%, transparent 25%, #000 100%);
    opacity: .75;
  }
  /* Halo sombre au centre pour la lisibilité */
  #nv-panel::after {
    content: "";
    position: absolute; inset: 0; z-index: -1;
    background: radial-gradient(ellipse 60% 50% at 40% 30%, rgba(13,16,20,0.85), transparent 70%);
  }

  #nv-panel h2 {
    margin: 0 0 14px;
    max-width: 380px;
    font-size: clamp(28px, 3.4vw, 42px);
    line-height: 1.1;
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  #nv-panel h2 em {
    font-style: normal;
    background: var(--grad);
    -webkit-background-clip: text; background-clip: text;
    color: transparent; -webkit-text-fill-color: transparent;
  }
  #nv-panel .sub { font-size: 13px; color: var(--text-3); margin-bottom: 22px; }

  /* ── Défilement ───────────────────────────── */
  #nv-panel .viewport {
    position: relative;
    flex: 1 1 auto;
    min-height: 0;
    overflow: hidden;
    -webkit-mask-image: linear-gradient(180deg, transparent 0, #000 70px, #000 calc(100% - 90px), transparent 100%);
            mask-image: linear-gradient(180deg, transparent 0, #000 70px, #000 calc(100% - 90px), transparent 100%);
  }
  #nv-panel .track {
    display: flex;
    flex-direction: column;
    gap: 14px;
    animation: nvScroll var(--speed) linear infinite;
  }
  #nv-panel .viewport:hover .track { animation-play-state: paused; }
  @keyframes nvScroll { from { transform: translateY(0); } to { transform: translateY(calc(-50% - 7px)); } }
  @media (prefers-reduced-motion: reduce) {
    #nv-panel .track { animation: none; }
    #nv-panel .viewport { overflow-y: auto; scrollbar-width: none; }
  }

  #nv-panel .card {
    padding: 20px 20px 18px;
    border-radius: 16px;
    background: linear-gradient(180deg, rgba(255,255,255,0.045), rgba(255,255,255,0.015)), var(--card);
    border: 1px solid var(--line);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  }
  #nv-panel .quote { margin: 0 0 16px; font-size: 13.5px; line-height: 1.55; font-weight: 500; color: var(--text-2); }
  #nv-panel .who { display: flex; align-items: center; gap: 12px; }
  #nv-panel .avatar {
    width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    font-size: 12.5px; font-weight: 700; color: #fff;
    border: 1px solid rgba(255,255,255,0.14);
  }
  #nv-panel .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  #nv-panel .name { font-size: 13.5px; font-weight: 600; line-height: 1.3; }
  #nv-panel .role { font-size: 12.5px; color: var(--text-3); line-height: 1.3; }

  @media (max-width: 520px) {
    #nv-panel { padding: 32px 18px 0; border-radius: 20px; }
  }
</style>

<div id="nv-panel">
  <h2 id="nv-title"></h2>
  <div class="sub" id="nv-sub"></div>
  <div class="viewport"><div class="track" id="nv-track"></div></div>
</div>

<script>
(function () {
  // ============================================================
  // CONFIG (contenu factice pour le moment)
  // ============================================================
  var TITRE = "Prêt à décrocher ta <em>mention</em> cette année&nbsp;?";   // <em> = mot en dégradé
  var SOUS_TITRE = "Des milliers d'étudiants en droit révisent avec NAVIRE";

  // nom, role, texte, photo ("" = initiales), couleur (fond des initiales)
  var AVIS = [
    { nom: "Camille Moreau",  role: "L2 Droit, Paris 1 Panthéon-Sorbonne", couleur: "#3B82F6", photo: "",
      texte: "Les fiches et les quiz de NAVIRE m'ont fait gagner un temps fou avant les partiels. Je révise moins longtemps, mais beaucoup mieux." },
    { nom: "Yanis Benali",    role: "L3 Droit, Lyon 3", couleur: "#8B5CF6", photo: "",
      texte: "Avec Prép'AdJuris, j'ai enfin compris la méthode du cas pratique. Les corrections des chargés de TD sont précises et personnalisées." },
    { nom: "Inès Lefebvre",   role: "M1 Droit privé, Paris-Panthéon-Assas", couleur: "#F59E0B", photo: "",
      texte: "NAVIRE AI répond à mes questions de cours en quelques secondes, avec les bonnes références. C'est devenu mon réflexe en révision." },
    { nom: "Hugo Martin",     role: "L1 Droit, Bordeaux", couleur: "#10B981", photo: "",
      texte: "Je suis arrivé en L1 sans méthode. Les flashcards et le classement m'ont donné un vrai rythme de travail toute l'année." },
    { nom: "Léa Dubois",      role: "L2 Droit, Toulouse Capitole", couleur: "#EC4899", photo: "",
      texte: "Le meilleur outil pour réviser le droit administratif. Les cours de NAVIRE Lib sont clairs, structurés et à jour." },
    { nom: "Sami Haddad",     role: "Prépa CRFPA", couleur: "#06B6D4", photo: "",
      texte: "Pour le grand oral et les écrits, l'entraînement régulier avec corrections a tout changé. Je recommande à toute ma promo." },
    { nom: "Clara Fontaine",  role: "L3 Droit, Lille", couleur: "#F97316", photo: "",
      texte: "Je l'utilise tous les jours. Poser une question à NAVIRE AI sur un arrêt et avoir une réponse sourcée, c'est un gain énorme." },
    { nom: "Thomas Girard",   role: "M1 Droit des affaires, Montpellier", couleur: "#6366F1", photo: "",
      texte: "Simple, rapide et efficace. Le simulateur de cas pratiques est exactement ce qui me manquait pour les partiels." }
  ];

  // ============================================================
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function initiales(nom) {
    return String(nom || "").trim().split(/\s+/).slice(0, 2).map(function (p) { return p.charAt(0); }).join("").toUpperCase();
  }
  function carte(a) {
    var c = a.couleur || "#4C93FF";
    var av = a.photo
      ? '<div class="avatar"><img src="' + esc(a.photo) + '" alt="" loading="lazy"></div>'
      : '<div class="avatar" style="background:linear-gradient(135deg,' + esc(c) + ',rgba(255,255,255,0.1) 150%)">' + esc(initiales(a.nom)) + "</div>";
    return '<article class="card"><p class="quote">« ' + esc(a.texte) + ' »</p>' +
      '<div class="who">' + av + '<div><div class="name">' + esc(a.nom) + '</div><div class="role">' + esc(a.role) + "</div></div></div></article>";
  }

  document.getElementById("nv-title").innerHTML = TITRE;
  document.getElementById("nv-sub").textContent = SOUS_TITRE;

  // La liste est rendue deux fois : l'animation remonte d'une moitié puis
  // repart du début, sans saut visible.
  var html = AVIS.map(carte).join("");
  var track = document.getElementById("nv-track");
  track.innerHTML = html + html.replace(/<article class="card"/g, '<article class="card" aria-hidden="true"');

  // Vitesse constante quel que soit le nombre d'avis (~ 28 px/s).
  requestAnimationFrame(function () {
    var h = track.scrollHeight / 2;
    if (h) document.getElementById("nv-panel").style.setProperty("--speed", Math.round(h / 28) + "s");
  });
})();
</script>
