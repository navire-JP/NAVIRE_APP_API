<!--
  NAVIRE — Embed page /professeurs (espace des chargés de TD Prép'AdJuris)
  =========================================================================
  Même DA que l'accueil et NAVIRE Lib : bleu et blanc, aucun trait, cartes
  à halo et visuels NAVIRE, menu latéral masquable (retenu d'une visite à
  l'autre). Téléphone (< 760 px) : police DM Sans plus petite, menu en voile
  opaque ; la page du site défile, pas l'embed.

  Selon GET /professeurs/me :
    - non connecté          → présentation + connexion (email ou Google)
    - compte non rattaché   → message (l'admin attache le compte dans la console)
    - professeur suspendu   → message
    - professeur actif      → cinq rubriques :
        Accueil       ce qui attend (copies à corriger, épreuves ouvertes, le mois)
        Copies        à corriger / corrigées : un clic ouvre la correction
        Épreuves      planifier un contrôle pour un groupe, voir qui l'a rendu
        Groupes       Discord, liens, étudiants et documents de chaque groupe
        Rémunération  prévisionnel, séance par séance

  Corriger : un écran blanc sur tout l'écran (header du site masqué), la copie
  en texte, sans page simulée. On écrit directement dedans, comme dans un
  Google Doc en mode suggestion : ce qu'on tape s'ajoute en vert, ce qu'on
  efface est barré en rouge (rien du texte de l'étudiant n'est perdu). On
  sélectionne un passage pour le commenter ou le surligner : les
  commentaires s'affichent en bulles carrées sur le côté, avec la photo et le
  nom du correcteur. Tout s'enregistre au fil de l'eau ; l'étudiant voit les
  révisions et les commentaires (et les retrouve dans ses exports .docx /
  .pdf et dans Fichiers) quand on rend la correction, avec la note et
  l'appréciation générale.
    GET  /professeurs/devoirs/{id}/copie
    PUT  /professeurs/devoirs/{id}/corrections   (corrections d'un paragraphe)
    POST /professeurs/devoirs/{id}/annotations, PATCH|DELETE /professeurs/annotations/{id}
    PATCH /professeurs/devoirs/{id}               (rendre : note, appréciation)
    GET  /professeurs/devoirs/{id}/export?format=docx|pdf

  Épreuves : GET|POST /professeurs/epreuves, DELETE /professeurs/epreuves/{id}.
  Aperçu admin (« Voir comme ») : l'espace d'un professeur, en lecture seule.
  Réglages : bloc CONFIG du script.
-->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=IBM+Plex+Mono:wght@400;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>

#nv-prof {
  --bg: transparent;
  --panel: rgba(255,255,255,0.035);
  --panel-2: rgba(255,255,255,0.06);
  --panel-3: rgba(255,255,255,0.1);

  --text-3: rgba(255,255,255,0.45);

  --warn: #FFD166;
  --blue: #7AA7FF;

  position: relative;
  width: 100%;
  height: 640px;          /* remplacé par la hauteur de l'écran au chargement */

  display: flex;
  overflow: hidden;
  font-family: 'Inter', sans-serif;
  -webkit-font-smoothing: antialiased;
  color: var(--text);
  background: var(--bg);
  box-sizing: border-box;
  font-size: 14px;
}
#nv-prof *, #nv-prof *::before, #nv-prof *::after { box-sizing: border-box; }
#nv-prof button { font-family: inherit; color: inherit; }
#nv-prof ::selection { background: rgba(255,255,255,0.22); }
#nv-prof svg { flex-shrink: 0; }
#nv-prof .nv-scroll { overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.1) transparent; }
#nv-prof .nv-scroll::-webkit-scrollbar { width: 6px; }
#nv-prof .nv-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 9px; }

/* ================= SIDEBAR ================= */
#nv-prof .nv-side {
  width: 264px; flex-shrink: 0;
  display: flex; flex-direction: column;
  padding: 14px 10px 12px; gap: 4px;
  border-right: 1px solid var(--line);
  z-index: 30;
}
#nv-prof.is-solo .nv-side, #nv-prof.is-solo .nv-scrim, #nv-prof.is-solo .nv-topbar { display: none !important; }
#nv-prof .nv-brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 12px; }
#nv-prof .nv-logo { width: 32px; height: 32px; background: center/contain no-repeat; flex-shrink: 0; }
#nv-prof .nv-brand-name { font-weight: 800; font-size: 15px; letter-spacing: .6px; }
#nv-prof .nv-brand-sub { font-size: 10.5px; color: var(--text-3); margin-top: 1px; }
#nv-prof .nv-side-close { margin-left: auto; }
#nv-prof:not(.is-compact) .nv-side-close { display: none; }

#nv-prof .nv-cta {

  padding: 10px 12px; border-radius: 11px;
  border: 1px solid var(--line); background: var(--panel-2);
  cursor: pointer; font-size: 13px; font-weight: 600;
  transition: background .15s, transform .15s; margin-bottom: 8px;
}
#nv-prof .nv-cta:hover { background: var(--panel-3); }
#nv-prof .nv-cta:active { transform: scale(.98); }
#nv-prof .nv-cta svg { width: 16px; height: 16px; }

#nv-prof .nv-nav {
  display: flex; align-items: center; gap: 10px; width: 100%;
  padding: 9px 12px; border-radius: 10px;
  border: none; background: transparent; cursor: pointer;
  font-size: 13px; font-weight: 500; color: var(--text-2);
  transition: background .15s, color .15s; text-align: left;
}
#nv-prof .nv-nav svg { width: 17px; height: 17px; opacity: .8; }
#nv-prof .nv-nav:hover { background: var(--panel); color: var(--text); }
#nv-prof .nv-nav.is-active { background: var(--panel-2); color: var(--text); }
#nv-prof .nv-nav .nv-badge { margin-left: auto; font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--text-3); }

#nv-prof .nv-side-fill { flex: 1; }
#nv-prof .nv-wallet { padding: 12px; border-radius: 11px; background: var(--panel); font-size: 11.5px; color: var(--text-3); }
#nv-prof .nv-wallet b { display: block; font-variant-numeric: tabular-nums; font-size: 20px; font-weight: 700; color: #fff; letter-spacing: -.4px; margin: 2px 0 6px; }
#nv-prof .nv-wallet-bar { height: 4px; border-radius: 9px; background: var(--panel-2); overflow: hidden; }
#nv-prof .nv-wallet-bar i { display: block; height: 100%; background: var(--ok); border-radius: 9px; transition: width .4s var(--ease); }
#nv-prof .nv-logout { margin-top: 8px; font-size: 11.5px; color: var(--text-4); background: none; border: 0; cursor: pointer; padding: 4px 12px; text-align: left; }
#nv-prof .nv-logout:hover { color: var(--text-2); }

#nv-prof .nv-scrim { position: absolute; inset: 0; background: rgba(0,0,0,0.5); opacity: 0; pointer-events: none; transition: opacity .3s; z-index: 25; }

/* ================= MAIN ================= */
#nv-prof .nv-main { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; position: relative; }
/* Aperçu admin : voir l'espace d'un professeur, en lecture seule */
#nv-prof .nv-apercu { display: none; align-items: center; gap: 10px; flex-wrap: wrap; padding: 8px 14px; background: #7AA7FF; color: #0a0a12; font-size: 12px; font-weight: 600; flex-shrink: 0; }
#nv-prof .nv-apercu.is-on { display: flex; }
#nv-prof .nv-apercu span { flex: 1; min-width: 160px; }
#nv-prof .nv-apercu select { height: 28px; border: 0; border-radius: 99px; padding: 0 10px; background: #0a0a12; color: #fff; font: inherit; font-size: 12px; max-width: 100%; cursor: pointer; }
#nv-prof.is-apercu [data-act="upload"], #nv-prof.is-apercu [data-act="pick"], #nv-prof.is-apercu [data-act="del-doc"],
#nv-prof.is-apercu [data-act="upload-for"], #nv-prof.is-apercu [data-act="dv-save"], #nv-prof.is-apercu [data-act="dv-reopen"],
#nv-prof.is-apercu [data-act="dv-corr-pick"], #nv-prof.is-apercu [data-act="dv-corr-del"], #nv-prof.is-apercu .nv-upload-card,
#nv-prof.is-apercu .nv-cta, #nv-prof.is-apercu [data-act="logout"] { display: none !important; }
#nv-prof.is-apercu [data-dv] { pointer-events: none; opacity: .6; }
#nv-prof .nv-pick { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 14px; margin-bottom: 6px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); color: inherit; font: inherit; text-align: left; cursor: pointer; }
#nv-prof .nv-pick:hover { background: var(--panel-2); }
#nv-prof .nv-pick b { display: block; font-size: 13.5px; }
#nv-prof .nv-pick small { display: block; font-size: 11.5px; color: var(--text-3); margin-top: 2px; }
#nv-prof .nv-pick div { flex: 1; min-width: 0; }
#nv-prof .nv-topbar { display: flex; align-items: center; gap: 8px; padding: 10px 14px; min-height: 52px; flex-shrink: 0; }
#nv-prof .nv-topbar-title { flex: 1; min-width: 0; font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-2); }
#nv-prof .nv-icon-btn {
  width: 34px; height: 34px; display: inline-flex; align-items: center; justify-content: center;

  cursor: pointer; transition: background .15s, color .15s; padding: 0;
}
#nv-prof .nv-icon-btn:hover { background: var(--panel-2); color: var(--text); }
#nv-prof .nv-icon-btn svg { width: 18px; height: 18px; }

#nv-prof .nv-page { flex: 1; min-height: 0; animation: nv-fade .28s var(--ease); }
#nv-prof .nv-page-inner { max-width: 760px; margin: 0 auto; padding: 8px 20px 34px; }

@keyframes nv-fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes nv-rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes nv-float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }

#nv-prof .nv-page-head { margin: 6px 0 18px; }
#nv-prof .nv-page-head h2 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -.4px; }
#nv-prof .nv-page-head p { margin: 4px 0 0; font-size: 13px; color: var(--text-3); line-height: 1.55; }

/* Accueil (non connecté, candidature, attente) */
#nv-prof .nv-hero { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 18px 10px 6px; gap: 6px; }
#nv-prof .nv-hero-logo { width: 64px; height: 64px; border-radius: 15px; background: center/contain no-repeat; margin-bottom: 14px; box-shadow: 0 20px 60px rgba(120,150,255,0.18); animation: nv-float 6s ease-in-out infinite; }
#nv-prof .nv-hero h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -.6px; line-height: 1.2; }
#nv-prof .nv-hero p { margin: 0; font-size: 13.5px; color: var(--text-3); max-width: 460px; line-height: 1.55; }
#nv-prof .nv-grad { background: linear-gradient(90deg, #fff, var(--blue)); -webkit-background-clip: text; background-clip: text; color: transparent; }
#nv-prof .nv-steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; margin: 24px 0 8px; }
#nv-prof .nv-step { text-align: left; padding: 14px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--panel); animation: nv-rise .5s var(--ease) both; }

#nv-prof .nv-step b { display: block; font-size: 13px; font-weight: 600; margin: 4px 0 3px; }
#nv-prof .nv-step span { font-size: 12px; color: var(--text-3); line-height: 1.5; }

/* Cartes */

#nv-prof .nv-card.is-on { border-color: rgba(255,255,255,0.14); background: var(--panel-2); }
#nv-prof .nv-card-title { font-size: 14px; font-weight: 700; margin: 0 0 4px; }
#nv-prof .nv-card-sub { font-size: 12px; color: var(--text-3); margin: 0 0 12px; line-height: 1.5; }
#nv-prof .nv-group-label { font-size: 10.5px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: var(--text-4); margin: 22px 4px 8px; }
#nv-prof .nv-notice { padding: 12px 14px; border-radius: 12px; background: rgba(255,209,102,0.08); border: 1px solid rgba(255,209,102,0.2); font-size: 12.5px; color: #ffe2a3; margin: 12px 0; line-height: 1.5; }
#nv-prof .nv-notice.is-bad { background: rgba(255,107,107,0.08); border-color: rgba(255,107,107,0.2); color: #ffb3b3; }

/* Statistiques */
#nv-prof .nv-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px; }
#nv-prof .nv-stat { padding: 14px; border-radius: var(--radius); background: var(--panel); border: 1px solid var(--line); animation: nv-rise .4s var(--ease) both; min-width: 0; }
#nv-prof .nv-stat:nth-child(2) { animation-delay: .04s; }

#nv-prof .nv-stat small { display: block; font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 600; letter-spacing: .6px; text-transform: uppercase; color: var(--text-4); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#nv-prof .nv-stat b { display: block; font-size: 22px; font-weight: 700; letter-spacing: -.5px; margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
#nv-prof .nv-stat.is-ok b { color: var(--ok); }

/* Lien */
#nv-prof .nv-link { display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 14px; border-radius: 99px; background: rgba(0,0,0,0.25); border: 1px solid var(--line); }
#nv-prof .nv-link code { flex: 1; min-width: 0; font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#nv-prof .nv-share { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }

/* Boutons */
#nv-prof .nv-btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 38px; padding: 0 18px; border-radius: 99px; border: none; background: #fff; color: #0a0a12; font-size: 13px; font-weight: 600; cursor: pointer; text-decoration: none; white-space: nowrap; transition: transform .15s, background .2s; }
#nv-prof .nv-btn:hover:not(:disabled) { transform: translateY(-1px); }
#nv-prof .nv-btn:disabled { background: var(--panel-3); color: var(--text-4); cursor: default; transform: none; }
#nv-prof .nv-btn svg { width: 15px; height: 15px; }
#nv-prof .nv-btn.is-block { width: 100%; height: 42px; }
#nv-prof .nv-chip { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 99px; border: 1px solid var(--line); background: transparent; font-size: 12px; color: var(--text-2); cursor: pointer; text-decoration: none; white-space: nowrap; transition: background .15s, color .15s; }
#nv-prof .nv-chip:hover { background: var(--panel-2); color: #fff; }
#nv-prof .nv-chip svg { width: 14px; height: 14px; }
#nv-prof .nv-link-btn { background: none; border: none; color: var(--text-2); font-size: 12.5px; cursor: pointer; padding: 4px 6px; border-radius: 6px; text-decoration: underline; text-underline-offset: 3px; }
#nv-prof .nv-link-btn:hover { color: #fff; }

/* Formulaires */
#nv-prof .nv-field { display: block; margin-top: 12px; }

#nv-prof .nv-field em { font-style: normal; color: var(--text-4); }
#nv-prof .nv-input { width: 100%; height: 42px; padding: 0 14px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); color: #fff; font: inherit; font-size: 13.5px; outline: none; transition: border-color .15s, background .15s; }
#nv-prof textarea.nv-input { height: auto; min-height: 92px; padding: 11px 14px; line-height: 1.55; resize: vertical; }
#nv-prof select.nv-input option { background: #111118; color: #fff; }
#nv-prof .nv-input::placeholder { color: var(--text-4); }
#nv-prof .nv-input:focus { border-color: rgba(255,255,255,0.22); background: var(--panel-2); }
#nv-prof .nv-row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
#nv-prof .nv-err { color: var(--danger); font-size: 12.5px; margin-top: 10px; min-height: 1em; }
#nv-prof .nv-sep { display: flex; align-items: center; gap: 10px; color: var(--text-4); font-size: 11.5px; margin: 14px 0; }
#nv-prof .nv-sep::before, #nv-prof .nv-sep::after { content: ''; flex: 1; height: 1px; background: var(--line); }

/* Case à cocher (comme NAVIRE AI) */
#nv-prof .nv-check-row { display: flex; align-items: flex-start; gap: 12px; padding: 10px 6px; border-radius: 9px; cursor: pointer; font-size: 13px; color: var(--text-2); line-height: 1.5; transition: background .15s; }
#nv-prof .nv-check-row:hover { background: var(--panel); }
#nv-prof .nv-check { width: 18px; height: 18px; border-radius: 6px; border: 1.5px solid rgba(255,255,255,0.3); display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px; transition: background .15s, border-color .15s; }
#nv-prof .nv-check svg { width: 12px; height: 12px; color: #0a0a12; opacity: 0; transform: scale(.5); transition: opacity .15s, transform .2s var(--ease); }
#nv-prof .nv-check-row.is-on .nv-check { background: #fff; border-color: #fff; }
#nv-prof .nv-check-row.is-on .nv-check svg { opacity: 1; transform: none; }

#nv-prof .nv-terms { margin: 0; padding: 0 0 0 20px; font-size: 13px; line-height: 1.65; color: var(--text-2); }
#nv-prof .nv-terms li { margin-bottom: 6px; }
#nv-prof .nv-terms li::marker { color: var(--text-4); }

/* Lignes (filleuls) */
#nv-prof .nv-search { display: flex; align-items: center; gap: 10px; padding: 0 14px; height: 42px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); margin-bottom: 14px; }
#nv-prof .nv-search svg { width: 16px; height: 16px; color: var(--text-3); }
#nv-prof .nv-search input { flex: 1; background: none; border: none; outline: none; color: #fff; font: inherit; font-size: 13.5px; }
#nv-prof .nv-search input::placeholder { color: var(--text-4); }
#nv-prof .nv-filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
#nv-prof .nv-filters .nv-chip.is-active { background: var(--panel-3); color: #fff; border-color: rgba(255,255,255,0.14); }
#nv-prof .nv-row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 12px; background: var(--panel); border: 1px solid transparent; margin-bottom: 6px; animation: nv-rise .35s var(--ease) both; }
#nv-prof .nv-row-ico { width: 36px; height: 36px; border-radius: 10px; background: var(--panel-2); display: flex; align-items: center; justify-content: center; color: var(--text-2); flex-shrink: 0; font-weight: 700; font-size: 13px; }
#nv-prof .nv-row-body { flex: 1; min-width: 0; }
#nv-prof .nv-row-title { font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#nv-prof .nv-row-meta { font-size: 11.5px; color: var(--text-3); margin-top: 3px; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
#nv-prof .nv-row-amount { font-size: 14px; font-weight: 700; flex-shrink: 0; }
#nv-prof .nv-tag { display: inline-flex; align-items: center; gap: 5px; font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 99px; background: var(--panel-2); color: var(--text-2); white-space: nowrap; }
#nv-prof .nv-tag i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

#nv-prof .nv-tag.warn { color: var(--warn); background: rgba(255,209,102,0.1); }
#nv-prof .nv-tag.bad { color: var(--danger); background: rgba(255,107,107,0.1); }
#nv-prof .nv-empty { text-align: center; padding: 34px 20px; font-size: 13px; color: var(--text-3); line-height: 1.6; }
#nv-prof .nv-empty b { display: block; color: var(--text-2); font-size: 14px; margin-bottom: 4px; }
#nv-prof .nv-skel { height: 62px; border-radius: 12px; margin-bottom: 6px; background: linear-gradient(90deg, var(--panel) 0%, var(--panel-2) 50%, var(--panel) 100%); background-size: 200% 100%; animation: nv-shimmer 1.4s linear infinite; }

/* Simulateur */
#nv-prof .nv-range { width: 100%; accent-color: #fff; margin: 6px 0 2px; }
#nv-prof .nv-sim-total { display: flex; align-items: baseline; justify-content: space-between; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }

#nv-prof .nv-cta:hover { background: var(--panel-3); }
#nv-prof .nv-wallet { background: var(--panel); border-radius: 12px; }
#nv-prof .nv-chip { border: 0; background: var(--panel-2); }
#nv-prof .nv-chip:hover { background: var(--panel-3); }
#nv-prof .nv-chip.is-active { background: #fff; color: #0a0a12; }
#nv-prof .nv-btn.is-sm { height: 32px; padding: 0 14px; font-size: 12.5px; }
#nv-prof .nv-row { border: 0; }
#nv-prof button.nv-row { width: 100%; text-align: left; color: inherit; font: inherit; cursor: pointer; transition: background .15s; }
#nv-prof button.nv-row:hover { background: var(--panel-2); }
#nv-prof .nv-row-art { width: 34px; height: 34px; flex-shrink: 0; background: center/contain no-repeat; }
#nv-prof .nv-note { font-family: 'IBM Plex Mono', monospace; font-size: 13.5px; font-weight: 700; color: #0a0a12; background: var(--blue); padding: 3px 10px; border-radius: 9px; white-space: nowrap; }
/* Cartes à halo (comme les accès de l'accueil) */
#nv-prof .nv-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; margin-bottom: 8px; }
#nv-prof .nv-hcard { position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 6px; min-width: 0; min-height: 124px; padding: 16px; border-radius: 16px; border: 0; background: var(--panel); text-align: left; color: inherit; font: inherit; cursor: pointer; transition: background .2s, transform .2s var(--ease); animation: nv-rise .45s var(--ease) both; }
#nv-prof .nv-hcard::after { content: ''; position: absolute; right: -40px; top: -40px; width: 120px; height: 120px; border-radius: 50%; background: radial-gradient(circle, rgba(122,167,255,0.16), transparent 70%); pointer-events: none; transition: transform .4s var(--ease); }
#nv-prof .nv-hcard:hover { background: var(--panel-2); transform: translateY(-2px); }
#nv-prof .nv-hcard:hover::after { transform: scale(1.25); }
#nv-prof .nv-hcard:nth-child(2) { animation-delay: .04s; }
#nv-prof .nv-hcard:nth-child(3) { animation-delay: .08s; }
#nv-prof .nv-hcard:nth-child(4) { animation-delay: .12s; }
#nv-prof .nv-hcard.is-hero { background: linear-gradient(135deg, rgba(79,125,255,0.2), rgba(122,167,255,0.03)); }
#nv-prof .nv-hcard-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; position: relative; z-index: 1; }
#nv-prof .nv-hcard-art { width: 38px; height: 38px; flex-shrink: 0; background: center/contain no-repeat; filter: drop-shadow(0 5px 12px rgba(79,125,255,0.22)); transition: transform .35s var(--ease); }
#nv-prof .nv-hcard:hover .nv-hcard-art { transform: translateY(-2px) scale(1.06) rotate(-3deg); }
#nv-prof .nv-hcard-text { margin-top: auto; min-width: 0; position: relative; z-index: 1; }
#nv-prof .nv-hcard-text b { display: block; font-size: 15px; font-weight: 700; letter-spacing: -.3px; line-height: 1.3; }
#nv-prof .nv-hcard-text small { display: block; font-size: 12px; color: var(--text-3); margin-top: 3px; line-height: 1.4; }
#nv-prof .nv-big { font-size: 26px; font-weight: 800; letter-spacing: -.6px; font-variant-numeric: tabular-nums; }
/* Groupe : effectif et documents dépliables */
#nv-prof .nv-fold { margin-top: 12px; }
#nv-prof .nv-fold > summary { list-style: none; display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 12.5px; font-weight: 600; color: var(--text-2); padding: 6px 0; }
#nv-prof .nv-fold > summary::-webkit-details-marker { display: none; }
#nv-prof .nv-fold > summary::before { content: '›'; font-size: 16px; color: var(--text-4); transition: transform .2s; width: 10px; }
#nv-prof .nv-fold[open] > summary::before { transform: rotate(90deg); }
#nv-prof .nv-fold .nv-row { background: rgba(255,255,255,0.025); }
/* Fenêtre (dépôt de document, nouvelle épreuve) */
#nv-prof .nv-pop { position: absolute; inset: 0; z-index: 1500; display: none; align-items: center; justify-content: center; background: rgba(5,6,12,0.55); padding: 16px; }
#nv-prof .nv-pop.is-on { display: flex; }
#nv-prof .nv-pop-card { width: min(520px, 100%); max-height: calc(100% - 32px); overflow-y: auto; padding: 22px; border-radius: 20px; background: #13141f; box-shadow: 0 30px 80px rgba(0,0,0,0.5); animation: nv-rise .25s var(--ease) both; }
#nv-prof .nv-pop-card h4 { margin: 0 0 4px; font-size: 18px; letter-spacing: -.3px; }
#nv-prof .nv-pop-card > p { margin: 0 0 6px; font-size: 13px; color: var(--text-3); line-height: 1.5; }
#nv-prof .nv-pop-btns { display: flex; gap: 8px; margin-top: 16px; justify-content: flex-end; flex-wrap: wrap; }
/* Téléphone : police, menu en voile */
#nv-prof.is-compact { font-family: 'DM Sans', system-ui, sans-serif; font-size: 13px; }
#nv-prof.is-compact .nv-page-head h2 { font-size: 19px; }
#nv-prof.is-compact .nv-cards { grid-template-columns: 1fr 1fr; gap: 8px; }
#nv-prof.is-compact .nv-hcard { min-height: 108px; padding: 14px; }
#nv-prof.is-compact .nv-hcard-art { width: 32px; height: 32px; }
#nv-prof.is-compact .nv-hcard-text b { font-size: 13.5px; }
#nv-prof.is-compact .nv-scrim { top: var(--vis-top, 0px); bottom: auto; height: var(--vis-h, 100%); background: transparent; }
#nv-prof.is-compact .nv-side { left: 12px; right: 12px; width: auto; bottom: auto; top: calc(var(--vis-top, 0px) + 12px); max-height: calc(var(--vis-h, 100%) - 24px); padding: 6px 6px 8px; border-radius: 18px; background: #181a26; box-shadow: 0 20px 50px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.07); transform: translateY(-8px) scale(.98); opacity: 0; transition: transform .22s var(--ease), opacity .18s, visibility 0s .22s; }
#nv-prof.is-compact.is-drawer .nv-side { transform: none; opacity: 1; transition: transform .22s var(--ease), opacity .18s; }
#nv-prof.is-compact.is-drawer .nv-scrim { opacity: 0; }
#nv-prof.is-compact .nv-nav { padding: 9px 12px; font-size: 13.5px; gap: 11px; }
#nv-prof.is-compact .nv-side-fill { display: none; }
#nv-prof.is-compact .nv-topbar { min-height: 50px; padding: 6px 8px; }
#nv-prof.is-compact .nv-topbar-title { font-size: 14px; }

/* ================= ÉCRAN BLANC (écriture, correction, lecture) =================
   Posé sur tout l'écran, header du site masqué : plein écran du navigateur
   quand il est permis, sinon un calque fixe au-dessus de toute la page.
   Rien que du blanc : pas de page simulée, une colonne de texte. */
.nvx { position: fixed; inset: 0; z-index: 2147483000; display: flex; flex-direction: column; background: #fff; color: #15161c; font-family: 'Inter', system-ui, sans-serif; -webkit-font-smoothing: antialiased; font-size: 14px; animation: nvx-in .25s cubic-bezier(.2,.8,.2,1); }
.nvx, .nvx *, .nvx *::before, .nvx *::after { box-sizing: border-box; }
.nvx button { font-family: inherit; color: inherit; }
.nvx ::selection { background: rgba(79,125,255,0.2); }
.nvx svg { flex-shrink: 0; }
@keyframes nvx-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes nvx-rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes nvx-shimmer { from { background-position: 120% 0; } to { background-position: -120% 0; } }
.nvx-top { display: flex; align-items: center; gap: 6px; height: 46px; padding: 0 12px; flex-shrink: 0; background: #fff; position: relative; z-index: 5; font-size: 12px; color: #8a8fa3; }
.nvx-info { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; white-space: nowrap; overflow: hidden; }
.nvx-info b { font-weight: 600; color: #15161c; overflow: hidden; text-overflow: ellipsis; }
.nvx-info span { overflow: hidden; text-overflow: ellipsis; }
.nvx-clock { font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; font-weight: 600; color: #15161c; padding: 3px 9px; border-radius: 99px; background: #f1f3f8; font-variant-numeric: tabular-nums; flex-shrink: 0; }
.nvx-clock.is-late { background: #fff0ee; color: #c8372d; }
.nvx-clock.is-over { background: #c8372d; color: #fff; }
.nvx-b { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 30px; padding: 0 11px; border-radius: 99px; border: 0; background: transparent; color: #4a4e5e; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; text-decoration: none; transition: background .15s, color .15s; }
.nvx-b:hover { background: #f1f3f8; color: #15161c; }
.nvx-b.is-on { background: #eaf0ff; color: #2f5be0; }
.nvx-b svg { width: 14px; height: 14px; }
.nvx-b.is-ico { width: 30px; padding: 0; }
.nvx-b.is-main { background: #15161c; color: #fff; padding: 0 14px; }
.nvx-b.is-main:hover { background: #2c2e38; color: #fff; }
.nvx-b.is-blue { background: #4F7DFF; color: #fff; }
.nvx-b.is-blue:hover { background: #3d6bf0; color: #fff; }
.nvx-b:disabled { opacity: .4; cursor: default; }
.nvx-sep { width: 1px; height: 16px; background: #eceef3; margin: 0 2px; flex-shrink: 0; }
.nvx-save { font-size: 11.5px; color: #a0a4b4; white-space: nowrap; }
.nvx-prog { height: 2px; background: #f1f3f8; flex-shrink: 0; }
.nvx-prog i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #4F7DFF, #8fb0ff); transition: width .6s linear; }
.nvx-body { flex: 1; min-height: 0; overflow-y: auto; position: relative; scrollbar-width: thin; scrollbar-color: #dfe2ea transparent; }
.nvx-col { max-width: 720px; margin: 0 auto; padding: 44px 28px 160px; }
.nvx-grid { display: grid; grid-template-columns: minmax(0, 720px) 280px; gap: 40px; justify-content: center; padding: 40px 28px 160px; position: relative; }
.nvx-titre { display: block; width: 100%; border: 0; outline: none; background: transparent; padding: 0; margin: 0 0 22px; font-family: 'Inter', sans-serif; font-size: 30px; font-weight: 800; letter-spacing: -.6px; line-height: 1.2; color: #15161c; }
.nvx-titre::placeholder { color: #c9ccd6; }
.nvx-h1 { font-family: 'Inter', sans-serif; font-size: 28px; font-weight: 800; letter-spacing: -.6px; line-height: 1.22; margin: 0 0 8px; }
.nvx-kicker { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: 1px; text-transform: uppercase; color: #4F7DFF; margin-bottom: 10px; }
.nvx-meta { font-size: 12.5px; color: #8a8fa3; margin-bottom: 26px; }
.nvx-text, .nvx-ed { font-family: 'Source Serif 4', Georgia, serif; font-size: 18px; line-height: 1.8; color: #15161c; outline: none; overflow-wrap: anywhere; }
.nvx-ed { position: relative; min-height: 50vh; caret-color: #4F7DFF; }
.nvx-ed p, .nvx-ed div, .nvx-text p { margin: 0 0 14px; }
.nvx-ed h3, .nvx-text h3 { font-family: 'Inter', sans-serif; font-size: 18px; font-weight: 700; letter-spacing: -.2px; margin: 30px 0 10px; line-height: 1.4; }
.nvx-text h2 { font-family: 'Inter', sans-serif; font-size: 23px; font-weight: 800; letter-spacing: -.4px; margin: 0 0 22px; line-height: 1.3; }
.nvx-ed blockquote, .nvx-text blockquote { margin: 0 0 14px 22px; padding-left: 14px; box-shadow: inset 3px 0 0 #c9d6ff; font-style: italic; }
.nvx-ed.is-empty::before { content: attr(data-ph); position: absolute; color: #c9ccd6; pointer-events: none; }
.nvx-text table { width: 100%; border-collapse: collapse; font-family: 'Inter', sans-serif; font-size: 13px; margin: 0 0 16px; }
.nvx-text td { padding: 7px 10px; background: #f6f7fa; border: 2px solid #fff; }
.nvx-text [data-bloc] { text-align: left; }
/* Révisions : barré rouge, ajout vert, surligné jaune, commenté bleu */
.nvx .del { color: #c8372d; text-decoration: line-through; text-decoration-thickness: 1.5px; }
.nvx .ins { color: #13834f; background: rgba(19,131,79,0.07); border-radius: 3px; text-decoration: underline; text-decoration-color: rgba(19,131,79,0.4); text-underline-offset: 3px; }
.nvx .hl { background: #fff1a8; border-radius: 2px; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
.nvx .com { background: rgba(79,125,255,0.12); box-shadow: inset 0 -1.5px 0 #4F7DFF; cursor: pointer; }
.nvx .com.is-focus { background: rgba(79,125,255,0.28); }
.nvx-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 11.5px; color: #8a8fa3; margin: 0 0 24px; }
/* Commentaires : bulles carrées sur le côté, photo, nom, commentaire */
.nvx-margin { position: relative; }
.nvx-bub { position: absolute; left: 0; right: 0; font-family: 'Inter', system-ui, sans-serif; font-style: normal; text-align: left; padding: 12px 13px; border-radius: 6px; background: #fff; box-shadow: 0 1px 2px rgba(20,24,40,0.06), 0 6px 22px rgba(20,24,40,0.07), 0 0 0 1px #eef0f5; font-size: 13px; line-height: 1.5; color: #2b2d36; cursor: pointer; transition: top .25s cubic-bezier(.2,.8,.2,1), box-shadow .15s, transform .15s; white-space: pre-wrap; overflow-wrap: anywhere; animation: nvx-rise .25s cubic-bezier(.2,.8,.2,1) both; }
.nvx-bub:hover { box-shadow: 0 2px 4px rgba(20,24,40,0.08), 0 10px 30px rgba(20,24,40,0.1), 0 0 0 1px #e3e7f2; }
.nvx-bub.is-focus { box-shadow: 0 0 0 2px #4F7DFF, 0 10px 30px rgba(20,24,40,0.12); transform: translateX(-6px); }
.nvx-bub-head { display: flex; align-items: center; gap: 9px; margin-bottom: 7px; white-space: normal; }
.nvx-bub-head b { font-size: 12.5px; font-weight: 700; color: #15161c; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nvx-bub-head small { font-size: 10.5px; color: #a0a4b4; }
.nvx-bub-acts { display: flex; gap: 4px; margin-top: 8px; }
.nvx-bub-acts button { border: 0; background: #f1f3f8; color: #4a4e5e; font-size: 11.5px; font-weight: 600; cursor: pointer; padding: 4px 9px; border-radius: 4px; }
.nvx-bub-acts button:hover { background: #e6e9f2; color: #15161c; }
.nvx-bub textarea { width: 100%; min-height: 70px; border: 0; border-radius: 4px; background: #f6f7fa; padding: 9px 10px; font: inherit; font-size: 13px; line-height: 1.5; color: #15161c; resize: vertical; outline: none; }
.nvx-bub textarea:focus { box-shadow: inset 0 0 0 1.5px #4F7DFF; }
.nvx-bub.is-draft { z-index: 4; cursor: default; }
.nvx-pp { display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; border-radius: 50%; background: #e6e8ef center/cover no-repeat; color: #fff; font-weight: 700; letter-spacing: 0; }
.nvx-pp.is-letter { background: #4F7DFF; }
.nvx-inline { display: none; }
.nvx-inline .nvx-bub { position: static; margin: 0 0 8px; }
/* Appréciation générale */
.nvx-verdict { display: flex; gap: 14px; align-items: flex-start; padding: 18px; border-radius: 6px; background: #f6f8ff; margin: 0 0 30px; }
.nvx-verdict > div { flex: 1; min-width: 0; font-size: 14px; line-height: 1.6; color: #2b2d36; white-space: pre-wrap; overflow-wrap: anywhere; }
.nvx-verdict small { display: block; font-size: 12px; font-weight: 700; color: #15161c; margin-bottom: 3px; white-space: normal; }
.nvx-note { font-family: 'IBM Plex Mono', monospace; font-size: 18px; font-weight: 700; color: #fff; background: #4F7DFF; padding: 6px 12px; border-radius: 6px; white-space: nowrap; }
.nvx-end { margin-top: 48px; padding: 22px; border-radius: 6px; background: #f6f7fa; }
.nvx-end h4 { margin: 0 0 4px; font-size: 15px; }
.nvx-end p { margin: 0 0 14px; font-size: 12.5px; color: #8a8fa3; }
.nvx-end-grid { display: grid; grid-template-columns: 1fr 130px; gap: 10px; }
.nvx-end label span { display: block; font-size: 11.5px; font-weight: 600; color: #6b6f80; margin-bottom: 6px; }
.nvx-field { width: 100%; border: 0; border-radius: 6px; background: #fff; padding: 11px 13px; font: inherit; font-size: 14px; color: #15161c; outline: none; }
textarea.nvx-field { min-height: 110px; resize: vertical; line-height: 1.55; }
select.nvx-field { height: 42px; padding: 0 12px; }
.nvx-field:focus { box-shadow: inset 0 0 0 1.5px #4F7DFF; }
.nvx-end input.nvx-field { height: 44px; font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 16px; text-align: center; }
.nvx-end-btns { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; align-items: center; }
.nvx-end-btns em { font-style: normal; font-size: 12px; color: #8a8fa3; }
/* Outils flottants */
.nvx-tool { position: absolute; z-index: 20; display: none; gap: 2px; padding: 4px; border-radius: 10px; background: #15161c; box-shadow: 0 10px 30px rgba(10,12,30,0.25); }
.nvx-tool.is-on { display: flex; animation: nvx-rise .15s both; }
.nvx-tool button { border: 0; background: transparent; color: #fff; height: 30px; padding: 0 11px; border-radius: 7px; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.nvx-tool button:hover { background: rgba(255,255,255,0.12); }
.nvx-tool button svg { width: 13px; height: 13px; }
/* Panneau latéral (sujet, brouillon) */
.nvx-panel { position: absolute; top: 48px; right: 0; bottom: 0; width: min(420px, 100%); background: #f7f8fb; z-index: 6; transform: translateX(102%); transition: transform .3s cubic-bezier(.2,.8,.2,1); display: flex; flex-direction: column; }
.nvx-panel.is-on { transform: none; box-shadow: -20px 0 50px rgba(20,24,40,0.08); }
.nvx-panel-head { display: flex; align-items: center; gap: 8px; padding: 12px 14px 6px 20px; }
.nvx-panel-head b { flex: 1; font-size: 13px; }
.nvx-panel-body { flex: 1; min-height: 0; overflow-y: auto; padding: 6px 22px 30px; font-family: 'Source Serif 4', Georgia, serif; font-size: 16px; line-height: 1.75; color: #2b2d36; white-space: pre-wrap; }
.nvx-panel textarea { flex: 1; min-height: 0; margin: 6px 14px 14px; border: 0; border-radius: 6px; background: #fff; padding: 14px; font: inherit; font-size: 14px; line-height: 1.6; color: #15161c; resize: none; outline: none; }
.nvx-panel textarea:focus { box-shadow: inset 0 0 0 1.5px #4F7DFF; }
/* Fenêtres */
.nvx-modal { position: absolute; inset: 0; z-index: 30; display: none; align-items: center; justify-content: center; padding: 16px; background: rgba(250,251,253,0.82); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
.nvx-modal.is-on { display: flex; }
.nvx-card { width: min(440px, 100%); padding: 24px; border-radius: 12px; background: #fff; box-shadow: 0 30px 80px rgba(20,24,40,0.16), 0 0 0 1px #eef0f5; animation: nvx-rise .2s both; }
.nvx-card h4 { margin: 0 0 6px; font-size: 18px; letter-spacing: -.3px; }
.nvx-card p { margin: 0 0 14px; font-size: 13px; color: #6b6f80; line-height: 1.55; }
.nvx-card label { display: block; margin-top: 12px; }
.nvx-card label > span { display: block; font-size: 11.5px; font-weight: 600; color: #6b6f80; margin-bottom: 6px; }
.nvx-card .nvx-field { background: #f6f7fa; }
.nvx-card textarea.nvx-field { min-height: 80px; }
.nvx-card-btns { display: flex; gap: 8px; margin-top: 18px; justify-content: flex-end; flex-wrap: wrap; }
.nvx-err { color: #c8372d; font-size: 12.5px; margin-top: 10px; min-height: 1em; }
.nvx-link { background: none; border: 0; padding: 0; color: #4F7DFF; font-size: 12.5px; font-weight: 600; cursor: pointer; }
.nvx-skel { height: 18px; border-radius: 4px; margin-bottom: 12px; background: linear-gradient(90deg, #f1f2f6 0%, #e7e9f0 50%, #f1f2f6 100%); background-size: 200% 100%; animation: nvx-shimmer 1.4s linear infinite; }
.nvx-toast { position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 40; padding: 9px 14px; border-radius: 10px; background: #15161c; color: #fff; font-size: 12.5px; box-shadow: 0 10px 30px rgba(10,12,30,0.25); white-space: nowrap; animation: nvx-rise .2s both; }
.nvx-toast.is-error { background: #c8372d; }
/* Étroit : commentaires sous leur paragraphe, barre resserrée */
.nvx.is-narrow .nvx-grid { grid-template-columns: minmax(0, 1fr); padding: 26px 18px 160px; }
.nvx.is-narrow .nvx-margin { display: none; }
.nvx.is-narrow .nvx-inline { display: block; margin: -4px 0 14px; }
.nvx.is-narrow .nvx-col { padding: 28px 18px 160px; }
.nvx.is-narrow .nvx-titre, .nvx.is-narrow .nvx-h1 { font-size: 24px; }
.nvx.is-narrow .nvx-text, .nvx.is-narrow .nvx-ed { font-size: 17px; }
.nvx.is-narrow .nvx-lbl, .nvx.is-narrow .nvx-hide-n { display: none; }
.nvx.is-narrow .nvx-end-grid { grid-template-columns: 1fr; }
.nvx.is-narrow .nvx-top { padding: 0 6px; gap: 2px; }
@media (prefers-reduced-motion: reduce) { .nvx, .nvx * { animation-duration: .01ms !important; transition-duration: .01ms !important; } }

  function viewEarnings() {

    if (!S.earnMonth && t.mois.length) {
      S.earnMonth = t.mois.some(function (m) { return m.mois === cur; }) ? cur : t.mois[t.mois.length - 1].mois;
    }
    if (S.earnMonth) chargerDetail(S.earnMonth);
    var max = Math.max.apply(null, t.mois.map(function (m) { return m.montant_cents; }).concat([1]));
    // Un mois est versé quand il l'est dans tous les groupes ; ajusté si l'un d'eux a un montant fixé.
    function monthTag(cle) {
      var ls = [];
      d.classes.forEach(function (c) { c.previsionnel.mois.forEach(function (m) { if (m.mois === cle) ls.push(m); }); });
      if (ls.length && ls.every(function (m) { return m.verse_le; })) return '<span class="nv-tag ok"><i></i>versé</span>';
      if (ls.some(function (m) { return m.fixe_cents !== null; })) return '<span class="nv-tag warn"><i></i>ajusté</span>';
      if (cle === cur) return '<span class="nv-tag"><i></i>en cours</span>';
      return '<span class="nv-tag" style="visibility:hidden"><i></i>versé</span>';
    }
    var html = head("Rémunération", "Prévisionnel calculé sur le calendrier des séances et tes étudiants inscrits, ajusté par l'équipe NAVIRE. Versée par virement.") +
      '<div class="nv-stats">' + stat("Déjà gagné", eur(t.realise_cents), true) + stat("Versé", eur(t.verse_cents)) + stat("À venir", eur(t.a_venir_cents)) + stat("Total prévu", eur(t.total_cents)) + '</div>' + soldeMois(t);
    html += '<div class="nv-group-label">Par mois</div>';

      html += '<button class="nv-month' + (m.mois < cur ? " is-past" : m.mois === cur ? " is-current" : "") + (m.mois === S.earnMonth ? " is-selected" : "") +

        '<small>' + m.seances + ' séance' + (m.seances > 1 ? 's' : '') + '</small>' +
        '<span class="nv-month-bar"><i style="width:' + Math.round(m.montant_cents / max * 100) + '%"></i></span>' +
        '<span class="nv-month-amount">' + eur(m.montant_cents) + '</span>' + monthTag(m.mois) + '</button>';

      if (p.remu_etudiant_cents) parts.push(eur(p.remu_etudiant_cents) + " par étudiant et par séance");
      html += '<div class="nv-card"><div class="nv-card-title">' + esc(c.nom) + '</div>' +
        '<div class="nv-card-sub">' + (parts.join(" + ") || (p.mois.some(function (m) { return m.fixe_cents !== null; }) ? "Montants fixés par l'équipe NAVIRE" : "Rémunération en cours de définition par l'équipe NAVIRE")) + ' · ' + c.etudiants.length + ' étudiant' + (c.etudiants.length > 1 ? 's' : '') + '</div>' +
        '<div class="nv-stats" style="margin:0">' + stat("Séances faites", p.seances_passees) + stat("À venir", p.seances_a_venir) +
        stat("Déjà gagné", eur(p.realise_cents), true) + stat("Prévu", eur(p.a_venir_cents)) + '</div></div>';
    });

  // Google : fenêtre sur l'API (l'iframe ne peut pas parler à Google), qui
  // renvoie un ticket par postMessage.
  function google() {
    var w = window.open(CONFIG.API + "/auth/google/start", "navire_oauth", "width=480,height=640");
    if (!w) return err("Autorise les fenêtres pop-up pour continuer avec Google.");
    function onMsg(ev) {
      var d = ev.data || {};
      if (d.type === "NAVIRE_OAUTH_ERROR") { window.removeEventListener("message", onMsg); err(d.message || "Connexion Google interrompue."); }
      if (d.type !== "NAVIRE_OAUTH_TICKET") return;
      window.removeEventListener("message", onMsg);
      api("POST", "/auth/oauth", { provider: "google", ticket: d.ticket }).then(loggedIn).catch(function (x) { err(x.message); });
    }
    window.addEventListener("message", onMsg);
  }

  // ---------- Position du curseur dans le modèle ----------

      if (next && next.nodeType === 1 && next.hasAttribute("data-k")) return { b: b, c: C[+next.getAttribute("data-k")], k: 0 };
      if (prev && prev.nodeType === 1 && prev.hasAttribute("data-k")) return { b: b, c: C[+prev.getAttribute("data-k")], k: prev.textContent.length };
      if (prev && prev.nodeType === 1 && prev.hasAttribute("data-o")) return { b: b, o: +prev.getAttribute("data-o") + prev.textContent.length };

  // ---------- Opérations (suggestions) ----------
  function delAt(C, p) { return C.filter(function (c) { return c.debut <= p && p < c.fin; })[0]; }

  function opInsert(pos, str) {

  // Remplacer une sélection (vide : effacer) dans un seul paragraphe.
  function opReplace(s, e, str) {

  // ---------- Annuler (Ctrl Z) ----------

  // ---------- Application d'une frappe ----------

      .then(function () { CX.saving--; if (!CX.saving && !Object.keys(CX.pending).length) cxSave("Enregistré"); })
      .catch(function (x) {

    while (debut < fin && b.text.charAt(debut) === " ") debut++;
    while (fin > debut && b.text.charAt(fin - 1) === " ") fin--;

      if (e.target.matches && e.target.matches("[data-cx-draft]") && CX.draft) CX.draft.texte = e.target.value;
    });
    n.addEventListener("mouseup", function () { setTimeout(cxUpdateTool, 0); });
    n.addEventListener("keyup", function (e) { if (/^(Arrow|Shift|Home|End|Page)/.test(e.key)) cxUpdateTool(); });
    n.addEventListener("mousedown", function (e) { if (e.target.closest('[data-cx-el="tool"] button')) e.preventDefault(); });
    cxQ('[data-cx-el="body"]').addEventListener("scroll", function () { if (CX.mark) cxHideTool(); });
    n.addEventListener("click", function (e) {
      var b = e.target.closest("[data-cx]");
      if (!b) {
        var bub = e.target.closest("[data-bub]"), mk = e.target.closest("[data-c]");
        if (bub && bub.getAttribute("data-bub") !== "draft") cxFocus(bub.getAttribute("data-bub"));
        else if (mk) cxFocus(mk.getAttribute("data-c").split(" ")[0]);
        return;
      }
      var a = b.getAttribute("data-cx"), id = +b.getAttribute("data-id");
      if (a === "fermer") return cxClose();
      if (a === "export") return cxExport(b.getAttribute("data-f"));
      if (a === "undo") return CX.ro ? null : cxUndo();
      if (a === "jointe") return openPdf(qs("/professeurs/devoirs/" + CX.id + "/correction"));
      if (a === "fin") { var end = cxQ("[data-cx-end]"); if (end) end.scrollIntoView({ behavior: "smooth", block: "center" }); var ta = cxQ('[data-cx-in="commentaire"]'); if (ta) setTimeout(function () { ta.focus({ preventScroll: true }); }, 400); return; }
      if (a === "rendre") return cxRendre(b);
      if (a === "reouvrir") return cxRendre(b, "depose");
      if (a === "t-com") { var s1 = cxSelOrig(); cxHideTool(); if (s1) cxNewDraft(s1); return; }
      if (a === "t-hl") { var s2 = cxSelOrig(); cxHideTool(); try { window.getSelection().removeAllRanges(); } catch (x) {} if (s2) cxAnnoter("surligne", s2, ""); return; }
      if (a === "t-undo-corr" && CX.mark && CX.mark.corr) { var M = CX.mark; cxSnap(M.b, "undo-corr"); rm(cxC(M.b), M.corr); cxRenderBloc(M.b); cxSchedule(M.b); cxHideTool(); return; }
      if (a === "t-unhl" && CX.mark && CX.mark.hl) { var h = +CX.mark.hl; cxHideTool(); return cxRetirer(h); }
      if (a === "d-x") return cxDraftClose();
      if (a === "d-ok") return cxDraftOk();
      if (a === "b-del") return cxRetirer(id);
      if (a === "b-edit") { var an = CX.anns.filter(function (x) { return x.id === id; })[0]; if (an) cxNewDraft({ bloc: an.bloc, debut: an.debut, fin: an.fin }, id, an.texte); return; }
    });
  }

  // ================= ACTIONS =================
  root.addEventListener("click", function (e) {
    var v = e.target.closest("[data-view]");
    if (v && root.contains(v) && S.dash) { setView(v.getAttribute("data-view")); return; }
    var a = e.target.closest("[data-act]");
    if (!a || !root.contains(a)) return;
    var act = a.getAttribute("data-act"), id = +a.getAttribute("data-id");
    if (S.voir && /^(upload|pick|del-doc|doc-new|ep-new|ep-create|ep-del)$/.test(act)) { toast("Aperçu admin : lecture seule", true); return; }
    if (act === "voir") { voirComme(id); return; }
    if (act === "close-drawer") root.classList.remove("is-drawer");
    else if (act === "side-close") { if (root.classList.contains("is-compact")) root.classList.remove("is-drawer"); else setSide(false); }
    else if (act === "side-open") { if (root.classList.contains("is-compact")) root.classList.add("is-drawer"); else setSide(true); }
    else if (act === "pop-close") { if (e.target === a || a.tagName === "BUTTON") popClose(); }
    else if (act === "cx-open") cxOpen(id);
    else if (act === "ep-new") popEpreuve();
    else if (act === "ep-type") { var tf = epForm(), tt = a.getAttribute("data-t"); tf.type = tt; tf.duree = EP_TYPES.filter(function (x) { return x[0] === tt; })[0][2]; popEpreuve(); }
    else if (act === "ep-dispo") { epForm().dispo = +a.getAttribute("data-h"); popEpreuve(); }
    else if (act === "ep-pdf") el("ep-file").click();
    else if (act === "ep-pdf-x") { epForm().file = null; popEpreuve(); }
    else if (act === "ep-create") epCreate();
    else if (act === "ep-sujet") openPdf(qs("/professeurs/epreuves/" + id + "/sujet"));
    else if (act === "ep-del") {
      if (!confirm("Supprimer cette épreuve ? Les copies déjà rendues restent dans « Copies ».")) return;
      api("DELETE", "/professeurs/epreuves/" + id).then(function () { S.eps.items = S.eps.items.filter(function (x) { return x.id !== id; }); renderNav(); viewEpreuves(); toast("Épreuve supprimée"); }).catch(function (x) { toast(x.message, true); });
    }
    else if (act === "doc-new") popDocument(id || null);
    else if (act === "pick") el("file").click();
    else if (act === "upload") docUpload(a);
    else if (act === "open-doc") openDoc(id);
    else if (act === "del-doc") delDoc(a, id);
    else if (act === "refresh") (S.earnDetail = {}, loadDash()).then(renderApp).then(function () { toast("À jour"); }).catch(function (x) { toast(x.message, true); });
    else if (act === "logout") { S.token = null; S.dash = null; S.voir = null; S.admin = false; S.profs = null; store(CONFIG.TOKEN_KEY, null); store(VOIR_KEY, null); renderApercu(); viewLoggedOut(); }
    else if (act === "signup") go(CONFIG.SIGNUP_URL);
    else if (act === "login") login(a);
    else if (act === "google") google();
    else if (act === "earn-month") { var cm = a.getAttribute("data-m"); S.earnMonth = S.earnMonth === cm ? null : cm; S.earnOpen = null; rerenderEarnings(); }
    else if (act === "earn-seance") { var sk = a.getAttribute("data-k"); S.earnOpen = S.earnOpen === sk ? null : sk; rerenderEarnings(); }
    else if (act === "dv-filter") { S.dvFilter = a.getAttribute("data-f"); viewCopies(); }
  });
  root.addEventListener("input", function (e) {
    var ek = e.target.getAttribute && e.target.getAttribute("data-ep");
    if (ek && S.epf) {
      S.epf[ek] = ek === "duree" ? (+e.target.value || 0) : ek === "classe" ? +e.target.value : e.target.value;
      if (ek === "ouvre" || ek === "duree") { var r0 = el("ep-resume"); if (r0) r0.textContent = epResume(S.epf); }
    }
  });
  root.addEventListener("change", function (e) {
    var ek2 = e.target.getAttribute && e.target.getAttribute("data-ep");
    if (ek2 === "classe" && S.epf) { S.epf.classe = +e.target.value; return; }
    if (e.target.getAttribute("data-el") === "ep-file" && e.target.files[0]) {
      var pf = e.target.files[0]; e.target.value = "";
      if (!/\.pdf$/i.test(pf.name)) return toast("Sujet en PDF uniquement.", true);
      epForm().file = pf; return popEpreuve();
    }
    if (e.target.getAttribute("data-el") === "voir") { voirComme(+e.target.value || null); return; }
    if (e.target.getAttribute("data-el") === "file" && e.target.files[0]) { pickFile(e.target.files[0]); e.target.value = ""; }
    if (e.target.id === "u-classe") S.uploadClass = +e.target.value;
  });
  root.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && (e.target.id === "l-email" || e.target.id === "l-pass")) login($('[data-act="login"]'));
  });
  document.addEventListener("keydown", function (e) {
    if (e.key !== "Escape") return;
    if (CX.node) { if (CX.draft) return cxDraftClose(); if (CX.mark || cxQ('[data-cx-el="tool"]').classList.contains("is-on")) return cxHideTool(); return; }
    root.classList.remove("is-drawer"); popClose();
  });
  document.addEventListener("selectionchange", function () { if (CX.node && !CX.draft) { clearTimeout(CX.selT); CX.selT = setTimeout(cxUpdateTool, 120); } });
  window.addEventListener("beforeunload", function (e) { if (CX.node && Object.keys(CX.pending).length) { cxFlush(); e.preventDefault(); e.returnValue = ""; } });

  // ================= DÉMARRAGE =================
  function loadDash() {
    return Promise.all([
      api("GET", "/professeurs/me/dashboard"),
      api("GET", "/professeurs/me/devoirs").catch(function () { return { items: [] }; }),
      api("GET", "/professeurs/epreuves").catch(function () { return { items: [], types: [] }; })
    ]).then(function (r) { S.dash = r[0]; S.devoirs = r[1].items || []; S.eps = r[2]; });
  }
  function route() {
    var s = S.me.status;
    renderApercu();
    if (S.admin && !S.voir && s !== "active") return viewPickProf();
    if (s === "none") return viewNotProf(false);
    if (s !== "active") return viewNotProf(true);
    root.classList.remove("is-solo");
    el("page").innerHTML = '<div class="nv-page-inner"><div class="nv-cards"><div class="nv-skel" style="height:124px"></div><div class="nv-skel" style="height:124px"></div><div class="nv-skel" style="height:124px"></div></div><div class="nv-skel"></div></div>';
    return loadDash().then(renderApp).catch(function (x) { setPage(empty("Espace indisponible", esc(x.message)), true); });
  }
  function boot() {
    if (!S.token) { viewLoggedOut(); return; }
    setPage('<div class="nv-skel" style="margin-top:20px"></div><div class="nv-skel"></div>', true);
    api("GET", "/professeurs/me")
      .then(function (m) {
        S.me = m; S.admin = !!m.admin;
        if (S.voir && !m.apercu) { S.voir = null; store(VOIR_KEY, null); }   // pas admin, ou professeur retiré
        return S.admin ? chargerProfs() : null;
      })
      .then(route)
      .catch(function (x) { if (x.status === 401) { S.token = null; store(CONFIG.TOKEN_KEY, null); viewLoggedOut(); } else setPage(empty("Erreur", esc(x.message)), true); });
  }
  S.token = load(CONFIG.TOKEN_KEY);
  S.voir = +load(VOIR_KEY) || null;
  boot();
})();
</script>
