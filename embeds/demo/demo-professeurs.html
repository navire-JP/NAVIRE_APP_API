  NAVIRE — Embed page /professeurs (espace des chargés de TD Prép'AdJuris)
  =========================================================================
  Même DA et même structure que l'embed ambassadeur :
    - s'adapte à la largeur de SON conteneur : >= 760px barre latérale,
      < 760px menu tiroir ;
    - prend toute la hauteur de l'écran sous sa position, seule la page
      ouverte défile.

  Selon GET /professeurs/me :
    - non connecté          → présentation + connexion (email ou Google)
    - compte non rattaché   → message (l'admin attache le compte dans la console)
    - professeur suspendu   → message
    - professeur actif      → application : vue d'ensemble, mes groupes
                              (Discord, liens), étudiants, documents (dépôt
                              PDF), devoirs (copies rendues par les étudiants
                              dans NAVIRE Lib : commentaire, note, copie
                              corrigée), rémunération (prévisionnel)

  Un document déposé est publié pour les étudiants du groupe (espace
  Prép'AdJuris et NAVIRE Lib, section Prép'AdJuris).

  DA de NAVIRE Lib, de l'accueil et du profil : bleu et blanc, sans traits,
  barre latérale masquable (retenue d'une visite à l'autre).

  À corriger : les copies rendues depuis l'onglet Prépa (.docx ou .pdf,
  mises en forme par NAVIRE). « Corriger » ouvre le mode correction : tout
  l'écran passe en blanc, texte en noir ; on sélectionne un passage pour le
  commenter, le surligner, le barrer, le remplacer ou insérer un ajout. Tout
  s'enregistre au fil de l'eau ; l'étudiant voit révisions et commentaires
  (et les retrouve dans ses exports .docx / .pdf) quand on rend la correction,
  avec la note et l'appréciation générale.
    GET  /professeurs/devoirs/{id}/copie
    POST /professeurs/devoirs/{id}/annotations, PATCH|DELETE /professeurs/annotations/{id}
    GET  /professeurs/devoirs/{id}/export?format=docx|pdf

  Épreuves : planifier un contrôle pour un groupe (type, sujet texte ou PDF,
  durée, ouverture, disponibilité), voir qui l'a commencé et rendu.
    GET|POST /professeurs/epreuves, PATCH|DELETE /professeurs/epreuves/{id}

  Réglages : bloc CONFIG du script.
-->

/* Accueil (non connecté, candidature, attente) */
#nv-prof .nv-hero { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 18px 10px 6px; gap: 6px; }
#nv-prof .nv-hero-logo { width: 64px; height: 64px; border-radius: 15px; background: center/contain no-repeat; margin-bottom: 14px; box-shadow: 0 20px 60px rgba(120,150,255,0.18); animation: nv-float 6s ease-in-out infinite; }
#nv-prof .nv-hero h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -.6px; line-height: 1.2; }
#nv-prof .nv-hero p { margin: 0; font-size: 13.5px; color: var(--text-3); max-width: 460px; line-height: 1.55; }
#nv-prof .nv-grad { background: linear-gradient(90deg, #fff, var(--blue)); -webkit-background-clip: text; background-clip: text; color: transparent; }
#nv-prof .nv-steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; margin: 24px 0 8px; }
#nv-prof .nv-step { text-align: left; padding: 14px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--panel); animation: nv-rise .5s var(--ease) both; }
#nv-prof .nv-step:nth-child(2) { animation-delay: .05s; }
#nv-prof .nv-step:nth-child(3) { animation-delay: .1s; }
#nv-prof .nv-step i { font-style: normal; font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 600; color: var(--text-4); }
#nv-prof .nv-step b { display: block; font-size: 13px; font-weight: 600; margin: 4px 0 3px; }
#nv-prof .nv-step span { font-size: 12px; color: var(--text-3); line-height: 1.5; }

/* Cartes */
#nv-prof .nv-card { padding: 16px; border-radius: 16px; background: var(--panel); border: 1px solid var(--line); margin-bottom: 12px; animation: nv-rise .4s var(--ease) both; }
#nv-prof .nv-card.is-on { border-color: rgba(255,255,255,0.14); background: var(--panel-2); }
#nv-prof .nv-card-title { font-size: 14px; font-weight: 700; margin: 0 0 4px; }
#nv-prof .nv-card-sub { font-size: 12px; color: var(--text-3); margin: 0 0 12px; line-height: 1.5; }
#nv-prof .nv-group-label { font-size: 10.5px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: var(--text-4); margin: 22px 4px 8px; }
#nv-prof .nv-notice { padding: 12px 14px; border-radius: 12px; background: rgba(255,209,102,0.08); border: 1px solid rgba(255,209,102,0.2); font-size: 12.5px; color: #ffe2a3; margin: 12px 0; line-height: 1.5; }
#nv-prof .nv-notice.is-bad { background: rgba(255,107,107,0.08); border-color: rgba(255,107,107,0.2); color: #ffb3b3; }

/* Statistiques */
#nv-prof .nv-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px; }
#nv-prof .nv-stat { padding: 14px; border-radius: var(--radius); background: var(--panel); border: 1px solid var(--line); animation: nv-rise .4s var(--ease) both; min-width: 0; }
#nv-prof .nv-stat:nth-child(2) { animation-delay: .04s; }
#nv-prof .nv-stat:nth-child(3) { animation-delay: .08s; }
#nv-prof .nv-stat:nth-child(4) { animation-delay: .12s; }
#nv-prof .nv-stat small { display: block; font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 600; letter-spacing: .6px; text-transform: uppercase; color: var(--text-4); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#nv-prof .nv-stat b { display: block; font-size: 22px; font-weight: 700; letter-spacing: -.5px; margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
#nv-prof .nv-stat.is-ok b { color: var(--ok); }

/* Lien */
#nv-prof .nv-link { display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 14px; border-radius: 99px; background: rgba(0,0,0,0.25); border: 1px solid var(--line); }
#nv-prof .nv-link code { flex: 1; min-width: 0; font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#nv-prof .nv-share { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }

/* Boutons */
#nv-prof .nv-btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 38px; padding: 0 18px; border-radius: 99px; border: none; background: #fff; color: #0a0a12; font-size: 13px; font-weight: 600; cursor: pointer; text-decoration: none; white-space: nowrap; transition: transform .15s, background .2s; }
#nv-prof .nv-btn:hover:not(:disabled) { transform: translateY(-1px); }
#nv-prof .nv-btn:disabled { background: var(--panel-3); color: var(--text-4); cursor: default; transform: none; }
#nv-prof .nv-btn svg { width: 15px; height: 15px; }
#nv-prof .nv-btn.is-block { width: 100%; height: 42px; }
#nv-prof .nv-chip { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 99px; border: 1px solid var(--line); background: transparent; font-size: 12px; color: var(--text-2); cursor: pointer; text-decoration: none; white-space: nowrap; transition: background .15s, color .15s; }
#nv-prof .nv-chip:hover { background: var(--panel-2); color: #fff; }
#nv-prof .nv-chip svg { width: 14px; height: 14px; }
#nv-prof .nv-link-btn { background: none; border: none; color: var(--text-2); font-size: 12.5px; cursor: pointer; padding: 4px 6px; border-radius: 6px; text-decoration: underline; text-underline-offset: 3px; }
#nv-prof .nv-link-btn:hover { color: #fff; }

/* Formulaires */
#nv-prof .nv-field { display: block; margin-top: 12px; }
#nv-prof .nv-field > span { display: block; font-size: 12px; font-weight: 500; color: var(--text-3); margin-bottom: 6px; }
#nv-prof .nv-field em { font-style: normal; color: var(--text-4); }
#nv-prof .nv-input { width: 100%; height: 42px; padding: 0 14px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); color: #fff; font: inherit; font-size: 13.5px; outline: none; transition: border-color .15s, background .15s; }
#nv-prof textarea.nv-input { height: auto; min-height: 92px; padding: 11px 14px; line-height: 1.55; resize: vertical; }
#nv-prof select.nv-input option { background: #111118; color: #fff; }
#nv-prof .nv-input::placeholder { color: var(--text-4); }
#nv-prof .nv-input:focus { border-color: rgba(255,255,255,0.22); background: var(--panel-2); }
#nv-prof .nv-row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
#nv-prof .nv-err { color: var(--danger); font-size: 12.5px; margin-top: 10px; min-height: 1em; }
#nv-prof .nv-sep { display: flex; align-items: center; gap: 10px; color: var(--text-4); font-size: 11.5px; margin: 14px 0; }
#nv-prof .nv-sep::before, #nv-prof .nv-sep::after { content: ''; flex: 1; height: 1px; background: var(--line); }

/* Case à cocher (comme NAVIRE AI) */
#nv-prof .nv-check-row { display: flex; align-items: flex-start; gap: 12px; padding: 10px 6px; border-radius: 9px; cursor: pointer; font-size: 13px; color: var(--text-2); line-height: 1.5; transition: background .15s; }
#nv-prof .nv-check-row:hover { background: var(--panel); }
#nv-prof .nv-check { width: 18px; height: 18px; border-radius: 6px; border: 1.5px solid rgba(255,255,255,0.3); display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px; transition: background .15s, border-color .15s; }
#nv-prof .nv-check svg { width: 12px; height: 12px; color: #0a0a12; opacity: 0; transform: scale(.5); transition: opacity .15s, transform .2s var(--ease); }
#nv-prof .nv-check-row.is-on .nv-check { background: #fff; border-color: #fff; }
#nv-prof .nv-check-row.is-on .nv-check svg { opacity: 1; transform: none; }

#nv-prof .nv-terms { margin: 0; padding: 0 0 0 20px; font-size: 13px; line-height: 1.65; color: var(--text-2); }
#nv-prof .nv-terms li { margin-bottom: 6px; }
#nv-prof .nv-terms li::marker { color: var(--text-4); }

/* Lignes (filleuls) */
#nv-prof .nv-search { display: flex; align-items: center; gap: 10px; padding: 0 14px; height: 42px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); margin-bottom: 14px; }
#nv-prof .nv-search svg { width: 16px; height: 16px; color: var(--text-3); }
#nv-prof .nv-search input { flex: 1; background: none; border: none; outline: none; color: #fff; font: inherit; font-size: 13.5px; }
#nv-prof .nv-search input::placeholder { color: var(--text-4); }
#nv-prof .nv-filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
#nv-prof .nv-filters .nv-chip.is-active { background: var(--panel-3); color: #fff; border-color: rgba(255,255,255,0.14); }
#nv-prof .nv-row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 12px; background: var(--panel); border: 1px solid transparent; margin-bottom: 6px; animation: nv-rise .35s var(--ease) both; }
#nv-prof .nv-row-ico { width: 36px; height: 36px; border-radius: 10px; background: var(--panel-2); display: flex; align-items: center; justify-content: center; color: var(--text-2); flex-shrink: 0; font-weight: 700; font-size: 13px; }
#nv-prof .nv-row-body { flex: 1; min-width: 0; }
#nv-prof .nv-row-title { font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#nv-prof .nv-row-meta { font-size: 11.5px; color: var(--text-3); margin-top: 3px; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
#nv-prof .nv-row-amount { font-size: 14px; font-weight: 700; flex-shrink: 0; }
#nv-prof .nv-tag { display: inline-flex; align-items: center; gap: 5px; font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 600; padding: 2px 7px; border-radius: 99px; background: var(--panel-2); color: var(--text-2); white-space: nowrap; }
#nv-prof .nv-tag i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
#nv-prof .nv-tag.ok { color: var(--ok); background: rgba(91,227,163,0.1); }
#nv-prof .nv-tag.warn { color: var(--warn); background: rgba(255,209,102,0.1); }
#nv-prof .nv-tag.bad { color: var(--danger); background: rgba(255,107,107,0.1); }
#nv-prof .nv-empty { text-align: center; padding: 34px 20px; font-size: 13px; color: var(--text-3); line-height: 1.6; }
#nv-prof .nv-empty b { display: block; color: var(--text-2); font-size: 14px; margin-bottom: 4px; }
#nv-prof .nv-skel { height: 62px; border-radius: 12px; margin-bottom: 6px; background: linear-gradient(90deg, var(--panel) 0%, var(--panel-2) 50%, var(--panel) 100%); background-size: 200% 100%; animation: nv-shimmer 1.4s linear infinite; }

/* Simulateur */
#nv-prof .nv-range { width: 100%; accent-color: #fff; margin: 6px 0 2px; }
#nv-prof .nv-sim-total { display: flex; align-items: baseline; justify-content: space-between; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
#nv-prof .nv-sim-total b { font-size: 30px; font-weight: 800; letter-spacing: -.8px; }

/* Toasts */
#nv-prof .nv-toasts { position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%); display: flex; flex-direction: column; gap: 6px; align-items: center; z-index: 50; pointer-events: none; }
#nv-prof .nv-toast { padding: 9px 14px; border-radius: 11px; background: rgba(30,30,44,0.95); border: 1px solid rgba(255,255,255,0.1); font-size: 12.5px; box-shadow: 0 10px 30px rgba(0,0,0,0.35); animation: nv-toast 2.6s var(--ease) both; white-space: nowrap; }
#nv-prof .nv-toast.is-error { color: #ffb3b3; }
@keyframes nv-toast { 0% { opacity: 0; transform: translateY(8px); } 10%, 85% { opacity: 1; transform: none; } 100% { opacity: 0; transform: translateY(-4px); } }

/* ================= COMPACT (téléphone / embed étroit) ================= */
#nv-prof.is-compact .nv-side {
  position: absolute; top: 0; bottom: 0; left: 0; overflow-y: auto;
  visibility: hidden; transition: transform .32s var(--ease), visibility 0s .32s;
  z-index: 1001; width: min(300px, 86%); transform: translateX(-102%);
  background: #0c0c14; box-shadow: 20px 0 60px rgba(0,0,0,0.4);
}
#nv-prof.is-compact.is-drawer .nv-side { transform: none; visibility: visible; transition: transform .32s var(--ease); }
#nv-prof.is-compact .nv-scrim { z-index: 1000; }
#nv-prof.is-compact.is-drawer .nv-scrim { opacity: 1; pointer-events: auto; }
#nv-prof.is-compact .nv-side-close, #nv-prof.is-compact .nv-menu-btn { display: inline-flex; }
#nv-prof.is-compact .nv-topbar { padding: 8px; border-bottom: 1px solid var(--line); min-height: 58px; }
#nv-prof.is-compact .nv-topbar-title { text-align: center; font-size: 15px; }
#nv-prof.is-compact .nv-page-inner { padding-left: 14px; padding-right: 14px; }
#nv-prof.is-compact .nv-stats { grid-template-columns: 1fr 1fr; }
#nv-prof.is-compact .nv-steps { grid-template-columns: 1fr; }
#nv-prof.is-compact .nv-row2 { grid-template-columns: 1fr; }
#nv-prof.is-compact .nv-hero h1 { font-size: 22px; }
#nv-prof.is-compact .nv-icon-btn { width: 42px; height: 42px; border-radius: 12px; }
#nv-prof.is-compact .nv-icon-btn svg { width: 22px; height: 22px; }
#nv-prof.is-compact .nv-nav { padding: 12px; font-size: 15px; gap: 12px; }
#nv-prof.is-compact .nv-nav svg { width: 21px; height: 21px; }
#nv-prof.is-compact .nv-input { font-size: 16px; } /* 16px : évite le zoom auto d'iOS */
#nv-prof.is-compact .nv-btn { height: 42px; }
#nv-prof.is-compact .nv-chip { height: 38px; padding: 0 14px; }
#nv-prof.is-compact .nv-check { width: 22px; height: 22px; }

@media (prefers-reduced-motion: reduce) {
  #nv-prof *, #nv-prof *::before, #nv-prof *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}

/* ================= PROFESSEURS ================= */
#nv-prof .nv-grade { display: inline-flex; align-items: center; gap: 6px; margin-top: 4px; font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 600; letter-spacing: .6px; padding: 3px 8px; border-radius: 99px; background: rgba(122,167,255,0.12); color: var(--blue); }
#nv-prof .nv-class-head { display: flex; align-items: flex-start; gap: 12px; }
#nv-prof .nv-class-head > div { flex: 1; min-width: 0; }
#nv-prof .nv-class-meta { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 0; }
#nv-prof .nv-discord { display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 16px; border-radius: 99px; border: none; background: #5865F2; color: #fff; font-size: 13px; font-weight: 600; cursor: pointer; text-decoration: none; white-space: nowrap; transition: transform .15s, filter .15s; }
#nv-prof .nv-discord:hover { transform: translateY(-1px); filter: brightness(1.08); }
#nv-prof .nv-discord svg { width: 16px; height: 16px; }
#nv-prof .nv-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
#nv-prof .nv-drop { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 22px 14px; border-radius: 14px; border: 1.5px dashed rgba(255,255,255,0.16); background: rgba(0,0,0,0.15); text-align: center; cursor: pointer; font-size: 12.5px; color: var(--text-3); transition: border-color .15s, background .15s; }
#nv-prof .nv-drop:hover, #nv-prof .nv-drop.is-over { border-color: rgba(255,255,255,0.35); background: var(--panel); }
#nv-prof .nv-drop b { color: var(--text); font-size: 13.5px; }
#nv-prof .nv-drop svg { width: 22px; height: 22px; color: var(--text-2); }
#nv-prof .nv-month { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 12px; background: var(--panel); margin-bottom: 6px; }
#nv-prof .nv-month-name { width: 130px; flex-shrink: 0; white-space: nowrap; font-size: 13px; font-weight: 600; text-transform: capitalize; }
#nv-prof .nv-month-bar { flex: 1; height: 6px; border-radius: 9px; background: var(--panel-2); overflow: hidden; }
#nv-prof .nv-month-bar i { display: block; height: 100%; border-radius: 9px; background: var(--blue); }
#nv-prof .nv-month.is-past .nv-month-bar i { background: var(--ok); }
#nv-prof .nv-month-amount { width: 112px; text-align: right; font-size: 13.5px; font-weight: 700; flex-shrink: 0; white-space: nowrap; font-variant-numeric: tabular-nums; }
#nv-prof .nv-month.is-current { box-shadow: inset 0 0 0 1px rgba(255,255,255,0.14); }
/* Solde prévisionnel du mois en cours */
#nv-prof .nv-solde { padding: 18px; border-radius: var(--radius); background: var(--panel); border: 1px solid var(--line); margin-bottom: 12px; animation: nv-rise .4s var(--ease) both; }
#nv-prof .nv-solde-top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
#nv-prof .nv-solde small { display: block; font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 600; letter-spacing: .6px; text-transform: uppercase; color: var(--text-4); }
#nv-prof .nv-solde-amount { display: block; font-size: 30px; font-weight: 800; letter-spacing: -.8px; margin-top: 6px; white-space: nowrap; font-variant-numeric: tabular-nums; }
#nv-prof .nv-solde-bar { height: 6px; border-radius: 9px; background: var(--panel-2); overflow: hidden; margin: 14px 0 12px; }
#nv-prof .nv-solde-bar i { display: block; height: 100%; border-radius: 9px; background: var(--ok); transition: width .4s var(--ease); }
#nv-prof .nv-solde-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
#nv-prof .nv-solde-grid div { min-width: 0; }
#nv-prof .nv-solde-grid small { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#nv-prof .nv-solde-grid b { display: block; font-size: 15px; font-weight: 700; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
#nv-prof .nv-solde-grid b.is-ok { color: var(--ok); }
#nv-prof.is-compact .nv-solde-amount { font-size: 26px; }
/* Détail du mois : séances, élèves, extras */
#nv-prof button.nv-month { width: 100%; border: 0; color: inherit; font: inherit; text-align: left; cursor: pointer; transition: background .15s; }
#nv-prof button.nv-month:hover { background: var(--panel-2); }
#nv-prof .nv-month.is-selected { box-shadow: inset 0 0 0 1px rgba(255,255,255,0.32); }
#nv-prof .nv-seance { border-top: 1px solid var(--line); }
#nv-prof .nv-seance:first-of-type { border-top: 0; }
#nv-prof .nv-seance-row { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 2px; border: 0; background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; }
#nv-prof .nv-seance-date { width: 128px; flex-shrink: 0; font-size: 13px; font-weight: 600; white-space: nowrap; }
#nv-prof .nv-seance-date em { display: block; font-style: normal; font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 400; color: var(--text-4); text-transform: none; margin-top: 2px; }
#nv-prof .nv-seance-tags { flex: 1; display: flex; flex-wrap: wrap; gap: 4px; min-width: 0; }
#nv-prof .nv-seance-amount { width: 104px; flex-shrink: 0; text-align: right; font-size: 13.5px; font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
#nv-prof .nv-seance-row .nv-chev { width: 14px; flex-shrink: 0; color: var(--text-4); transition: transform .2s; }
#nv-prof .nv-seance.is-open .nv-chev { transform: rotate(90deg); }
#nv-prof .nv-seance-body { padding: 2px 2px 14px; font-size: 12.5px; color: var(--text-2); }
#nv-prof .nv-calc { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 10px 12px; border-radius: 10px; background: rgba(0,0,0,0.18); font-variant-numeric: tabular-nums; margin-bottom: 10px; }
#nv-prof .nv-calc span:nth-child(even) { text-align: right; white-space: nowrap; font-weight: 600; color: var(--text); }
#nv-prof .nv-calc .is-total { border-top: 1px solid var(--line); padding-top: 6px; font-weight: 700; color: var(--text); }
#nv-prof .nv-eleves { display: flex; flex-wrap: wrap; gap: 5px; margin: 6px 0 10px; }
#nv-prof .nv-eleve { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 99px; background: var(--panel-2); font-size: 12px; color: var(--text); }
#nv-prof .nv-eleve.is-out { opacity: .45; text-decoration: line-through; }
#nv-prof .nv-sublabel { font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 600; letter-spacing: .6px; text-transform: uppercase; color: var(--text-4); margin-top: 4px; }
#nv-prof.is-compact .nv-seance-date { width: 96px; }
#nv-prof.is-still .nv-stat, #nv-prof.is-still .nv-card, #nv-prof.is-still .nv-solde { animation: none; }
#nv-prof.is-compact .nv-seance-amount { width: 84px; }
#nv-prof .nv-month .nv-tag { width: 78px; justify-content: center; flex-shrink: 0; }
#nv-prof .nv-month small { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--text-4); width: 78px; flex-shrink: 0; white-space: nowrap; }
#nv-prof .nv-icon-mini { width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; border-radius: 9px; border: 1px solid var(--line); background: transparent; color: var(--text-3); cursor: pointer; flex-shrink: 0; transition: background .15s, color .15s; padding: 0; }
#nv-prof .nv-icon-mini:hover { background: var(--panel-2); color: #fff; }
#nv-prof .nv-icon-mini.is-bad:hover { color: var(--danger); }
#nv-prof .nv-icon-mini svg { width: 15px; height: 15px; }
#nv-prof .nv-row-ico svg { width: 17px; height: 17px; }
#nv-prof.is-compact .nv-month small { display: none; }
#nv-prof.is-compact .nv-month-name { width: auto; flex: 1; }
#nv-prof.is-compact .nv-month-bar { display: none; }
#nv-prof.is-compact .nv-class-head { flex-direction: column; }

/* Devoirs */

  };

  // ================= DÉFILEMENT : la page du site défile, pas l'embed =================
  // L'embed prend la hauteur de son contenu ; la page du site défile. La barre
  // latérale, la barre du haut et les fenêtres suivent la partie visible de
  // l'embed, calée sur la hauteur de l'écran (variables --vis-top, --vis-h).
  // Repli « is-boxed » (iframe d'une autre origine, la page du site est
  // inaccessible) : hauteur de l'écran, le contenu défile dans l'embed.
  var FRAMED = window.self !== window.top, HOST = null, frameEl = null, wrappers = [];
  if (FRAMED) {

    hideBar.textContent = "html,body{margin:0;scrollbar-width:none;overflow:hidden}html::-webkit-scrollbar,body::-webkit-scrollbar{display:none;width:0;height:0}";
    document.head.appendChild(hideBar);
    try { if (window.frameElement && window.parent.document) { HOST = window.parent; frameEl = window.frameElement; } } catch (e) {}
    if (frameEl) for (var n = frameEl.parentElement, i = 0; n && i < 4 && n !== HOST.document.body; i++, n = n.parentElement) wrappers.push(n);

  var BOXED = FRAMED && !HOST;
  root.classList.add(BOXED ? "is-boxed" : "is-flow");
  var FLOW = (function () {
    var subs = [], ticking = false;
    function win() { return HOST || window; }
    function vh() { return win().innerHeight || 800; }
    function page() { return el("page"); }
    // Haut de l'embed dans la fenêtre du site.
    function rootTop() { return (frameEl ? frameEl.getBoundingClientRect().top : 0) + root.getBoundingClientRect().top; }
    function barH() { var b = root.querySelector(".nv-topbar"); return b && b.offsetParent ? b.offsetHeight : 0; }
    var F = {
      boxed: BOXED,
      // Défilement lu depuis le haut de l'embed.
      y: function () { return BOXED ? page().scrollTop : Math.max(0, -rootTop()); },
      to: function (y, smooth) {
        y = Math.max(0, y || 0);

      },
      toEl: function (node, off, smooth) { if (node) F.to(F.elY(node) - (off == null ? 16 : off) - (BOXED ? 0 : barH()), smooth); },
      // Changement de vue : on remonte en haut de l'embed s'il est dépassé.
      top: function () { if (BOXED) page().scrollTop = 0; else if (rootTop() < 0) F.to(0); },
      // Part lue (0 à 1) de la vue.

      layout: function () {

        root.style.setProperty("--vis-h", Math.round(visH) + "px");

        if (BOXED) {

          try { window.parent.postMessage({ type: "NAVIRE_EMBED_HEIGHT", height: hb }, "*"); } catch (e) {}

          return;
        }

        root.style.height = "auto";
        root.style.minHeight = Math.max(560, Math.round(vh() - top - 12)) + "px";
        var h = root.offsetHeight;

        }
        F.layout();
      }
    };

      ticking = true;

    }

        '<div class="nv-row-meta">Du ' + esc(o.toLocaleString("fr-FR", { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" })) + ' au ' + esc(fe.toLocaleString("fr-FR", { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" })) + (x.sujet_pdf ? ' · sujet PDF' : '') + '</div></div>' +

  function epResume(f) {

    return "Ouverte du " + o.toLocaleString("fr-FR", { weekday: "long", day: "numeric", month: "long", hour: "2-digit", minute: "2-digit" }) +
      " au " + fe.toLocaleString("fr-FR", { weekday: "long", day: "numeric", month: "long", hour: "2-digit", minute: "2-digit" }) + ". Chaque étudiant a " + epDuree(f.duree) + " une fois lancée.";
  }
  function epCreate(b) {
    var f = S.epf, e2 = el("ep-err");
    if (!f.sujet.trim() && !f.file) { if (e2) e2.textContent = "Donne un sujet (texte ou PDF)."; return; }
    if (!f.classe) { if (e2) e2.textContent = "Aucun groupe."; return; }
    var o = new Date(f.ouvre); if (isNaN(o.getTime())) { if (e2) e2.textContent = "Date d'ouverture invalide."; return; }
    var fd = new FormData();

    fd.append("duree_minutes", f.duree); fd.append("ouvre_le", o.toISOString()); fd.append("persistance_heures", f.dispo);
    if (f.file) fd.append("file", f.file);
    f.busy = true; viewEpreuves();
    fetch(CONFIG.API + "/professeurs/epreuves", { method: "POST", headers: { Authorization: "Bearer " + S.token }, body: fd })
      .then(handle).then(function (x) {
        S.eps.items = [x].concat(S.eps.items || []); S.epf = null; renderCounts(); viewEpreuves(); toast("Épreuve planifiée");
      }).catch(function (x) { f.busy = false; viewEpreuves(); var e3 = el("ep-err"); if (e3) e3.textContent = x.message; });
  }

  function dvFind(id) { return S.devoirs.filter(function (x) { return x.id === id; })[0]; }

  function dvSave(b, id, statut) {
    var dr = S.dvDraft[id] || {}, x = dvFind(id), body = {};

      body.commentaire = dr.commentaire != null ? dr.commentaire : x.commentaire;
      body.note = dr.note != null ? dr.note : x.note;
      if (!String(body.commentaire || "").trim() && !String(body.note || "").trim() && !x.correction) return toast("Ajoute un commentaire, une note ou une copie corrigée.", true);
      body.statut = "corrige";
    }
    b.disabled = true;
    api("PATCH", "/professeurs/devoirs/" + id, body)
      .then(function (row) { dvReplace(row); toast(statut === "depose" ? "Copie remise à corriger" : "Correction envoyée à l'étudiant"); })
      .catch(function (err2) { b.disabled = false; toast(err2.message, true); });
  }
  function dvUploadCorrection(f) {
    var id = S.dvTarget;

  // Solde prévisionnel du mois en cours : déjà gagné + séances restantes du mois.
  function soldeMois(t) {
    var m = t.mois_en_cours;
    if (!m) return '';
    var reste = m.seances - m.seances_passees;
    var pct = m.montant_cents ? Math.min(100, Math.round(m.realise_cents / m.montant_cents * 100)) : 0;
    return '<div class="nv-solde"><div class="nv-solde-top"><div><small>Solde prévisionnel · ' + esc(mois(m.mois)) + '</small>' +
      '<span class="nv-solde-amount">' + eur(m.montant_cents) + '</span></div>' +
      '<span class="nv-tag"><i></i>' + m.seances_passees + '/' + m.seances + ' séance' + (m.seances > 1 ? 's' : '') + '</span></div>' +
      '<div class="nv-solde-bar"><i style="width:' + pct + '%"></i></div>' +
      '<div class="nv-solde-grid">' +
      '<div><small>Déjà gagné</small><b class="is-ok">' + eur(m.realise_cents) + '</b></div>' +
      '<div><small>Reste ce mois</small><b>' + eur(m.a_venir_cents) + '</b></div>' +
      '<div><small>' + (m.extras ? 'Dont extras' : 'Séances à faire') + '</small><b>' + (m.extras ? eur(m.extras_cents) : reste) + '</b></div>' +
      '</div></div>';
  }

  // ----- Détail d'un mois : séance par séance, au centime près -----

      jour: d.toLocaleDateString("fr-FR", { weekday: "short", day: "numeric", month: "short" }).replace(/^./, function (c) { return c.toUpperCase(); }),
      heure: d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" })
    };

      .then(function () { if (S.view === "earnings" && S.earnMonth === cle) rerenderEarnings(); });
  }
  function seanceHtml(g, s, i) {

    h += '<div class="nv-seance-body"><div class="nv-calc">';
    if (s.reparti && !aBareme) {
      h += '<span>Montant fixé par NAVIRE, ' + (g.totaux.repartition === "par_eleve" ? 'réparti selon les ' + s.nb_eleves + ' élève' + (s.nb_eleves > 1 ? 's' : '') + ' de la séance' : 'réparti entre les séances') + '</span><span></span>' +
        '<span class="is-total">Ta part</span><span class="is-total">' + eur(s.part_prof_cents) + '</span></div>';
    } else {

        '<span>' + s.nb_eleves + ' élève' + (s.nb_eleves > 1 ? 's' : '') + ' × ' + eur(b.remu_etudiant_cents) + '</span><span>' + eur(s.part_prof_eleves_cents) + '</span>';
    }
    if (x) h += '<span>Extra : ' + x.nb_factures + ' élève' + (x.nb_factures > 1 ? 's' : '') + ' resté' + (x.nb_factures > 1 ? 's' : '') + ' × ' + eur(b.remu_extra_etudiant_cents) + '</span><span>' + eur(x.part_prof_cents) + '</span>';
    if (s.reparti) {

    }

  function detailMois(cle) {

    if (!r || r === "loading") return h + '<div class="nv-skel"></div>';

    r.groupes.forEach(function (g) {

      h += '<div class="nv-card"><div class="nv-card-title">' + esc(g.classe) + '</div>' +

      g.seances.forEach(function (s, i) { h += seanceHtml(g, s, i); });

  // Re-rendu sur place (clic, détail chargé) : sans animation, à la même position.

  // ----- Rémunération -----
  function viewEarnings() {
    var d = S.dash, t = d.totaux;
    var now = new Date(), cur = now.getFullYear() + "-" + String(now.getMonth() + 1).padStart(2, "0");
    if (!S.earnMonth && t.mois.length) {
      S.earnMonth = t.mois.some(function (m) { return m.mois === cur; }) ? cur : t.mois[t.mois.length - 1].mois;
    }
    if (S.earnMonth) chargerDetail(S.earnMonth);
    var max = Math.max.apply(null, t.mois.map(function (m) { return m.montant_cents; }).concat([1]));
    // Un mois est versé quand il l'est dans tous les groupes ; ajusté si l'un d'eux a un montant fixé.
    function monthTag(cle) {
      var ls = [];
      d.classes.forEach(function (c) { c.previsionnel.mois.forEach(function (m) { if (m.mois === cle) ls.push(m); }); });
      if (ls.length && ls.every(function (m) { return m.verse_le; })) return '<span class="nv-tag ok"><i></i>versé</span>';
      if (ls.some(function (m) { return m.fixe_cents !== null; })) return '<span class="nv-tag warn"><i></i>ajusté</span>';
      if (cle === cur) return '<span class="nv-tag"><i></i>en cours</span>';
      return '<span class="nv-tag" style="visibility:hidden"><i></i>versé</span>';
    }
    var html = head("Rémunération", "Prévisionnel calculé sur le calendrier des séances et tes étudiants inscrits, ajusté par l'équipe NAVIRE. Versée par virement.") +
      '<div class="nv-stats">' + stat("Déjà gagné", eur(t.realise_cents), true) + stat("Versé", eur(t.verse_cents)) + stat("À venir", eur(t.a_venir_cents)) + stat("Total prévu", eur(t.total_cents)) + '</div>' + soldeMois(t);
    html += '<div class="nv-group-label">Par mois</div>';
    if (!t.mois.length) html += empty("Pas encore de séance", "Les mois apparaîtront dès que l'agenda sera saisi.");
    t.mois.forEach(function (m) {
      html += '<button class="nv-month' + (m.mois < cur ? " is-past" : m.mois === cur ? " is-current" : "") + (m.mois === S.earnMonth ? " is-selected" : "") +
        '" data-act="earn-month" data-m="' + m.mois + '" title="Voir le détail des séances"><span class="nv-month-name">' + mois(m.mois) + '</span>' +
        '<small>' + m.seances + ' séance' + (m.seances > 1 ? 's' : '') + '</small>' +
        '<span class="nv-month-bar"><i style="width:' + Math.round(m.montant_cents / max * 100) + '%"></i></span>' +
        '<span class="nv-month-amount">' + eur(m.montant_cents) + '</span>' + monthTag(m.mois) + '</button>';
    });
    if (S.earnMonth) html += detailMois(S.earnMonth);
    html += '<div class="nv-group-label">Par groupe</div>';
    d.classes.forEach(function (c) {
      var p = c.previsionnel, parts = [];
      if (p.remu_seance_cents) parts.push(eur(p.remu_seance_cents) + " par séance");
      if (p.remu_etudiant_cents) parts.push(eur(p.remu_etudiant_cents) + " par étudiant et par séance");
      html += '<div class="nv-card"><div class="nv-card-title">' + esc(c.nom) + '</div>' +
        '<div class="nv-card-sub">' + (parts.join(" + ") || (p.mois.some(function (m) { return m.fixe_cents !== null; }) ? "Montants fixés par l'équipe NAVIRE" : "Rémunération en cours de définition par l'équipe NAVIRE")) + ' · ' + c.etudiants.length + ' étudiant' + (c.etudiants.length > 1 ? 's' : '') + '</div>' +
        '<div class="nv-stats" style="margin:0">' + stat("Séances faites", p.seances_passees) + stat("À venir", p.seances_a_venir) +
        stat("Déjà gagné", eur(p.realise_cents), true) + stat("Prévu", eur(p.a_venir_cents)) + '</div></div>';
    });
    setPage(html);
  }

  // ================= MODE CORRECTION =================
  // La copie mise en forme par NAVIRE, en plein écran sur fond blanc. On

  function cxEl(n) { return el("cx-" + n); }
  function cxCommente(a) { return a.type === "commentaire" || (a.type === "surligne" && !!a.texte); }
  function cxLien(u) { u = String(u || "").trim(); return /^https?:\/\//i.test(u) ? u : ""; }
  function cxAvatar(url, nom, size) {
    var st = 'width:' + size + 'px;height:' + size + 'px;border-radius:50%;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;';
    if (cxLien(url)) return '<span style="' + st + 'background:#e6e8ef center/cover no-repeat;background-image:url(&quot;' + esc(url) + '&quot;)"></span>';
    return '<span style="' + st + 'background:#4F7DFF;color:#fff;font-family:Inter,sans-serif;font-weight:700;font-size:' + Math.round(size * 0.45) + 'px;letter-spacing:0">' + esc(String(nom || "C").trim().charAt(0).toUpperCase()) + '</span>';
  }

  function cxMorceaux(b, anns) {
    var text = b.text || "", n = text.length, B = {}, styles = [], pos = 0;
    B[0] = 1; B[n] = 1;
    (b.runs && b.runs.length ? b.runs : [[text, false, false]]).forEach(function (r) { styles.push([pos, pos + r[0].length, r[1], r[2]]); pos += r[0].length; B[pos] = 1; });
    anns.forEach(function (a) { B[Math.max(0, Math.min(n, a.debut))] = 1; B[Math.max(0, Math.min(n, a.fin))] = 1; });
    var bs = Object.keys(B).map(Number).sort(function (x, y) { return x - y; }), out = [];
    for (var k = 0; k < bs.length; k++) {
      var p = bs[k];
      anns.forEach(function (a) { if (a.type === "correction" && a.fin === p && a.texte) out.push({ k: "ins", t: a.texte, a: a.id }); });
      if (k + 1 >= bs.length) break;
      var q = bs[k + 1];
      if (q <= p) continue;
      var st = styles.filter(function (x) { return x[0] <= p && p < x[1]; })[0] || [0, 0, false, false];
      var barre = anns.filter(function (a) { return a.type === "correction" && a.debut <= p && p < a.fin; })[0];
      out.push({
        k: "txt", t: text.slice(p, q), o: p, g: st[2], i: st[3], barre: barre ? barre.id : null,
        hl: anns.filter(function (a) { return a.type === "surligne" && a.debut <= p && p < a.fin; }).map(function (a) { return a.id; }),
        coms: anns.filter(function (a) { return cxCommente(a) && a.debut <= p && p < a.fin; }).map(function (a) { return a.id; })
      });
    }
    return out;
  }
  function cxNumeros() {
    var idx = {}, map = {};
    CX.data.blocs.forEach(function (b, i) { idx[b.id] = i; });
    var list = CX.data.annotations.filter(cxCommente).sort(function (x, y) { return (idx[x.bloc] - idx[y.bloc]) || (x.debut - y.debut) || (x.id - y.id); });
    list.forEach(function (a, i) { map[a.id] = i + 1; });
    return { map: map, list: list };
  }
  function cxNote(a, num) {
    return '<div class="cx-note" data-cx-note="' + a.id + '"><small>' + cxAvatar(a.auteur_avatar, a.auteur, 20) + '<span>' + num + ' · ' + esc(a.auteur || "Correcteur") + (a.type === "surligne" ? " · surligné" : "") + '</span>' +

  }
  function cxRender() {
    var data = CX.data, d = data.devoir, e = d.etudiant || {}, num = cxNumeros(), par = {};
    data.annotations.forEach(function (a) { (par[a.bloc] = par[a.bloc] || []).push(a); });
    cxEl("titre").textContent = d.titre;
    cxEl("sous").textContent = (e.username || e.email || "Étudiant") + " · " + (d.classe_nom || d.matiere_label || d.matiere) + (data.mots ? " · " + data.mots + " mots" : "");

      '<div class="cx-legend"><span><span class="cx-del">barré</span> à retirer</span><span><span class="cx-ins">vert</span> ajouté</span><span><span class="cx-hl">&nbsp;surligné&nbsp;</span></span><span><span class="cx-com">&nbsp;commenté&nbsp;</span></span></div>';
    data.blocs.forEach(function (b) {
      if (b.t === "table") { html += '<table data-bloc="' + esc(b.id) + '">' + (b.rows || []).map(function (r) { return "<tr>" + r.map(function (c) { return "<td>" + esc(c) + "</td>"; }).join("") + "</tr>"; }).join("") + '</table>'; return; }
      var anns = par[b.id] || [];
      var inner = cxMorceaux(b, anns).map(function (m) {
        if (m.k === "ins") return '<span class="cx-ins" data-ins="1" data-ann="' + m.a + '">' + esc(m.t) + '</span>';
        var t = esc(m.t);
        if (m.g) t = "<b>" + t + "</b>";
        if (m.i) t = "<i>" + t + "</i>";
        var cls = "cx-t" + (m.barre ? " cx-del" : "") + (m.hl.length ? " cx-hl" : "") + (m.coms.length ? " cx-com" : "");
        var ids = (m.barre ? [m.barre] : []).concat(m.hl).concat(m.coms);
        var sup = "";
        m.coms.forEach(function (id) {

        });

      }).join("");
      var tag = b.t === "titre" ? "h2" : b.t === "h" ? "h3" : "p";

      var notes = anns.filter(cxCommente).map(function (a) { return cxNote(a, num.map[a.id]); }).join("");
      html += '<' + tag + ' class="' + cls2 + '" data-bloc="' + esc(b.id) + '">' + inner + '</' + tag + '>' + (notes ? '<div class="cx-inline-notes">' + notes + '</div>' : "");
    });
    var dr = cxDraft();
    html += '<div class="cx-end" data-cx-end><h4>Appréciation générale</h4><p>Elle s\'affiche en tête de la copie de l\'étudiant, avec la note, quand tu rends la correction.</p>' +
      '<div class="cx-end-grid"><label><span>Appréciation</span><textarea data-cx-in="commentaire" maxlength="8000" placeholder="Ce qui va, ce qui manque, la piste pour progresser…">' + esc(dr.commentaire) + '</textarea></label>' +
      '<label><span>Note</span><input data-cx-in="note" maxlength="40" placeholder="14/20" value="' + esc(dr.note) + '"></label></div>' +
      '<div class="cx-end-btns"><button class="cx-b is-main" data-cx="rendre">' + (d.statut === "corrige" ? "Mettre à jour la correction" : "Rendre la correction") + '</button>' +
      '<em>' + data.annotations.length + ' annotation' + (data.annotations.length > 1 ? "s" : "") + (d.statut === "corrige" ? " · corrigée le " + date(d.corrige_le) : " · l\'étudiant ne voit rien avant que tu rendes la correction") + '</em></div></div>';
    cxEl("paper").innerHTML = html;
    cxEl("margin").innerHTML = num.list.length ? num.list.map(function (a) { return cxNote(a, num.map[a.id]); }).join("")

  function cxPlace() {

    var sel = window.getSelection();
    if (!sel || sel.rangeCount === 0 || sel.isCollapsed) return null;
    var r = sel.getRangeAt(0), paper = cxEl("paper");
    if (!paper.contains(r.commonAncestorContainer)) return null;
    function bloc(n) { n = n.nodeType === 3 ? n.parentNode : n; return n && n.closest ? n.closest("[data-bloc]") : null; }
    var b1 = bloc(r.startContainer), b2 = bloc(r.endContainer);
    if (!b1 || b1 !== b2 || b1.tagName === "TABLE") return { erreur: b1 && b2 && b1 !== b2 ? "Sélectionne dans un seul paragraphe." : null };
    var debut = cxOffset(b1, r.startContainer, r.startOffset), fin = cxOffset(b1, r.endContainer, r.endOffset);
    var b = CX.data.blocs.filter(function (x) { return x.id === b1.getAttribute("data-bloc"); })[0];
    while (debut < fin && b.text.charAt(debut) === " ") debut++;
    while (fin > debut && b.text.charAt(fin - 1) === " ") fin--;
    if (fin <= debut) return null;
    return { bloc: b.id, debut: debut, fin: fin, citation: b.text.slice(debut, fin), rect: r.getBoundingClientRect() };
  }
  function cxPosAt(box, rect, w) {
    var body = cxEl("body"), br = body.getBoundingClientRect();
    var left = Math.max(8, Math.min(rect.left - br.left + rect.width / 2 - w / 2, body.clientWidth - w - 8));
    box.style.left = left + "px";
    box.style.top = (rect.top - br.top + body.scrollTop - 46) + "px";
    return { left: left, top: rect.bottom - br.top + body.scrollTop + 10 };
  }
  function cxShowTool() {
    if (S.voir || !CX.data) return;
    var s2 = cxSelection();
    if (!s2) { cxHideTool(); return; }
    if (s2.erreur) { cxHideTool(); toast(s2.erreur, true); return; }
    CX.sel = s2;
    var t = cxEl("tool");
    t.classList.add("is-on");
    cxPosAt(t, s2.rect, t.offsetWidth || 420);
  }
  function cxHideTool() { var t = cxEl("tool"); if (t) t.classList.remove("is-on"); }
  function cxClosePop() { var p = cxEl("pop"); if (p) { p.classList.remove("is-on"); p.innerHTML = ""; } CX.pop = null; }

  // Fenêtre de saisie : commentaire, texte de remplacement, ajout.
  function cxAsk(kind, sel, rect, init) {
    var labels = { commentaire: ["Commentaire", "Ton commentaire pour l'étudiant…"], remplacer: ["Remplacer par", "Le texte correct…"], inserer: ["Ajouter après", "Le texte à ajouter…"], edit: ["Modifier", ""] };
    var L = labels[kind];
    var p = cxEl("pop");
    CX.pop = { kind: kind, sel: sel, id: init && init.id };
    p.innerHTML = '<small>' + L[0] + '</small>' + (sel && sel.citation ? '<q>' + esc(sel.citation) + '</q>' : "") +
      '<textarea data-cx-pop placeholder="' + esc(L[1]) + '" maxlength="4000">' + esc(init ? init.texte : "") + '</textarea>' +
      '<div class="cx-pop-btns"><span>Ctrl + Entrée</span><button class="cx-b" data-cx="pop-annuler">Annuler</button><button class="cx-b is-main" data-cx="pop-ok">Enregistrer</button></div>';
    p.classList.add("is-on");
    var pos = cxPosAt(p, rect, 300);
    p.style.top = pos.top + "px";
    var ta = p.querySelector("textarea");
    setTimeout(function () { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }, 0);
  }
  function cxAdd(type, sel, texte) {
    cxSaving(1);
    return api("POST", "/professeurs/devoirs/" + CX.id + "/annotations", { type: type, bloc: sel.bloc, debut: sel.debut, fin: sel.fin, texte: texte || "" })
      .then(function (a) { CX.data.annotations.push(a); cxRender(); })
      .catch(function (x) { toast(x.message, true); })
      .then(function () { cxSaving(-1); });
  }
  function cxTool(action) {
    var sel = CX.sel; if (!sel) return;
    cxHideTool();
    try { window.getSelection().removeAllRanges(); } catch (x) {}
    if (action === "surligne") return cxAdd("surligne", sel, "");
    if (action === "barre") return cxAdd("correction", sel, "");
    if (action === "commentaire") return cxAsk("commentaire", sel, sel.rect);
    if (action === "remplacer") return cxAsk("remplacer", sel, sel.rect);
    if (action === "inserer") return cxAsk("inserer", { bloc: sel.bloc, debut: sel.fin, fin: sel.fin, citation: sel.citation }, sel.rect);
  }
  function cxPopOk() {
    var P = CX.pop; if (!P) return;
    var t = (cxEl("pop").querySelector("textarea").value || "").trim();
    if (!t) return toast("Le texte est vide.", true);
    cxClosePop();
    if (P.kind === "commentaire") return cxAdd("commentaire", P.sel, t);
    if (P.kind === "remplacer" || P.kind === "inserer") return cxAdd("correction", P.sel, t);
    if (P.kind === "edit") {
      cxSaving(1);
      api("PATCH", "/professeurs/annotations/" + P.id, { texte: t })
        .then(function (a) { CX.data.annotations = CX.data.annotations.map(function (x) { return x.id === a.id ? a : x; }); cxRender(); })
        .catch(function (x) { toast(x.message, true); }).then(function () { cxSaving(-1); });
    }
  }
  function cxDel(id) {
    cxSaving(1);
    api("DELETE", "/professeurs/annotations/" + id)
      .then(function () { CX.data.annotations = CX.data.annotations.filter(function (x) { return x.id !== id; }); cxClosePop(); cxRender(); })
      .catch(function (x) { toast(x.message, true); }).then(function () { cxSaving(-1); });
  }
  // Clic sur une marque : focus du commentaire, ou petite fenêtre pour la retirer.
  function cxMark(ids, rect) {
    var anns = CX.data.annotations.filter(function (a) { return ids.indexOf(String(a.id)) >= 0; });
    root.querySelectorAll("#nv-prof .cx-ed .is-focus").forEach(function (x) { x.classList.remove("is-focus"); });
    anns.forEach(function (a) {
      root.querySelectorAll('[data-cx-note="' + a.id + '"], [data-anns~="' + a.id + '"]').forEach(function (x) { x.classList.add("is-focus"); });
    });
    if (S.voir) return;
    var p = cxEl("pop"), lab = { commentaire: "Commentaire", surligne: "Surligné", correction: "Correction" };
    CX.pop = { kind: "marks" };
    p.innerHTML = anns.map(function (a) {
      var quoi = a.type === "correction" ? (a.debut === a.fin ? "Ajout : « " + a.texte + " »" : a.texte ? "« " + a.citation + " » → « " + a.texte + " »" : "« " + a.citation + " » barré") : (a.texte || "« " + a.citation + " »");
      return '<small>' + lab[a.type] + '</small><div style="font-size:13px;color:#2b2d36;margin-bottom:8px;overflow-wrap:anywhere">' + esc(quoi) + '</div>' +
        '<div class="cx-pop-btns" style="margin:0 0 10px">' + (a.texte || a.type !== "surligne" ? '<button class="cx-b" data-cx="note-edit" data-id="' + a.id + '">Modifier</button>' : "") + '<button class="cx-b" data-cx="ann-del" data-id="' + a.id + '">Retirer</button></div>';
    }).join("");
    p.classList.add("is-on");
    var pos = cxPosAt(p, rect, 300);
    p.style.top = pos.top + "px";
  }
  function cxRendre(b) {
    var dr = cxDraft(), body = { commentaire: dr.commentaire, note: dr.note, statut: "corrige" };
    if (!CX.data.annotations.length && !String(dr.commentaire || "").trim() && !String(dr.note || "").trim()) return toast("Annote la copie ou ajoute une appréciation.", true);
    if (b) b.disabled = true;
    api("PATCH", "/professeurs/devoirs/" + CX.id, body).then(function (row) {
      store(cxDraftKey(), null);
      CX.data.devoir = Object.assign({}, CX.data.devoir, row);
      S.devoirs = S.devoirs.map(function (x) { return x.id === row.id ? row : x; });
      renderCounts();
      toast("Correction rendue : l'étudiant a reçu un mail.");
      cxClose();
      if (S.view === "devoirs") viewDevoirs();
    }).catch(function (x) { if (b) b.disabled = false; toast(x.message, true); });
  }
  function cxExport(fmt) {
    toast("Préparation du fichier…");
    fetch(CONFIG.API + "/professeurs/devoirs/" + CX.id + "/export?format=" + fmt, { headers: { Authorization: "Bearer " + S.token } })
      .then(function (r) { if (!r.ok) return handle(r); return r.blob().then(function (b) { return { b: b, h: r.headers.get("content-disposition") || "" }; }); })
      .then(function (x) {
        var m = /filename\*=UTF-8''([^;]+)/i.exec(x.h), nom = m ? decodeURIComponent(m[1]) : "copie." + fmt;
        var url = URL.createObjectURL(x.b), a = document.createElement("a");
        a.href = url; a.download = nom; document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
      }).catch(function (x) { toast(x.message, true); });
  }

  (function () {
    var ed = el("cx");
    ed.addEventListener("mouseup", function (e) {
      if (e.target.closest(".cx-tool,.cx-pop,.cx-bar,[data-cx-end]")) return;
      setTimeout(function () {
        var sel = window.getSelection();
        if (sel && !sel.isCollapsed) return cxShowTool();
        cxHideTool();
        var mk = e.target.closest("[data-anns]");
        if (mk) cxMark(mk.getAttribute("data-anns").split(" "), mk.getBoundingClientRect());
        else if (e.target.closest("[data-ins]") && e.target.closest("[data-ann]")) { var i2 = e.target.closest("[data-ann]"); cxMark([i2.getAttribute("data-ann")], i2.getBoundingClientRect()); }
        else if (!e.target.closest(".cx-note")) cxClosePop();
      }, 0);
    });
    ed.addEventListener("click", function (e) {
      var b = e.target.closest("[data-cx]");
      var n = e.target.closest(".cx-note");
      if (!b && n) {
        var id = n.getAttribute("data-cx-note");
        root.querySelectorAll("#nv-prof .cx-ed .is-focus").forEach(function (x) { x.classList.remove("is-focus"); });
        root.querySelectorAll('[data-cx-note="' + id + '"], [data-anns~="' + id + '"]').forEach(function (x) { x.classList.add("is-focus"); });
        return;
      }
      if (!b) return;
      var act = b.getAttribute("data-cx"), aid = +b.getAttribute("data-id");
      if (act === "fermer") return cxClose();
      if (act === "export") return cxExport(b.getAttribute("data-f"));
      if (act === "plein") { try { if (document.fullscreenElement) document.exitFullscreen(); else ed.requestFullscreen(); } catch (x) {} return; }
      if (act === "rendre") return S.voir ? toast("Aperçu admin : lecture seule", true) : cxRendre(b);
      if (act.indexOf("t-") === 0) return cxTool(act.slice(2));
      if (act === "pop-ok") return cxPopOk();
      if (act === "pop-annuler") return cxClosePop();
      if (act === "ann-del") return cxDel(aid);
      if (act === "note-edit") {
        var a = CX.data.annotations.filter(function (x) { return x.id === aid; })[0];
        var anc = cxEl("paper").querySelector('[data-anns~="' + aid + '"]') || b;
        return a && cxAsk("edit", { citation: a.citation }, anc.getBoundingClientRect(), a);
      }
    });
    ed.addEventListener("input", function (e) {
      var k = e.target.getAttribute && e.target.getAttribute("data-cx-in");
      if (!k || !CX.data) return;
      var dr = cxDraft(); dr[k] = e.target.value;
      store(cxDraftKey(), JSON.stringify(dr));
    });
    ed.addEventListener("keydown", function (e) {
      if (e.target.matches && e.target.matches("[data-cx-pop]")) {
        if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); cxPopOk(); }
        if (e.key === "Escape") { e.stopPropagation(); cxClosePop(); }
      }
    });
    document.addEventListener("keydown", function (e) {
      if (!ed.classList.contains("is-on")) return;
      var tag = (e.target.tagName || "").toLowerCase();
      if (e.key === "Escape") { if (CX.pop) cxClosePop(); else if (cxEl("tool").classList.contains("is-on")) cxHideTool(); else if (!document.fullscreenElement) cxClose(); return; }
      if (tag === "textarea" || tag === "input" || e.ctrlKey || e.metaKey || e.altKey) return;
      if (!cxEl("tool").classList.contains("is-on")) return;
      var map = { c: "commentaire", h: "surligne", d: "barre", r: "remplacer", a: "inserer" }, k = map[e.key.toLowerCase()];
      if (k) { e.preventDefault(); cxTool(k); }
    });
    cxEl("body").addEventListener("scroll", function () { if (cxEl("tool").classList.contains("is-on")) cxShowTool(); });
    FLOW.onScroll(function () { if (CX.data && cxEl("tool").classList.contains("is-on")) cxShowTool(); });
  })();

  // ================= DÉMARRAGE =================
  function loadDash() {
    return Promise.all([
      api("GET", "/professeurs/me/dashboard"),
      api("GET", "/professeurs/me/devoirs").catch(function () { return { items: [] }; }),
      api("GET", "/professeurs/epreuves").catch(function () { return { items: [], types: [] }; })
    ]).then(function (r) { S.dash = r[0]; S.devoirs = r[1].items || []; S.eps = r[2]; });
  }

  function route() {
    var s = S.me.status;
    renderApercu();
    if (S.admin && !S.voir && s !== "active") return viewPickProf();
    if (s === "none") return viewNotProf(false);
    if (s !== "active") return viewNotProf(true);
    root.classList.remove("is-solo");
    el("page").innerHTML = '<div class="nv-page-inner"><div class="nv-skel"></div><div class="nv-skel"></div><div class="nv-skel" style="height:120px"></div></div>';
    return loadDash().then(renderApp).catch(function (x) { setPage(empty("Espace indisponible", esc(x.message)), true); });
  }

  function boot() {
    if (!S.token) { viewLoggedOut(); return; }
    setPage('<div class="nv-skel" style="margin-top:20px"></div><div class="nv-skel"></div>', true);
    api("GET", "/professeurs/me")
      .then(function (m) {
        S.me = m; S.admin = !!m.admin;
        if (S.voir && !m.apercu) { S.voir = null; store(VOIR_KEY, null); }   // pas admin, ou professeur retiré
        return S.admin ? chargerProfs() : null;
      })
      .then(route)
      .catch(function (x) { if (x.status === 401) { S.token = null; store(CONFIG.TOKEN_KEY, null); viewLoggedOut(); } else setPage(empty("Erreur", esc(x.message)), true); });
  }
  S.token = load(CONFIG.TOKEN_KEY);
  S.voir = +load(VOIR_KEY) || null;
  boot();
})();
</script>
</body></html>
