<!--
  NAVIRE, embed de l'onglet Prépa (page /prepa), réservé aux inscrits
  Prép'AdJuris.
  ======================================================================
  Même DA que l'accueil et NAVIRE Lib : bleu et blanc, aucun trait, cartes
  à halo lumineux et visuels NAVIRE ; menu latéral masquable (retenu d'une
  visite à l'autre). Téléphone (< 760 px) : police DM Sans plus petite, le
  bouton menu ouvre un voile opaque, la page du site défile (pas l'embed),
  une flèche blanche ramène en haut.

  Cinq rubriques (lien direct /prepa?onglet=…) :
    semaine   l'essentiel en haut (prochain cours, épreuve ouverte, copie
              corrigée), puis le calendrier (semaine / mois) ;
    epreuves  épreuves planifiées par le professeur et entraînement libre ;
    copies    « Nouvelle copie » (écrire dans NAVIRE ou déposer un fichier)
              et les copies rendues ; lien direct : /prepa?copie=12 ;
    cours     cours suivis depuis NAVIRE Lib et cours de la classe ;
    factu     prochain prélèvement par matière.

  Écrire dans NAVIRE : un écran blanc sur tout l'écran (le header du site
  est masqué), une zone d'écriture épurée, sans page simulée. En épreuve, le
  compte à rebours et l'étape de la méthode défilent en petit en haut ; le
  sujet et un brouillon s'ouvrent sur le côté. La copie s'enregistre au fil
  de l'eau (appareil + serveur). Quitter la page abandonne l'épreuve.
  Écrire une copie hors épreuve : même écran, sans chrono, brouillon gardé.

  Lire une correction : même écran blanc, la copie avec les révisions du
  correcteur (barré, ajouté, surligné) et ses commentaires en bulles sur le
  côté (photo, nom, commentaire), la note et l'appréciation en tête ;
  téléchargement .docx (révisions Word) ou .pdf. Les copies corrigées sont
  aussi dans l'onglet Fichiers, « Mes copies ».

  Admin : case « Vue étudiant » en bas du menu (L1, L2, L3, M1), lecture seule.

  Données : GET /lib/prepa, POST /lib/prepa/devoirs (fichier),
            POST /lib/prepa/devoirs/texte (copie écrite dans NAVIRE),
            GET /lib/prepa/devoirs/{id}/copie, …/export?format=docx|pdf,
            GET|POST /lib/prepa/epreuves…, PUT …/sessions/{id}/brouillon,
            POST …/sessions/{id}/rendre-texte, …/abandonner,
            DELETE /lib/prepa/suivis/{id}.
  Réglages : bloc CONFIG du script.
-->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=IBM+Plex+Mono:wght@400;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
#nv-prepa {
  --panel: rgba(255,255,255,0.035);
  --panel-2: rgba(255,255,255,0.06);
  --panel-3: rgba(255,255,255,0.1);
  --text: #fff;
  --text-2: rgba(255,255,255,0.72);
  --text-3: rgba(255,255,255,0.45);
  --text-4: rgba(255,255,255,0.28);
  --blue: #7AA7FF;
  --blue-hi: #B5CDFF;
  --blue-deep: #4F7DFF;
  --blue-soft: rgba(122,167,255,0.1);
  --blue-line: rgba(122,167,255,0.35);

  position: relative;
  width: 100%;
  height: 640px;
  min-height: 460px;
  display: flex;
  overflow: hidden;

}

#nv-prepa button { font-family: inherit; color: inherit; }
#nv-prepa ::selection { background: rgba(122,167,255,0.3); }
#nv-prepa svg { flex-shrink: 0; }
#nv-prepa .nv-scroll { overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.1) transparent; }

#nv-prepa .nv-side > * { flex-shrink: 0; }
#nv-prepa:not(.is-compact).is-side-off .nv-side { margin-left: -244px; visibility: hidden; transition: margin-left .3s var(--ease), visibility 0s .3s; }
#nv-prepa .nv-brand { display: flex; align-items: center; gap: 8px; padding: 0 0 10px 10px; }
#nv-prepa .nv-brand b { font-size: 13px; font-weight: 700; letter-spacing: -.1px; }

#nv-prepa .nv-side-close { margin-left: auto; width: 28px; height: 28px; border-radius: 8px; color: var(--text-4); }

#nv-prepa .nv-side-close .nv-x { display: none; }

#nv-prepa .nv-nav { display: flex; align-items: center; gap: 9px; width: 100%; padding: 7px 10px; border-radius: 8px; border: none; background: transparent; cursor: pointer; font-size: 12.5px; font-weight: 500; color: var(--text-3); transition: background .15s, color .15s; text-align: left; text-decoration: none; }
#nv-prepa .nv-nav svg { width: 15px; height: 15px; opacity: .7; }
#nv-prepa .nv-nav:hover { background: var(--panel); color: var(--text); }
#nv-prepa .nv-nav.is-active { background: var(--panel-2); color: var(--text); }
#nv-prepa .nv-nav .nv-badge { margin-left: auto; font-family: var(--mono); font-size: 10px; color: var(--text-4); }
#nv-prepa .nv-nav .nv-badge.is-blue { color: #0a0a12; background: var(--blue); padding: 1px 6px; border-radius: 99px; font-weight: 600; }

#nv-prepa .nv-side-fill { flex: 1; min-height: 12px; }

#nv-prepa .np-admin { margin-top: 10px; padding: 10px; border-radius: 12px; background: var(--panel); }

#nv-prepa .np-switch span { flex: 1; }

#nv-prepa .np-switch i { position: relative; width: 34px; height: 20px; border-radius: 99px; background: var(--panel-3); flex-shrink: 0; transition: background .2s; }
#nv-prepa .np-switch i::after { content: ''; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: transform .25s var(--ease); }
#nv-prepa .np-switch.is-on i { background: var(--blue); }
#nv-prepa .np-switch.is-on i::after { transform: translateX(14px); }
#nv-prepa .np-seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 3px; padding: 3px; border-radius: 10px; background: var(--panel-2); margin-top: 10px; }
#nv-prepa .np-seg button { height: 26px; border: 0; border-radius: 7px; background: transparent; font-size: 11px; font-weight: 700; color: var(--text-3); cursor: pointer; padding: 0; }
#nv-prepa .np-seg button.is-on { background: #fff; color: #0a0a12; }

/* ---------- Zone principale ---------- */
#nv-prepa .nv-main { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; position: relative; }
#nv-prepa .nv-topbar { display: flex; align-items: center; gap: 8px; padding: 10px 14px; min-height: 52px; flex-shrink: 0; }
#nv-prepa .nv-topbar-title { flex: 1; min-width: 0; font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-2); }
#nv-prepa .nv-icon-btn { width: 34px; height: 34px; display: inline-flex; align-items: center; justify-content: center; border-radius: 10px; border: none; background: transparent; color: var(--text-3); cursor: pointer; transition: background .15s, color .15s; padding: 0; }
#nv-prepa .nv-icon-btn:hover { background: var(--panel-2); color: var(--text); }

#nv-prepa .np-apercu { display: none; align-items: center; gap: 10px; padding: 8px 14px; background: rgba(255,255,255,0.04); color: rgba(255,255,255,0.62); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); font-size: 12px; flex-shrink: 0; }

#nv-prepa .np-apercu span { flex: 1; }

@keyframes nv-rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

#nv-prepa .nv-page-head h2 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -.4px; }
#nv-prepa .nv-page-head p { margin: 4px 0 0; font-size: 13px; color: var(--text-3); line-height: 1.55; max-width: 620px; }

/* ---------- Éléments communs ---------- */
#nv-prepa .nv-btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 38px; padding: 0 18px; border-radius: 99px; border: none; background: #fff; color: #0a0a12; font-size: 13px; font-weight: 600; cursor: pointer; text-decoration: none; white-space: nowrap; transition: transform .15s, background .2s; }

#nv-prepa .np-note-box { padding: 12px 14px; border-radius: 13px; background: var(--panel); font-size: 12.5px; color: var(--text-2); margin-bottom: 14px; line-height: 1.5; }

#nv-prepa .np-sec .nv-chip { height: 28px; font-size: 11.5px; padding: 0 11px; }

/* Cartes à halo (comme les accès de l'accueil) */
#nv-prepa .np-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
#nv-prepa .np-card { position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 6px; min-width: 0; min-height: 128px; padding: 16px; border-radius: var(--radius); border: 0; background: var(--panel); text-align: left; text-decoration: none; color: inherit; cursor: pointer; transition: background .2s, transform .2s var(--ease); animation: nv-rise .45s var(--ease) both; }

#nv-prepa .np-card.is-live { background: linear-gradient(135deg, rgba(127,227,176,0.14), rgba(127,227,176,0.02)); }
#nv-prepa .np-card.is-hero { background: linear-gradient(135deg, rgba(79,125,255,0.2), rgba(122,167,255,0.03)); }
#nv-prepa .np-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--live); animation: np-pulse 1.8s infinite; margin-right: 6px; vertical-align: 1px; }

/* Lignes */

#nv-prepa .np-row:hover { background: var(--panel-2); }

/* Calendrier */

#nv-prepa .np-ev { display: block; width: 100%; text-align: left; border: 0; border-radius: 10px; padding: 7px 8px; background: rgba(122,167,255,0.14); cursor: pointer; transition: background .15s, transform .15s; }
#nv-prepa .np-ev:hover { background: rgba(122,167,255,0.24); transform: translateY(-1px); }

#nv-prepa .np-ev.is-off { background: var(--panel-2); }
#nv-prepa .np-ev.is-off b { text-decoration: line-through; color: var(--text-3); }

#nv-prepa .np-ev.is-live { background: rgba(127,227,176,0.18); }

#nv-prepa .np-mev { display: block; width: 100%; border: 0; text-align: left; border-radius: 6px; padding: 2px 5px; font-size: 10.5px; background: rgba(122,167,255,0.16); cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#nv-prepa .np-mev.is-off { text-decoration: line-through; color: var(--text-3); background: var(--panel-2); }

/* Cours */

/* ---------- Téléphone : police, menu en voile, page qui défile ---------- */

/* ---------- Défilement : la page du site défile ---------- */
#nv-prepa.is-flow { height: auto; overflow: visible; overflow-x: clip; align-items: flex-start; }

@media (prefers-reduced-motion: reduce) {
  #nv-prepa *, #nv-prepa *::before, #nv-prepa *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}

/* ================= ÉCRAN BLANC (écriture, correction, lecture) =================

.nvx { position: fixed; inset: 0; z-index: 2147483000; display: flex; flex-direction: column; background: #fff; color: #15161c; font-family: 'Inter', system-ui, sans-serif; -webkit-font-smoothing: antialiased; font-size: 14px; animation: nvx-in .25s cubic-bezier(.2,.8,.2,1); }

  // ---------- Calendrier (et l'essentiel en haut) ----------
  function essentiel() {
    var p = S.p, cards = [];
    var s = seances().filter(function (x) { return x.en_cours; })[0] || p.prochaine_seance;
    if (s) {
      var d = dateOf(s.date_debut), st = etat(s), lien = seanceLien(s);
      var quand = !d ? "" : memeJour(d, new Date()) ? "Aujourd'hui à " + hhmm(d) : jour(d, true) + " à " + hhmm(d);
      cards.push(card({ cls: st === "live" ? "is-live" : "is-hero", attrs: lien && st !== "annulee" ? 'data-href="' + esc(lien) + '"' : 'data-seance="' + s.id + '"', art: "home-veilles",
        tag: st === "live" ? '<span class="nv-tag live"><span class="np-dot" style="margin:0 2px 0 0;width:6px;height:6px"></span>EN COURS</span>' : '<span class="nv-tag blue">PROCHAIN COURS</span>',
        titre: esc(s.titre || s.matiere), sous: esc(quand) + (lien && st !== "annulee" ? " · Rejoindre" : "") }));
    }
    epOuvertes().slice(0, 2).forEach(function (x) {
      var f = dateOf(x.ferme_le), enc = x.session && x.session.statut === "en_cours";
      cards.push(card({ attrs: x.session ? 'data-ep-reprendre="' + x.session.id + '"' : 'data-ep-start="' + x.id + '"', art: "profil-qcm", tag: '<span class="nv-tag solid">' + (enc ? "EN COURS" : "ÉPREUVE OUVERTE") + "</span>",
        titre: esc(x.titre), sous: esc(x.type_label + " · " + duree(x.duree_minutes)) + (f ? " · jusqu'au " + esc(jour(f).toLowerCase()) : "") }));
    });
    nonLues().slice(0, 2).forEach(function (d) {
      cards.push(card({ attrs: 'data-copie="' + d.id + '"', art: "files-cristal", tag: d.note ? '<span class="np-note">' + esc(d.note) + "</span>" : '<span class="nv-tag live">CORRIGÉE</span>',
        titre: esc(d.titre), sous: "Correction de " + esc(d.corrige_par || "ton correcteur") + " · Lire" }));
    });
    if (cards.length < 3 && !p.apercu) {
      var br = brouillonLibre();
      cards.push(card({ attrs: 'data-act="ecrire"', art: "home-fichiers", titre: br ? "Reprendre ma copie" : "Écrire une copie", sous: br ? "Ton brouillon t'attend, enregistré sur cet appareil." : "Un écran blanc, rien que ton texte. Elle part à ton correcteur." }));
    }
    if (cards.length < 3) cards.push(card({ attrs: 'data-view="epreuves"', art: "profil-qcm", titre: "S'entraîner", sous: "Dissertation, commentaire, cas pratique ou fiche d'arrêt, chronométrés." }));
    return '<div class="np-cards">' + cards.join("") + "</div>";
  }
  function evHtml(s, mini) {
    var d = dateOf(s.date_debut), st = etat(s);
    var cls = (st === "annulee" ? " is-off" : "") + (st === "live" ? " is-live" : "") + (s.date_initiale ? " is-moved" : "");
    if (mini) return '<button class="np-mev' + cls + '" data-seance="' + s.id + '">' + hhmm(d) + " " + esc(s.titre || s.matiere) + "</button>";
    return '<button class="np-ev' + cls + '" data-seance="' + s.id + '"><i>' + (st === "live" ? "● " : "") + hhmm(d) + "</i><b>" + esc(s.titre || s.matiere) + "</b></button>";
  }
  function rowSeance(s) {
    var d = dateOf(s.date_debut), st = etat(s);
    return '<button class="np-row' + (st === "annulee" ? " is-off" : "") + '" data-seance="' + s.id + '"><span class="np-row-time">' + hhmm(d) + '</span><div class="np-row-txt"><b>' + esc(s.titre || s.matiere) + "</b><span>" +
      esc((s.titre ? s.matiere + " · " : "") + (st === "annulee" ? "annulée" : st === "live" ? "en cours" : (s.duree_minutes || 60) + " min") + (s.date_initiale ? " · déplacée" : "")) + "</span></div>" +
      (st === "live" ? '<span class="nv-tag live">EN COURS</span>' : st === "annulee" ? '<span class="nv-tag">ANNULÉE</span>' : "") + "</button>";
  }
  function viewSemaine() {
    var c = S.cal, now = new Date(), html = essentiel();
    var compact = root.classList.contains("is-compact");
    var titre;
    if (c.mode === "semaine") {
      var l = lundi(c.ref), dim = plusJours(l, 6);
      titre = l.getMonth() === dim.getMonth() ? l.getDate() + " – " + dim.getDate() + " " + dim.toLocaleDateString("fr-FR", { month: "long" })
        : l.toLocaleDateString("fr-FR", { day: "numeric", month: "short" }) + " – " + dim.toLocaleDateString("fr-FR", { day: "numeric", month: "short" });
    } else titre = c.ref.toLocaleDateString("fr-FR", { month: "long", year: "numeric" });
    html += '<div class="np-calbar"><h3>' + esc(titre) + "</h3>" +
      '<button class="nv-icon-btn" data-cal="prev" aria-label="Précédent">' + ICON.back + "</button>" +
      '<button class="nv-chip" data-cal="today">Aujourd\'hui</button>' +
      '<button class="nv-icon-btn" data-cal="next" aria-label="Suivant">' + ICON.next + "</button>" +
      '<div class="np-seg2"><button data-calmode="semaine"' + (c.mode === "semaine" ? ' class="is-on"' : "") + '>Semaine</button><button data-calmode="mois"' + (c.mode === "mois" ? ' class="is-on"' : "") + ">Mois</button></div></div>";
    var parJour = {};
    seances().forEach(function (s) { var d = dateOf(s.date_debut); if (d) (parJour[d.toDateString()] = parJour[d.toDateString()] || []).push(s); });
    if (c.mode === "semaine" && compact) {
      var l3 = lundi(c.ref), any = false;
      for (var j = 0; j < 7; j++) {
        var dd = plusJours(l3, j), ls = parJour[dd.toDateString()] || [];
        if (!ls.length) continue;
        any = true;
        html += '<div class="np-day' + (memeJour(dd, now) ? " is-today" : "") + '">' + (memeJour(dd, now) ? "Aujourd'hui · " : "") + esc(jour(dd, true)) + "</div>" + ls.map(rowSeance).join("");
      }
      if (!any) html += '<div class="nv-empty"><b>Semaine libre</b>Aucun cours cette semaine.</div>';
    } else if (c.mode === "semaine") {
      var l2 = lundi(c.ref), auj = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      html += '<div class="np-week">';
      for (var i = 0; i < 7; i++) {
        var dj = plusJours(l2, i), list = parJour[dj.toDateString()] || [];
        html += '<div class="np-wday' + (memeJour(dj, now) ? " is-today" : "") + (dj < auj ? " is-past" : "") + '"><div class="np-wday-head">' +
          esc(dj.toLocaleDateString("fr-FR", { weekday: "short" }).replace(".", "")) + "<b>" + dj.getDate() + "</b></div>" + list.map(function (s) { return evHtml(s); }).join("") + "</div>";
      }
      html += "</div>";
    } else {
      var start = lundi(new Date(c.ref.getFullYear(), c.ref.getMonth(), 1)), finMois = new Date(c.ref.getFullYear(), c.ref.getMonth() + 1, 0);
      var cases = Math.ceil((Math.round((finMois - start) / 86400000) + 1) / 7) * 7;
      html += '<div class="np-month">' + ["lun", "mar", "mer", "jeu", "ven", "sam", "dim"].map(function (x) { return '<div class="np-mhead">' + x + "</div>"; }).join("");
      for (var k = 0; k < cases; k++) {
        var dm = plusJours(start, k), lm = parJour[dm.toDateString()] || [];
        html += '<div class="np-mday' + (dm.getMonth() !== c.ref.getMonth() ? " is-other" : "") + (memeJour(dm, now) ? " is-today" : "") + '"><span>' + dm.getDate() + "</span>" + lm.map(function (s) { return evHtml(s, true); }).join("") + "</div>";
      }
      html += "</div>";
    }
    if (!seances().length) html += '<div class="nv-empty"><b>Calendrier vide</b>Aucune séance n\'est encore programmée pour tes matières.</div>';
    setPage(html, true);
  }
  function popSeance(id) {
    var s = seances().filter(function (x) { return String(x.id) === String(id); })[0];
    if (!s) return;
    var d = dateOf(s.date_debut), st = etat(s), ini = dateOf(s.date_initiale), lien = seanceLien(s);
    var fin = new Date(d.getTime() + (s.duree_minutes || 60) * 60000);
    pop("<small>" + esc(s.matiere) + "</small><h4>" + esc(s.titre || s.matiere) + "</h4>" +
      "<p>" + esc(jour(d, true)) + ", " + hhmm(d) + " – " + hhmm(fin) + "</p>" +
      (st === "annulee" ? '<p style="color:var(--bad)">Séance annulée.</p>' : "") +
      (ini ? "<p>Déplacée : prévue à l'origine " + esc(jour(ini, true)) + " à " + hhmm(ini) + ".</p>" : "") +
      (st === "live" ? '<p style="color:var(--live)"><span class="np-dot"></span>Le cours a commencé.</p>' : "") +
      '<div class="np-pop-btns"><button class="nv-chip" data-act="pop-close">Fermer</button>' + (lien && st !== "annulee" && st !== "passee" ? '<a class="nv-btn ' + (st === "live" ? "is-live" : "is-blue") + '" href="' + esc(lien) + '" target="_blank" rel="noopener">Rejoindre</a>' : "") + "</div>");
  }
  function pop(html) { el("pop-card").innerHTML = html; el("pop").classList.add("is-on"); }
  function popClose() { el("pop").classList.remove("is-on"); }

  // ---------- Copies ----------
  function viewCopies() {
    var list = devoirs(), v = vues(), br = brouillonLibre();
    var html = head("Mes copies", "Écris ta copie dans NAVIRE ou dépose un fichier : elle part au chargé de TD de ton groupe. Une fois corrigée, tu la lis ici avec ses révisions et ses commentaires, et tu la retrouves dans Fichiers.");
    if (S.p.apercu) html += '<div class="np-note-box">Vue étudiant : écrire et déposer sont désactivés.</div>';
    else html += '<div class="np-cards">' +
      card({ attrs: 'data-act="ecrire"', cls: "is-hero", art: "home-fichiers", tag: br ? '<span class="nv-tag blue">BROUILLON</span>' : "", titre: br ? "Reprendre ma copie" : "Écrire dans NAVIRE", sous: br ? esc(br.titre || "Sans titre") + " · enregistrée sur cet appareil" : "Un écran blanc, rien que ton texte." }) +
      card({ attrs: 'data-act="deposer"', art: "files-cristal", titre: "Déposer un fichier", sous: "Word (.docx) ou PDF texte, mis en forme par NAVIRE." }) + "</div>";
    html += '<div class="np-sec">Copies rendues <small>' + list.length + "</small></div>";
    if (!list.length) return setPage(html + '<div class="nv-empty"><b>Aucune copie pour le moment</b>Tes copies rendues et corrigées apparaîtront ici.</div>');
    html += list.map(function (d, k) {
      var done = d.statut === "corrige", at = dateOf(d.created_at), neuf = done && !v[d.id];

        '<div class="np-row-txt"><b>' + esc(d.titre) + "</b><span>" + esc(d.matiere) + (at ? " · rendue le " + esc(jour(at)) : "") + (done && d.corrige_par ? " · corrigée par " + esc(d.corrige_par) : "") + "</span></div>" +
        (neuf ? '<span class="nv-tag live">NOUVEAU</span>' : "") +
        (d.note ? '<span class="np-note">' + esc(d.note) + "</span>" : '<span class="nv-tag' + (done ? " solid" : "") + '">' + (done ? "CORRIGÉE" : "EN CORRECTION") + "</span>") + "</button>";
    }).join("");
    setPage(html);
  }
  // Dépôt d'un fichier : une fenêtre, trois champs.
  var DEP = { file: null, busy: false };
  function popDeposer() {
    var mats = matieresOuvertes();
    if (!mats.length) return toast("Aucune matière ouverte.", true);
    DEP = { file: null, busy: false };
    pop("<small>Nouvelle copie</small><h4>Déposer un fichier</h4><p>NAVIRE met ta copie en forme ; ton correcteur la corrige directement dessus.</p>" +
      (mats.length > 1 ? '<label class="nv-field"><span>Matière</span><select class="nv-input" data-el="dep-mat">' + mats.map(function (m) { return '<option value="' + esc(m.matiere_key) + '">' + esc(m.label) + "</option>"; }).join("") + "</select></label>" : "") +
      '<label class="nv-field"><span>Titre</span><input class="nv-input" data-el="dep-titre" maxlength="200" placeholder="Ex. Dissertation n° 2, la coutume"></label>' +
      '<label class="np-drop" data-el="dep-drop"><input type="file" accept=".docx,.pdf" data-el="dep-file"><span class="np-row-ico">' + ico("up", 17) + '</span><div><b data-el="dep-name">Choisir ma copie</b><span>.docx ou .pdf · ' + taille(S.p.devoir_max_bytes) + " max</span></div></label>" +
      '<div class="nv-err" data-el="dep-err"></div>' +
      '<div class="np-pop-btns"><button class="nv-chip" data-act="pop-close">Annuler</button><button class="nv-btn is-blue" data-act="dep-ok" data-el="dep-ok" disabled>Envoyer</button></div>');
    var drop = el("dep-drop");
    ["dragenter", "dragover"].forEach(function (ev) { drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add("is-over"); }); });
    ["dragleave", "drop"].forEach(function (ev) { drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.remove("is-over"); }); });
    drop.addEventListener("drop", function (e) { var f = e.dataTransfer && e.dataTransfer.files[0]; if (f) depFile(f); });
  }
  function depFile(f) {
    if (!/\.(pdf|docx)$/i.test(f.name)) return toast("Dépose un fichier .docx ou .pdf.", true);
    if (f.size > S.p.devoir_max_bytes) return toast("Fichier trop lourd (" + taille(S.p.devoir_max_bytes) + " max).", true);
    DEP.file = f;
    el("dep-name").textContent = f.name;
    var t = el("dep-titre"); if (t && !t.value) t.value = f.name.replace(/\.(pdf|docx)$/i, "").replace(/[_-]+/g, " ").slice(0, 200);
    el("dep-ok").disabled = false;
  }
  function depEnvoyer(b) {
    if (DEP.busy || !DEP.file) return;
    var mats = matieresOuvertes(), m = el("dep-mat") ? el("dep-mat").value : mats[0].matiere_key;
    var fd = new FormData();
    fd.append("file", DEP.file); fd.append("matiere_key", m); fd.append("titre", el("dep-titre").value || ""); fd.append("message", "");
    DEP.busy = true; b.disabled = true; b.textContent = "Mise en forme…";
    upload("/lib/prepa/devoirs", fd).then(function (d) {
      S.p.devoirs = [d].concat(devoirs());
      popClose(); toast("Copie envoyée à ton correcteur."); show("copies");
    }).catch(function (x) { DEP.busy = false; b.disabled = false; b.textContent = "Envoyer"; el("dep-err").textContent = x.message; });
  }

  // ---------- Cours ----------
  function book(d, suivi) {

  var REGLES = '<ul class="np-rules"><li>Un écran blanc sur tout l\'écran, le compte à rebours en haut.</li><li>Le sujet et un brouillon s\'ouvrent sur le côté.</li><li>Ta copie s\'enregistre au fil de l\'eau.</li><li><b>Quitter la page abandonne l\'épreuve</b> : elle ne pourra plus être rendue.</li></ul>';

  // Commencer : le plein écran est demandé tout de suite (geste de l'utilisateur),

  // ================= ÉCRAN D'ÉCRITURE =================
  // Une colonne blanche, un titre, le texte. Intertitres, gras, italique et
  // citation dans la barre du haut (ou Ctrl/⌘ B, I). Enregistrement : sur
  // l'appareil à chaque frappe, sur le serveur toutes les 8 secondes (épreuve).
  function wrQ(sel) { return WR.node.querySelector(sel); }
  function wrToast(msg, isError) {
    var t = document.createElement("div");
    t.className = "nvx-toast" + (isError ? " is-error" : "");
    t.textContent = msg;
    WR.node.appendChild(t);
    setTimeout(function () { t.remove(); }, 2600);
  }
  function wrOpen(o) {
    if (WR.node) wrClose(true);
    var ep = o.mode === "epreuve";
    WR.mode = o.mode; WR.sess = null; WR.dirty = false; WR.sorties = 0; WR.panel = null; WR.file = null;

        '<div class="nvx-info" data-w-el="info">' + (ep ? '<span class="nvx-clock" data-w-el="clock">…</span><span data-w-el="step"></span>' : '<span data-w-el="mots">0 mot</span>') + "</div>" +
        '<button class="nvx-b nvx-hide-n" data-w="fmt" data-f="h" title="Intertitre">Titre</button>' +

        '<span class="nvx-sep nvx-hide-n"></span>' +
        (ep ? '<button class="nvx-b" data-w="panel" data-p="sujet">Sujet</button>' : "") +
        '<button class="nvx-b" data-w="panel" data-p="notes">Brouillon</button>' +
        '<span class="nvx-save nvx-hide-n" data-w-el="save"></span>' +
        '<button class="nvx-b is-main" data-w="rendre">Rendre</button>' +
      "</div>" +
      '<div class="nvx-prog">' + (ep ? '<i data-w-el="prog"></i>' : "") + "</div>" +
      '<div class="nvx-body"><div class="nvx-col">' +
        (ep ? '<div class="nvx-kicker" data-w-el="kicker"></div><div class="nvx-h1" data-w-el="h1"></div><div class="nvx-meta" data-w-el="meta"></div>'
            : '<input class="nvx-titre" data-w-el="titre" maxlength="200" placeholder="Titre de ta copie">') +
        '<div class="nvx-ed is-empty" data-w-el="ed" contenteditable="' + (ep ? "false" : "true") + '" spellcheck="' + (ep ? "false" : "true") + '" data-ph="Commence à écrire…"><p><br></p></div>' +
      "</div></div>" +
      '<aside class="nvx-panel" data-w-el="panel"><div class="nvx-panel-head"><b data-w-el="panel-t"></b><span data-w-el="panel-x2"></span><button class="nvx-b" data-w="panel-x">Fermer</button></div>' +
        '<div class="nvx-panel-body" data-w-el="sujet"></div><textarea data-w-el="notes" placeholder="Ton brouillon : idées, plan, références. Il reste ici, il n\'est pas envoyé."></textarea></aside>' +
      '<div class="nvx-modal" data-w-el="modal"><div class="nvx-card" data-w-el="card"></div></div>';
    WR.node = n;

    if (ep) {

      wrCount();
      setTimeout(function () { (d && d.titre ? wrQ('[data-w-el="ed"]') : wrQ('[data-w-el="titre"]')).focus(); }, 60);

    }
  }
  // La session est là : chrono, sujet, brouillon, garde-fou « quitter = abandonner ».
  function wrLoad(sess) {
    if (!WR.node) return;
    setSkew(sess.server_now);
    WR.sess = sess;
    WR.key = sess.essai ? null : "navire_prepa_wr_s" + sess.id;
    var E = EPREUVES[sess.type] || EPREUVES.dissertation;
    wrQ('[data-w-el="kicker"]').textContent = E.label + (sess.matiere ? " · " + sess.matiere : "") + (sess.essai ? " · essai" : "");
    wrQ('[data-w-el="h1"]').textContent = sess.titre;
    wrQ('[data-w-el="meta"]').textContent = duree(sess.duree_minutes) + (sess.sujet ? " · le sujet est dans « Sujet », en haut" : "");
    wrQ('[data-w-el="sujet"]').textContent = sess.sujet || "Pas de sujet en texte.";
    if (sess.sujet_pdf) wrQ('[data-w-el="panel-x2"]').innerHTML = '<button class="nvx-b" data-w="sujet-pdf">PDF du sujet</button>';
    // Brouillon : le plus récent entre l'appareil et le serveur.
    var loc = WR.key ? loadJ(WR.key) : null, srv = sess.brouillon;
    var pick = loc && (!srv || (loc.at || 0) >= Date.parse(srv.saved_at || 0)) ? loc : srv;
    if (pick) { wrSetBlocs(pick.blocs); wrQ('[data-w-el="notes"]').value = pick.notes || ""; }
    WR.sorties = (loc && loc.sorties) || 0;

  function wrTick() {

    var c = wrQ('[data-w-el="clock"]');
    c.textContent = reste > 0 ? hms(reste) : "Temps écoulé";
    c.classList.toggle("is-late", reste > 0 && reste < 300);
    c.classList.toggle("is-over", reste <= 0);

      "<b>" + esc(et[k].titre) + "</b>" + (nxt ? " · ensuite " + esc(nxt.titre.toLowerCase()) + " dans " + hms((nxt.debut - m) * 60).replace(/:\d\d$/, "").replace(/^(\d+)$/, "$1 min") : "") + " · " + mots + " mot" + (mots > 1 ? "s" : "");
  }
  function wrMots() { var t = (wrQ('[data-w-el="ed"]').innerText || "").trim(); return t ? t.split(/\s+/).length : 0; }
  function wrCount() { if (WR.mode !== "epreuve") { var n = wrMots(); wrQ('[data-w-el="mots"]').textContent = n + " mot" + (n > 1 ? "s" : ""); } }
  function wrSaveLabel(t) { var s = wrQ('[data-w-el="save"]'); if (s) s.textContent = t; }

  // Texte de l'éditeur → blocs {t, runs} (format des copies NAVIRE).
  function wrBlocs() {
    var out = [], ed = wrQ('[data-w-el="ed"]');
    var BLOC = /^(P|DIV|H1|H2|H3|H4|H5|H6|BLOCKQUOTE|LI|UL|OL|SECTION|ARTICLE)$/;
    function typeOf(tag, parent) { return /^H[1-6]$/.test(tag) ? "h" : tag === "BLOCKQUOTE" ? "quote" : parent || "p"; }
    function walk(node, type) {
      var cur = { t: type, runs: [] };
      function flush() { if (cur.runs.some(function (r) { return r[0].trim(); })) out.push(cur); cur = { t: type, runs: [] }; }
      (function inline(n, g, i) {
        Array.prototype.forEach.call(n.childNodes, function (c) {

          if (c.nodeType !== 1) return;

    var id = RD.id; if (!id) return;
    toast("Préparation du fichier…");
    fetch(CONFIG.API + "/lib/prepa/devoirs/" + id + "/export?format=" + fmt, { headers: { Authorization: "Bearer " + S.token } })
      .then(function (r) { if (!r.ok) return handle(r); return r.blob().then(function (b) { return { b: b, h: r.headers.get("content-disposition") || "" }; }); })
      .then(function (x) {
        var m = /filename\*=UTF-8''([^;]+)/i.exec(x.h), nom = m ? decodeURIComponent(m[1]) : "copie." + fmt;
        var url = URL.createObjectURL(x.b), a = document.createElement("a");
        a.href = url; a.download = nom; document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
      }).catch(function (x) { toast(x.message, true); });
  }
  function ouvrirFichier(path) {
    var w = window.open("", "_blank");
    fetch(CONFIG.API + path, { headers: { Authorization: "Bearer " + S.token } })
      .then(function (r) { if (!r.ok) throw new Error("Fichier indisponible."); return r.blob(); })
      .then(function (b) { var u = URL.createObjectURL(b); if (w) w.location.href = u; else window.open(u, "_blank"); })
      .catch(function (x) { if (w) w.close(); toast(x.message, true); });
  }

  // ================= ÉVÉNEMENTS =================
  root.addEventListener("click", function (e) {
    var t = e.target.closest("[data-unfollow],[data-ep-start],[data-ep-go],[data-ep-type],[data-ep-reprendre],[data-act],[data-view],[data-voir],[data-cal],[data-calmode],[data-seance],[data-copie],[data-doc],[data-href]");
    if (!t || !root.contains(t)) return;
    if (t.hasAttribute("data-unfollow")) { e.stopPropagation(); return unfollow(t.getAttribute("data-unfollow")); }
    if (t.hasAttribute("data-ep-start")) return popPlanifiee(+t.getAttribute("data-ep-start"));
    if (t.hasAttribute("data-ep-go")) return lancer({ epreuve_id: +t.getAttribute("data-ep-go") });
    if (t.hasAttribute("data-ep-type")) return popLibre(t.getAttribute("data-ep-type"));
    if (t.hasAttribute("data-ep-reprendre")) return reprendre(+t.getAttribute("data-ep-reprendre"));
    if (t.hasAttribute("data-view")) return show(t.getAttribute("data-view"));
    if (t.hasAttribute("data-voir")) { S.voir = t.getAttribute("data-voir"); store("navire_prepa_voir", S.voir); store("navire_prepa_niveau", S.voir); return charger(); }
    if (t.hasAttribute("data-cal")) {
      var c = S.cal, a = t.getAttribute("data-cal");
      if (a === "today") c.ref = new Date();
      else if (c.mode === "semaine") c.ref = plusJours(c.ref, a === "next" ? 7 : -7);
      else c.ref = new Date(c.ref.getFullYear(), c.ref.getMonth() + (a === "next" ? 1 : -1), 1);
      var y = FLOW.y(); viewSemaine(); FLOW.to(y); return;
    }
    if (t.hasAttribute("data-calmode")) { S.cal.mode = t.getAttribute("data-calmode"); store("navire_prepa_cal", S.cal.mode); var y2 = FLOW.y(); viewSemaine(); FLOW.to(y2); return; }
    if (t.hasAttribute("data-seance")) return popSeance(t.getAttribute("data-seance"));
    if (t.hasAttribute("data-copie")) return rdOpen(t.getAttribute("data-copie"));
    if (t.hasAttribute("data-doc")) return go(CONFIG.LIB_URL + "?doc=" + t.getAttribute("data-doc"));
    if (t.hasAttribute("data-href")) return window.open(t.getAttribute("data-href"), "_blank", "noopener");
    switch (t.getAttribute("data-act")) {
      case "side-close": return root.classList.contains("is-compact") ? root.classList.remove("is-drawer") : setSide(false);
      case "side-open": return root.classList.contains("is-compact") ? root.classList.add("is-drawer") : setSide(true);
      case "close-drawer": return root.classList.remove("is-drawer");
      case "pop-close": if (e.target === t || t.tagName === "BUTTON") popClose(); return;
      case "login": return go(CONFIG.LOGIN_URL);
      case "vue-etudiant":
        S.voir = S.voir ? null : (load("navire_prepa_niveau") || "L1");
        store("navire_prepa_voir", S.voir);
        return charger();
      case "ecrire": return S.p.apercu ? toast("Vue étudiant : lecture seule.", true) : wrOpen({ mode: "copie" });
      case "deposer": return popDeposer();
      case "dep-ok": return depEnvoyer(t);
      case "ep-libre-go": return lancer({ type: S.libre.type, matiere_key: S.libre.matiere, sujet: S.libre.sujet });
    }
  });
  root.addEventListener("keydown", function (e) { if (e.key === "Escape") { popClose(); root.classList.remove("is-drawer"); } });
  document.addEventListener("keydown", function (e) {
    if (e.key !== "Escape") return;
    if (WR.node && WR.node.querySelector('[data-w-el="modal"].is-on')) return wrModalClose();
    if (WR.node && WR.panel) return wrPanel(null);
    if (RD.node && !document.fullscreenElement) rdClose();
  });
  root.addEventListener("change", function (e) {
    var k = e.target.getAttribute && e.target.getAttribute("data-libre");
    if (k) { S.libre[k] = e.target.value; return; }
    if (e.target.getAttribute && e.target.getAttribute("data-el") === "dep-file" && e.target.files[0]) depFile(e.target.files[0]);
  });
  root.addEventListener("input", function (e) {
    var k = e.target.getAttribute && e.target.getAttribute("data-libre");
    if (k) S.libre[k] = e.target.value;
  });

  // ================= DÉMARRAGE =================
  function charger() {
    renderSide();
    setTitle("Prépa");
    setPage('<div class="np-cards"><div class="nv-skel" style="height:128px"></div><div class="nv-skel" style="height:128px"></div><div class="nv-skel" style="height:128px"></div></div><div class="nv-skel" style="height:240px;margin-top:28px"></div>', true);
    return api("GET", "/lib/prepa" + voirQ()).then(function (p) {
      S.p = p;
      S.ep = null; chargerEpreuves();
      var copie = pageParam("copie"), onglet = pageParam("onglet");
      show(onglet === "rendre" ? "copies" : VIEWS.indexOf(onglet) >= 0 ? onglet : S.view);
      if (copie && p.prepa && !p.apercu) rdOpen(copie);
    }).catch(function (x) {
      if (x.status === 401) { S.token = null; return renderLogin(); }
      setPage('<div class="nv-empty"><b>Prépa indisponible</b>' + esc(x.message) + "</div>");
    });
  }
  S.token = load(CONFIG.TOKEN_KEY);
  S.cal.mode = load("navire_prepa_cal") === "mois" ? "mois" : "semaine";
  if (!S.token) return renderLogin();
  api("GET", "/auth/me").then(function (u) { S.me = u; }).catch(function () {}).then(function () {
    if (S.me && S.me.is_admin) S.voir = load("navire_prepa_voir") || null;
    return charger();
  });
  // Les séances passent « en cours » : on relit l'emploi du temps toutes les deux minutes.
  setInterval(function () {
    if (!S.token || !S.p || !S.p.prepa || S.view !== "semaine" || IMM.on) return;
    api("GET", "/lib/prepa" + voirQ()).then(function (p) { S.p = p; if (S.view === "semaine" && !IMM.on) { renderSide(); var sc = FLOW.y(); viewSemaine(); FLOW.to(sc); } }).catch(function () {});
  }, 120000);
})();
</script>
