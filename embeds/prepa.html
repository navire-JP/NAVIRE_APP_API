<!--
  NAVIRE, embed de l'onglet Prépa (page /prepa), réservé aux inscrits
  Prép'AdJuris. Sorti de NAVIRE Lib : Lib garde ses documents à pastille
  « Prépa » et le bouton « Suivre dans Prépa ».
  ======================================================================
  Même DA que l'accueil, le profil et NAVIRE Lib : bleu et blanc, sans
  traits, barre latérale masquable (retenue d'une visite à l'autre), menu
  tiroir sous 760 px ; prend la hauteur de l'écran sous sa position.

  Rubriques (lien direct /prepa?onglet=…) :
    semaine   calendrier des cours (semaine / mois) tel que prévu ou déplacé
              dans la console : séance annulée barrée, séance déplacée avec
              sa date d'origine, « En cours » quand le professeur a lancé le
              cours sur Discord, Rejoindre ;
    copies    les copies rendues : mises en forme par NAVIRE, avec les
              révisions (barré, ajouté, surligné) et les commentaires du
              correcteur dans la marge une fois la correction rendue ;
              téléchargement .docx (révisions Word) ou .pdf ;
              lien direct vers une copie : /prepa?copie=12 ;
    rendre    déposer une copie (.docx ou .pdf texte) ;
    cours     les cours suivis depuis NAVIRE Lib (« Suivre dans Prépa ») et
              ceux de la classe, qui s'ouvrent dans Lib ;
    factu     prochain prélèvement par matière, lien vers les factures ;
    epreuves  épreuves planifiées par le professeur (ouverture, disponibilité,
              durée) et entraînement libre (dissertation, commentaire d'arrêt,
              cas pratique, fiche d'arrêt). L'écran d'épreuve est épuré : un
              chrono lumineux, l'étape en cours en une phrase, la suivante en
              plus petit ; le sujet en panneau ; « Rendre ma copie » envoie la
              copie au correcteur. Le chrono est tenu par le serveur (reprise
              après rechargement).
  En bas du menu : Discord, NAVIRE Lib, et pour les admins une case
  « Vue étudiant » (à cocher / décocher) qui montre l'onglet tel qu'un
  étudiant du niveau choisi (L1, L2, L3, M1) le voit, en lecture seule.

  Données : GET /lib/prepa, POST /lib/prepa/devoirs,
            GET /lib/prepa/devoirs/{id}/copie, …/export?format=docx|pdf,
            DELETE /lib/prepa/suivis/{id}.
  Réglages : bloc CONFIG du script.
-->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>

  --text-4: rgba(255,255,255,0.28);
  --blue: #7AA7FF;
  --blue-hi: #B5CDFF;
  --blue-deep: #4F7DFF;

/* Zone principale */
#nv-prepa .nv-main { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; position: relative; }

  function setPageParam(name, value) {

  }
  function voirQ() { return S.voir ? "?voir_comme=" + S.voir : ""; }
  function dateOf(iso) { var d = new Date(iso); return isNaN(d.getTime()) ? null : d; }

  function jour(d, long) {

  }
  function memeJour(a, b) { return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate(); }
  function lundi(d) { var x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); var k = (x.getDay() + 6) % 7; x.setDate(x.getDate() - k); return x; }

    next: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>',
    x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>',
    tick: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
    timer: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6"/></svg>',
    lock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>'
  };

  // ================= DÉFILEMENT : la page du site défile, pas l'embed =================
  // L'embed prend la hauteur de son contenu ; la page du site défile. La barre
  // latérale, la barre du haut et les fenêtres suivent la partie visible de
  // l'embed, calée sur la hauteur de l'écran (variables --vis-top, --vis-h).
  // Repli « is-boxed » (iframe d'une autre origine, la page du site est
  // inaccessible) : hauteur de l'écran, le contenu défile dans l'embed.
  var FRAMED = window.self !== window.top, HOST = null, frameEl = null, wrappers = [];
  if (FRAMED) {
    var hideBar = document.createElement("style");
    hideBar.textContent = "html,body{margin:0;scrollbar-width:none;overflow:hidden}html::-webkit-scrollbar,body::-webkit-scrollbar{display:none;width:0;height:0}";
    document.head.appendChild(hideBar);
    try { if (window.frameElement && window.parent.document) { HOST = window.parent; frameEl = window.frameElement; } } catch (e) {}
    if (frameEl) for (var n = frameEl.parentElement, i = 0; n && i < 4 && n !== HOST.document.body; i++, n = n.parentElement) wrappers.push(n);
  }
  var BOXED = FRAMED && !HOST;
  root.classList.add(BOXED ? "is-boxed" : "is-flow");
  var FLOW = (function () {
    var subs = [], ticking = false;
    function win() { return HOST || window; }
    function vh() { return win().innerHeight || 800; }
    function page() { return el("page"); }
    // Haut de l'embed dans la fenêtre du site.
    function rootTop() { return (frameEl ? frameEl.getBoundingClientRect().top : 0) + root.getBoundingClientRect().top; }
    function barH() { var b = root.querySelector(".nv-topbar"); return b && b.offsetParent ? b.offsetHeight : 0; }
    var F = {
      boxed: BOXED,
      // Défilement lu depuis le haut de l'embed.
      y: function () { return BOXED ? page().scrollTop : Math.max(0, -rootTop()); },
      to: function (y, smooth) {
        y = Math.max(0, y || 0);
        if (BOXED) { page().scrollTo({ top: y, behavior: smooth ? "smooth" : "auto" }); return; }
        var w = win();
        w.scrollTo({ top: Math.max(0, (w.scrollY || w.pageYOffset || 0) + rootTop() + y), behavior: smooth ? "smooth" : "auto" });
      },
      // Position d'un élément, dans le même repère que y().
      elY: function (node) {
        if (BOXED) return node.getBoundingClientRect().top - page().getBoundingClientRect().top + page().scrollTop;
        return node.getBoundingClientRect().top - root.getBoundingClientRect().top;
      },
      toEl: function (node, off, smooth) { if (node) F.to(F.elY(node) - (off == null ? 16 : off) - (BOXED ? 0 : barH()), smooth); },
      // Changement de vue : on remonte en haut de l'embed s'il est dépassé.
      top: function () { if (BOXED) page().scrollTop = 0; else if (rootTop() < 0) F.to(0); },
      // Part lue (0 à 1) de la vue.
      progress: function () {
        if (BOXED) { var p = page(), m = p.scrollHeight - p.clientHeight; return m > 0 ? p.scrollTop / m : 0; }
        var max = root.offsetHeight - vh() + Math.max(0, rootTop() + F.y());

      },
      onScroll: function (fn) { subs.push(fn); },
      layout: function () {
        if (BOXED) { root.style.setProperty("--vis-top", "0px"); root.style.setProperty("--vis-h", root.offsetHeight + "px"); return; }
        var rt = rootTop(), rh = root.offsetHeight, h = vh();
        var visH = Math.max(200, Math.min(h, rt + rh) - Math.max(0, rt));
        var visTop = Math.max(0, Math.min(-rt, rh - visH));
        root.style.setProperty("--vis-top", Math.round(visTop) + "px");
        root.style.setProperty("--vis-h", Math.round(visH) + "px");
      },
      size: function () {
        var w = win();
        if (BOXED) {
          var hb = Math.max(560, Math.round((window.screen && window.screen.availHeight || 900) - 180));
          root.style.height = hb + "px";
          try { window.parent.postMessage({ type: "NAVIRE_EMBED_HEIGHT", height: hb }, "*"); } catch (e) {}
          F.layout();
          return;
        }
        var top = rootTop() + (w.scrollY || w.pageYOffset || 0);
        root.style.height = "auto";
        root.style.minHeight = Math.max(560, Math.round(vh() - top - 12)) + "px";
        var h = root.offsetHeight;
        if (frameEl) {
          frameEl.style.height = h + "px"; frameEl.style.minHeight = h + "px";

        }

      }

  function sizeApp() { FLOW.size(); }

  function updateCompact() {
    var w = root.clientWidth;
    root.classList.toggle("is-compact", w < 760);
    var page = el("page");

  function setSide(on) { root.classList.toggle("is-side-off", !on); store("navire_prepa_side", on ? null : "off"); setTimeout(updateCompact, 320); }
  root.classList.toggle("is-side-off", load("navire_prepa_side") === "off");

  function setPage(html, wide) {

  function setTitle(t) { el("title").textContent = t; }

  // ================= DONNÉES =================
  function seances() { return (S.p && S.p.seances) || []; }

  function nonLues() {

  }
  function seanceLien(s) { return lienSur(s.lien) || lienSur(S.p && S.p.discord_url); }
  function etat(s) {

  // ================= BARRE LATÉRALE =================

  function viewSemaine() {
    setTitle("Calendrier");
    var c = S.cal, now = new Date(), html = hero();
    var compact = root.classList.contains("is-compact");
    var mode = compact && c.mode === "semaine" ? "liste" : c.mode;
    var titre;
    if (c.mode === "semaine") {
      var l = lundi(c.ref), dim = plusJours(l, 6);
      titre = l.getMonth() === dim.getMonth()
        ? l.getDate() + " – " + dim.getDate() + " " + dim.toLocaleDateString("fr-FR", { month: "long", year: "numeric" })
        : l.toLocaleDateString("fr-FR", { day: "numeric", month: "short" }) + " – " + dim.toLocaleDateString("fr-FR", { day: "numeric", month: "short", year: "numeric" });
    } else {
      titre = c.ref.toLocaleDateString("fr-FR", { month: "long", year: "numeric" });
    }
    html += '<div class="np-calbar"><h3>' + esc(titre) + '</h3>' +
      '<button class="nv-icon-btn" data-cal="prev" aria-label="Précédent">' + ICON.back + '</button>' +
      '<button class="nv-chip" data-cal="today">Aujourd\'hui</button>' +

      '<div class="np-seg2"><button data-calmode="semaine"' + (c.mode === "semaine" ? ' class="is-on"' : "") + '>Semaine</button><button data-calmode="mois"' + (c.mode === "mois" ? ' class="is-on"' : "") + '>Mois</button></div></div>';

    var parJour = {};
    seances().forEach(function (s) { var d = dateOf(s.date_debut); if (!d) return; var k = d.toDateString(); (parJour[k] = parJour[k] || []).push(s); });

    if (mode === "semaine") {
      var l2 = lundi(c.ref);
      html += '<div class="np-week">';
      for (var i = 0; i < 7; i++) {
        var dj = plusJours(l2, i), list = parJour[dj.toDateString()] || [];
        var past = dj < new Date(now.getFullYear(), now.getMonth(), now.getDate());
        html += '<div class="np-wday' + (memeJour(dj, now) ? " is-today" : "") + (past ? " is-past" : "") + '"><div class="np-wday-head">' +
          esc(dj.toLocaleDateString("fr-FR", { weekday: "short" }).replace(".", "")) + '<b>' + dj.getDate() + '</b></div>' + list.map(function (s) { return evHtml(s); }).join("") + '</div>';
      }
      html += '</div>';
    } else if (mode === "liste") {
      var l3 = lundi(c.ref), any = false;
      html += '<div class="np-agenda">';
      for (var j = 0; j < 7; j++) {
        var dd = plusJours(l3, j), ls = parJour[dd.toDateString()] || [];
        if (!ls.length) continue;
        any = true;
        html += '<div class="np-day' + (memeJour(dd, now) ? " is-today" : "") + '">' + (memeJour(dd, now) ? "Aujourd'hui · " : "") + esc(jour(dd, true)) + '</div>' + ls.map(rowSeance).join("");
      }
      if (!any) html += '<div class="nv-empty"><b>Semaine libre</b>Aucun cours cette semaine.</div>';
      html += '</div>';
    } else {
      var premier = new Date(c.ref.getFullYear(), c.ref.getMonth(), 1), start = lundi(premier);
      html += '<div class="np-month">' + ["lun", "mar", "mer", "jeu", "ven", "sam", "dim"].map(function (x) { return '<div class="np-mhead">' + x + '</div>'; }).join("");
      var finMois = new Date(c.ref.getFullYear(), c.ref.getMonth() + 1, 0);
      var cases = Math.ceil((Math.round((finMois - start) / 86400000) + 1) / 7) * 7;
      for (var k = 0; k < cases; k++) {
        var dm = plusJours(start, k);
        var lm = parJour[dm.toDateString()] || [];
        html += '<div class="np-mday' + (dm.getMonth() !== c.ref.getMonth() ? " is-other" : "") + (memeJour(dm, now) ? " is-today" : "") + '"><span>' + dm.getDate() + '</span>' + lm.map(function (s) { return evHtml(s, true); }).join("") + '</div>';
      }
      html += '</div>';
    }
    html += '<div class="np-legend"><span><i style="background:rgba(122,167,255,0.5)"></i>Cours prévu</span><span><i style="background:var(--ins)"></i>En cours</span><span><i style="background:var(--panel-3)"></i>Annulé (barré)</span><span><i style="box-shadow:inset 2px 0 0 var(--blue);background:rgba(122,167,255,0.14)"></i>Déplacé</span></div>';
    if (!seances().length) html += '<div class="nv-empty"><b>Calendrier vide</b>Aucune séance n\'est encore programmée pour tes matières.</div>';
    setPage(html, true);
  }

  // Découpe d'un bloc en morceaux avec ses annotations (même règle que l'API, services/copies.py).
  function morceaux(b, anns) {
    var text = b.text || "", n = text.length, B = {}, styles = [], pos = 0;
    B[0] = 1; B[n] = 1;
    (b.runs && b.runs.length ? b.runs : [[text, false, false]]).forEach(function (r) { styles.push([pos, pos + r[0].length, r[1], r[2]]); pos += r[0].length; B[pos] = 1; });
    anns.forEach(function (a) { B[Math.max(0, Math.min(n, a.debut))] = 1; B[Math.max(0, Math.min(n, a.fin))] = 1; });
    var bs = Object.keys(B).map(Number).sort(function (x, y) { return x - y; }), out = [];
    for (var k = 0; k < bs.length; k++) {
      var p = bs[k];
      anns.forEach(function (a) { if (a.type === "correction" && a.fin === p && a.texte) out.push({ k: "ins", t: a.texte, a: a.id, at: p }); });
      if (k + 1 >= bs.length) break;
      var q = bs[k + 1];
      if (q <= p) continue;
      var st = styles.filter(function (s) { return s[0] <= p && p < s[1]; })[0] || [0, 0, false, false];
      var barre = anns.filter(function (a) { return a.type === "correction" && a.debut <= p && p < a.fin; })[0];
      out.push({
        k: "txt", t: text.slice(p, q), o: p, g: st[2], i: st[3], barre: barre ? barre.id : null,
        hl: anns.some(function (a) { return a.type === "surligne" && a.debut <= p && p < a.fin; }),
        coms: anns.filter(function (a) { return commente(a) && a.debut <= p && p < a.fin; }).map(function (a) { return a.id; })
      });
    }
    return out;
  }
  function commente(a) { return a.type === "commentaire" || (a.type === "surligne" && !!a.texte); }
  function copieHtml(data, numeros) {
    var parBloc = {};
    (data.annotations || []).forEach(function (a) { (parBloc[a.bloc] = parBloc[a.bloc] || []).push(a); });
    var vus = {};
    return (data.blocs || []).map(function (b) {
      if (b.t === "table") return '<table data-bloc="' + esc(b.id) + '">' + (b.rows || []).map(function (r) { return "<tr>" + r.map(function (c) { return "<td>" + esc(c) + "</td>"; }).join("") + "</tr>"; }).join("") + '</table>';
      var anns = parBloc[b.id] || [];
      var inner = morceaux(b, anns).map(function (m) {
        if (m.k === "ins") return '<span class="cx-ins" data-ins="1" data-a="' + m.a + '">' + esc(m.t) + '</span>';
        var t = esc(m.t);
        if (m.g) t = "<b>" + t + "</b>";
        if (m.i) t = "<i>" + t + "</i>";
        var cls = ["cx-t"];
        if (m.barre) cls.push("cx-del");
        if (m.hl) cls.push("cx-hl");
        if (m.coms.length) cls.push("cx-com");
        var num = "";
        m.coms.forEach(function (id) {
          var a = anns.filter(function (x) { return x.id === id; })[0];
          if (a && m.o + m.t.length === Math.min(a.fin, b.text.length) && !vus[id]) { vus[id] = 1; num += '<sup class="cx-num" data-note="' + id + '">' + numeros[id] + '</sup>'; }
        });
        return '<span class="' + cls.join(" ") + '" data-o="' + m.o + '"' + (m.barre ? ' data-a="' + m.barre + '"' : "") + (m.coms.length ? ' data-c="' + m.coms.join(" ") + '"' : "") + '>' + t + '</span>' + num;
      }).join("");
      var tag = b.t === "titre" ? "h2" : b.t === "h" ? "h3" : "p";
      var cls2 = b.t === "titre" ? "cx-titre" : b.t === "h" ? "cx-h" : b.t === "quote" ? "cx-quote" : "";
      var notes = anns.filter(commente).map(function (a) { return noteHtml(a, numeros); }).join("");
      return '<' + tag + ' class="' + cls2 + '" data-bloc="' + esc(b.id) + '">' + inner + '</' + tag + '>' + (notes ? '<div class="cx-inline-notes">' + notes + '</div>' : "");
    }).join("");
  }
  // Photo de profil du correcteur (initiale à défaut).
  function avatar(url, nom, size) {
    var st = 'width:' + size + 'px;height:' + size + 'px';
    if (lienSur(url)) return '<span class="cx-pp" style="' + st + ';background-image:url(&quot;' + esc(url) + '&quot;)"></span>';
    return '<span class="cx-pp is-letter" style="' + st + ';font-size:' + Math.round(size * 0.45) + 'px">' + esc(String(nom || "C").trim().charAt(0).toUpperCase()) + '</span>';
  }
  function noteHtml(a, numeros) {
    return '<div class="cx-note" data-note="' + a.id + '"><small>' + avatar(a.auteur_avatar, a.auteur, 20) + '<span>' + numeros[a.id] + ' · ' + esc(a.auteur || "Correcteur") + (a.type === "surligne" ? " · surligné" : "") + '</span></small>' + esc(a.texte) + '</div>';
  }
  function numeroter(data) {
    var ordre = {}, idx = {};
    (data.blocs || []).forEach(function (b, i) { idx[b.id] = i; });
    var coms = (data.annotations || []).filter(commente).sort(function (x, y) { return (idx[x.bloc] - idx[y.bloc]) || (x.debut - y.debut) || (x.id - y.id); });
    coms.forEach(function (a, i) { ordre[a.id] = i + 1; });
    return { map: ordre, list: coms };
  }

      (d.correction ? '<a class="nv-chip" data-dl="correction">' + ico("file", 14) + 'Copie corrigée jointe</a>' : "") + '</div></div>';

    } else if (!done) {
      html += '<div class="cx-wait">Ta copie est entre les mains de ton correcteur. Ses révisions et ses commentaires apparaîtront ici dès qu\'il aura rendu la correction.</div>';
    }
    if (anns.length) html += '<div class="cx-legend"><span><span class="cx-del">barré</span> à retirer</span><span><span class="cx-ins">souligné vert</span> ajouté</span><span><span class="cx-hl">&nbsp;surligné&nbsp;</span> à revoir</span>' + (num.list.length ? '<span><span class="cx-com">&nbsp;souligné bleu&nbsp;</span> commentaire (' + num.list.length + ')</span>' : "") + (nbCor ? '<span>' + nbCor + ' correction' + (nbCor > 1 ? "s" : "") + '</span>' : "") + '</div>';
    html += '<div class="cx-layout' + (num.list.length ? "" : " is-nomargin") + '"><article class="cx-paper" data-el="paper">' + copieHtml(data, num.map) + '</article>' +
      (num.list.length ? '<aside class="cx-margin" data-el="margin">' + num.list.map(function (a) { return noteHtml(a, num.map); }).join("") + '</aside>' : "") + '</div>';

  // Commentaires dans la marge, alignés sur leur passage, sans se chevaucher.
  function placeNotes() {
    var m = el("margin"), paper = el("paper");
    if (!m || !paper || !m.offsetParent) return;
    var base = paper.getBoundingClientRect().top, bas = 0;
    m.querySelectorAll(".cx-note").forEach(function (n) {

      var anc = paper.querySelector('[data-c~="' + id + '"]');
      var top = anc ? anc.getBoundingClientRect().top - base : bas;
      top = Math.max(top, bas);
      n.style.top = top + "px";
      bas = top + n.offsetHeight + 8;
    });
    m.style.minHeight = bas + "px";
  }

      .then(function (x) {
        var m = /filename\*=UTF-8''([^;]+)/i.exec(x.h), nom = m ? decodeURIComponent(m[1]) : "copie." + fmt;
        var url = URL.createObjectURL(x.b), a = document.createElement("a");

  // ---------- Rendre ----------
  function viewRendre() {

    if (S.p.apercu) {   // vue étudiant (admin) : chrono d'essai, rien n'est enregistré
      var now = new Date(srvNow()).toISOString();
      return demarrer({ id: 0, essai: true, type: L.type, type_label: EPREUVES[L.type].label, titre: EPREUVES[L.type].label, matiere: "Essai", sujet: L.sujet, duree_minutes: EPREUVES[L.type].ref, started_at: now, server_now: now, statut: "en_cours" });
    }
    if (!window.confirm("Lancer le chrono ? " + EPREUVES[L.type].label + ", " + duree(EPREUVES[L.type].ref) + ".")) return;
    api("POST", "/lib/prepa/epreuves/sessions", { type: L.type, matiere_key: L.matiere, sujet: L.sujet }).then(demarrer).catch(function (e) { toast(e.message, true); });
  }
  function demarrer(sess) {
    S.libre = { type: null, matiere: S.libre.matiere, titre: "", sujet: "" };
    S.ep = null; chargerEpreuves();
    montrerExam(sess);
  }
  function ouvrirExam(id) {
    api("GET", "/lib/prepa/epreuves/sessions/" + id).then(montrerExam).catch(function (e) { store("navire_prepa_exam", null); toast(e.message, true); });
  }
  var examTimer = null;
  function montrerExam(sess) {
    setSkew(sess.server_now);
    S.exam = sess;
    if (sess.id) store("navire_prepa_exam", String(sess.id));
    var E = EPREUVES[sess.type] || EPREUVES.dissertation;
    el("exam-titre").innerHTML = '<b>' + esc(E.label) + '</b> · ' + esc(sess.titre) + (sess.matiere ? " · " + esc(sess.matiere) : "") + (sess.essai ? " · essai" : "");
    el("exam-sujet-body").textContent = sess.sujet || "Pas de sujet en texte.";
    el("exam-sujet-pdf").innerHTML = sess.sujet_pdf ? '<button class="np-ghost" data-act="exam-sujet-pdf-open">PDF du sujet</button>' : "";
    el("exam-sujet").classList.toggle("is-on", false);
    el("exam-rendre").classList.remove("is-on");
    el("exam-details").hidden = true; el("exam-dbtn").textContent = "Détails de l'étape";
    el("exam-file").value = ""; S.examFile = null; el("exam-fname").textContent = "Choisir ma copie"; el("exam-ok").disabled = true; el("exam-err").textContent = "";
    el("exam-steps").innerHTML = etapes(sess.type, sess.duree_minutes).map(function () { return "<i><em></em></i>"; }).join("");
    el("exam").classList.add("is-on");
    root.classList.remove("is-drawer");
    S.examEtape = -1;
    clearInterval(examTimer);
    tickExam();
    examTimer = setInterval(tickExam, 250);
    if (sess.statut === "terminee") el("exam-rendre").classList.add("is-on");
  }
  function tickExam() {
    var x = S.exam; if (!x) return;
    var debut = Date.parse(x.started_at), total = x.duree_minutes * 60;
    var ecoule = (srvNow() - debut) / 1000, reste = total - ecoule, ex = el("exam");
    ex.classList.toggle("is-done", reste <= 0);
    ex.classList.toggle("is-late", reste > 0 && reste < 300);
    el("exam-clock").innerHTML = reste > 0 ? hms(reste) : '0:00<small>temps écoulé</small>';
    var et = etapes(x.type, x.duree_minutes), m = ecoule / 60, k = 0;
    for (var i = 0; i < et.length; i++) if (m >= et[i].debut) k = i;
    el("exam-steps").querySelectorAll("em").forEach(function (b, i) {
      var p = i < k ? 1 : i > k ? 0 : (m - et[i].debut) / (et[i].fin - et[i].debut);
      b.style.width = Math.max(0, Math.min(1, reste <= 0 ? 1 : p)) * 100 + "%";
    });
    if (k === S.examEtape && reste > 0) return;
    S.examEtape = k;
    if (reste <= 0) {
      el("exam-step").textContent = "Pose ton stylo.";
      el("exam-hint").textContent = "Le temps est écoulé. Rends ta copie à ton correcteur.";
      el("exam-next").textContent = "";
      el("exam-details").innerHTML = "";
      return;
    }
    var cur = et[k], nxt = et[k + 1];
    el("exam-step").textContent = cur.titre;
    el("exam-hint").textContent = cur.phrase;
    var debNext = nxt ? new Date(debut + nxt.debut * 60000) : null;
    el("exam-next").textContent = nxt ? "Ensuite, à " + hms(nxt.debut * 60).replace(/:\d\d$/, "").replace(/^(\d+)$/, "0:$1") + " · " + nxt.titre : "Dernière étape";
    if (debNext) el("exam-next").title = "Vers " + hhmm(debNext);
    el("exam-details").innerHTML = cur.details.map(function (d) { return "<li>" + esc(d) + "</li>"; }).join("");
  }
  function fermerExam() {
    clearInterval(examTimer);
    try { if (document.fullscreenElement) document.exitFullscreen(); } catch (x) {}
    el("exam").classList.remove("is-on");
    S.exam = null;
    if (S.view === "epreuves") viewEpreuves();
  }
  function choisirCopieExam(f) {
    if (!/\.(pdf|docx)$/i.test(f.name)) return toast("Dépose un fichier .docx ou .pdf.", true);
    S.examFile = f;
    el("exam-fname").textContent = f.name;
    el("exam-ok").disabled = false;
  }
  function rendreExam() {
    var x = S.exam, f = S.examFile; if (!x || !f) return;
    if (x.essai) { toast("Vue étudiant : rien n'est envoyé."); return fermerExam(); }
    var b = el("exam-ok"); b.disabled = true; b.textContent = "Envoi…";
    var fd = new FormData(); fd.append("file", f); fd.append("message", el("exam-msg").value || "");
    fetch(CONFIG.API + "/lib/prepa/epreuves/sessions/" + x.id + "/rendre", { method: "POST", headers: { Authorization: "Bearer " + S.token }, body: fd })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok) throw new Error(detail(j.detail)); return j; }); })
      .then(function (r) {
        store("navire_prepa_exam", null);
        S.p.devoirs = [r.devoir].concat(S.p.devoirs || []);
        fermerExam();
        S.ep = null; chargerEpreuves();
        toast("Copie rendue à ton correcteur.");
        show("copie", r.devoir.id);
      })
      .catch(function (e) { b.disabled = false; b.textContent = "Envoyer"; el("exam-err").textContent = e.message; });
  }

  // ================= ÉVÉNEMENTS =================
  root.addEventListener("click", function (e) {
    var t0 = e.target.closest("[data-ep-start],[data-ep-type],[data-ep-reprendre]");
    if (t0 && root.contains(t0)) {
      if (t0.hasAttribute("data-ep-type")) { S.libre.type = S.libre.type === t0.getAttribute("data-ep-type") ? null : t0.getAttribute("data-ep-type"); return viewEpreuves(); }
      if (t0.hasAttribute("data-ep-start")) return lancerPlanifiee(+t0.getAttribute("data-ep-start"));
      return ouvrirExam(+t0.getAttribute("data-ep-reprendre"));
    }
    var t = e.target.closest("[data-act],[data-view],[data-voir],[data-cal],[data-calmode],[data-seance],[data-copie],[data-export],[data-dl],[data-doc],[data-unfollow],[data-note],[data-c]");
    if (!t || !root.contains(t)) return;
    if (t.hasAttribute("data-unfollow")) { e.stopPropagation(); return unfollow(t.getAttribute("data-unfollow")); }
    if (t.hasAttribute("data-view")) return show(t.getAttribute("data-view"));
    if (t.hasAttribute("data-voir")) { S.voir = t.getAttribute("data-voir") || null; store("navire_prepa_voir", S.voir); if (S.voir) store("navire_prepa_niveau", S.voir); return charger(); }
    if (t.hasAttribute("data-cal")) {
      var c = S.cal, a = t.getAttribute("data-cal");
      if (a === "today") c.ref = new Date();
      else if (c.mode === "semaine") c.ref = plusJours(c.ref, a === "next" ? 7 : -7);
      else c.ref = new Date(c.ref.getFullYear(), c.ref.getMonth() + (a === "next" ? 1 : -1), 1);
      return viewSemaine();
    }
    if (t.hasAttribute("data-calmode")) { S.cal.mode = t.getAttribute("data-calmode"); store("navire_prepa_cal", S.cal.mode); return viewSemaine(); }
    if (t.hasAttribute("data-seance")) return popSeance(t.getAttribute("data-seance"));
    if (t.hasAttribute("data-copie")) return show("copie", t.getAttribute("data-copie"));
    if (t.hasAttribute("data-export")) return exporter(t.getAttribute("data-export"));
    if (t.hasAttribute("data-dl")) return ouvrirFichier("/lib/prepa/devoirs/" + S.copie.id + "/correction");
    if (t.hasAttribute("data-doc")) return go(CONFIG.LIB_URL + "?doc=" + t.getAttribute("data-doc"));
    if (t.hasAttribute("data-note")) return focusNote(t.getAttribute("data-note"));
    if (t.hasAttribute("data-c")) return focusNote(t.getAttribute("data-c").split(" ")[0]);
    switch (t.getAttribute("data-act")) {
      case "side-close": return root.classList.contains("is-compact") ? root.classList.remove("is-drawer") : setSide(false);
      case "side-open": return root.classList.contains("is-compact") ? root.classList.add("is-drawer") : setSide(true);
      case "close-drawer": return root.classList.remove("is-drawer");
      case "pop-close": if (e.target === t || t.tagName === "BUTTON") el("pop").classList.remove("is-on"); return;
      case "login": return go(CONFIG.LOGIN_URL);
      case "vue-etudiant":
        S.voir = S.voir ? null : (load("navire_prepa_niveau") || "L1");
        store("navire_prepa_voir", S.voir);
        return charger();
      case "dv-submit": return submitDevoir();
      case "exam-sujet": el("exam-sujet").classList.toggle("is-on"); return;
      case "exam-sujet-pdf-open": return ouvrirFichier("/lib/prepa/epreuves/sessions/" + S.exam.id + "/sujet");
      case "exam-plein": try { if (document.fullscreenElement) document.exitFullscreen(); else el("exam").requestFullscreen(); } catch (x) {} return;
      case "exam-details": var ul = el("exam-details"); ul.hidden = !ul.hidden; el("exam-dbtn").textContent = ul.hidden ? "Détails de l'étape" : "Masquer les détails"; return;
      case "exam-quitter": return fermerExam();
      case "exam-rendre": el("exam-rendre").classList.add("is-on"); return;
      case "exam-rendre-annuler": el("exam-rendre").classList.remove("is-on"); return;
      case "exam-rendre-ok": return rendreExam();
      case "ep-libre-go": return lancerLibre();
    }
  });
  root.addEventListener("keydown", function (e) {
    if (e.key === "Escape") el("pop").classList.remove("is-on");
    var t = e.target.closest && e.target.closest("[data-doc]");
    if (t && e.key === "Enter") go(CONFIG.LIB_URL + "?doc=" + t.getAttribute("data-doc"));
  });
  root.addEventListener("change", function (e) {
    if (e.target.getAttribute && e.target.getAttribute("data-el") === "exam-file") { var f0 = e.target.files[0]; if (f0) choisirCopieExam(f0); return; }
    var lk = e.target.getAttribute && e.target.getAttribute("data-libre");
    if (lk) { S.libre[lk] = e.target.value; return; }
    var k = e.target.getAttribute && e.target.getAttribute("data-dv");
    if (!k) return;
    if (k === "file") { if (e.target.files[0]) pickFile(e.target.files[0]); return; }
    S.dv[k] = e.target.value;
  });
  root.addEventListener("input", function (e) {
    var lk = e.target.getAttribute && e.target.getAttribute("data-libre");
    if (lk) { S.libre[lk] = e.target.value; return; }
    var k = e.target.getAttribute && e.target.getAttribute("data-dv");
    if (k && k !== "file") S.dv[k] = e.target.value;
  });

  // ================= DÉMARRAGE =================
  function charger() {
    renderSide();
    setTitle("Prépa");
    setPage('<div class="nv-skel" style="height:96px;margin-top:10px"></div><div class="nv-skel" style="height:260px"></div>', true);
    return api("GET", "/lib/prepa" + voirQ()).then(function (p) {
      S.p = p;
      S.ep = null; chargerEpreuves();
      var copie = pageParam("copie"), onglet = pageParam("onglet");
      if (copie && p.prepa && !p.apercu) return show("copie", copie);
      show(VIEWS.indexOf(onglet) >= 0 ? onglet : (S.view === "copie" ? "copies" : S.view));
    }).catch(function (x) {
      if (x.status === 401) { S.token = null; return renderLogin(); }
      setPage('<div class="nv-empty"><b>Prépa indisponible</b>' + esc(x.message) + '</div>');
    });
  }
  S.token = load(CONFIG.TOKEN_KEY);
  S.cal.mode = load("navire_prepa_cal") === "mois" ? "mois" : "semaine";
  if (!S.token) return renderLogin();
  api("GET", "/auth/me").then(function (u) { S.me = u; }).catch(function () {}).then(function () {
    if (S.me && S.me.is_admin) S.voir = load("navire_prepa_voir") || null;
    return charger();
  });
  // Les séances passent « en cours » : on relit l'emploi du temps toutes les deux minutes.
  setInterval(function () {
    if (!S.token || !S.p || !S.p.prepa || S.view !== "semaine") return;
    api("GET", "/lib/prepa" + voirQ()).then(function (p) { S.p = p; if (S.view === "semaine") { renderSide(); var sc = FLOW.y(); viewSemaine(); FLOW.to(sc); } }).catch(function () {});
  }, 120000);
})();
</script>
