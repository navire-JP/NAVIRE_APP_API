<!--
  NAVIRE — Veille : actualités juridiques. Embed unique, responsive.
  =========================================================================
  Même DA que NAVIRE Lib et l'accueil (home.html) : bleu et blanc, aucun
  trait apparent (les blocs tiennent par leur fond), cartes à halo lumineux.
    - >= 760px de conteneur : menu à gauche, replié par défaut (bouton menu
      pour l'ouvrir, « « » pour le replier, retenu d'une visite à l'autre) ;
    - < 760px (téléphone) : police DM Sans plus petite (comme Fichiers) ;
      au-dessus de la liste, trois onglets « À la une / Non lues / À relire »,
      puis la recherche et un bouton blanc qui ouvre la liste des rubriques
      (avec les nouvelles actus de la semaine) ; le bouton menu ouvre un
      voile de verre flou avec Sources officielles, NAVIRE AI et NAVIRE Lib.
      Sur téléphone, l'embed prend la hauteur de son contenu : rien ne défile
      à l'intérieur, c'est la page qui défile ; une flèche ramène en haut.
  Hauteur (ordinateur) : l'embed prend toute la hauteur de l'écran sous sa
  position (sous le header du site) ; seul le contenu défile.

  Chaque actu affiche qui l'a postée (photo, pseudo, rôle : Équipe NAVIRE,
  Professeur, Étudiant — champ `author` de l'API) ; un clic sur l'auteur
  ouvre son profil (PROFIL_URL?u=ID). Les actus importées
  automatiquement n'ont pas d'auteur : on affiche alors leur source.

  Lien direct vers une actu : ajoute ?actu=ID à l'adresse de la page.

  Articles : format rédigé sur NAVIRE par les doctorants vérifiés et l'équipe
  (icône NAVIRE_Articles_icon). Menu « Articles », lecture du texte mis en
  forme, enregistrement comme une actu. Adresse d'un article :
  navire-ai.com/actus/NA<id> (la page /actus doit aussi répondre à
  /actus/NA<id> ; ?actu=NA<id> marche aussi). « Écrire un article » n'apparaît
  pour tous (barre du haut, « À la une », « Articles ») : un compte autorisé
  (GET /auth/me → can_publish_articles) ouvre l'éditeur ; les autres font
  leur demande de statut Doctorant sur place (POST /users/me/verifications),
  validée dans la console. Éditeur
  avec gras, italique, souligné, listes, citation et emojis ; l'auteur (ou un
  admin) peut ensuite modifier ou supprimer l'article.
    POST /veille/articles · PATCH|DELETE /veille/articles/{id}
  Passerelle vers NAVIRE Lib : sous une actu, « Réviser dans la Lib » propose
  jusqu'à 2 cours de la matière (champ `cours` de GET /veille/actus/{id}).
  Réglages : bloc CONFIG du script.
-->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
#nv-news {
  --panel: rgba(255,255,255,0.035);
  --panel-2: rgba(255,255,255,0.06);
  --panel-3: rgba(255,255,255,0.1);
  --line: transparent;            /* aucun trait apparent */
  --text: #fff;
  --text-2: rgba(255,255,255,0.72);
  --text-3: rgba(255,255,255,0.45);
  --text-4: rgba(255,255,255,0.28);
  --blue: #7AA7FF;
  --blue-hi: #B5CDFF;
  --blue-deep: #4F7DFF;
  --blue-soft: rgba(122,167,255,0.1);
  --blue-line: rgba(122,167,255,0.35);
  /* Rubriques : uniquement des nuances de bleu */
  --r-civil: #8AB4FF;
  --r-penal: #4F86F7;
  --r-public: #B9D3FF;
  --r-affaires: #2F6BEA;
  --r-general: #6F9DD8;
  --mono: 'IBM Plex Mono', monospace;
  --ease: cubic-bezier(.2,.8,.2,1);

  position: relative;
  width: 100%;
  height: 640px;          /* remplacé par la hauteur de l'écran au chargement */
  min-height: 460px;
  display: flex;
  overflow: hidden;
  font-family: 'Inter', sans-serif;
  -webkit-font-smoothing: antialiased;
  color: var(--text);
  background: transparent;
  box-sizing: border-box;
  font-size: 14px;
}
#nv-news *, #nv-news *::before, #nv-news *::after { box-sizing: border-box; }
#nv-news button { font-family: inherit; color: inherit; }
#nv-news a { color: inherit; }
#nv-news ::selection { background: rgba(122,167,255,0.3); }
#nv-news .nv-scroll { overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.1) transparent; }
#nv-news .nv-scroll::-webkit-scrollbar { width: 6px; }
#nv-news .nv-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 9px; }
#nv-news svg { flex-shrink: 0; }
#nv-news [data-cat="civil"]    { --c: var(--r-civil); }
#nv-news [data-cat="penal"]    { --c: var(--r-penal); }
#nv-news [data-cat="public"]   { --c: var(--r-public); }
#nv-news [data-cat="affaires"] { --c: var(--r-affaires); }
#nv-news [data-cat="general"]  { --c: var(--r-general); }
#nv-news .nv-dot { display: inline-block; flex-shrink: 0; width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--text-3)); }
@keyframes nv-fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes nv-rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes nv-shimmer { from { background-position: 120% 0; } to { background-position: -120% 0; } }

/* ================= MENU (comme NAVIRE Lib) ================= */
#nv-news .nv-side { width: 244px; flex-shrink: 0; display: flex; flex-direction: column; padding: 12px 8px 10px; gap: 2px; background: rgba(255,255,255,0.018); z-index: 30; min-height: 0; overflow-y: auto; scrollbar-width: none; transition: margin-left .3s var(--ease), visibility 0s; }
#nv-news .nv-side::-webkit-scrollbar { display: none; }
#nv-news .nv-side > * { flex-shrink: 0; }
#nv-news:not(.is-compact).is-side-off .nv-side { margin-left: -244px; visibility: hidden; transition: margin-left .3s var(--ease), visibility 0s .3s; }
#nv-news .nv-brand { display: flex; align-items: center; gap: 9px; padding: 2px 4px 10px 10px; }
#nv-news .nv-brand-name { font-weight: 700; font-size: 13.5px; }
#nv-news .nv-side-close { margin-left: auto; width: 28px; height: 28px; border-radius: 8px; color: var(--text-4); }
#nv-news .nv-side-close svg { width: 15px; height: 15px; }
#nv-news .nv-side-close .nv-x { display: none; }
#nv-news.is-compact .nv-side-close .nv-x { display: block; }
#nv-news.is-compact .nv-side-close .nv-chev { display: none; }

#nv-news .nv-side-search { display: flex; align-items: center; gap: 9px; width: 100%; height: 36px; padding: 0 10px; margin-bottom: 6px; border-radius: 10px; border: none; background: var(--panel-2); cursor: pointer; font-size: 12.5px; font-weight: 600; text-align: left; transition: background .15s; }
#nv-news .nv-side-search:hover { background: var(--panel-3); }
#nv-news .nv-side-search svg { width: 15px; height: 15px; color: var(--blue); }

#nv-news .nv-nav { display: flex; align-items: center; gap: 9px; width: 100%; padding: 7px 10px; border-radius: 8px; border: none; background: transparent; cursor: pointer; font-size: 12.5px; font-weight: 500; color: var(--text-3); text-align: left; text-decoration: none; transition: background .15s, color .15s; }
#nv-news .nv-nav svg { width: 15px; height: 15px; opacity: .7; }
#nv-news .nv-nav:hover { background: var(--panel); color: var(--text); }
#nv-news .nv-nav.is-active { background: var(--panel-2); color: var(--text); }
#nv-news .nv-nav .nv-badge { margin-left: auto; font-family: var(--mono); font-size: 10px; color: var(--text-4); }
#nv-news .nv-nav .nv-badge.is-hot { color: #0a0a12; background: var(--blue); border-radius: 99px; padding: 1px 7px; font-weight: 600; }

#nv-news a.nv-nav svg { color: var(--blue); opacity: .85; }

/* Objectif du jour */

#nv-news .nv-goal a { color: var(--blue); font-weight: 600; text-decoration: none; }

/* ================= ZONE PRINCIPALE ================= */
#nv-news .nv-main { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; position: relative; }
#nv-news .nv-topbar { display: flex; align-items: center; gap: 8px; padding: 10px 14px; min-height: 52px; flex-shrink: 0; }

#nv-news .nv-icon-btn { width: 34px; height: 34px; display: inline-flex; align-items: center; justify-content: center; border-radius: 10px; border: none; background: transparent; color: var(--text-3); cursor: pointer; padding: 0; transition: background .15s, color .15s; }
#nv-news .nv-icon-btn:hover { background: var(--panel-2); color: var(--text); }
#nv-news .nv-icon-btn svg { width: 18px; height: 18px; }

#nv-news .nv-content { flex: 1; min-height: 0; }
#nv-news .nv-inner { max-width: 860px; margin: 0 auto; padding: 4px 24px 40px; animation: nv-fade .28s var(--ease); }
/* Grand écran : la page s'élargit avec l'écran, les actus passent sur 2 colonnes

#nv-news.is-wide .nv-inner { max-width: 1240px; padding-left: 40px; padding-right: 40px; }

/* ---------- En-tête de page ---------- */

#nv-news .nv-list { display: flex; flex-direction: column; gap: 6px; margin-top: 14px; }

#nv-news .nv-card:hover { background: var(--panel-2); }

#nv-news .nv-card.is-row .nv-card-title { margin-top: 0; }
#nv-news .nv-card-text { margin: 6px 0 0; font-size: 13px; line-height: 1.55; color: var(--text-3); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
#nv-news .nv-card.is-read .nv-card-title { color: var(--text-2); font-weight: 500; }

#nv-news .nv-readmark svg { width: 12px; height: 12px; color: var(--blue); }

#nv-news .nv-save svg { width: 15px; height: 15px; }
#nv-news .nv-save.is-on { color: var(--blue); }

/* Auteur : qui a posté l'actu */

#nv-news .nv-author b { font-weight: 600; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#nv-news .nv-av { width: 18px; height: 18px; border-radius: 50%; flex-shrink: 0; background: var(--blue-soft) center/cover no-repeat; color: var(--blue); font-size: 9.5px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; text-transform: uppercase; }
#nv-news .nv-role { font-family: var(--mono); font-size: 9.5px; font-weight: 600; padding: 1px 7px; border-radius: 99px; background: var(--blue-soft); color: var(--blue); white-space: nowrap; }

#nv-news .nv-art-ic { width: 16px; height: 16px; object-fit: contain; flex-shrink: 0; filter: drop-shadow(0 2px 5px rgba(120,70,255,0.35)); }

#nv-news .nv-article-body { margin-top: 26px; }
#nv-news .nv-article-body h3 { margin: 22px 0 10px; font-size: 18px; font-weight: 700; letter-spacing: -.3px; }

#nv-news .nv-btn.is-danger { color: #FF8A8A; }
#nv-news .nv-write-top { display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 14px 0 10px; border-radius: 99px; border: none; background: linear-gradient(120deg, #8F63FF, #6E8DFF); color: #fff; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap; box-shadow: 0 6px 18px rgba(120,80,255,0.35); transition: transform .15s, filter .15s; }

#nv-news .nv-write-top img { width: 18px; height: 18px; object-fit: contain; }

#nv-news .nv-apply { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
#nv-news .nv-apply-hero { display: flex; gap: 14px; align-items: center; padding: 18px; border-radius: 18px; background: linear-gradient(120deg, rgba(155,111,255,0.16), rgba(122,167,255,0.08)); }

/* Éditeur d'article */

#nv-news .nv-ed-body { min-height: 300px; padding: 16px 18px; border-radius: 16px; background: var(--panel); outline: none; font-size: 15.5px; line-height: 1.72; color: rgba(255,255,255,0.92); overflow-wrap: anywhere; }

/* À la une : carte à halo, comme les cours de NAVIRE Lib */
#nv-news .nv-feature { position: relative; overflow: hidden; display: flex; flex-direction: column; margin-top: 14px; padding: 20px 20px 14px; border-radius: 18px; background: var(--blue-soft); cursor: pointer; transition: background .2s, transform .2s var(--ease); animation: nv-rise .4s var(--ease) both; }
#nv-news .nv-feature::after { content: ''; position: absolute; right: -60px; top: -70px; width: 220px; height: 220px; border-radius: 50%; background: radial-gradient(circle, rgba(122,167,255,0.22), transparent 70%); pointer-events: none; }

/* Pagination */

#nv-news .nv-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 38px; padding: 0 16px; border-radius: 99px; border: none; background: var(--panel-2); font-size: 13px; font-weight: 600; cursor: pointer; text-decoration: none; white-space: nowrap; transition: background .15s, transform .15s; }

#nv-news .nv-btn.is-on { color: var(--blue); background: var(--blue-soft); }

/* ---------- Article ---------- */
#nv-news .nv-article { max-width: 700px; margin: 0 auto; }

#nv-news .nv-crumbs { display: flex; align-items: center; gap: 8px; margin: 0 0 16px; }

#nv-news .nv-block { margin-top: 26px; }
#nv-news .nv-block h4, #nv-news .nv-callout h4 { margin: 0 0 10px; font-family: var(--mono); font-size: 10px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: var(--text-3); }
#nv-news .nv-prose { font-size: 15.5px; line-height: 1.72; color: rgba(255,255,255,0.9); overflow-wrap: anywhere; }

#nv-news .nv-ref { color: #fff; text-decoration: none; background: rgba(122,167,255,0.12); padding: 0 3px; border-radius: 4px; transition: background .15s; }
#nv-news .nv-ref:hover { background: rgba(122,167,255,0.25); }
#nv-news .nv-ref sup { font-size: 9px; margin-left: 2px; color: var(--blue); }
#nv-news .nv-refs { display: flex; flex-wrap: wrap; gap: 6px; }
#nv-news .nv-refchip { display: inline-flex; align-items: center; gap: 8px; max-width: 100%; height: 32px; padding: 0 12px; border-radius: 99px; background: var(--panel); font-size: 12px; color: var(--text-2); text-decoration: none; transition: background .15s, color .15s; }
#nv-news .nv-refchip:hover { background: var(--panel-2); color: #fff; }
#nv-news .nv-refchip span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

#nv-news .nv-cours-item { position: relative; overflow: hidden; display: flex; align-items: center; gap: 12px; padding: 13px 14px; border-radius: 14px; background: var(--panel); text-decoration: none; transition: background .15s; }

#nv-news .nv-cours-ic { width: 34px; height: 34px; border-radius: 10px; display: flex; align-items: center; justify-content: center; background: var(--blue-soft); color: var(--blue); flex-shrink: 0; }

#nv-news .nv-cours-txt { flex: 1; min-width: 0; }

#nv-news .nv-cours-txt b { display: block; margin-top: 2px; font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ---------- Sources officielles ---------- */

#nv-news .nv-link::after { content: ''; position: absolute; right: -40px; top: -40px; width: 110px; height: 110px; border-radius: 50%; background: radial-gradient(circle, rgba(122,167,255,0.13), transparent 70%); pointer-events: none; }

#nv-news .nv-lf { padding: 18px; border-radius: 18px; background: var(--blue-soft); }

#nv-news .nv-lf-targets { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
#nv-news .nv-lf .nv-chip { background: rgba(10,10,20,0.3); }

/* États */
#nv-news .nv-empty { text-align: center; padding: 46px 20px; font-size: 13px; color: var(--text-3); line-height: 1.6; }
#nv-news .nv-empty b { display: block; color: var(--text-2); font-size: 14.5px; margin-bottom: 4px; }
#nv-news .nv-empty .nv-btn { margin-top: 14px; }
#nv-news .nv-skel { border-radius: 14px; margin-bottom: 6px; background: linear-gradient(90deg, var(--panel) 0%, var(--panel-2) 50%, var(--panel) 100%); background-size: 200% 100%; animation: nv-shimmer 1.4s linear infinite; }

/* Toasts */
#nv-news .nv-toasts { position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%); display: flex; flex-direction: column; gap: 6px; align-items: center; z-index: 50; pointer-events: none; }
#nv-news .nv-toast { padding: 9px 14px; border-radius: 11px; background: rgba(30,32,50,0.95); font-size: 12.5px; box-shadow: 0 10px 30px rgba(0,0,0,0.35); animation: nv-toast 2.8s var(--ease) both; white-space: nowrap; }

/* ================= COMPACT (téléphone / embed étroit) ================= */
#nv-news.is-compact .nv-side { position: absolute; top: 0; bottom: 0; left: 0; visibility: hidden; transition: transform .32s var(--ease), visibility 0s .32s; z-index: 1001; width: min(320px, 88%); transform: translateX(-102%); background: #0c0c14; box-shadow: 20px 0 60px rgba(0,0,0,0.4); }

#nv-news.is-compact .nv-author .nv-role { display: none; }

/* ================= TÉLÉPHONE : onglets, recherche, rubriques, voile ================= */
/* Hors téléphone : onglets et bouton de rubrique cachés, les pastilles restent */
#nv-news .nv-mtabs, #nv-news .nv-rubbtn { display: none; }
#nv-news .nv-searchrow { display: flex; align-items: center; gap: 8px; }

#nv-news.is-compact { font-family: 'DM Sans', system-ui, sans-serif; font-size: 13px; }

#nv-news.is-compact .nv-search .nv-icon-btn { position: absolute; right: 3px; top: 3px; width: 28px; height: 28px; border-radius: 8px; background: rgba(20,22,32,0.6); }

/* Tailles de texte plus petites */
#nv-news.is-compact .nv-topbar { min-height: 50px; padding: 6px 8px; }

#nv-news.is-compact .nv-inner { padding: 2px 12px 28px; }
#nv-news.is-compact .nv-list { gap: 6px; margin-top: 12px; }
#nv-news.is-compact .nv-card { padding: 11px 13px 9px; border-radius: 13px; }
#nv-news.is-compact .nv-card-title { font-size: 13.5px; line-height: 1.38; }
#nv-news.is-compact .nv-card-meta { font-size: 11px; gap: 5px 8px; margin-top: 6px; }
#nv-news.is-compact .nv-rub { font-size: 9.5px; }
#nv-news.is-compact .nv-tag { font-size: 9.5px; }
#nv-news.is-compact .nv-save { width: 34px; height: 34px; }
#nv-news.is-compact .nv-save svg { width: 16px; height: 16px; }
#nv-news.is-compact .nv-feature { margin-top: 12px; padding: 15px 15px 11px; border-radius: 16px; }
#nv-news.is-compact .nv-feature h3 { font-size: 15.5px; letter-spacing: -.2px; }
#nv-news.is-compact .nv-result { font-size: 11.5px; margin-top: 10px; }
#nv-news.is-compact .nv-btn { height: 36px; padding: 0 14px; font-size: 12.5px; }
#nv-news.is-compact .nv-pagecount { font-size: 11px; }
#nv-news.is-compact .nv-page-head h1 { font-size: 20px; }
#nv-news.is-compact .nv-page-head p { font-size: 12.5px; }
#nv-news.is-compact .nv-article h1 { font-size: 20px; letter-spacing: -.4px; }
#nv-news.is-compact .nv-crumbs button { font-size: 12px; }
#nv-news.is-compact .nv-byline-txt b { font-size: 13px; }

<script>
(function () {
  // ================= CONFIG =================

  var EMOJIS = ['⚖️', '📚', '🎓', '✍️', '📝', '📌', '💡', '🔎', '📖', '🏛️', '✅', '❌', '⚠️', '❗', '❓', '🔥', '🚀', '📅', '🔗', '👉', '👏', '🙂', '😉', '🤔', '❤️', '⭐'];

  var RUBRIQUES = [
    { key: 'civil',    label: 'Droit civil',        desc: 'Contrats, responsabilité, famille, biens' },
    { key: 'penal',    label: 'Droit pénal',        desc: 'Infractions, procédure pénale, peines' },

  ];

  // Sources officielles : liens permanents de la rubrique « Aller plus loin »
  var SOURCES = [
    { group: 'Textes', items: [
      { n: 'Légifrance', d: 'Codes, lois, décrets et jurisprudence : le service public de diffusion du droit.', u: 'https://www.legifrance.gouv.fr/' },

      { n: 'Conseil constitutionnel', d: 'Décisions DC et QPC, commentaires officiels.', u: 'https://www.conseil-constitutionnel.fr/decisions' },
      { n: 'CEDH — HUDOC', d: 'Arrêts de la Cour européenne des droits de l\'homme.', u: 'https://hudoc.echr.coe.int/fre' },
      { n: 'CJUE — Curia', d: 'Arrêts de la Cour de justice de l\'Union européenne.', u: 'https://curia.europa.eu/jcms/jcms/j_6/fr/' }
    ]},
    { group: 'Institutions et réformes', items: [
      { n: 'Assemblée nationale', d: 'Projets et propositions de loi en cours d\'examen.', u: 'https://www.assemblee-nationale.fr/' },
      { n: 'Sénat', d: 'Dossiers législatifs et travaux des commissions.', u: 'https://www.senat.fr/' },
      { n: 'Vie publique', d: 'Les lois et réformes expliquées simplement.', u: 'https://www.vie-publique.fr/' },
      { n: 'Ministère de la Justice', d: 'Circulaires, réformes et actualités de la justice.', u: 'https://www.justice.gouv.fr/' }
    ]}
  ];

  // ================= IFRAME FRAMER =================
  var root = document.getElementById('nv-news');
  var FRAMED = window.self !== window.top;
  var HOST = null;
  if (FRAMED) {
    // On masque la barre de défilement de l'iframe (sans bloquer le défilement).
    var hideBar = document.createElement('style');
    hideBar.textContent = 'html,body{scrollbar-width:none;-ms-overflow-style:none}html::-webkit-scrollbar,body::-webkit-scrollbar{display:none;width:0;height:0}';
    document.head.appendChild(hideBar);
    document.body.style.margin = '0';
    try { if (window.frameElement && window.parent.document) HOST = window.parent; } catch (e) {}
  }

  // Hauteur de l'embed = hauteur de l'écran moins sa position en haut de
  // page (le header du site est au-dessus). On règle aussi l'iframe Framer
  // et ses blocs parents qui ne contiennent que lui, pour qu'ils ne coupent rien.
  var frameEl = HOST ? window.frameElement : null;
  var wrappers = [];
  if (frameEl) {
    for (var n = frameEl.parentElement, i = 0; n && i < 4 && n !== HOST.document.body; i++, n = n.parentElement) wrappers.push(n);
  }
  function isPhone() { return root.clientWidth < 760; }
  function anchorTop() {
    var win = HOST || window, anchor = frameEl || root;
    return anchor.getBoundingClientRect().top + (win.scrollY || win.pageYOffset || 0);
  }
  function sizeApp() {
    var win = HOST || window;
    var top = anchorTop();
    var h = Math.max(460, Math.round(win.innerHeight - top - 12));
    if (isPhone()) {
      // Téléphone : hauteur du contenu (au moins l'écran), sans défilement interne
      root.style.minHeight = h + 'px';
      h = Math.max(h, Math.ceil(root.scrollHeight));
      if (!frameEl && FRAMED) { try { window.parent.postMessage({ type: 'NAVIRE_EMBED_HEIGHT', height: h }, '*'); } catch (e) {} }
    } else {
      root.style.minHeight = '';
      root.style.height = h + 'px';
    }
    if (frameEl) {
      frameEl.style.height = h + 'px';
      frameEl.style.minHeight = h + 'px';
      wrappers.forEach(function (w) { if (w.childElementCount === 1) w.style.minHeight = h + 'px'; });
    }
  }
  sizeApp();
  (HOST || window).addEventListener('resize', sizeApp);
  window.addEventListener('load', sizeApp);
  setTimeout(sizeApp, 600);   // après la mise en place de la page Framer

  // Partie de l'embed visible à l'écran (téléphone : l'embed est plus haut que l'écran)
  function viewBox() {
    var win = HOST || window;
    var r = (frameEl || root).getBoundingClientRect();
    if (HOST || !FRAMED) return { top: Math.max(0, -r.top), h: win.innerHeight - Math.max(0, r.top) };
    return { top: 0, h: Math.min(root.offsetHeight, (window.screen && window.screen.availHeight) || 800) };
  }
  // Remonte en haut de l'embed (la page entière défile sur téléphone)
  function scrollToTop(smooth) {
    var win = HOST || window;
    if (!HOST && FRAMED) { try { window.parent.postMessage({ type: 'NAVIRE_EMBED_SCROLL_TOP' }, '*'); } catch (e) {} return; }
    var top = anchorTop();
    var y = top <= win.innerHeight / 2 ? 0 : top - 80;
    if ((win.scrollY || win.pageYOffset || 0) <= y) return;
    try { win.scrollTo({ top: y, behavior: smooth ? 'smooth' : 'auto' }); } catch (e) { win.scrollTo(0, y); }
  }

  // Flèche « remonter » : posée sur la page du site (fixe en bas à droite),
  // visible sur téléphone quand on est descendu loin dans la liste.
  var upBtn = null;
  (function () {
    if (FRAMED && !HOST) return;   // page d'une autre origine : pas d'accès à son défilement
    var doc = (HOST || window).document;
    upBtn = doc.createElement('button');
    upBtn.type = 'button';
    upBtn.setAttribute('aria-label', 'Remonter en haut');
    upBtn.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg>';
    upBtn.style.cssText = 'position:fixed;right:16px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:2147483000;width:46px;height:46px;border:0;border-radius:50%;' +
      'background:#fff;color:#0a0a12;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 10px 30px rgba(0,0,0,0.45);' +
      'opacity:0;transform:translateY(10px) scale(.9);pointer-events:none;transition:opacity .2s,transform .2s;-webkit-tap-highlight-color:transparent';
    upBtn.addEventListener('click', function () { scrollToTop(true); });
    doc.body.appendChild(upBtn);
  })();
  function paintUp() {
    if (!upBtn) return;
    var win = HOST || window;
    var r = (frameEl || root).getBoundingClientRect();
    var on = isPhone() && r.top < -win.innerHeight * 0.8 && r.bottom > win.innerHeight * 0.5;
    upBtn.style.opacity = on ? '1' : '0';
    upBtn.style.transform = on ? 'none' : 'translateY(10px) scale(.9)';
    upBtn.style.pointerEvents = on ? 'auto' : 'none';
  }
  (HOST || window).addEventListener('scroll', paintUp, { passive: true });
  (HOST || window).addEventListener('resize', paintUp);

  // ================= ÉTAT =================
  function el(name) { return root.querySelector('[data-el="' + name + '"]'); }
  var content = el('content');

  var token = '';
  try { token = localStorage.getItem('navire_token') || ''; } catch (e) {}
  var LS = {
    get: function (k, d) { try { var v = localStorage.getItem('nv_news_' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem('nv_news_' + k, JSON.stringify(v)); } catch (e) {} }
  };

  var state = {
    view: 'home',               // list | article | sources
    sideOff: LS.get('side_off', true),   // menu replié par défaut
    filters: { status: 'all', category: '', q: '', period: 'all', kind: '' },
    canWrite: false,            // rédaction d'articles (doctorant vérifié ou admin)
    docPending: false,          // demande de statut Doctorant en attente
    editing: null,              // article en cours de modification (null : nouvel article)
    items: [], total: 0, hasMore: false, loading: false,
    start: 0, starts: [], shown: 0,   // pagination « Charger plus » sans défilement
    rubriques: null,            // réponse de /veille/rubriques
    me: null,                   // progression du jour (/veille/state)
    counts: { unread: null, saved: null },
    article: null,              // { item, related }
    back: null,                 // vue à retrouver en quittant un article
    known: {}                   // actus déjà chargées, par id
  };
  var listSeq = 0;              // ignore les réponses d'une recherche dépassée

  // ================= OUTILS =================
  function api(path, opts) {
    opts = opts || {};
    var h = {};
    if (token) h['Authorization'] = 'Bearer ' + token;
    if (opts.body) h['Content-Type'] = 'application/json';
    return fetch(API + path, {
      method: opts.method || 'GET', headers: h,
      body: opts.body ? JSON.stringify(opts.body) : undefined
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (data) {
        if (r.status === 401 && token && !opts.authOnly) {
          // Jeton expiré : on continue en lecture seule plutôt que de bloquer.
          token = ''; renderGoal(); updateCounts();
          return api(path, opts);
        }
        if (!r.ok) { var err = new Error('HTTP ' + r.status); err.status = r.status; err.data = data; throw err; }
        return data;
      });
    });
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function cssUrl(u) { return 'url("' + String(u).replace(/"/g, '%22') + '")'; }
  function toast(msg, kind) {
    var t = document.createElement('div');
    t.className = 'nv-toast' + (kind ? ' is-' + kind : '');
    t.textContent = msg;
    var box = el('toasts');
    if (isPhone()) { var v = viewBox(); box.style.top = Math.max(0, v.top + v.h - 80) + 'px'; } else box.style.top = '';
    box.appendChild(t);
    setTimeout(function () { t.remove(); }, 2900);
  }
  function rub(key) {
    for (var i = 0; i < RUBRIQUES.length; i++) if (RUBRIQUES[i].key === key) return RUBRIQUES[i];
    return { key: key, label: key ? key.charAt(0).toUpperCase() + key.slice(1) : 'Général', desc: '' };
  }
  function relTime(iso) {
    if (!iso) return '';
    var t = new Date(iso).getTime(); if (isNaN(t)) return '';
    var m = Math.floor(Math.max(0, Date.now() - t) / 60000);
    if (m < 1) return "à l'instant";
    if (m < 60) return 'il y a ' + m + ' min';
    var h = Math.floor(m / 60); if (h < 24) return 'il y a ' + h + ' h';
    var d = Math.floor(h / 24); if (d === 1) return 'hier';
    if (d < 7) return 'il y a ' + d + ' j';
    var dt = new Date(iso);
    return dt.toLocaleDateString('fr-FR', dt.getFullYear() === new Date().getFullYear() ? { day: 'numeric', month: 'short' } : { day: 'numeric', month: 'short', year: 'numeric' });
  }
  function longDate(iso) {
    var d = new Date(iso); if (isNaN(d)) return '';
    return d.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

  // ================= RÉFÉRENCES JURIDIQUES CLIQUABLES =================
  // Repère dans le texte les articles de code, lois, décrets, arrêts… et les
  // relie à la bonne base officielle (Légifrance, Judilibre, EUR-Lex).
  var MOIS = '(?:janvier|février|fevrier|mars|avril|mai|juin|juillet|août|aout|septembre|octobre|novembre|décembre|decembre)';
  var DATE = '\\d{1,2}(?:er)?\\s+' + MOIS + '\\s+\\d{4}';
  var CODES = '(?:civil|pénal|penal|de commerce|du travail|de la consommation|de procédure civile|de procédure pénale|de justice administrative|général des collectivités territoriales|général des impôts|de la sécurité sociale|de la santé publique|de l[\'’]environnement|de l[\'’]urbanisme|monétaire et financier|des assurances|de la propriété intellectuelle|rural et de la pêche maritime|de la construction et de l[\'’]habitation|de l[\'’]entrée et du séjour des étrangers et du droit d[\'’]asile|de la route|de l[\'’]éducation|électoral|des relations entre le public et l[\'’]administration|de la commande publique|de l[\'’]organisation judiciaire|de la défense|des transports|de l[\'’]action sociale et des familles)';
  var ART_NUM = '(?:[LRDA]\\.?\\s?)?\\d+(?:[-‑.]\\d+)*(?:\\s(?:bis|ter|quater|quinquies))?';
  var REF_RULES = [
    { kind: 'Code', re: new RegExp('\\b(?:articles?|art\\.)\\s+' + ART_NUM + '(?:\\s?(?:,|et|à)\\s?' + ART_NUM + ')*\\s+(?:du|de la|de l[\'’])\\s*(?:Code\\s+' + CODES + '|Constitution|Convention européenne des droits de l[\'’]homme|Déclaration des droits de l[\'’]homme et du citoyen)', 'gi'), to: 'legifrance' },
    { kind: 'Code', re: new RegExp('\\b(?:art\\.?|article)\\s+' + ART_NUM + '\\s+C\\.\\s?(?:civ|pén|pen|com|trav|consom|pr\\.\\s?civ|pr\\.\\s?pén|pr\\.\\s?pen)\\.?', 'gi'), to: 'legifrance' },
    { kind: 'Texte', re: new RegExp('\\b(?:loi organique|loi|décret|ordonnance|arrêté)\\s+n[°o]\\s?\\d{2,4}-\\d+(?:\\s+du\\s+' + DATE + ')?', 'gi'), to: 'legifrance' },
    { kind: 'Cass.', re: new RegExp('\\bCass\\.?,?\\s*(?:civ\\.?\\s*(?:1(?:re|ère)|2e|3e)?|crim\\.?|com\\.?|soc\\.?|ass\\.?\\s*plén\\.?|ch\\.?\\s*mixte)[^\\n;()]{0,30}?' + DATE + '(?:,\\s*n[°o]\\s?\\d{2}-\\d{2}\\.\\d{3})?', 'gi'), to: 'cass' },
    { kind: 'Pourvoi', re: /\b(?:pourvoi\s+)?n[°o]\s?\d{2}-\d{2}\.\d{3}\b/gi, to: 'cass' },
    { kind: 'CE', re: new RegExp('\\bCE,?\\s*(?:Ass\\.?,?\\s*|Sect\\.?,?\\s*|\\d+(?:e|ème)\\s+(?:et\\s+\\d+(?:e|ème)\\s+)?(?:ch\\.|chambres?)\\s*(?:réunies)?,?\\s*)?' + DATE + '(?:,\\s*n[°o]\\s?\\d{5,6})?', 'gi'), to: 'legifrance' },
    { kind: 'Cons. const.', re: /\b(?:décision|déc\.)\s+n[°o]\s?\d{4}-\d+\s?(?:QPC|DC|L|LP|ORGA|LOM|FNR|REF)\b/gi, to: 'legifrance' },
    { kind: 'UE', re: /\b(?:règlement|directive)\s+(?:\((?:UE|CE)\)\s+)?(?:n[°o]\s?)?\d{2,4}\/\d+(?:\/(?:UE|CE))?/gi, to: 'eurlex' }
  ];
  var TARGETS = {
    legifrance: { name: 'Légifrance', url: function (q) { return 'https://www.legifrance.gouv.fr/search/all?tab_selection=all&searchField=ALL&query=' + encodeURIComponent(q) + '&page=1&init=true'; } },
    cass: { name: 'Judilibre', url: function (q) {

  function findRefs(text) {
    var found = [];

      '<h3>' + esc(it.title) + '</h3><p>' + esc(it.essentiel) + '</p>' + metaHtml(it) + '</article>';
  }
  function skeleton(n, h) { var s = ''; for (var i = 0; i < n; i++) s += '<div class="nv-skel" style="height:' + (h || 64) + 'px"></div>'; return s; }
  function errorHtml(msg) {
    return '<div class="nv-empty"><b>Impossible de charger les actus</b>' + esc(msg || 'Vérifie ta connexion puis réessaie.') +
      '<br><button class="nv-btn" data-act="retry">Réessayer</button></div>';

  function linkCard(s) {

  // ================= LISTE (à la une, rubrique, recherche, non lues, à relire) =================
  var lastRetry = null;
  function renderHome() { openList({ status: 'all', category: '', q: '', period: 'all' }); }
  function heroSub(r) {
    if (!r || !r.total) return 'Les actus juridiques publiées sur NAVIRE apparaissent ici.';
    return (r.week_total ? plural(r.week_total, 'nouvelle actu', 'nouvelles actus') + ' cette semaine · ' : '') +
      plural(r.total, 'actu', 'actus') + ' au total.';
  }
  function listTitle(f) {
    if (f.status === 'unread') return 'Non lues';
    if (f.status === 'saved') return 'À relire';
    if (f.kind === 'article' && !f.category) return 'Articles';
    if (f.category) return rub(f.category).label;
    if (f.q) return 'Recherche';
    return 'À la une';
  }
  // Téléphone : « À la une / Non lues / À relire » au-dessus de la recherche
  function mtabsHtml(f) {
    function tab(k, label, count) {
      return '<button type="button" class="' + (f.status === k ? 'is-on' : '') + '" data-mtab="' + k + '">' + label + (count ? '<b data-el="mt-' + k + '"></b>' : '') + '</button>';
    }
    var art = f.kind === 'article';
    return '<div class="nv-mtabs" role="tablist">' + (art ? tab('', 'À la une') : tab('all', 'À la une')) + tab('unread', 'Non lues', 1) + tab('saved', 'À relire', 1) +
      '<button type="button" class="' + (art ? 'is-on' : '') + '" data-mtab="articles">Articles</button></div>';
  }
  function openList(f, focus) {
    lastRetry = function () { openList(state.filters); };
    state.filters = f;
    var title = listTitle(f), r = f.category ? rub(f.category) : null;
    var desc = f.status === 'unread' ? 'Les actus que tu n\'as pas encore ouvertes.' :
      f.status === 'saved' ? 'Les actus que tu as gardées pour plus tard.' :
      f.kind === 'article' && !r ? 'Les articles rédigés sur NAVIRE par les doctorants et l\'équipe.' :
      r ? r.desc + '.' : heroSub(state.rubriques);
    var h1 = isDefault(f) ? 'Veille <span class="nv-grad">juridique</span>' : f.kind === 'article' && !r ? artIc() + 'Articles' : esc(title);
    setTitle(title);
    show('list',
      '<div class="nv-page-head"><h1' + (r ? ' data-cat="' + r.key + '"' : '') + '>' + (r ? '<i class="nv-dot"></i>' : '') + h1 + '</h1><p data-el="list-sub">' + esc(desc) + '</p></div>' +
      mtabsHtml(f) +
      (f.kind === 'article' || isDefault(f) ? writeCard() : '') +
      '<div class="nv-searchrow"><form class="nv-search" data-form="filter">' + ICON.search +
        '<input type="text" enterkeyhint="search" name="q" data-el="q" value="' + esc(f.q) + '" placeholder="Rechercher' + (root.classList.contains('is-compact') ? '' : ' dans ' + (r ? 'la rubrique' : 'les actus')) + '…" autocomplete="off" aria-label="Rechercher">' +
        (f.q ? '<button type="button" class="nv-icon-btn" data-act="clear-q" aria-label="Effacer">' + ICON.close + '</button>' : '') + '</form>' +
        '<button type="button" class="nv-rubbtn" data-act="pick-rub" aria-haspopup="dialog" title="Choisir une rubrique">' +
          '<img src="' + esc(LOGO_NOIR) + '" alt="" aria-hidden="true"><span>' + esc(r ? r.label : 'Toutes') + '</span>' + ICON.down + '</button></div>' +
      '<div class="nv-filters">' +
        '<button class="nv-chip' + (!f.category ? ' is-on' : '') + '" data-filter-cat="">Toutes</button>' +
        RUBRIQUES.map(function (x) { return '<button class="nv-chip' + (f.category === x.key ? ' is-on' : '') + '" data-filter-cat="' + x.key + '" data-cat="' + x.key + '"><i class="nv-dot"></i>' + esc(x.label) + '</button>'; }).join('') +
      '</div>' +
      '<div data-el="result" class="nv-result"></div>' +
      '<div data-el="list"><div class="nv-list">' + skeleton(5) + '</div></div>' +
      '<div class="nv-loadmore" data-el="more"></div>'
    );
    updateCounts();
    if (focus) setTimeout(function () { var q = el('q'); if (q) { q.focus({ preventScroll: true }); q.select(); } }, 60);
    state.items = []; state.total = 0; state.hasMore = false;
    state.start = 0; state.starts = []; state.shown = 0;
    loadPage();
  }
  function listQuery(offset) {
    var f = state.filters, p = ['limit=' + PAGE_SIZE, 'offset=' + offset];
    if (f.category) p.push('category=' + encodeURIComponent(f.category));
    if (f.q) p.push('q=' + encodeURIComponent(f.q));
    if (f.status !== 'all') p.push('status=' + f.status);
    if (f.period !== 'all') p.push('period=' + f.period);
    if (f.kind) p.push('kind=' + f.kind);
    return '/veille/actus?' + p.join('&');
  }
  function loadPage() {
    var seq = ++listSeq, offset = state.items.length;
    state.loading = true;
    renderMore();
    api(listQuery(offset)).then(function (d) {
      if (seq !== listSeq || state.view !== 'list') return;
      state.loading = false;
      state.items = state.items.concat(remember(d.items));
      state.total = d.total; state.hasMore = d.has_more;
      if (state.filters.status === 'unread' && !state.filters.q && !state.filters.category && state.filters.period === 'all') { state.counts.unread = d.total; updateCounts(); }
      renderList();
    }).catch(function (e) {
      if (seq !== listSeq) return;
      state.loading = false;
      el('list').innerHTML = errorHtml(e.status ? 'Erreur ' + e.status + ' du serveur.' : '');
      renderMore();
    });
  }
  function renderList() {
    var f = state.filters, box = el('list'); if (!box) return;
    el('result').innerHTML = f.q && state.total ? '<b>' + plural(state.total, 'actu', 'actus') + '</b> pour « ' + esc(f.q) + ' »' : '';
    if (!state.items.length) {
      var empty = f.status === 'saved' ? '<b>Rien à relire pour l\'instant</b>Touche l\'icône marque-page d\'une actu pour la garder ici.' :
        f.status === 'unread' ? '<b>Tu es à jour</b>Tu as ouvert toutes les actus. Reviens demain pour la suite.' :
        f.q ? '<b>Aucun résultat pour « ' + esc(f.q) + ' »</b>Essaie un autre mot.<br>' +
          (f.category ? '<button class="nv-btn" data-act="widen">Chercher dans toutes les actus</button> ' : '') +
          '<a class="nv-btn" href="' + esc(TARGETS.legifrance.url(f.q)) + '" target="_blank" rel="noopener">Chercher « ' + esc(f.q) + ' » sur Légifrance' + ICON.ext + '</a>' :
        '<b>Aucune actu ici</b>Rien n\'a encore été publié avec ces filtres.';
      box.innerHTML = '<div class="nv-empty">' + empty + '</div>';
      renderMore();
      return;
    }
    var html = '', items = state.items.slice(state.start, state.start + PAGE_SIZE);
    if (isDefault(f) && state.start === 0) { html = featureHtml(items[0]); items = items.slice(1); }
    box.innerHTML = html + '<div class="nv-list">' + items.map(rowHtml).join('') + '</div>';
    fitList();
    renderMore();
  }
  // Ordinateur : garde seulement les actus qui tiennent dans la hauteur visible
  // (pas de défilement), la suite s'affiche avec « Suivantes ».
  function fitList() {
    var box = el('list'); if (!box) return;
    var cards = [].slice.call(box.querySelectorAll('.nv-card, .nv-feature'));
    // Téléphone : la liste défile normalement, une page entière à la fois
    if (root.classList.contains('is-compact')) { state.shown = cards.length; return; }
    var limit = content.getBoundingClientRect().bottom - 72;   // place du bouton + marge du bas
    var shown = 0;
    for (var i = 0; i < cards.length; i++) {
      if (shown >= 1 && cards[i].getBoundingClientRect().bottom > limit) {
        for (var j = i; j < cards.length; j++) cards[j].remove();
        break;
      }
      shown++;
    }
    state.shown = shown;
  }
  function renderMore() {
    var m = el('more'); if (!m) return;
    if (!state.items.length) { m.innerHTML = ''; return; }
    var end = Math.min(state.start + state.shown, state.total);
    m.innerHTML = (state.starts.length ? '<button class="nv-btn" data-act="prev">' + ICON.back + 'Plus récentes</button>' : '') +
      (state.total > state.shown || state.start ? '<span class="nv-pagecount">' + (state.start + 1) + '–' + end + ' / ' + state.total + '</span>' : '') +
      (state.loading ? '<button class="nv-btn" disabled>Chargement…</button>' :
        end < state.total ? '<button class="nv-btn" data-act="more">Suivantes' + ICON.arrow + '</button>' : '');
  }
  function nextPage() {
    state.starts.push(state.start);
    state.start += Math.max(1, state.shown);
    content.scrollTop = 0;
    if (isPhone()) scrollToTop(true);
    if (state.start + PAGE_SIZE > state.items.length && state.hasMore) loadPage();
    else renderList();
  }
  function prevPage() {
    if (!state.starts.length) return;
    state.start = state.starts.pop();
    content.scrollTop = 0;
    if (isPhone()) scrollToTop(true);
    renderList();
  }

  // ================= ARTICLE =================
  function openArticle(id) {
    id = +id;
    if (state.view !== 'article' && state.view !== 'editor') state.back = { view: state.view, filters: state.filters, items: state.items, total: state.total, hasMore: state.hasMore, start: state.start, starts: state.starts.slice() };
    lastRetry = function () { openArticle(id); };
    var known = state.known[id];
    setTitle(known ? known.category_label : 'Actu');
    show('article', known ? articleHtml(known, null) : '<div class="nv-article">' + skeleton(1, 40) + skeleton(1, 90) + skeleton(3, 70) + '</div>');
    api('/veille/actus/' + id).then(function (d) {
      if (state.view !== 'article') return;
      remember([d.item]); remember(d.related);
      state.article = d;
      setTitle(d.item.category_label);
      var keep = content.scrollTop;
      content.querySelector('.nv-inner').innerHTML = articleHtml(d.item, d.related, d.cours || []);
      content.scrollTop = keep;
      markRead(d.item);
      startReadTimer(id);
    }).catch(function (e) {
      if (state.view !== 'article') return;
      content.querySelector('.nv-inner').innerHTML = e.status === 404
        ? '<div class="nv-empty"><b>Cette actu n\'existe plus</b>Elle a peut-être été retirée.<br><button class="nv-btn" data-nav="home">Retour à la une</button></div>'
        : errorHtml(e.status ? 'Erreur ' + e.status + ' du serveur.' : '');
    });
  }
  // Cours NAVIRE Lib à réviser après l'actu : ils s'ouvrent dans la Lib.
  function coursHtml(cours) {
    if (!cours || !cours.length) return '';
    return '<section class="nv-section"><div class="nv-section-head"><h2>Réviser dans la Lib</h2><span>Le cours de la matière</span></div><div class="nv-cours">' +
      cours.map(function (c) {
        return '<a class="nv-cours-item" href="' + esc(LIB_URL + (LIB_URL.indexOf('?') < 0 ? '?' : '&') + 'doc=' + c.id) + '" target="_top">' +
          '<span class="nv-cours-ic">' + ICON.book + '</span>' +
          '<span class="nv-cours-txt"><small>' + esc([c.kind_label, c.niveau, c.plus ? 'Lib+' : ''].filter(Boolean).join(' · ')) + '</small><b>' + esc(c.titre) + '</b></span>' +
          ICON.arrow + '</a>';
      }).join('') + '</div></section>';
  }
  // « Posté par » : auteur (photo, pseudo, rôle), date, source et durée de lecture
  function bylineHtml(it) {
    var a = it.author;
    var src = it.source_name ? (it.source_url ? '<a href="' + esc(it.source_url) + '" target="_blank" rel="noopener" data-src="' + it.id + '">' + esc(it.source_name) + '</a>' : esc(it.source_name)) : '';
    var details = [esc(longDate(it.published_at))];
    if (a && src && it.kind !== 'article') details.push('Source : ' + src);
    details.push(it.reading_minutes + ' min de lecture');
    if (it.is_read) details.push('<span class="nv-readmark">' + ICON.check + 'Lue</span>');
    var who = a
      ? '<a href="' + esc(profilUrl(a)) + '" target="_top" data-profil class="nv-byline-who" title="Voir le profil">' + avatarHtml(a) + '</a><div class="nv-byline-txt"><b>' + (it.kind === 'article' ? 'Publié par' : 'Posté par') + ' <a href="' + esc(profilUrl(a)) + '" target="_top" data-profil class="nv-byline-who">' + esc(a.name) + '</a>' + roleHtml(a) + '</b><small>' + details.join(' · ') + '</small></div>'
      : '<span class="nv-av">' + esc((it.source_name || 'N').charAt(0)) + '</span><div class="nv-byline-txt"><b>' + (src || 'NAVIRE') + '</b><small>' + details.join(' · ') + '</small></div>';
    return '<div class="nv-byline">' + who + '</div>';
  }
  function articleHtml(it, related, cours) {
    if (it.kind === 'article') return writtenHtml(it, related);
    var refs = findRefs(it.essentiel + '\n' + it.impact), seen = {};
    refs = refs.filter(function (r) { var k = r.text.toLowerCase().replace(/\s+/g, ' '); if (seen[k]) return false; seen[k] = 1; return true; });
    var backLabel = state.back && state.back.view === 'list' ? listTitle(state.back.filters) : 'À la une';
    return '<div class="nv-article" data-cat="' + esc(it.category) + '">' +
      '<div class="nv-crumbs"><button data-act="back">' + ICON.back + esc(backLabel) + '</button></div>' +
      '<div class="nv-card-top">' + rubTag(it) + (isNew(it) ? '<span class="nv-tag is-new">Nouveau</span>' : '') + '</div>' +
      '<h1>' + esc(it.title) + '</h1>' +
      bylineHtml(it) +
      '<section class="nv-block"><h4>L\'essentiel</h4><div class="nv-prose">' + prose(it.essentiel) + '</div></section>' +
      (it.impact ? '<section class="nv-callout"><h4>Pourquoi c\'est important</h4><div class="nv-prose">' + prose(it.impact) + '</div></section>' : '') +

      }).join('') + '</div></section>' : '') +

        '<button class="nv-btn' + (it.is_saved ? ' is-on' : '') + '" data-save="' + it.id + '" aria-pressed="' + !!it.is_saved + '">' + ICON.save + (it.is_saved ? 'Gardée' : 'À relire') + '</button>' +
        '<button class="nv-btn" data-copy="' + it.id + '">' + ICON.link + 'Copier le lien</button>' +
        '<a class="nv-btn" href="' + esc(aiLink('Explique-moi cette actu juridique et ses conséquences : « ' + it.title + ' »')) + '" target="_top">' + ICON.ai + 'Demander à NAVIRE AI</a>' +

  // Article NAVIRE : texte mis en forme (déjà nettoyé par l'API)

  // ================= RÉDACTION D'ARTICLES =================
  // Visible de tous : publie (doctorant vérifié, admin) ou mène à la demande de statut.
  function writeCard() {
    var sub = state.canWrite ? 'Publié dans Actus, dans la Lib et sur ton profil.'
      : state.docPending ? 'Ta demande de statut Doctorant est en cours de vérification.'
      : 'Réservé aux doctorants vérifiés : fais ta demande en deux minutes.';
    return '<button class="nv-write" data-act="write"><img src="' + esc(ART_ICON) + '" alt="" aria-hidden="true">' +
      '<div><b>Écrire un article</b><span>' + esc(sub) + '</span></div></button>';
  }
  function startWrite() {
    root.classList.remove('is-drawer');
    closePop();
    if (!token) {
      toast('Connecte-toi pour écrire un article.');
      return;
    }
    if (state.canWrite) return openEditor(null);
    openApply();
  }
  // Demande du statut Doctorant (validée dans la console, onglet Catég. → Vérifs)
  function openApply() {
    if (state.view !== 'apply' && state.view !== 'editor') state.back = { view: state.view, filters: state.filters, items: state.items, total: state.total, hasMore: state.hasMore, start: state.start, starts: state.starts.slice() };
    lastRetry = openApply;
    setTitle('Écrire un article');
    var hero = '<div class="nv-apply-hero"><img src="' + esc(ART_ICON) + '" alt="" aria-hidden="true"><div><h1>Écrire sur NAVIRE</h1>' +
      '<p>Les articles sont rédigés par des doctorants vérifiés et par l\'équipe. Ils paraissent dans Actus, dans la Lib et sur ton profil, avec ton nom.</p></div></div>';
    var crumbs = '<div class="nv-crumbs"><button data-act="back">' + ICON.back + 'Retour</button></div>';
    if (state.docPending) {
      show('apply', '<div class="nv-apply">' + crumbs + hero +
        '<div class="nv-apply-note"><b>Demande envoyée.</b> L\'équipe vérifie ton statut de doctorant. Dès qu\'il est validé, tu reçois un mail et le bouton « Écrire » ouvre directement l\'éditeur.</div></div>');
      return;
    }
    show('apply', '<div class="nv-apply">' + crumbs + hero +
      '<ol class="nv-apply-steps"><li>Tu décris ton doctorat ci-dessous (et joins une attestation si tu l\'as).</li><li>L\'équipe valide ton statut, en général sous 48 h.</li><li>Tu écris et publies tes articles quand tu veux.</li></ol>' +
      '<div data-el="apply-last"></div>' +
      '<label class="nv-apply-label" for="nv-apply-msg">Ton doctorat</label>' +
      '<textarea id="nv-apply-msg" data-el="apply-msg" maxlength="2000" placeholder="Université, école doctorale, sujet de thèse, directeur de thèse, année de doctorat…"></textarea>' +
      '<label class="nv-apply-label">Attestation d\'inscription en doctorat (facultatif)</label>' +
      '<input type="file" data-el="apply-file" accept="application/pdf,image/jpeg,image/png,image/webp" style="font-size:12.5px;color:var(--text-2)">' +
      '<div class="nv-actions" style="margin-top:4px"><button class="nv-btn is-primary" data-act="apply-send">Demander le statut Doctorant</button></div>' +
    '</div>');
    // Dernière demande refusée : on affiche le motif.
    api('/users/me/verifications', { authOnly: true }).then(function (d) {
      var last = (d.items || []).filter(function (v) { return v.label === 'Doctorant'; })[0];
      var box = el('apply-last');
      if (!box || !last) return;
      if (last.status === 'pending') { state.docPending = true; return openApply(); }
      if (last.status === 'rejected') box.innerHTML = '<div class="nv-apply-note is-warn"><b>Ta dernière demande n\'a pas été validée.</b>' + (last.rejection_reason ? ' Motif : ' + esc(last.rejection_reason) + '.' : '') + ' Tu peux en refaire une.</div>';
    }).catch(function () {});
  }
  function sendApply(btn) {
    var msg = (el('apply-msg').value || '').trim();
    var file = el('apply-file').files && el('apply-file').files[0];
    if (msg.length < 20 && !file) { toast('Décris ton doctorat en quelques mots, ou joins une attestation.', 'error'); el('apply-msg').focus(); return; }
    if (file && file.size > 8 * 1024 * 1024) { toast('Attestation trop lourde (8 Mo maximum).', 'error'); return; }
    var fd = new FormData();
    fd.append('label', 'Doctorant');
    fd.append('message', msg);
    if (file) fd.append('proof', file);
    btn.disabled = true; btn.textContent = 'Envoi…';
    fetch(API + '/users/me/verifications', { method: 'POST', headers: { Authorization: 'Bearer ' + token }, body: fd })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (d) { if (!r.ok) throw d; return d; }); })
      .then(function (d) {
        if (d.status === 'approved') { state.canWrite = true; toast('Ton statut est déjà validé : à toi d\'écrire !', 'ok'); return openEditor(null); }
        state.docPending = true;
        toast('Demande envoyée', 'ok');
        openApply();
      })
      .catch(function (d) {
        btn.disabled = false; btn.textContent = 'Demander le statut Doctorant';
        toast(d && typeof d.detail === 'string' ? d.detail : 'Envoi impossible, réessaie.', 'error');
      });
  }
  function openEditor(item) {
    if (!state.canWrite && !(item && item.can_edit)) return openApply();
    if (state.view !== 'editor') state.back = state.view === 'article' ? { view: 'list', filters: { status: 'all', category: '', q: '', period: 'all', kind: 'article' } } : { view: state.view, filters: state.filters, items: state.items, total: state.total, hasMore: state.hasMore, start: state.start, starts: state.starts.slice() };
    state.editing = item || null;
    lastRetry = null;
    setTitle(item ? 'Modifier l\'article' : 'Nouvel article');
    var cat = item ? item.category : 'general';
    show('editor',
      '<div class="nv-editor">' +
        '<div class="nv-crumbs"><button data-act="back">' + ICON.back + 'Annuler</button><span class="nv-art-kicker">' + artIc() + (item ? 'Modifier l\'article' : 'Nouvel article') + '</span></div>' +
        '<input class="nv-ed-title" data-el="ed-title" maxlength="200" placeholder="Titre de l\'article" value="' + esc(item ? item.title : '') + '">' +
        '<div class="nv-ed-row"><select class="nv-ed-select" data-el="ed-cat" aria-label="Rubrique">' +
          RUBRIQUES.map(function (r) { return '<option value="' + r.key + '"' + (r.key === cat ? ' selected' : '') + '>' + esc(r.label) + '</option>'; }).join('') +
        '</select></div>' +
        '<div class="nv-ed-tools" data-el="ed-tools">' +
          '<button type="button" data-cmd="bold" title="Gras (Ctrl B)"><b>G</b></button>' +
          '<button type="button" data-cmd="italic" title="Italique (Ctrl I)"><i>I</i></button>' +
          '<button type="button" data-cmd="underline" title="Souligné (Ctrl U)"><u>S</u></button>' +
          '<i class="nv-ed-sep"></i>' +
          '<button type="button" data-cmd="formatBlock" data-val="h3" title="Intertitre">Titre</button>' +
          '<button type="button" data-cmd="insertUnorderedList" title="Liste à puces">• Liste</button>' +
          '<button type="button" data-cmd="insertOrderedList" title="Liste numérotée">1. Liste</button>' +
          '<button type="button" data-cmd="formatBlock" data-val="blockquote" title="Citation">« »</button>' +
          '<i class="nv-ed-sep"></i>' +
          '<button type="button" data-act="ed-emoji" title="Emojis">🙂 Emojis</button>' +
        '</div>' +
        '<div class="nv-emojis" data-el="ed-emojis">' + EMOJIS.map(function (e) { return '<button type="button" data-emoji="' + e + '">' + e + '</button>'; }).join('') + '</div>' +
        '<div class="nv-ed-body" data-el="ed-body" contenteditable="true" data-placeholder="Écris ton article… Sélectionne un mot pour le mettre en gras ou en italique."></div>' +
        '<div class="nv-ed-foot"><small data-el="ed-count"></small>' +
          '<button class="nv-btn" data-act="back">Annuler</button>' +
          '<button class="nv-btn is-primary" data-act="publish-article">' + (item ? 'Enregistrer les modifications' : 'Publier l\'article') + '</button></div>' +
      '</div>');
    var body = el('ed-body');
    if (item && item.body_html) body.innerHTML = item.body_html;
    try { document.execCommand('defaultParagraphSeparator', false, 'p'); } catch (x) {}
    // Collage : texte brut seulement, pour ne pas importer la mise en page d'ailleurs.
    body.addEventListener('paste', function (e) {
      var txt = (e.clipboardData || window.clipboardData).getData('text/plain');
      if (txt == null) return;
      e.preventDefault();
      document.execCommand('insertText', false, txt);
    });
    body.addEventListener('input', edCount);
    edCount();
    setTimeout(function () { (item ? body : el('ed-title')).focus(); }, 60);
  }
  function edText() { var b = el('ed-body'); return b ? (b.innerText || '').replace(/\s+/g, ' ').trim() : ''; }
  function edCount() {
    var c = el('ed-count'); if (!c) return;
    var n = edText().split(' ').filter(Boolean).length;
    c.textContent = n ? n + ' mot' + (n > 1 ? 's' : '') + ' · ' + Math.max(1, Math.ceil(n / 200)) + ' min de lecture' : '';
  }
  function publishArticle(btn) {
    var title = (el('ed-title').value || '').trim();
    if (title.length < 5) { toast('Donne un titre d\'au moins 5 caractères.', 'error'); el('ed-title').focus(); return; }
    if (edText().length < 80) { toast('L\'article est trop court (80 caractères au moins).', 'error'); el('ed-body').focus(); return; }
    var editing = state.editing;
    var payload = { title: title, category: el('ed-cat').value, body_html: el('ed-body').innerHTML };
    btn.disabled = true;
    btn.textContent = editing ? 'Enregistrement…' : 'Publication…';
    api(editing ? '/veille/articles/' + editing.id : '/veille/articles', { method: editing ? 'PATCH' : 'POST', body: payload, authOnly: true }).then(function (it) {
      state.known[it.id] = it;
      state.editing = null;
      toast(editing ? 'Article modifié' : 'Article publié', 'ok');
      state.back = { view: 'list', filters: { status: 'all', category: '', q: '', period: 'all', kind: 'article' } };
      openArticle(it.id);
      loadMeta();
    }).catch(function (e) {
      btn.disabled = false;
      btn.textContent = editing ? 'Enregistrer les modifications' : 'Publier l\'article';
      var d = e.data && e.data.detail;
      toast(typeof d === 'string' ? d : 'Publication impossible, réessaie.', 'error');
    });
  }
  function deleteArticle(id) {
    if (!window.confirm('Supprimer cet article ? Il disparaîtra d\'Actus, de la Lib et des profils.')) return;
    api('/veille/articles/' + id, { method: 'DELETE', authOnly: true }).then(function () {
      delete state.known[id];
      toast('Article supprimé');
      goNav('articles');
      loadMeta();
    }).catch(function () { toast('Suppression impossible, réessaie.', 'error'); });
  }
  root.addEventListener('mousedown', function (e) {
    // Les boutons de l'éditeur ne doivent pas faire perdre la sélection du texte.
    if (e.target.closest('[data-cmd], [data-emoji], [data-act="ed-emoji"]')) e.preventDefault();
  });
  function edCommand(btn) {
    var body = el('ed-body'); if (!body) return;
    if (document.activeElement !== body) body.focus();
    var cmd = btn.getAttribute('data-cmd'), val = btn.getAttribute('data-val');
    if (cmd === 'formatBlock') {
      // Second clic : retour au paragraphe normal
      var cur = (document.queryCommandValue('formatBlock') || '').toLowerCase();
      document.execCommand('formatBlock', false, cur === val ? 'p' : val);
    } else document.execCommand(cmd, false, null);
    edCount();
  }

  function goBack() {
    var b = state.back;
    if (state.view === 'editor' && state.editing) { var ed = state.editing; state.editing = null; state.back = { view: 'list', filters: { status: 'all', category: '', q: '', period: 'all', kind: 'article' } }; return openArticle(ed.id); }
    if (!b || b.view !== 'list' && b.view !== 'sources' && b.view !== 'article') return renderHome();
    if (b.view === 'article' && state.article) return openArticle(state.article.item.id);
    if (b.view === 'sources') return renderSources();
    if (!b.items) return openList(b.filters);
    // Retour à la liste telle qu'on l'a laissée (sans recharger)
    state.filters = b.filters;
    openList(b.filters);
    listSeq++;   // annule le chargement lancé par openList
    state.items = b.items.map(function (x) { return state.known[x.id] || x; });
    state.total = b.total; state.hasMore = b.hasMore; state.loading = false;
    state.start = b.start || 0; state.starts = b.starts || [];
    renderList();
  }
  // Elo : 30 s passées sur l'actu (onglet visible) → +2, +10 à la 5e du jour.
  // Le serveur revérifie le délai depuis l'ouverture (GET /veille/actus/{id}).
  var readTimer = null;
  function startReadTimer(id) {
    clearTimeout(readTimer);
    if (!token) return;
    var still = function () { return state.view === 'article' && state.article && state.article.item.id === id; };
    var left = 30, last = Date.now();
    (function tick() {
      readTimer = setTimeout(function () {
        if (!still()) return;
        var now = Date.now();
        if (document.visibilityState !== 'hidden') left -= (now - last) / 1000;
        last = now;
        if (left > 0) return tick();
        api('/veille/actus/' + id + '/lecture', { method: 'POST', authOnly: true }).then(function (d) {
          if (d && d.elo_gagne > 0) toast('+' + d.elo_gagne + ' elo · actu lue', 'ok');
        }).catch(function () {});
      }, 1000);
    })();
  }
  function markRead(it) {
    if (!token || it.is_read) return;
    api('/veille/read/' + it.id, { method: 'POST', authOnly: true }).then(function (d) {
      if (state.known[it.id]) state.known[it.id].is_read = true;
      var before = state.me && state.me.goal_reached;
      state.me = { read_today: d.read_today, goal: d.goal, goal_reached: d.goal_reached, streak: d.streak };
      renderGoal();
      if (state.counts.unread) { state.counts.unread--; updateCounts(); }
      if (d.goal_reached && !before) toast('Objectif du jour atteint · série de ' + plural(d.streak, 'jour', 'jours'), 'ok');
      else if (!d.already_read) toast('Actu lue · ' + Math.min(d.read_today, d.goal) + '/' + d.goal + ' aujourd\'hui');
    }).catch(function () {});
  }

  // ================= À RELIRE =================
  function toggleSave(id, btn) {
    if (!token) return needLogin('garder des actus à relire');
    var it = state.known[id] || { id: id, is_saved: btn.classList.contains('is-on') };
    var on = !it.is_saved;
    paintSave(id, on);
    api('/veille/actus/' + id + '/save', { method: on ? 'PUT' : 'DELETE', authOnly: true }).then(function () {
      if (state.counts.saved != null) { state.counts.saved += on ? 1 : -1; updateCounts(); }
      toast(on ? 'Gardée dans « À relire »' : 'Retirée de « À relire »');
    }).catch(function () {
      paintSave(id, !on);
      toast('Impossible d\'enregistrer. Réessaie.', 'error');
    });
  }
  function paintSave(id, on) {
    if (state.known[id]) state.known[id].is_saved = on;
    root.querySelectorAll('[data-save="' + id + '"]').forEach(function (b) {
      b.classList.toggle('is-on', on);
      b.setAttribute('aria-pressed', on);
      if (b.classList.contains('nv-btn')) b.innerHTML = ICON.save + (on ? 'Gardée' : 'À relire');
      else { b.title = on ? 'Retirer de À relire' : 'À relire'; b.setAttribute('aria-label', b.title); }
    });
  }

  // ================= SOURCES OFFICIELLES =================
  function renderSources() {
    lastRetry = renderSources;
    setTitle('Sources officielles');
    show('sources',
      '<div class="nv-page-head"><h1>Sources <span class="nv-grad">officielles</span></h1><p>Les bases à consulter pour vérifier un texte, retrouver une décision ou suivre une réforme.</p></div>' +
      '<form class="nv-lf" data-form="official"><b>Chercher un texte ou une décision</b>' +
        '<p>Un article, une loi, un numéro de pourvoi… La recherche s\'ouvre directement sur le site officiel.</p>' +
        '<div class="nv-lf-row"><div class="nv-search">' + ICON.search + '<input name="q" placeholder="Ex. article 1240 du Code civil, 21-12.345" autocomplete="off" aria-label="Recherche officielle"></div>' +
        '<button class="nv-btn is-primary" type="submit">Rechercher' + ICON.ext + '</button></div>' +
        '<div class="nv-lf-targets"><button type="button" class="nv-chip is-on" data-target="legifrance">Légifrance</button><button type="button" class="nv-chip" data-target="cass">Judilibre</button><button type="button" class="nv-chip" data-target="eurlex">EUR-Lex</button></div>' +
      '</form>' +
      SOURCES.map(function (g) {
        return '<div class="nv-group-label">' + esc(g.group) + '</div><div class="nv-links">' + g.items.map(linkCard).join('') + '</div>';
      }).join('')
    );
  }

  // ================= ÉVÉNEMENTS =================
  root.addEventListener('click', function (e) {
    var t = e.target;
    if (t === el('pop')) return closePop();   // clic sur le voile, hors de la carte
    var mt = t.closest('[data-mtab]');
    if (mt) {
      var k = mt.getAttribute('data-mtab');
      if (k === 'articles') return goNav('articles');
      if (k === '') return renderHome();
      if (k !== 'all' && !token) return needLogin(k === 'saved' ? 'garder des actus à relire' : 'voir tes actus non lues');
      var fm = copyF(); fm.status = k; fm.kind = ''; return openList(fm);
    }
    // Auteur d'une actu : son profil (sans ouvrir la carte de l'actu)
    var prof = t.closest('[data-profil]');
    if (prof && root.contains(prof)) { e.preventDefault(); e.stopPropagation(); try { window.top.location.href = prof.href; } catch (x) { window.open(prof.href, '_blank'); } return; }
    var save = t.closest('[data-save]');
    if (save && root.contains(save)) { e.preventDefault(); e.stopPropagation(); return toggleSave(+save.getAttribute('data-save'), save); }
    var copy = t.closest('[data-copy]');
    if (copy) {
      var link = actuLink(copy.getAttribute('data-copy'));
      var done = function () { toast('Lien copié'); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(link).then(done, function () { window.prompt('Copie ce lien :', link); });
      else window.prompt('Copie ce lien :', link);
      return;
    }
    var src = t.closest('[data-src]');
    if (src && token) { api('/veille/event', { method: 'POST', body: { item_id: +src.getAttribute('data-src'), event_type: 'open' }, authOnly: true }).catch(function () {}); }
    if (t.closest('a')) return;   // liens : comportement normal
    var rb = t.closest('[data-rub]');
    if (rb) { e.stopPropagation(); return openList({ status: 'all', category: rb.getAttribute('data-rub'), q: '', period: 'all' }); }
    var nav = t.closest('[data-nav]');
    if (nav) return goNav(nav.getAttribute('data-nav'));
    var fc = t.closest('[data-filter-cat]');
    if (fc) { var f1 = copyF(); f1.category = fc.getAttribute('data-filter-cat'); return openList(f1); }
    var tg = t.closest('[data-target]');
    if (tg) { tg.parentNode.querySelectorAll('.nv-chip').forEach(function (c) { c.classList.toggle('is-on', c === tg); }); return; }
    var cmdBtn = t.closest('[data-cmd]');
    if (cmdBtn) return edCommand(cmdBtn);
    var emo = t.closest('[data-emoji]');
    if (emo) { var eb = el('ed-body'); if (eb) { if (document.activeElement !== eb) eb.focus(); document.execCommand('insertText', false, emo.getAttribute('data-emoji')); edCount(); } return; }
    var open = t.closest('[data-open]');
    if (open) return openArticle(open.getAttribute('data-open'));
    var a = t.closest('[data-act]');
    if (!a) return;
    var act = a.getAttribute('data-act');
    if (act === 'open-drawer') {
      if (root.classList.contains('is-compact')) openPop('menu');
      else { state.sideOff = false; LS.set('side_off', false); updateLayout(); }
    }
    else if (act === 'close-drawer') root.classList.remove('is-drawer');
    else if (act === 'close-pop') closePop();
    else if (act === 'pick-rub') openPop('rub');
    else if (act === 'close-side') {
      if (root.classList.contains('is-compact')) root.classList.remove('is-drawer');
      else { state.sideOff = true; LS.set('side_off', true); updateLayout(); }
    }
    else if (act === 'search') openSearch();
    else if (act === 'more') nextPage();
    else if (act === 'prev') prevPage();
    else if (act === 'back') goBack();
    else if (act === 'retry') { loadMeta(); if (lastRetry) lastRetry(); }
    else if (act === 'widen') openList({ status: state.filters.status, category: '', q: state.filters.q, period: 'all' });
    else if (act === 'clear-q') { var f3 = copyF(); f3.q = ''; openList(f3, true); }
    else if (act === 'write') startWrite();
    else if (act === 'apply-send') sendApply(a);
    else if (act === 'edit-article') { var ai = state.known[+a.getAttribute('data-id')]; if (ai) openEditor(ai); }
    else if (act === 'delete-article') deleteArticle(+a.getAttribute('data-id'));
    else if (act === 'publish-article') publishArticle(a);
    else if (act === 'ed-emoji') { var pe = el('ed-emojis'); if (pe) pe.classList.toggle('is-open'); }
  });
  function copyF() { var f = state.filters; return { status: f.status, category: f.category, q: f.q, period: f.period, kind: f.kind || '' }; }
  function openSearch() {
    root.classList.remove('is-drawer');
    if (state.view === 'list' && el('q')) { el('q').focus(); el('q').select(); return; }
    openList({ status: 'all', category: '', q: '', period: 'all' }, true);
  }
  root.addEventListener('keydown', function (e) {
    // Entrée sur une carte = l'ouvrir (accessibilité clavier)
    if (e.key === 'Enter' && e.target.matches && e.target.matches('[data-open][tabindex]')) { e.preventDefault(); openArticle(e.target.getAttribute('data-open')); }
  });
  root.addEventListener('submit', function (e) {
    var form = e.target.closest('[data-form]'); if (!form) return;
    e.preventDefault();
    var q = (form.querySelector('input[name="q"]').value || '').trim();
    var kind = form.getAttribute('data-form');
    if (kind === 'official') {
      if (!q) return;
      var on = form.querySelector('[data-target].is-on');
      window.open(TARGETS[on ? on.getAttribute('data-target') : 'legifrance'].url(q), '_blank', 'noopener');
      return;
    }
    var f = copyF();
    f.q = q.slice(0, 120);
    openList(f, true);
  });
  // Recherche au fil de la frappe dans la liste (avec un court délai)
  var typing = null;
  root.addEventListener('input', function (e) {
    if (!e.target.matches('[data-el="q"]')) return;
    clearTimeout(typing);
    typing = setTimeout(function () {
      var input = el('q'); if (!input) return;
      var q = input.value.trim().slice(0, 120);
      if (q === state.filters.q) return;
      var f = copyF(); f.q = q;
      var pos = input.selectionStart;
      openList(f, true);
      var again = el('q'); if (again) { again.focus(); try { again.setSelectionRange(pos, pos); } catch (err) {} }
    }, 380);
  });
  function onKey(e) {
    if ((e.ctrlKey || e.metaKey) && (e.key === 'k' || e.key === 'K') && document.body.contains(root)) { e.preventDefault(); openSearch(); }
    if (e.key === 'Escape') {
      if (!el('pop').hidden) closePop();
      else if (root.classList.contains('is-drawer')) root.classList.remove('is-drawer');
      else if (state.view === 'article') goBack();
      else if (state.view === 'editor' && el('ed-emojis') && el('ed-emojis').classList.contains('is-open')) el('ed-emojis').classList.remove('is-open');
    }
  }
  document.addEventListener('keydown', onKey);
  if (HOST) try { HOST.document.addEventListener('keydown', onKey); } catch (e) {}

  // ================= DÉMARRAGE =================
  function loadMeta() {
    return api('/veille/rubriques').then(function (d) {
      state.rubriques = d;
      renderSideRubs();
      var sub = el('list-sub');
      if (sub && state.view === 'list' && isDefault(state.filters)) sub.textContent = heroSub(d);
    }).catch(function () {});
  }
  function loadMe() {
    if (!token) return;
    api('/veille/state', { authOnly: true }).then(function (d) { state.me = d; renderGoal(); }).catch(function () {});
  }

  renderSideRubs();
  renderGoal();
  updateCounts();
  // Lien direct : ?actu=ID, ?actu=NA<id> ou /actus/NA<id> (articles)
  var start = null;
  try {
    var loc = pageLocation();
    start = new URLSearchParams(loc.search).get('actu');
    var pm = loc.pathname.match(/\/NA(\d+)\/?$/i);
    if (pm) start = pm[1];
  } catch (e) {}
  if (start) start = String(start).replace(/^NA/i, '');
  if (start && /^\d+$/.test(start)) { state.back = { view: 'home' }; openArticle(start); }
  else renderHome();
  // Rédaction d'articles : doctorants vérifiés et admins
  function loadWriter() {
    if (!token) return;
    api('/auth/me', { authOnly: true }).then(function (me) {
      state.canWrite = !!(me && me.can_publish_articles);
      state.docPending = (me.pending_verifications || []).indexOf('Doctorant') !== -1;
      // Met à jour la carte « Écrire un article » déjà affichée
      var card = content.querySelector('.nv-write');
      if (card) card.outerHTML = writeCard();
    }).catch(function () {});
  }
  loadWriter();
  loadMeta();
  loadMe();
  loadCounts();
})();
</script>
